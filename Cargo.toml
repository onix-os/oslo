[package]
name = "rush"
version = "0.1.0"
edition = "2024"
# Edition 2024 alone needs 1.85, but the codebase uses let-chains in edition-2024 position
# (stabilised in 1.88) and brush-parser declares 1.88 too. Bump this only alongside the MSRV
# job in .github/workflows/tests.yml, which pins the same toolchain.
rust-version = "1.88"
description = "rush"
license = "MIT"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
mlua = { version = "0.10", features = ["lua54", "vendored", "async"] }
# `resource` is what `ulimit` reads and sets limits through, in both directions. Reading once went
# through /proc/self/limits, which meant every `ulimit` query answered "cannot read" on macOS while
# the `ulimit -n 512` beside it quietly succeeded.
nix = { version = "0.29", features = ["process", "signal", "term", "fs", "user", "resource"] }
rustyline = "15.0"
glob = "0.3"
# `[[ str =~ ere ]]` needs a real POSIX-ERE engine. Approximating it with globs would make every
# validation idiom (`=~ ^[0-9]+$`) answer plausibly and wrongly.
regex = "1"
which = "7.0"
thiserror = "2.0"

tracing = "0.1"
tracing-subscriber = "0.3"
# The published release, unmodified, and used for *parsing only* — its AST is converted straight
# into rush's own in `src/parser/brush_adapter/`, and nothing else from brush executes anything.
# Every builtin here is rush's own. The one thing this costs is `for ((;;))` with no space between
# the section separators: brush's tokenizer takes the longest match and fuses them into the single
# `;;` that ends a `case` item, so the arithmetic-for rule never sees the two `;` it asks for.
# That is a loud syntax error rather than a wrong answer — see tests/differential/expected_fail.rs.
brush-parser = "0.4.0"

[dev-dependencies]
tempfile = "3.17"

# A one-package workspace, stated explicitly so `cargo fmt --all` and the 600-line limit apply
# to this crate and nothing else. `fuzz/` declares its own empty [workspace] to stay out.
[workspace]


