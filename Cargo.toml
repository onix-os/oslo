[package]
name = "rush"
version = "0.1.0"
edition = "2024"
description = "rush"
license = "MIT"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
mlua = { version = "0.10", features = ["lua54", "vendored", "async"] }
nix = { version = "0.29", features = ["process", "signal", "term", "fs", "user"] }
rustyline = "15.0"
glob = "0.3"
which = "7.0"
thiserror = "2.0"

tracing = "0.1"
tracing-subscriber = "0.3"
brush-parser = "0.4.0"

[dev-dependencies]
tempfile = "3.17"


