[package]
name = "rush"
version = "0.1.0"
edition = "2024"
# Edition 2024 alone needs 1.85, but the codebase uses let-chains in edition-2024 position
# (stabilised in 1.88) and brush-parser declares 1.88 too. Bump this only alongside the MSRV
# job in .github/workflows/tests.yml, which pins the same toolchain.
rust-version = "1.88"
description = "rush"
license = "MIT"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
mlua = { version = "0.10", features = ["lua54", "vendored", "async"] }
# `resource` is what `ulimit` sets limits through. Without it the builtin can only read
# /proc/self/limits, and `ulimit -n 512` has to be refused rather than silently ignored.
nix = { version = "0.29", features = ["process", "signal", "term", "fs", "user", "resource"] }
rustyline = "15.0"
glob = "0.3"
# `[[ str =~ ere ]]` needs a real POSIX-ERE engine. Approximating it with globs would make every
# validation idiom (`=~ ^[0-9]+$`) answer plausibly and wrongly.
regex = "1"
which = "7.0"
thiserror = "2.0"

tracing = "0.1"
tracing-subscriber = "0.3"
# Vendored 0.4.0 — the published release, plus one grammar patch so that `for ((;;))` parses.
# brush's tokenizer takes the longest match and fuses the loop's two section separators into a
# single `;;` operator whenever the condition is empty, which the grammar's arithmetic-for rule
# then cannot match. The patch and the upstream PR text are in vendor/brush-parser/PATCH.md;
# this line goes back to `brush-parser = "0.x"` the day the fix lands upstream.
brush-parser = { path = "vendor/brush-parser" }

[dev-dependencies]
tempfile = "3.17"

# The vendored parser is a path dependency, which would otherwise make it a workspace member and
# so a target of `cargo fmt --all` and the 600-line file limit. Neither applies to a dependency
# whose source is upstream's: reformatting it would bury the one-rule patch in noise.
[workspace]
exclude = ["vendor/brush-parser"]


