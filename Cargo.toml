[package]
name = "oslo"
version = "0.3.6"
edition = "2024"
# Minimum supported Rust version, mirrored by the MSRV job in .github/workflows/tests.yml.
rust-version = "1.89"
description = "oslo"
license = "MIT"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"

[features]
# A default build produces one static musl binary without a C toolchain.
default = []

# `vista` — the model behind the ghost prediction and the correction.
#
# **Off, and measured.** What it buys is real
# (`docs/features/prediction-and-repair.md`), but it is a dependency oslo does not otherwise need
# and 341 KB on a binary meant to be `/bin/sh`: 5,663,840 bytes without it against 6,013,312 with.
# Without it the ghost comes from history, completions and `$PATH` — the sources that read what is
# already on the machine — and the shell learns nothing, writes no model and reads none.
#
# With it, the model becomes a fourth suggestion source and brings `oslo.repair`, `oslo.predict.*`
# and the correction drawn after a mistyped line. A config that wants to work in both builds asks
# before using them: `if oslo.repair then … end`.
vista = ["oslo-base/vista", "oslo-runtime/vista", "oslo-ui/vista"]

# `tab` — named sessions that keep running when the terminal they were in goes away, reached with
# one key. See `PLAN.md` and `docs/features/tab.md`.
#
# **Off, because it is a second process and a pty for every session that uses it, and because a
# shell meant to be `/bin/sh` should not carry a multiplexer nobody asked for.** Unlike `vista` it
# adds no dependency at all — it is `nix`, which oslo already links — so what it costs is code and
# the runtime directory, not crates.
#
# Without it the key is unbound and the settings are accepted and ignored, so one config works in
# both builds with nothing to ask.
scratch = ["oslo-shell/scratch", "oslo-runtime/scratch"]

# `direnv` — directory environments.
#
# **Off, and the largest of the four.** It reads a file on every arrival in a directory and can run
# what it finds there, which is a different kind of trust from anything else the shell does on its
# own. A build without it has no `direnv` builtin, no `oslo.direnv` API, no `.env.lua` or `.envrc`
# reading, and no dev shell import — `cd` is `cd`.
direnv = ["oslo-shell/direnv", "oslo-runtime/direnv"]

# `nix` — a Nix dev shell, imported without entering one.
#
# **Independent of `direnv`, on purpose.** Today the only way in is a directory file asking for it,
# but nothing about reading `nix print-dev-env` needs a directory file — and the things worth adding
# next (flake-output completion, a prompt segment naming the shell you are in) need one even less.
# Where the two meet — `use flake` in an `.envrc`, `oslo.direnv.nix_develop` in a `.env.lua` — the
# entry point asks for both.
nix = ["oslo-shell/nix", "oslo-runtime/nix"]

# `plugin` — installing somebody else's Lua, and loading it on demand.
#
# **The line is drawn where the policy starts.** `oslo.db` and the `pre-cmd` veto are in every
# build: they are capabilities, small and self-contained, and a config that will never install
# anything can still want them. Putting them behind a switch would give oslo two dialects, where a
# config has to ask whether `oslo.db` exists before using it.
#
# Installing is different in kind. It fetches somebody's code, decides whether to trust it, and
# reserves builtin names on their behalf — none of which a `/bin/sh` on a distribution has any use
# for, and all of which should be absent rather than merely unused.
#
# Without it there is no `oslo plugin`, no manifest, no index and no loading. Everything a plugin is
# *written against* is still there, so the same Lua runs from `conf.d` in either binary.
plugin = ["oslo-runtime/plugin"]

# `argc` — the shell parses its own scripts' arguments, and other people's.
#
# `argc` is a CLI framework for bash: a script declares its options as comments and calls
# `eval "$(argc --argc-eval "$0" "$@")"` to have them parsed. With this feature oslo *is* that
# parser, in two forms — `oslo --argc-eval` for a bash script, and the `argc` builtin for a script
# oslo runs itself, which applies the parse to the environment directly rather than through a
# subprocess and an `eval`.
#
# **Off, and measured: 308 KB.** The real binary, built both ways at this profile:
#
# ```text
#   every feature but this one   6,160,768 bytes
#   with it                      6,476,160 bytes    +315,392
# ```
#
# An isolated test binary had predicted 439 KB; the difference is what fat LTO shares with crates
# oslo already links. Still larger than `direnv` and `plugin` together, and it brings five crates
# oslo does not otherwise have — `nom` among them, a second parser-combinator library in a tree
# whose argument is that it owns its parsers. It parses *comments*, which is where that line is
# drawn. A `/bin/sh` has no business parsing argument declarations for other people's scripts, so a
# distribution ships this off.
#
# Without it there is no `--argc-eval`, no `argc` builtin and no completion from a script's
# comments; the word `argc` falls through to `$PATH`, so the real one still works.
argc = ["oslo-shell/argc", "oslo-runtime/argc", "dep:argc"]

# `secrets` — values encrypted at rest with age, decrypted only when something asks for one.
#
# **Off, and measured before anything was designed on top of it.** The real binary at this profile,
# built both ways, with only the x25519 path exercised:
#
# ```text
#   nothing else on          5,467,072 bytes
#   with it, as published    5,827,616 bytes    +352 KB, 109 crates
#   with it, trimmed         5,618,656 bytes    +148 KB,  36 crates
# ```
#
# The first number is what `age` costs as it comes, and most of it is not encryption: the error
# messages are localised through Fluent, and the recipient types for hardware keys and post-quantum
# bring `hpke`, `ml-kem`, `p256` and the elliptic-curve tower beneath them. None of that is optional
# upstream, so the crate is vendored and cut down — see `vendor/README.md`, which lists every change.
# What is left is the age format: x25519 and passphrase recipients, the header, the STREAM payload.
#
# It is built for size like every other dependency, by the `package."*"` rule below rather than by
# an entry of its own — and that is where it should stay. Built at `3` instead it is 5,626,848: the
# maximum optimisation is worth 8 KB here, on code that runs once when a secret is read.
#
# Still off by default, because 148 KB and 36 crates is not nothing on a binary meant to be
# `/bin/sh`, and a shell that never holds a secret should not carry the code that could. Without it
# there is no `oslo secret`, no `oslo.secret`, and `age` is not compiled, fetched or linked.
#
# **Re-measured after the stores went in**, on the binary as it is now — several stores, several key
# sources, several recipients, `secrets.conf`, `oslo.secret` and `oslo secret run`:
#
# ```text
#   every other feature on   6,631,840 bytes
#   with it                  6,894,016 bytes    +256 KB, still 36 crates
# ```
#
# So the layer above `age` is 108 KB and no new dependency: `base64` at the Lua boundary was already
# in the tree as an unconditional dependency of vendored `age`, which is also why `seal` speaks
# base64 rather than turning on age's `armor` — that was measured at 45 KB for a format nothing on
# this side of the boundary would read.
#
# **No age plugin client, deliberately.** Hardware keys in the age world are reached by an external
# `age-plugin-NAME` binary, and speaking that protocol would mean restoring the code the trim above
# deleted. It is not here: a key oslo cannot compute itself comes from `key command` instead, which
# runs whatever already holds it. See `docs/features/secrets.md`.
secrets = ["oslo-base/secrets", "oslo-runtime/secrets"]
crypt = ["secrets", "oslo-base/crypt"]

[dependencies]
# The Lua front end, in the same relationship to Lua that brush-parser has to the shell: it parses
# and nothing else. Evaluation is oslo's own, in `src/lua/eval/`, so that both languages run on one
# Rust core. `full_moon` is the parser behind StyLua and selene.
#
# This replaced `mlua`, which is a *binding* to the reference Lua written in C: it vendored and
# compiled 30k lines of C into the binary, so a static musl build needed a C toolchain, and Lua
# values lived in a separate VM that the shell could only pass strings across. See PLAN-LUA.md.
full_moon = { path = "vendor/full_moon", default-features = false, features = ["lua54"] }
# `argc`, behind the feature of the same name. Only the parts a caller needs: the parse and the
# match (`eval`), the bash renderer for `--argc-eval`, and the completion generator. `native-runtime`
# is deliberately absent — oslo implements `argc::Runtime` over its own facilities, which is what
# lets a script's own functions run in this shell rather than in a bash it has to go and find.
argc = { path = "vendor/argc", default-features = false, features = [
    "eval", "eval-bash", "compgen",
], optional = true }
# `resource` is what `ulimit` reads and sets limits through, and what `times` reads getrusage(2)
# through. Without it both had to parse /proc by hand.
# `poll` is declared here rather than arriving by accident. It used to come from rustyline's own
# feature selection — oslo called `nix::poll` without ever asking for it, and removing rustyline is
# what revealed the borrowed feature.
nix = { version = "0.29", features = [
    "process", "signal", "term", "fs", "user", "resource", "hostname", "poll",
] }
# `[[ str =~ ere ]]` needs a real POSIX-ERE engine. Approximating it with globs would make every
# validation idiom (`=~ ^[0-9]+$`) answer plausibly and wrongly.
# **Trimmed on purpose, and measured.** The default feature set costs ~370KB and is *slower* for
# what a shell actually does. Two things are dropped:
#
# * `perf-dfa` — the lazy DFA. It pays for itself scanning a long haystack and charges per search,
#   which is the wrong trade for matching one short line at a time: line-by-line scanning measured
#   972ms with it and 320ms without. Dropping it costs a pattern with no literal to prefilter on a
#   long haystack — 6ms became 68ms — which is the rarer shape and still milliseconds.
# * `unicode-age`, `-bool`, `-script`, `-segment` — the tables behind `\p{Age:…}`, `\p{Script:…}`
#   and `\b{…}`. Nothing in a shell's regex reaches for them. `unicode-case` stays for `(?i)`,
#   `-gencat` for `\p{L}`, and `-perl` for `\d \w \s`.
#
# `perf-literal` is kept, and it is the one that matters: without it a long scan goes from 4ms to
# 192ms. It brings `aho-corasick` and `memchr`, and earns them.
regex = { version = "1", default-features = false, features = [
    "std", "unicode-case", "unicode-gencat", "unicode-perl",
    "perf-literal", "perf-inline",
] }
# JSON is a core capability rather than a library a user can install: a C module cannot load into
# a static binary, which rules out lua-cjson and every Lua JSON parser that wraps it. `serde_json`
# is pure Rust, so it works where those cannot. See PLAN-LUA.md.
serde_json = "1"
which = "7.0"
unicode-segmentation = "1.12"
unicode-width = "0.2"

# Used for *parsing only* — its AST is converted straight into oslo's own in
# `src/parser/brush_adapter/`, and nothing else from brush executes anything. Every builtin here is
# oslo's own.
#
# Pinned to a fork branch rather than the crates.io release while
# https://github.com/reubeno/brush/pull/1253 is open. That PR fixes a tokenizer bug the published
# 0.4.0 has: a comment inside `$( … )` is only recognised when an *even* number of blanks precedes
# its `#`, so `$( #'` fails to parse. It rejects real scripts — two files in modernish's test suite
# hit it. The branch is upstream `main` plus that one commit; revert this to a plain version
# requirement once it lands in a release.
#
# The one thing this still costs is `for ((;;))` with no space between the section separators:
# brush's tokenizer takes the longest match and fuses them into the single `;;` that ends a `case`
# item, so the arithmetic-for rule never sees the two `;` it asks for. That is a loud syntax error
# rather than a wrong answer — see tests/differential/expected_fail.rs.
brush-parser = { path = "vendor/brush-parser" }
oslo-base = { path = "crates/oslo-base" }
oslo-lua = { path = "crates/oslo-lua" }
oslo-runtime = { path = "crates/oslo-runtime" }
oslo-shell = { path = "crates/oslo-shell" }
oslo-ui = { path = "crates/oslo-ui" }
# The allow list for directory environments is keyed by a hash of the rc file's path *and* its
# contents, which is what makes editing an allowed file revoke it. Pure Rust, so it does not cost
# the static musl build a C toolchain.
# **0.10, deliberately.** `tagdata` pulls `sha3 0.10`, which is built on `digest 0.10`; asking for
# `sha2 0.11` meant a second copy of the whole framework — `digest`, `block-buffer` and
# `crypto-common` each linked twice — for no benefit. SHA-256 is SHA-256, so the version here
# changes no hash and therefore invalidates no `.envrc` that has already been allowed.
sha2 = "0.10"
# A regular dependency rather than a dev one since the directory environment arrived: an `.envrc`'s
# own output is captured to a scratch file so it can be printed under the file that produced it.
# A pipe would be the obvious choice and is the wrong one — nothing drains it while the rc file
# runs, so a chatty `.envrc` would block forever on its own output once the pipe filled.
tempfile = "3.17"
# The same crate as above, with the switch that exposes the lock serialising tests which touch the
# process-wide feature bitset. Cargo unifies the two when it builds a test and does not when it
# builds the shell, so a release binary carries neither the lock nor the reset.
[dev-dependencies]
oslo-base = { path = "crates/oslo-base" }
oslo-ui = { path = "crates/oslo-ui" }

# The crates oslo is built from, and the ones it vendors. `fuzz/` declares its own empty
# [workspace] to stay out.
[workspace]
members = [
  "crates/oslo-base",
  "crates/oslo-lua",
  "crates/oslo-runtime",
  "crates/oslo-shell",
  "crates/oslo-ui",
  "vendor/argc",
  "vendor/brush-parser",
  "vendor/full_moon",
  "vendor/full_moon/derive",
]



[[bench]]
name = "fuzzy"
# `bench/`, not cargo's default `benches/`. The path has to be stated because of that, and stating
# it is the whole cost — cargo finds nothing to auto-discover and takes this instead.
path = "bench/fuzzy.rs"
harness = false

[[bench]]
name = "keystroke"
path = "bench/keystroke.rs"
harness = false

[[bench]]
name = "predict"
path = "bench/predict.rs"
harness = false
required-features = ["vista"]

# Measured, not assumed — the before/after is in PERF_AND_CODE.md.
#
# No `panic = "abort"`, deliberately, though it is the obvious fourth setting: `catch_unwind` in
# `startup::environments` restores stdout and stderr before re-raising, and under `abort` that
# restore never runs — a panic inside a `.env.lua` would kill the shell with its own message
# written into a temp file nobody ever reads. A silent death is worse than a slightly larger binary.
[profile.release]
# **Fat, since the shell became six crates.**
#
# `codegen-units = 1` used to mean the whole shell was one optimisation unit, because the whole
# shell was one crate. Splitting it made five, and thin LTO optimises across units far less
# thoroughly than being inside one — the static musl binary grew 5.77 MB → 6.09 MB with no code
# added. Fat LTO does the cross-module work properly and gets it back:
#
# ```text
#                thin      fat
#   one crate    5.77 MB   5.49 MB
#   six crates   6.09 MB   5.68 MB
# ```
#
# So the split costs 0.19 MB rather than 0.32, and what ships is *smaller* than what shipped before
# it — 5.68 against 5.77. The price is link time: a release relink went 33.8 s → 46.0 s. That is
# paid by `make build` and by CI, not by `make dev`, which is the inner loop and does not use this
# profile at all.
lto = "fat"
codegen-units = 1
strip = "symbols"

# **Size, for oslo's own crates too — with the editor as the exception.**
#
# The rule below has applied to dependencies for a while; oslo's own crates were the last thing
# still built for speed by default, and they are most of the binary. Applying the same setting to
# them is worth 1.22 MB and, measured, costs nothing a person could feel:
#
# ```text
#                                    static musl      paint      hint
#   opt-level = 3 (before)             6.95 MB       2.21 us    2.21 us
#   opt-level = "s", flat              5.57 MB       2.73 us    2.55 us
#   opt-level = "s", oslo-ui at 3      5.73 MB       2.24 us    2.29 us
# ```
#
# `bench/keystroke.rs`, min of six runs — a single run on this machine varies by a factor of two,
# so anything less than that is noise dressed up as a measurement. The flat setting costs half a
# microsecond per keystroke against a budget of about ten milliseconds, which would have been
# acceptable; the exception makes it free, so there is no reason not to take it.
#
# `"z"` was measured too: 5.04 MB, another 0.53 below `"s"`. Not taken, because the speed of it was
# never measured and the marginal byte is worth less than the certainty.
opt-level = "s"

# **The dependencies are compiled for size; oslo and its parser are not.**
#
# Compiling everything below this crate for size was measured once and deferred, because it cost
# 14% on the parser loop and 3% on the arithmetic loop. The reason was known even then: thin LTO
# inlines `brush-parser` into oslo's hot path, so shrinking it shrinks the loop that runs on every
# line typed. Nothing else oslo depends on is on that path.
#
# So the exception is named rather than the rule abandoned. `"*"` takes the size setting; the
# parser is put back to `3` beside it, and cargo applies the more specific entry. That is the
# refinement the earlier note said was untested — it is tested now, and the numbers are in the
# commit that made this change.
[profile.release.package."*"]
opt-level = "s"

# The one dependency on the hot path, and the whole reason `"*"` above needed an exception.
[profile.release.package.brush-parser]
opt-level = 3

# **The editor is oslo's own `brush-parser`**: the one crate on the path a keystroke takes, where
# `"s"` was measurable. `paint` and `hint` run on every key and both come from here — 2.73 µs and
# 2.55 µs built for size, 2.24 and 2.29 built for speed, against 2.21 before any of this. The other
# 160 KB is the cheapest 160 KB in the binary.
[profile.release.package.oslo-ui]
opt-level = 3

# **The one place where `"s"` was chosen after measuring both.** `argc` was built at `3` first, on
# the argument that a parse runs once per invocation of a script that uses it and that is the shape
# which pays for speed. The binary says what that argument costs:
#
# ```text
#   without argc      6,164,864
#   argc at "s"       6,508,928    +336 KB
#   argc at 3         6,562,176    +388 KB
#                                  ───────
#   maximum optimisation costs         52 KB
# ```
#
# Fifty-two kilobytes is more than every optional argc *feature* put together — `eval-bash` is 12 KB
# and `compgen` is 400 bytes — to make a parse of a ten-line declaration faster than the
# microseconds it already takes. Nobody can feel that; everybody carries the bytes.
[profile.release.package.argc]
opt-level = "s"

# **`"*"` does not reach oslo's own crates, and that is cargo's rule rather than luck.**
#
# Worth writing down, because it is the obvious thing to get wrong once the shell is five crates:
# `profile.package."*"` matches *dependencies*, not workspace members, so `oslo-shell` and the rest
# keep this profile's `opt-level = 3` and are not quietly compiled for size along with everything
# else. Checked rather than assumed — setting `oslo-ui` to `"z"` moves the binary 5.96 MB → 5.77 MB,
# so a per-member override does take effect when one is written; there simply is not one.
