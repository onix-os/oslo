[package]
name = "oslo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "oslo"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []

vista = ["oslo-base/vista", "oslo-runtime/vista", "oslo-ui/vista"]

scratch = ["oslo-shell/scratch", "oslo-runtime/scratch"]

direnv = ["oslo-shell/direnv", "oslo-runtime/direnv"]

# `make` — `.make.lua` recipes, the `oslo make` tool and the `make` builtin.
make = ["oslo-shell/make", "oslo-runtime/make"]

nix = ["oslo-shell/nix", "oslo-runtime/nix"]

# `math` — the calculator: units and dimensional analysis, as the `math` builtin and `oslo.math`.
math = ["oslo-shell/math", "oslo-runtime/math"]

plugin = ["oslo-runtime/plugin"]

argc = ["oslo-shell/argc", "oslo-runtime/argc", "dep:argc"]

secrets = ["oslo-base/secrets", "oslo-runtime/secrets"]

crypt = ["secrets", "oslo-base/crypt"]

[dependencies]
argc = { path = "vendor/argc", default-features = false, features = [
    "eval", "eval-bash", "compgen",
], optional = true }
nix = { version = "0.29", features = [
    "process", "signal", "term", "fs", "user", "resource", "hostname", "poll", "inotify",
] }
regex = { version = "1", default-features = false, features = [
    "std", "unicode-case", "unicode-perl",
    "perf-inline",
] }
serde_json = { version = "1", features = ["preserve_order"] }
which = "7.0"
unicode-segmentation = "1.12"
unicode-width = "0.2"

brush-parser = { path = "vendor/brush-parser" }
oslo-base = { path = "crates/oslo-base" }
oslo-luavm = { path = "crates/oslo-luavm" }
oslo-runtime = { path = "crates/oslo-runtime" }
oslo-shell = { path = "crates/oslo-shell" }
oslo-ui = { path = "crates/oslo-ui" }
sha2 = "0.10"
tempfile = "3.17"

[dev-dependencies]
oslo-base = { path = "crates/oslo-base" }
oslo-ui = { path = "crates/oslo-ui" }

# **One version for the whole tree, in one place.** The crates had drifted into three — the binary
# at 0.4.x, four libraries at 0.2.x and two new ones at 0.1.0 — which says nothing true about any
# of them: they are released together, always, as one binary. Every manifest now inherits from
# here, so there is exactly one line in the repository that carries the number.
#
# The release tool bumps it by rewriting the `version = "…"` line it finds, and this is now the
# only one; `scripts/project-meta.sh` reads it the same way, falling back here when `[package]`
# inherits rather than states it.
[workspace.package]
version = "0.4.4"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace]
members = [
  "crates/oslo-base",
  "crates/oslo-luavm",
  "crates/oslo-math",
  "crates/oslo-runtime",
  "crates/oslo-shell",
  "crates/oslo-ui",
  "vendor/argc",
  "vendor/brush-parser",
]

[[bench]]
name = "fuzzy"
path = "bench/fuzzy.rs"
harness = false

[[bench]]
name = "keystroke"
path = "bench/keystroke.rs"
harness = false

[[bench]]
name = "predict"
path = "bench/predict.rs"
harness = false
required-features = ["vista"]

[profile.release]
# **Unwinding is not needed and costs 820 KB.** It used to be: the history store could panic on a
# corrupt page, so every read and write went through `catch_unwind`. tagdata v0.1.4 validates a
# page pointer before following it and reports `InvalidDB` instead, so those guards are gone and
# nothing is left that has to survive a panic. `.gcc_except_table` alone falls from 261 KB to 7 KB.
panic = "abort"
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = "s"

[profile.release.package."*"]
opt-level = "s"

# Likewise, and here the pin was buying nothing at all: parsing 4000 shell blocks took 118 ms at
# both settings.
[profile.release.package.brush-parser]
opt-level = "s"

# Size, not speed, and measured rather than assumed: at `opt-level = 3` painting a 57-character
# line took 2.41 µs per keystroke and at "s" it takes 3.02 µs. A keystroke is ~100 ms apart, so the
# difference is 0.0006% of the gap between two keys — and it is 250 KB of binary.
[profile.release.package.oslo-ui]
opt-level = "s"

[profile.release.package.argc]
opt-level = "s"

[profile.release.package.oslo-runtime]
opt-level = "z"

[profile.release.package.oslo-base]
opt-level = "z"

