# Vendored copy of brush-parser 0.4.0 (MIT), carrying one grammar patch.
#
# See PATCH.md in this directory for the patch, why it exists, and how to drop the fork.
#
# This manifest is the crates.io-normalised 0.4.0 manifest with four deliberate deletions, all of
# them build plumbing rather than crate content:
#
#   * `[dev-dependencies]`, `[[bench]]` and `[[example]]` — rush never builds brush's own benches,
#     examples or test binaries, and keeping them would force cargo to resolve criterion,
#     serde_yaml and friends that are otherwise absent from the lock file.
#   * `[lints]` — upstream denies all warnings. A path dependency does not get `--cap-lints allow`
#     the way a registry dependency does, so upstream's `deny(warnings)` would turn any lint a
#     newer rustc invents into a hard build failure for rush. Warnings from a vendored dependency
#     are not rush's to fix; they must not break rush's build.
#
# Everything under src/ is upstream's, byte for byte, except the patch listed in PATCH.md.

[package]
edition = "2024"
rust-version = "1.88.0"
name = "brush-parser"
version = "0.4.0"
authors = ["reuben olinsky"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "POSIX/bash shell tokenizer and parsers (used by brush-shell)"
readme = "README.md"
keywords = [
    "cli",
    "shell",
    "sh",
    "bash",
    "script",
]
categories = [
    "command-line-utilities",
    "development-tools",
]
license = "MIT"
repository = "https://github.com/reubeno/brush"
publish = false

[features]
arbitrary = ["dep:arbitrary"]
debug-tracing = ["peg/trace"]
diagnostics = ["dep:miette"]
serde = ["dep:serde"]
winnow-parser = ["dep:winnow"]

[lib]
name = "brush_parser"
path = "src/lib.rs"
bench = false

[dependencies.arbitrary]
version = "1.4.2"
features = ["derive"]
optional = true

[dependencies.bon]
version = "3.9.1"

[dependencies.cached]
version = "0.59.0"

[dependencies.indenter]
version = "0.3.4"

[dependencies.insta]
version = "1.47.1"
features = ["redactions"]

[dependencies.miette]
version = "7.6.0"
features = ["derive"]
optional = true
default-features = false

[dependencies.peg]
version = "0.8.5"

[dependencies.serde]
version = "1.0.228"
features = [
    "derive",
    "rc",
]
optional = true

[dependencies.thiserror]
version = "2.0.18"

[dependencies.tracing]
version = "0.1.44"

[dependencies.utf8-chars]
version = "3.0.6"

[dependencies.winnow]
version = "1.0.0"
optional = true

[target.wasm32-unknown-unknown.dependencies.getrandom]
version = "0.4.2"
features = ["wasm_js"]

[target.wasm32-unknown-unknown.dependencies.uuid]
version = "1.23.1"
features = ["js"]
