# age 0.12.1, trimmed. See `vendor/README.md` for what was taken out and why.
#
# What is gone: the `ssh`, `cli-common`, `plugin`, `async` and `unstable` features and the modules
# behind them, the `tag` and `tagpq` recipient types, and the localisation of error messages. What
# is left is the age format itself — x25519 and passphrase recipients, the header, and the STREAM
# payload — which is the whole of what a shell holding a token needs.

[package]
edition = "2021"
rust-version = "1.74"
name = "age"
version = "0.12.1"
authors = ["Jack Grigg <thestr4d@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "[BETA] A simple, secure, and modern encryption library."
readme = "README.md"
keywords = ["rage", "encryption"]
categories = ["cryptography"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/str4d/rage"

[lib]
name = "age"
path = "src/lib.rs"
bench = false

[features]
default = []
# ASCII-armoured output: the same file as PEM rather than binary.
armor = []

[dependencies]
age-core = { path = "../age-core", version = "0.12.0" }
base64 = "0.22"
bech32 = "0.11"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
cookie-factory = { version = "0.3", default-features = false, features = ["std"] }
hkdf = "0.12"
hmac = "0.12"
nom = { version = "8", default-features = false, features = ["alloc"] }
pin-project = "1"
rand = "0.8"
scrypt = { version = "0.11", default-features = false }
sha2 = { version = "0.10", default-features = false }
subtle = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
