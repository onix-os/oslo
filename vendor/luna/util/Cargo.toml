# See `../Cargo.toml`: vendored, and de-workspaced so it can be a member of oslo's.
[package]
name = "luna-util"
description = "Utilities for the `luna` library"
readme = "README.md"
version = "0.4.0"
edition = "2021"
authors = ["kyren <catherine@kyju.org>"]
license = "MIT"
repository = "https://github.com/onix-os/luna"
publish = false

[lib]
name = "luna_util"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", optional = true }
thiserror = "1.0"
ottavino-gc-arena = { version = "0.6.0", features = ["allocator-api2", "hashbrown"] }
