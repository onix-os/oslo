# Vendored: `luna`, from https://github.com/onix-os/luna — a fork of `ottavino`, which is itself a
# fork of `piccolo`. A stackless Lua VM in pure Rust, with a real garbage collector.
#
# The upstream is its own cargo workspace. Here it is a member of oslo's, so the `[workspace]`
# section is gone and the values it supplied are written out. That is the only edit: the source is
# otherwise untouched, which is the rule for everything under `vendor/`.
[package]
name = "luna"
description = "A stackless Lua VM in pure Rust. Fork of ottavino, itself a fork of piccolo."
readme = "README.md"
version = "0.4.0"
edition = "2021"
authors = ["kyren <catherine@kyju.org>"]
license = "MIT"
repository = "https://github.com/onix-os/luna"
publish = false

[lib]
name = "luna"
path = "src/lib.rs"

[dependencies]
ahash = "0.8"
allocator-api2 = "0.2"
anyhow = "1.0"
ottavino-gc-arena = { version = "0.6.0", features = ["allocator-api2", "hashbrown"] }
hashbrown = { version = "0.14", features = ["raw"] }
rand = { version = "0.8", features = ["small_rng"] }
thiserror = "1.0"

# **Vendored code is not restyled.** See `vendor/README.md`. At the manifest rather than in
# `lib.rs`, because each file under `tests/` is its own crate and an inner attribute never reaches
# them — oslo builds with `-D warnings`, and upstream's tests trip clippy too.
[lints.clippy]
all = "allow"
