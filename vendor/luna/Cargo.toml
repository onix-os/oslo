# Vendored from <https://github.com/onix-os/luna> — a stackless Lua VM in pure Rust with a tracing
# garbage collector, forked from `ottavino`, itself a fork of `piccolo`.
#
# Upstream is its own cargo workspace; here it is a member of oslo's, so the `[workspace]` section is
# gone and the values it supplied are written out. `util/` and `examples/` are not vendored: nothing
# in oslo uses them and the examples want `clap` and `rustyline`. That, and the two blocks at the
# bottom, are the only edits — the source itself is untouched, which is the rule for `vendor/`.
[package]
name = "luna"
description = "A stackless Lua interpreter, with an extended standard library."
readme = "README.md"
version = "0.4.0"
edition = "2021"
authors = ["Trim Bresilla <kushtrimbresilla@gmail.com>"]
license = "MIT"
repository = "https://github.com/onix-os/luna"
publish = false

[lib]
name = "luna"
path = "src/lib.rs"

[dependencies]
ahash = "0.8"
allocator-api2 = "0.2"
anyhow = "1.0"
ottavino-gc-arena = { version = "0.6.0", features = ["allocator-api2", "hashbrown"] }
hashbrown = { version = "0.14", features = ["raw"] }
rand = { version = "0.8", features = ["small_rng"] }
thiserror = "1.0"

# **Vendored code is not restyled.** See `vendor/README.md`. At the manifest rather than in
# `lib.rs`, because each file under `tests/` is its own crate and an inner attribute never reaches
# them — oslo builds with `-D warnings`, and upstream's tests trip clippy too.
[lints.clippy]
all = "allow"
