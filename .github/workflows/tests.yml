name: tests

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  # Releases ship macOS binaries, so macOS has to be a gate and not a surprise. The toolchain
  # action is pinned to an exact stable release: `@stable` silently moves under us, which turns
  # a new lint into a red build on an unrelated PR.
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      # `make verify` as one step reports only "the gate failed". Splitting it means the run
      # summary alone names the stage, which matters because reading job logs needs admin rights
      # on this repository and the person debugging a red build usually does not have them.
      - name: Toolchain and environment
        run: |
          echo "make:  $(make --version | head -1)"
          echo "bash:  $(bash --version | head -1)"
          echo "sed:   $(sed --version 2>/dev/null | head -1 || echo 'BSD sed (no --version)')"
          echo "cargo: $(cargo --version)"
          echo "PROJECT_NAME parsed by the Makefile: '$(make -s print-name)'"
      # Failures are re-emitted as ::error:: annotations, not just written to the log. Job logs
      # need admin rights on this repository; annotations are visible to anyone who can see the
      # run, so a red build stays diagnosable by whoever is actually looking at it.
      - name: fmt-check
        run: |
          make fmt-check && exit 0
          cargo fmt --all -- --check 2>&1 | head -60 | while IFS= read -r l; do echo "::error::fmt: $l"; done
          exit 1
      - name: check-loc
        run: make check-loc
      - name: check-readme
        run: make check-readme
      - name: check
        run: make check
      - name: test
        run: |
          set -o pipefail
          cargo test --all-targets 2>&1 | tee /tmp/test.log && exit 0
          grep -E '^(test .* FAILED|failures:|thread .* panicked|assertion|  left:|  right:|diverge)' /tmp/test.log \
            | head -60 | while IFS= read -r l; do echo "::error::test: $l"; done
          exit 1
      - name: clippy
        run: make clippy
      - name: rustdoc
        run: make rustdoc

  # Cargo.toml claims rust-version = 1.88; this job is what makes the claim true.
  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            msrv-${{ runner.os }}-
      - name: Declared rust-version matches the pinned toolchain
        run: |
          declared="$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          if [ "$declared" != "1.88" ]; then
            echo "Cargo.toml rust-version is '$declared' but this job pins 1.88." >&2
            echo "Update both together, or the MSRV is not actually being checked." >&2
            exit 1
          fi
      - name: Build at MSRV
        run: cargo check --all-targets
