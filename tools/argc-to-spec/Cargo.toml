[package]
name = "argc-to-spec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Turn argc-annotated scripts into carapace completion specs."
publish = false

# **Its own crate, so the shell does not carry it.** The conversion needs `argc/export`, which
# brings `serde_json` and a serde-enabled `indexmap` — bytes that would otherwise land in a binary
# whose README itemises features in kilobytes. A workspace member is built when it is asked for and
# never as part of `oslo`.

[dependencies]
argc = { path = "../../vendor/argc", default-features = false, features = ["export"] }
