name: twiggy
description: "A code-size profiler for WebAssembly"
flags:
  "--help, -h": "Prints help information"
  "--version, -v": "Prints version information"
commands:
  - name: diff
    description: "Diff the old and new versions of a binary to see what sizes changed"
