        mcmodel: [small, medium, medany, medlow]
        "stdlib++-isystem": ["$directories"]
      positionalany: ["$files"]
  - name: dll-tool
    description: "LLVM dll tool"
    flags:
      "-h, --help": "Print help and exit"
      "-D=": "Specify the input DLL Name"
      "-d=": "Input .def File"
      "-f=": "Assembler Flags"
      "-k": "Kill @n Symbol from export"
      "-l=": "Generate an import lib"
      "-m=": "Set target machine"
      "-S=": Assembler
    completion:
      flag:
        d: ["$files"]
        m: [i386, "i386:x86-64", arm, arm64]
  - name: lib
    description: "Use Zig as a drop-in lib.exe"
  - name: ranlib
    description: "LLVM Ranlib : This program generates an index to speed access to archives"
    flags:
      "-h, --help": "Print help and exit"
      "-v, --version": "Display the version of this program"
      "-D": "Use zero for timestamps and uids/gids (default)"
      "-U": "Use actual timestamps and uids/gids"
  - name: env
    description: "Print lib path, std path, cache directory, and version"
  - name: help
    description: "Print help and exit"
  - name: libc
    description: "Detect the native libc installation and print the resulting paths to stdout"
    flags:
      "-h, --help": "Print help and exit"
      "-target=": "<arch><sub>-<os>-<abi> see the targets command"
    completion:
      positional:
        - ["$files"]
  - name: targets
    description: "List available compilation targets"
