        fapinotes-cache-path: ["$directories"]
        fcf-protection: [return, branch, full, none]
        fcs-profile-generate: ["$directories"]
        fembed-bitcode: ["off", all, bitcode, marker]
        flto: [full, thin]
        fmodules-cache-path: ["$directories"]
