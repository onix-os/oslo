  "--ca-dir=": "path of the trusted CA-Directory Default: /etc/ssl/certs"
  "--target-network=": "Target network in dotted decimal or CIDR notation Default: 0.0.0.0/0.0.0.0"
  "--password-helper=": "path to password program or helper name"
