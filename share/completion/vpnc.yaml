  "--enable-no-encryption": "enables using no encryption for data traffic (key exchanged must be encrypted)"
  "--application-version=": "Application Version to report."
  "--ifname=": "visible name of the TUN/TAP interface"
  "--ifmode=": "mode of TUN/TAP interface: • tun: virtual point to point interface (default) • tap: virtual ethernet interface Default: tun"
  "--ifmtu=": "Set MTU for TUN/TAP interface (default 0 == automatic detect)"
  "--debug=": "Show verbose debug messages •"
  "--no-detach": "Don't detach from the console after login"
  "--pid-file=": "store the pid of background process in <filename> Default: /run/vpnc.pid"
  "--local-addr=": "local IP to use for ISAKMP / ESP / ... (0.0.0.0 == automatically assign) Default: 0.0.0.0"
  "--local-port=": "local ISAKMP port number to use (0 == use random port) Default: 500"
  "--udp-port=": "Local UDP port number to use (0 == use random port)."
  "--dpd-idle=": "Send DPD packet after not receiving anything for <idle> seconds."
  "--non-inter": "Don't ask anything, exit on missing options"
