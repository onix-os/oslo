# Converted from Fig's firebase.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: firebase
commands:
  - name: "appdistribution:distribute"
    description: "Upload a distribution"
    flags:
      "--app=": "The app id of your Firebase app"
      "--release-notes": "Release notes to include with this distribution"
      "--release-notes-file=": "Path to file with release notes to include with this distribution"
      "--testers=": {description: "A comma separated list of tester emails to distribute to", nargs: -1}
      "--testers-file=": "Path to file with a comma separated list of tester emails to distribute to"
      "--groups=": {description: "A comma separated list of group aliases to distribute to", nargs: -1}
      "--groups-file=": {description: "Path to file with a comma separated list of group aliases to distribute to", nargs: -1}
      "-h, --help": "Output usage information"
  - name: "apps:android:sha:create"
    description: "Add a SHA certificate hash for a given app id"
    flags:
      "-h, --help": "Output usage information"
  - name: "apps:android:sha:delete"
    description: "Delete a SHA certificate hash for a given app id"
    flags:
      "-h, --help": "Output usage information"
  - name: "apps:create"
    description: "Create a new Firebase app"
    flags:
      "-a, --package-name=": "Required package name for the Android app"
      "-b, --bundle-id=": "Required bundle id for the iOS app"
      "-s, --app-store-id=": "(optional) app store id for the iOS app"
      "-h, --help": "Output usage information"
  - name: "auth:export"
    description: "Export accounts from your Firebase project into a data file"
    flags:
      "--format=": "Format of exported data (csv, json). Ignored if [dataFile] has format extension"
      "-h, --help": "Output usage information"
    completion:
      flag:
        format: [csv, json]
      positional:
        - ["$files"]
  - name: "auth:import"
    description: "Import users into your Firebase project from a data file(.csv or .json)"
    flags:
      "--hash-algo=": "Specify the hash algorithm used in password for these accounts"
      "--hash-key=": "Specify the key used in hash algorithm"
      "--salt-separator=": "Specify the salt separator which will be appended to salt when verifying password. only used by SCRYPT now"
      "--rounds=": "Specify how many rounds for hash calculation"
      "--mem-cost=": "Specify the memory cost for firebase scrypt, or cpu/memory cost for standard scrypt"
      "--parallelization=": "Specify the parallelization for standard scrypt"
      "--block-size=": "Specify the block size (normally is 8) for standard scrypt"
      "--dk-len=": "Specify derived key length for standard scrypt"
      "--hash-input-order=": "Specify the order of password and salt. Possible values are SALT_FIRST and PASSWORD_FIRST. MD5, SHA1, SHA256, SHA512, HMAC_MD5, HMAC_SHA1, HMAC_SHA256, HMAC_SHA512 support this flag"
      "-h, --help": "Output usage information"
    completion:
      positional:
        - ["$files"]
  - name: "database:get"
    description: "Fetch and print JSON data at the specified path"
  - name: "database:instances:create"
    description: "Create a realtime database instance"
    flags:
      "-l, --location=": "(optional) location for the database instance, defaults to us-central1"
      "-h, --help": "Output usage information"
  - name: "database:instances:list"
    description: "List realtime database instances, optionally filtered by a specified location"
    flags:
      "-h, --help": "Output usage information"
  - name: "database:profile"
    description: "Profile the Realtime Database and generate a usage report"
    flags:
      "-o, --output=": "Save the output to the specified file"
      "-d, --duration=": "Collect database usage information for the specified number of seconds"
      "--raw=": "Output the raw stats collected as newline delimited json"
      "--no-collapse": "Prevent collapsing similar paths into $wildcard locations"
      "-i, --input=": "Generate the report based on the specified file instead of streaming logs from the database"
      "--instance=": "Use the database <instance>.firebaseio.com (if omitted, use default database instance)"
      "-h, --help": "Output usage information"
  - name: "database:push"
    description: "Add a new JSON object to a list of data in your Firebase"
    flags:
      "-d, --data=": "Specify escaped JSON directly"
      "--instance=": "Use the database <instance>.firebaseio.com (if omitted, use default database instance)"
      "-h, --help": "Output usage information"
    completion:
      positional:
        - ["$files"]
  - name: "database:remove"
    description: "Remove data from your Firebase at the specified path"
    flags:
      "-y, --confirm": "Pass this option to bypass confirmation prompt"
      "--instance=": "Use the database <instance>.firebaseio.com (if omitted, use default database instance)"
      "-h, --help": "Output usage information"
    completion:
      positional:
        - ["$files"]
  - name: "database:set"
    description: "Store JSON data at the specified path via STDIN, arg, or file"
    flags:
      "-d, --data=": "Specify escaped JSON directly"
      "-y, --confirm": "Pass this option to bypass confirmation prompt"
      "--instance=": "Use the database <instance>.firebaseio.com (if omitted, use default database instance)"
      "-h, --help": "Output usage information"
    completion:
      positional:
        - ["$files"]
  - name: "database:settings:get"
    description: "Store JSON data at the specified path via STDIN, arg, or file"
    flags:
      "--instance=": "Use the database <instance>.firebaseio.com (if omitted, uses default database instance)"
      "-h, --help": "Output usage information"
    completion:
      positional:
        - ["$files"]
  - name: "database:settings:set"
    description: "Set the realtime database setting at path"
    flags:
      "--instance=": "Use the database <instance>.firebaseio.com (if omitted, use default database instance)"
      "-h, --help": "Output usage information"
  - name: "database:update"
    description: "Update some of the keys for the defined path in your Firebase"
    flags:
      "-d, --data=": "Specify escaped JSON directly"
      "-y, --confirm": "Pass this option to bypass confirmation prompt"
      "--instance=": "Use the database <instance>.firebaseio.com (if omitted, use default database instance)"
      "-h, --help": "Output usage information"
    completion:
      positional:
        - ["$files"]
  - name: deploy
    description: "Deploy code and assets to your Firebase project"
    flags:
      "-p, --public": "Override the Hosting public directory specified in firebase.json"
      "-m, --message=": "An optional message describing this deploy"
      "-f, --force": "Delete Cloud Functions missing from the current working directory without confirmation"
      "--only": "Only deploy to specified, comma-separated targets (e.g. \"hosting,storage\"). For functions, can specify filters with colons to scope function deploys to only those functions (e.g. \"--only functions:func1,functions:func2\"). When filtering based on export groups (the exported module object keys), use dots to specify group names (e.g. \"--only functions:group1.subgroup1,functions:group2)\""
      "--except=": "Deploy to all targets except specified (e.g. \"database\")"
      "-h, --help": "Output usage information"
  - name: "emulators:exec"
    description: "Start the local Firebase emulators, run a test script, then shut down the emulators"
    flags:
      "--only=": "Only specific emulators. This is a comma separated list of emulator names. Valid options are: [\"auth\",\"functions\",\"firestore\",\"database\",\"hosting\",\"pubsub\"]"
      "--inspect-functions": "Emulate Cloud Functions in debug mode with the node inspector on the given port (9229 if not specified)"
      "--import=": "Import emulator data from a previous export (see emulators:export)"
      "--export-on-exit": "Automatically export emulator data (emulators:export) when the emulators make a clean exit (SIGINT), when no dir is provided the location of --import [dir] is used"
      "--ui": "Run the Emulator UI"
      "-h, --help": "Output usage information"
  - name: "emulators:export"
    description: "Export data from running emulators"
    flags:
      "--only=": "Only specific emulators. This is a comma separated list of emulator names. Valid options are: [\"auth\",\"functions\",\"firestore\",\"database\",\"hosting\",\"pubsub\"]"
      "--force": "Overwrite any export data in the target directory"
      "-h, --help": "Output usage information"
    completion:
      positional:
        - ["$files"]
  - name: "emulators:start"
    description: "Start the local Firebase emulators"
    flags:
      "--only=": "Only specific emulators. This is a comma separated list of emulator names. Valid options are: [\"auth\",\"functions\",\"firestore\",\"database\",\"hosting\",\"pubsub\"]"
      "--inspect-functions=": "Emulate Cloud Functions in debug mode with the node inspector on the given port (9229 if not specified)"
      "--import": "Import emulator data from a previous export (see emulators:export)"
      "--export-on-exit": "Automatically export emulator data (emulators:export) when the emulators make a clean exit (SIGINT), when no dir is provided the location of --import [dir] is used"
      "-h, --help": "Output usage information"
  - name: "experimental:functions:shell"
    description: "Launch full Node shell with emulated functions"
    flags:
      "-p, --port=": "The port on which to emulate functions (default: 5000) (default: 5000)"
      "-h, --help": "Output usage information"
  - name: "ext:configure"
    description: "Configure an existing extension instance"
    flags:
      "--params=": "Path of params file with .env format"
      "-h, --help": "Output usage information"
  - name: "ext:info"
    description: "List all the extensions that are installed in your Firebase project"
    flags:
      "--markdown": "Output info in Markdown suitable for constructing a README file"
      "-h, --help": "Output usage information"
  - name: "ext:uninstall"
    description: "Uninstall an extension that is installed in your Firebase project by instance ID"
    flags:
      "-f, --force": "No confirmation. Otherwise, a confirmation prompt will appear"
      "-h, --help": "Output usage information"
  - name: "ext:update"
    description: "Update an existing extension instance to the latest version"
    flags:
      "-h, --help": "Output usage information"
  - name: "firestore:delete"
    description: "Delete data from Cloud Firestore"
    flags:
      "-r, --recursive": "Recursive. Delete all documents and subcollections at and under the specified level. May not be passed along with"
      "--shallow": "Shallow. Delete only documents at the specified level and ignore documents in subcollections. This action can potentially orphan documents nested in subcollections. May not be passed along with -r"
      "--all-collections": "Delete all. Deletes the entire Firestore database, including all collections and documents. Any other flags or arguments will be ignored"
      "-y, --yes": "No confirmation. Otherwise, a confirmation prompt will appear"
      "-h, --help": "Output usage information"
  - name: "firestore:indexes"
    description: "List indexes in your project's Cloud Firestore database"
    flags:
      "--pretty": "Pretty print. When not specified the indexes are printed in the JSON specification format"
      "-h, --help": "Output usage information"
  - name: "functions:config:clone"
    description: "Clone environment config from another project"
    flags:
      "--from=": "The project from which to clone configuration"
      "--only=": "A comma-separated list of keys to clone"
      "--except=": "A comma-separated list of keys to not clone"
      "-h, --help": "Output usage information"
  - name: "functions:config:get"
    description: "Fetch environment config stored at the given path"
    flags:
      "-h, --help": "Output usage information"
  - name: "functions:config:set"
    description: "Set environment config with key=value syntax"
    flags:
      "-h, --help": "Output usage information"
  - name: "functions:log"
    description: "Read logs from deployed functions"
    flags:
      "--only=": "Only show logs of specified, comma-separated functions (e.g. \"funcA,funcB\")"
      "-n, --lines=": "Specify number of log lines to fetch"
      "--open": "Open logs page in web browser"
      "-h, --help": "Output usage information"
  - name: "functions:shell"
    description: "Launch full Node shell with emulated functions"
    flags:
      "-p, --port=": "The port on which to emulate functions"
      "--inspect-functions=": "Emulate Cloud Functions in debug mode with the node inspector on the given port (9229 if not specified)"
      "-h, --help": "Output usage information"
  - name: help
    description: "Display help information"
    flags:
      "-h, --help": "Output usage information"
  - name: "hosting:channel:create"
    description: "Create a Firebase Hosting channel"
    flags:
      "-e, --expires=": "Duration string (e.g. 12h or 30d) for channel expiration, max 30d"
      "--site=": "Site for which to create the channel"
      "-h, --help": "Output usage information"
  - name: "hosting:channel:delete"
    description: "Delete a Firebase Hosting channel"
    flags:
      "--site=": "Site in which the channel exists"
      "-f, --force": "Delete without confirmation"
      "-h, --help": "Output usage information"
  - name: "hosting:channel:deploy"
    description: "Deploy to a specific Firebase Hosting channel"
    flags:
      "-e, --expires=": "Duration string (e.g. 12h, 30d) for channel expiration, max 30d; defaults to 7d"
      "--only": "Only create previews for specified targets"
      "--open": "Open a browser to the channel after deploying"
      "--no-authorized-domains": "Do not sync channel domains with Firebase Auth"
      "-h, --help": "Output usage information"
  - name: "hosting:channel:list"
    description: "List all Firebase Hosting channels for your project"
    flags:
      "--site=": "List channels for the specified site"
      "-h, --help": "Output usage information"
  - name: "hosting:channel:open"
    description: "Opens the URL for a Firebase Hosting channel"
    flags:
      "--site=": "The site to which the channel belongs"
      "-h, --help": "Output usage information"
  - name: "hosting:clone"
    description: "Clone a version from one site to another"
    flags:
      "-h, --help": "Output usage information"
  - name: "hosting:disable"
    description: "Stop serving web traffic to your Firebase Hosting site"
    flags:
      "-y, --confirm": "Skip confirmation"
      "-s, --site=": "The site to disable"
      "-h, --help": "Output usage information"
  - name: "hosting:sites:create"
    description: "Create a Firebase Hosting site"
    flags:
      "--app=": "Specify an existing Firebase Web App ID"
      "-h, --help": "Output usage information"
  - name: "hosting:sites:delete"
    description: "Delete a Firebase Hosting site"
    flags:
      "-f, --force": "Delete without confirmation"
      "-h, --help": "Output usage information"
  - name: "hosting:sites:get"
    description: "Print info about a Firebase Hosting site"
    flags:
      "-h, --help": "Output usage information"
  - name: "hosting:sites:list"
    description: "List Firebase Hosting sites"
    flags:
      "-h, --help": "Output usage information"
  - name: init
    description: "Setup a Firebase project in the current directory"
    flags:
      "-h, --help": "Output usage information"
  - name: login
    description: "Log the CLI into Firebase"
    flags:
      "--no-localhost": "Copy and paste a code instead of starting a local server for authentication"
      "--reauth": "Force reauthentication even if already logged in"
      "-h, --help": "Output usage information"
  - name: "login:add"
    description: "Authorize the CLI for an additional account"
    flags:
      "--no-localhost": "Copy and paste a code instead of starting a local server for authentication"
      "-h, --help": "Output usage information"
  - name: "login:ci"
    description: "Generate an access token for use in non-interactive environments"
    flags:
      "--no-localhost": "Copy and paste a code instead of starting a local server for authentication"
      "-h, --help": "Output usage information"
  - name: "login:list"
    description: "List authorized CLI accounts"
    flags:
      "-h, --help": "Output usage information"
  - name: "login:use"
    description: "Set the default account to use for this project directory"
    flags:
      "-h, --help": "Output usage information"
  - name: logout
    description: "Log the CLI out of Firebase"
    flags:
      "-h, --help": "Output usage information"
  - name: open
    description: "Quickly open a browser to relevant project resources"
    flags:
      "-h, --help": "Output usage information"
  - name: "projects:addfirebase"
    description: "Add Firebase resources to a Google Cloud Platform project"
    flags:
      "-h, --help": "Output usage information"
  - name: "projects:create"
    description: "Creates a new Google Cloud Platform project, then adds Firebase resources to the project"
    flags:
      "-n, --display-name=": "(optional) display name for the project"
      "-o, --organization=": "(optional) ID of the parent Google Cloud Platform organization under which to create this project"
      "-f, --folder=": "(optional) ID of the parent Google Cloud Platform folder in which to create this project"
      "-h, --help": "Output usage information"
  - name: "projects:list"
    description: "List all Firebase projects you have access to"
    flags:
      "-h, --help": "Output usage information"
  - name: "remoteconfig:get"
    description: "Get a Firebase project's Remote Config template"
    flags:
      "-v, --version-number": "Grabs the specified version of the template"
      "-o, --output=": "Write config output to a filename (if omitted, will use the default file path)"
      "-h, --help": "Output usage information"
  - name: "remoteconfig:rollback"
    description: "Roll back a project's published Remote Config template to the one specified by the provided version number"
    flags:
      "-v, --version-number=": "Rollback to the specified version of the template"
      "--force": "Rollback template to the specified version without confirmation"
      "-h, --help": "Output usage information"
  - name: "remoteconfig:versions:list"
    description: "Get a list of Remote Config template versions that have been published for a Firebase project"
    flags:
      "--limit=": "Limit the number of versions being returned. Pass '0' to fetch all versions"
      "-h, --help": "Output usage information"
  - name: serve
    description: "Start a local server for your static assets"
    flags:
      "-p, --port=": "The port on which to listen (default: 5000) (default: 5000)"
      "-o, --host=": "The host on which to listen (default: localhost) (default: \"localhost\")"
      "--only": "Only serve specified targets (valid targets are: hosting, functions)"
      "--except=": "Serve all except specified targets (valid targets are: hosting, functions)"
      "-h, --help": "Output usage information"
  - name: "setup:emulators:database"
    description: "Downloads the database emulator"
    flags:
      "-h, --help": "Output usage information"
  - name: "setup:emulators:firestore"
    description: "Downloads the firestore emulator"
    flags:
      "-h, --help": "Output usage information"
  - name: "setup:emulators:pubsub"
    description: "Downloads the pubsub emulator"
    flags:
      "-h, --help": "Output usage information"
  - name: "setup:emulators:ui"
    description: "Downloads the ui emulator"
    flags:
      "-h, --help": "Output usage information"
  - name: target
    description: "Display configured deploy targets for the current project"
    flags:
      "-h, --help": "Output usage information"
  - name: "target:apply"
    description: "Apply a deploy target to a resource"
    flags:
      "-h, --help": "Output usage information"
  - name: "target:clear"
    description: "Clear all resources from a named resource target"
    flags:
      "-h, --help": "Output usage information"
  - name: "target:remove"
    description: "Remove a resource target"
    flags:
      "-h, --help": "Output usage information"
  - name: use
    description: "Set an active Firebase project for your working directory"
    flags:
      "--add=": "Create a new project alias interactively"
      "--alias=": "Create a new alias for the provided project id"
      "--unalias=": "Remove an already created project alias"
      "--clear": "Clear the active project selection"
      "-h, --help": "Output usage information"
