  - name: functions
    description: "The functions command allows you view, create and manage your Cloud Functions"
    commands:
      - name: list
        description: "Get a list of all the project's functions. You can use the query params to filter your results"
        flags:
          "--search=": "Search term to filter your list results. Max length: 256 chars"
          "--limit=": "Maximum number of functions to return in response. By default will return maximum 25 results. Maximum of 100 results allowed per request"
          "--offset=": "Offset value. The default value is 0. Use this value to manage pagination. [learn more about pagination](https://appwrite.io/docs/pagination)"
          "--cursor=": "ID of the function used as the starting point for the query, excluding the function itself. Should be used for efficient pagination when working with large sets of data. [learn more about pagination](https://appwrite.io/docs/pagination)"
          "--cursorDirection=": "Direction of the cursor, can be either 'before' or 'after'"
          "--orderType=": "Order result by ASC or DESC order"
      - name: create
        description: "Create a new function. You can pass a list of [permissions](/docs/permissions) to allow different project users or team with access to execute the function using the client API"
        flags:
          "--functionId=!": "Function ID. Choose your own unique ID or pass the string \"unique()\" to auto generate it. Valid chars are a-z, A-Z, 0-9, period, hyphen, and underscore. Can't start with a special char. Max length is 36 chars"
          "--name=!": "Function name. Max length: 128 chars"
          "--execute=!": {description: "An array of strings with execution permissions. By default no user is granted with any execute permissions. [learn more about permissions](https://appwrite.io/docs/permissions) and get a full list of available permissions. Maximum of 100 scopes are allowed, each 64 characters long", nargs: -1}
          "--runtime=!": "Execution runtime"
          "--vars=": "Key-value JSON object that will be passed to the function as environment variables"
          "--events=": {description: "Events list. Maximum of 100 events are allowed", nargs: -1}
          "--schedule=": "Schedule CRON syntax"
          "--timeout=": "Function maximum execution time in seconds"
      - name: listRuntimes
        description: "Get a list of all runtimes that are currently active on your instance"
      - name: get
        description: "Get a function by its unique ID"
        flags:
          "--functionId=!": "Function ID"
      - name: update
        description: "Update function by its unique ID"
        flags:
          "--functionId=!": "Function ID"
          "--name=!": "Function name. Max length: 128 chars"
          "--execute=!": {description: "An array of strings with execution permissions. By default no user is granted with any execute permissions. [learn more about permissions](https://appwrite.io/docs/permissions) and get a full list of available permissions. Maximum of 100 scopes are allowed, each 64 characters long", nargs: -1}
          "--vars=": "Key-value JSON object that will be passed to the function as environment variables"
          "--events=": {description: "Events list. Maximum of 100 events are allowed", nargs: -1}
          "--schedule=": "Schedule CRON syntax"
          "--timeout=": "Maximum execution time in seconds"
      - name: delete
        description: "Delete a function by its unique ID"
        flags:
          "--functionId=!": "Function ID"
      - name: listDeployments
        description: "Get a list of all the project's code deployments. You can use the query params to filter your results"
        flags:
          "--functionId=!": "Function ID"
          "--search=": "Search term to filter your list results. Max length: 256 chars"
          "--limit=": "Maximum number of deployments to return in response. By default will return maximum 25 results. Maximum of 100 results allowed per request"
          "--offset=": "Offset value. The default value is 0. Use this value to manage pagination. [learn more about pagination](https://appwrite.io/docs/pagination)"
          "--cursor=": "ID of the deployment used as the starting point for the query, excluding the deployment itself. Should be used for efficient pagination when working with large sets of data. [learn more about pagination](https://appwrite.io/docs/pagination)"
          "--cursorDirection=": "Direction of the cursor, can be either 'before' or 'after'"
          "--orderType=": "Order result by ASC or DESC order"
      - name: createDeployment
        description: "Create a new function code deployment. Use this endpoint to upload a new version of your code function. To execute your newly uploaded code, you'll need to update the function's deployment to use your new deployment UID. This endpoint accepts a tar.gz file compressed with your code. Make sure to include any dependencies your code has within the compressed file. You can learn more about code packaging in the [Appwrite Cloud Functions tutorial](/docs/functions). Use the \"command\" param to set the entry point used to execute your code"
        flags:
          "--functionId=!": "Function ID"
          "--entrypoint=!": "Entrypoint File"
          "--code=!": "Gzip file with your code package. When used with the Appwrite CLI, pass the path to your code directory, and the CLI will automatically package your code. Use a path that is within the current directory"
          "--activate=!": "Automatically activate the deployment when it is finished building"
      - name: getDeployment
        description: "Get a code deployment by its unique ID"
        flags:
          "--functionId=!": "Function ID"
          "--deploymentId=!": "Deployment ID"
      - name: updateDeployment
        description: "Update the function code deployment ID using the unique function ID. Use this endpoint to switch the code deployment that should be executed by the execution endpoint"
        flags:
          "--functionId=!": "Function ID"
          "--deploymentId=!": "Deployment ID"
      - name: deleteDeployment
        description: "Delete a code deployment by its unique ID"
        flags:
          "--functionId=!": "Function ID"
          "--deploymentId=!": "Deployment ID"
      - name: retryBuild
        flags:
          "--functionId=!": "Function ID"
          "--deploymentId=!": "Deployment ID"
          "--buildId=!": "Build unique ID"
      - name: listExecutions
        description: "Get a list of all the current user function execution logs. You can use the query params to filter your results. On admin mode, this endpoint will return a list of all of the project's executions. [Learn more about different API modes](/docs/admin)"
        flags:
          "--functionId=!": "Function ID"
          "--limit=": "Maximum number of executions to return in response. By default will return maximum 25 results. Maximum of 100 results allowed per request"
          "--offset=": "Offset value. The default value is 0. Use this value to manage pagination. [learn more about pagination](https://appwrite.io/docs/pagination)"
          "--search=": "Search term to filter your list results. Max length: 256 chars"
          "--cursor=": "ID of the execution used as the starting point for the query, excluding the execution itself. Should be used for efficient pagination when working with large sets of data. [learn more about pagination](https://appwrite.io/docs/pagination)"
          "--cursorDirection=": "Direction of the cursor, can be either 'before' or 'after'"
      - name: createExecution
        description: "Trigger a function execution. The returned object will return you the current execution status. You can ping the 'Get Execution' endpoint to get updates on the current execution status. Once this endpoint is called, your function execution process will start asynchronously"
        flags:
          "--functionId=!": "Function ID"
          "--data=": "String of custom data to send to function"
          "--async=": "Execute code asynchronously. Default value is true"
      - name: getExecution
        description: "Get a function execution log by its unique ID"
        flags:
          "--functionId=!": "Function ID"
          "--executionId=!": "Execution ID"
      - name: getUsage
        flags:
          "--functionId=!": "Function ID"
          "--range=": "Date range"
