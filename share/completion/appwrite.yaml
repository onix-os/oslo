          "--permission=!": "Permissions type model to use for reading files in this bucket. You can use bucket-level permission set once on the bucket using the 'read' and 'write' params, or you can set file-level permission where each file read and write params will decide who has access to read and write to each file individually. [learn more about permissions](/docs/permissions) and get a full list of available permissions"
          "--read=": {description: "An array of strings with read permissions. By default no user is granted with any read permissions. [learn more about permissions](/docs/permissions) and get a full list of available permissions", nargs: -1}
          "--write=": {description: "An array of strings with write permissions. By default no user is granted with any write permissions. [learn more about permissions](/docs/permissions) and get a full list of available permissions", nargs: -1}
          "--enabled=": "Is bucket enabled?"
          "--maximumFileSize=": "Maximum file size allowed in bytes. Maximum allowed value is 30MB. For self-hosted setups you can change the max limit by changing the '_APP_STORAGE_LIMIT' environment variable. [Learn more about storage environment variables](docs/environment-variables#storage)"
          "--allowedFileExtensions=": {description: "Allowed file extensions. Maximum of 100 extensions are allowed, each 64 characters long", nargs: -1}
          "--encryption=": "Is encryption enabled? For file size above 20MB encryption is skipped even if it's enabled"
          "--antivirus=": "Is virus scanning enabled? For file size above 20MB AntiVirus scanning is skipped even if it's enabled"
      - name: getBucket
        description: "Get a storage bucket by its unique ID. This endpoint response returns a JSON object with the storage bucket metadata"
        flags:
          "--bucketId=!": "Bucket unique ID"
      - name: updateBucket
        description: "Update a storage bucket by its unique ID"
        flags:
          "--bucketId=!": "Bucket unique ID"
          "--name=!": "Bucket name"
          "--permission=!": "Permissions type model to use for reading files in this bucket. You can use bucket-level permission set once on the bucket using the 'read' and 'write' params, or you can set file-level permission where each file read and write params will decide who has access to read and write to each file individually. [learn more about permissions](/docs/permissions) and get a full list of available permissions"
          "--read=": {description: "An array of strings with read permissions. By default inherits the existing read permissions. [learn more about permissions](/docs/permissions) and get a full list of available permissions", nargs: -1}
          "--write=": {description: "An array of strings with write permissions. By default inherits the existing write permissions. [learn more about permissions](/docs/permissions) and get a full list of available permissions", nargs: -1}
          "--enabled=": "Is bucket enabled?"
          "--maximumFileSize=": "Maximum file size allowed in bytes. Maximum allowed value is 30MB. For self hosted version you can change the limit by changing _APP_STORAGE_LIMIT environment variable. [Learn more about storage environment variables](docs/environment-variables#storage)"
          "--allowedFileExtensions=": {description: "Allowed file extensions. Maximum of 100 extensions are allowed, each 64 characters long", nargs: -1}
          "--encryption=": "Is encryption enabled? For file size above 20MB encryption is skipped even if it's enabled"
          "--antivirus=": "Is virus scanning enabled? For file size above 20MB AntiVirus scanning is skipped even if it's enabled"
      - name: deleteBucket
        description: "Delete a storage bucket by its unique ID"
        flags:
          "--bucketId=!": "Bucket unique ID"
      - name: listFiles
        description: "Get a list of all the user files. You can use the query params to filter your results. On admin mode, this endpoint will return a list of all of the project's files. [Learn more about different API modes](/docs/admin)"
        flags:
          "--bucketId=!": "Storage bucket unique ID. You can create a new storage bucket using the Storage service [server integration](/docs/server/storage#createBucket)"
          "--search=": "Search term to filter your list results. Max length: 256 chars"
          "--limit=": "Maximum number of files to return in response. By default will return maximum 25 results. Maximum of 100 results allowed per request"
          "--offset=": "Offset value. The default value is 0. Use this param to manage pagination. [learn more about pagination](https://appwrite.io/docs/pagination)"
          "--cursor=": "ID of the file used as the starting point for the query, excluding the file itself. Should be used for efficient pagination when working with large sets of data. [learn more about pagination](https://appwrite.io/docs/pagination)"
          "--cursorDirection=": "Direction of the cursor, can be either 'before' or 'after'"
          "--orderType=": "Order result by ASC or DESC order"
      - name: createFile
        description: "Create a new file. Before using this route, you should create a new bucket resource using either a [server integration](/docs/server/database#storageCreateBucket) API or directly from your Appwrite console. Larger files should be uploaded using multiple requests with the [content-range](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Range) header to send a partial request with a maximum supported chunk of '5MB'. The 'content-range' header values should always be in bytes. When the first request is sent, the server will return the **File** object, and the subsequent part request must include the file's **id** in 'x-appwrite-id' header to allow the server to know that the partial upload is for the existing file and not for a new one. If you're creating a new file using one of the Appwrite SDKs, all the chunking logic will be managed by the SDK internally"
        flags:
          "--bucketId=!": "Storage bucket unique ID. You can create a new storage bucket using the Storage service [server integration](/docs/server/storage#createBucket)"
          "--fileId=!": "File ID. Choose your own unique ID or pass the string \"unique()\" to auto generate it. Valid chars are a-z, A-Z, 0-9, period, hyphen, and underscore. Can't start with a special char. Max length is 36 chars"
          "--file=!": "Binary file"
          "--read=": {description: "An array of strings with read permissions. By default only the current user is granted with read permissions. [learn more about permissions](https://appwrite.io/docs/permissions) and get a full list of available permissions", nargs: -1}
          "--write=": {description: "An array of strings with write permissions. By default only the current user is granted with write permissions. [learn more about permissions](https://appwrite.io/docs/permissions) and get a full list of available permissions", nargs: -1}
      - name: getFile
        description: "Get a file by its unique ID. This endpoint response returns a JSON object with the file metadata"
        flags:
          "--bucketId=!": "Storage bucket unique ID. You can create a new storage bucket using the Storage service [server integration](/docs/server/storage#createBucket)"
          "--fileId=!": "File ID"
      - name: updateFile
        description: "Update a file by its unique ID. Only users with write permissions have access to update this resource"
        flags:
          "--bucketId=!": "Storage bucket unique ID. You can create a new storage bucket using the Storage service [server integration](/docs/server/storage#createBucket)"
          "--fileId=!": "File unique ID"
          "--read=": {description: "An array of strings with read permissions. By default no user is granted with any read permissions. [learn more about permissions](https://appwrite.io/docs/permissions) and get a full list of available permissions", nargs: -1}
          "--write=": {description: "An array of strings with write permissions. By default no user is granted with any write permissions. [learn more about permissions](https://appwrite.io/docs/permissions) and get a full list of available permissions", nargs: -1}
      - name: deleteFile
        description: "Delete a file by its unique ID. Only users with write permissions have access to delete this resource"
        flags:
          "--bucketId=!": "Storage bucket unique ID. You can create a new storage bucket using the Storage service [server integration](/docs/server/storage#createBucket)"
          "--fileId=!": "File ID"
      - name: getFileDownload
        description: "Get a file content by its unique ID. The endpoint response return with a 'Content-Disposition: attachment' header that tells the browser to start downloading the file to user downloads directory"
        flags:
          "--bucketId=!": "Storage bucket ID. You can create a new storage bucket using the Storage service [server integration](/docs/server/storage#createBucket)"
          "--fileId=!": "File ID"
          "--destination=!": "Output file path"
      - name: getFilePreview
        description: "Get a file preview image. Currently, this method supports preview for image files (jpg, png, and gif), other supported formats, like pdf, docs, slides, and spreadsheets, will return the file icon image. You can also pass query string arguments for cutting and resizing your preview image. Preview is supported only for image files smaller than 10MB"
        flags:
          "--bucketId=!": "Storage bucket unique ID. You can create a new storage bucket using the Storage service [server integration](/docs/server/storage#createBucket)"
          "--fileId=!": "File ID"
          "--width=": "Resize preview image width, Pass an integer between 0 to 4000"
          "--height=": "Resize preview image height, Pass an integer between 0 to 4000"
          "--gravity=": "Image crop gravity. Can be one of center,top-left,top,top-right,left,right,bottom-left,bottom,bottom-right"
          "--quality=": "Preview image quality. Pass an integer between 0 to 100. Defaults to 100"
          "--borderWidth=": "Preview image border in pixels. Pass an integer between 0 to 100. Defaults to 0"
          "--borderColor=": "Preview image border color. Use a valid HEX color, no # is needed for prefix"
          "--borderRadius=": "Preview image border radius in pixels. Pass an integer between 0 to 4000"
          "--opacity=": "Preview image opacity. Only works with images having an alpha channel (like png). Pass a number between 0 to 1"
          "--rotation=": "Preview image rotation in degrees. Pass an integer between -360 and 360"
          "--background=": "Preview image background color. Only works with transparent images (png). Use a valid HEX color, no # is needed for prefix"
          "--output=": "Output format type (jpeg, jpg, png, gif and webp)"
          "--destination=!": "Output file path"
      - name: getFileView
        description: "Get a file content by its unique ID. This endpoint is similar to the download method but returns with no 'Content-Disposition: attachment' header"
        flags:
          "--bucketId=!": "Storage bucket unique ID. You can create a new storage bucket using the Storage service [server integration](/docs/server/storage#createBucket)"
          "--fileId=!": "File ID"
          "--destination=!": "Output file path"
      - name: getUsage
        flags:
          "--range=": "Date range"
      - name: getBucketUsage
        flags:
          "--bucketId=!": "Bucket ID"
          "--range=": "Date range"
  - name: teams
    description: "The teams command allows you to group users of your project and to enable them to share read and write access to your project resources"
    commands:
      - name: list
        description: "Get a list of all the teams in which the current user is a member. You can use the parameters to filter your results. In admin mode, this endpoint returns a list of all the teams in the current project. [Learn more about different API modes](/docs/admin)"
        flags:
          "--search=": "Search term to filter your list results. Max length: 256 chars"
          "--limit=": "Maximum number of teams to return in response. By default will return maximum 25 results. Maximum of 100 results allowed per request"
          "--offset=": "Offset value. The default value is 0. Use this param to manage pagination. [learn more about pagination](https://appwrite.io/docs/pagination)"
          "--cursor=": "ID of the team used as the starting point for the query, excluding the team itself. Should be used for efficient pagination when working with large sets of data. [learn more about pagination](https://appwrite.io/docs/pagination)"
          "--cursorDirection=": "Direction of the cursor, can be either 'before' or 'after'"
          "--orderType=": "Order result by ASC or DESC order"
      - name: create
        description: "Create a new team. The user who creates the team will automatically be assigned as the owner of the team. Only the users with the owner role can invite new members, add new owners and delete or update the team"
        flags:
          "--teamId=!": "Team ID. Choose your own unique ID or pass the string \"unique()\" to auto generate it. Valid chars are a-z, A-Z, 0-9, period, hyphen, and underscore. Can't start with a special char. Max length is 36 chars"
          "--name=!": "Team name. Max length: 128 chars"
          "--roles=": {description: "Array of strings. Use this param to set the roles in the team for the user who created it. The default role is **owner**. A role can be any string. Learn more about [roles and permissions](/docs/permissions). Maximum of 100 roles are allowed, each 32 characters long", nargs: -1}
      - name: get
        description: "Get a team by its ID. All team members have read access for this resource"
        flags:
          "--teamId=!": "Team ID"
      - name: update
        description: "Update a team using its ID. Only members with the owner role can update the team"
        flags:
          "--teamId=!": "Team ID"
          "--name=!": "New team name. Max length: 128 chars"
      - name: delete
        description: "Delete a team using its ID. Only team members with the owner role can delete the team"
        flags:
          "--teamId=!": "Team ID"
      - name: listLogs
        description: "Get the team activity logs list by its unique ID"
        flags:
          "--teamId=!": "Team ID"
          "--limit=": "Maximum number of logs to return in response. By default will return maximum 25 results. Maximum of 100 results allowed per request"
          "--offset=": "Offset value. The default value is 0. Use this value to manage pagination. [learn more about pagination](https://appwrite.io/docs/pagination)"
      - name: getMemberships
        description: "Use this endpoint to list a team's members using the team's ID. All team members have read access to this endpoint"
        flags:
          "--teamId=!": "Team ID"
          "--search=": "Search term to filter your list results. Max length: 256 chars"
          "--limit=": "Maximum number of memberships to return in response. By default will return maximum 25 results. Maximum of 100 results allowed per request"
          "--offset=": "Offset value. The default value is 0. Use this value to manage pagination. [learn more about pagination](https://appwrite.io/docs/pagination)"
          "--cursor=": "ID of the membership used as the starting point for the query, excluding the membership itself. Should be used for efficient pagination when working with large sets of data. [learn more about pagination](https://appwrite.io/docs/pagination)"
          "--cursorDirection=": "Direction of the cursor, can be either 'before' or 'after'"
          "--orderType=": "Order result by ASC or DESC order"
      - name: createMembership
        description: "Invite a new member to join your team. If initiated from the client SDK, an email with a link to join the team will be sent to the member's email address and an account will be created for them should they not be signed up already. If initiated from server-side SDKs, the new member will automatically be added to the team. Use the 'url' parameter to redirect the user from the invitation email back to your app. When the user is redirected, use the [Update Team Membership Status](/docs/client/teams#teamsUpdateMembershipStatus) endpoint to allow the user to accept the invitation to the team. Please note that to avoid a [Redirect Attack](https://github.com/OWASP/CheatSheetSeries/blob/master/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.md) the only valid redirect URL's are the once from domains you have set when adding your platforms in the console interface"
        flags:
          "--teamId=!": "Team ID"
          "--email=!": "Email of the new team member"
          "--roles=!": {description: "Array of strings. Use this param to set the user roles in the team. A role can be any string. Learn more about [roles and permissions](/docs/permissions). Maximum of 100 roles are allowed, each 32 characters long", nargs: -1}
          "--url=!": "URL to redirect the user back to your app from the invitation email. Only URLs from hostnames in your project platform list are allowed. This requirement helps to prevent an [open redirect](https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html) attack against your project API"
          "--name=": "Name of the new team member. Max length: 128 chars"
      - name: getMembership
        description: "Get a team member by the membership unique id. All team members have read access for this resource"
        flags:
          "--teamId=!": "Team ID"
          "--membershipId=!": "Membership ID"
      - name: updateMembershipRoles
        description: "Modify the roles of a team member. Only team members with the owner role have access to this endpoint. Learn more about [roles and permissions](/docs/permissions)"
        flags:
          "--teamId=!": "Team ID"
          "--membershipId=!": "Membership ID"
          "--roles=!": {description: "An array of strings. Use this param to set the user's roles in the team. A role can be any string. Learn more about [roles and permissions](https://appwrite.io/docs/permissions). Maximum of 100 roles are allowed, each 32 characters long", nargs: -1}
      - name: deleteMembership
        description: "This endpoint allows a user to leave a team or for a team owner to delete the membership of any other team member. You can also use this endpoint to delete a user membership even if it is not accepted"
        flags:
          "--teamId=!": "Team ID"
          "--membershipId=!": "Membership ID"
      - name: updateMembershipStatus
        description: "Use this endpoint to allow a user to accept an invitation to join a team after being redirected back to your app from the invitation email received by the user. If the request is successful, a session for the user is automatically created"
        flags:
          "--teamId=!": "Team ID"
          "--membershipId=!": "Membership ID"
          "--secret=!": "Secret key"
  - name: users
    description: "The users command allows you to manage your project users"
    commands:
      - name: list
        description: "Get a list of all the project's users. You can use the query params to filter your results"
        flags:
          "--search=": "Search term to filter your list results. Max length: 256 chars"
          "--limit=": "Maximum number of users to return in response. By default will return maximum 25 results. Maximum of 100 results allowed per request"
          "--offset=": "Offset value. The default value is 0. Use this param to manage pagination. [learn more about pagination](https://appwrite.io/docs/pagination)"
          "--cursor=": "ID of the user used as the starting point for the query, excluding the user itself. Should be used for efficient pagination when working with large sets of data. [learn more about pagination](https://appwrite.io/docs/pagination)"
          "--cursorDirection=": "Direction of the cursor, can be either 'before' or 'after'"
          "--orderType=": "Order result by ASC or DESC order"
      - name: create
        description: "Create a new user"
        flags:
          "--userId=!": "User ID. Choose your own unique ID or pass the string \"unique()\" to auto generate it. Valid chars are a-z, A-Z, 0-9, period, hyphen, and underscore. Can't start with a special char. Max length is 36 chars"
          "--email=!": "User email"
          "--password=!": "User password. Must be at least 8 chars"
          "--name=": "User name. Max length: 128 chars"
      - name: getUsage
        flags:
          "--range=": "Date range"
          "--provider=": "Provider Name"
      - name: get
        description: "Get a user by its unique ID"
      - name: delete
        description: "Delete a user by its unique ID, thereby releasing it's ID. Since ID is released and can be reused, all user-related resources like documents or storage files should be deleted before user deletion. If you want to keep ID reserved, use the [updateStatus](/docs/server/users#usersUpdateStatus) endpoint instead"
      - name: updateEmail
        description: "Update the user email by its unique ID"
        flags:
          "--userId=!": "User ID"
          "--email=!": "User email"
      - name: getLogs
        description: "Get the user activity logs list by its unique ID"
        flags:
          "--userId=!": "User ID"
          "--limit=": "Maximum number of logs to return in response. By default will return maximum 25 results. Maximum of 100 results allowed per request"
          "--offset=": "Offset value. The default value is 0. Use this value to manage pagination. [learn more about pagination](https://appwrite.io/docs/pagination)"
      - name: getMemberships
        description: "Get the user membership list by its unique ID"
        flags:
          "--userId=!": "User ID"
      - name: updateName
        description: "Update the user name by its unique ID"
        flags:
          "--userId=!": "User ID"
          "--name=!": "User name. Max length: 128 chars"
      - name: updatePassword
        description: "Update the user password by its unique ID"
        flags:
          "--userId=!": "User ID"
          "--password=!": "New user password. Must be at least 8 chars"
      - name: updatePhone
        description: "Update the user phone by its unique ID"
        flags:
          "--userId=!": "User ID"
          "--number=!": "User phone number"
      - name: getPrefs
        description: "Get the user preferences by its unique ID"
        flags:
          "--userId=!": "User ID"
      - name: updatePrefs
        description: "Update the user preferences by its unique ID. The object you pass is stored as is, and replaces any previous value. The maximum allowed prefs size is 64kB and throws error if exceeded"
        flags:
          "--userId=!": "User ID"
          "--prefs=!": "Prefs key-value JSON object"
      - name: getSessions
        description: "Get the user sessions list by its unique ID"
        flags:
          "--userId=!": "User ID"
      - name: deleteSessions
        description: "Delete all user's sessions by using the user's unique ID"
        flags:
          "--userId=!": "User ID"
      - name: deleteSession
        description: "Delete a user sessions by its unique ID"
        flags:
          "--userId=!": "User ID"
          "--sessionId=!": "Session ID"
      - name: updateStatus
        description: "Update the user status by its unique ID. Use this endpoint as an alternative to deleting a user if you want to keep user's ID reserved"
        flags:
          "--userId=!": "User ID"
          "--status=!": "User Status. To activate the user pass 'true' and to block the user pass 'false'"
      - name: updateEmailVerification
        description: "Update the user email verification status by its unique ID"
        flags:
          "--userId=!": "User ID"
          "--emailVerification=!": "User email verification status"
      - name: updatePhoneVerification
        description: "Update the user phone verification status by its unique ID"
        flags:
          "--userId=!": "User ID"
          "--phoneVerification=!": "User phone verification status"
  - name: client
    description: "The client command allows you to configure your CLI"
    flags:
      "--selfSigned=": "Configure the CLI to use a self-signed certificate ( true or false )"
      "--endpoint=": "Set your Apwrite server endpoint"
      "--projectId=": "Set your Apwrite project ID"
      "--key=": "Set your Apwrite server's API key"
      "--debug": "Print CLI debug information"
      "--reset": "Reset the CLI configuration"
