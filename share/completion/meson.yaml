# Converted from argc's meson.sh by tools/argc-to-spec. Do not edit by hand.
name: meson
flags:
  "-h, --help": "show this help message and exit"
  "-V, --version": "Print version"
commands:
  - name: setup
    description: "Configure the project"
    flags:
      "-h, --help": "show this help message and exit"
      "--prefix=": "Installation prefix (default: /usr/local)."
      "--bindir=": "Executable directory (default: bin)."
      "--datadir=": "Data file directory (default: share)."
      "--includedir=": "Header file directory (default: include)."
      "--infodir=": "Info page directory (default: share/info)."
      "--libdir=": "Library directory (default: lib/x86_64-linux-gnu)."
      "--licensedir=": "Licenses directory (default: )."
      "--libexecdir=": "Library executable directory (default: libexec)."
      "--localedir=": "Locale data directory (default: share/locale)."
      "--localstatedir=": "Localstate data directory (default: var)."
      "--mandir=": "Manual page directory (default: share/man)."
      "--sbindir=": "System executable directory (default: sbin)."
      "--sharedstatedir=": "Architecture-independent data directory (default: com)."
      "--sysconfdir=": "Sysconf data directory (default: etc)."
      "--auto-features=": "Override value of all 'auto' features (default: auto)."
      "--backend=": "Backend to use (default: ninja)."
      "--genvslite=": "Setup multiple buildtype-suffixed ninja-backend build directories, and a [builddir]_vs containing a Visual Studio meta-backend with multiple configurations that calls into them (default: vs2022)."
      "--buildtype=": "Build type to use (default: debug)."
      "--debug": "Enable debug symbols and other information"
      "--default-library=": "Default library type (default: shared)."
      "--errorlogs": "Whether to print the logs from failing tests"
      "--install-umask=": "Default umask to apply on permissions of installed files (default: 022)."
      "--layout=": "Build directory layout (default: mirror)."
      "--optimization=": "Optimization level (default: 0)."
      "--prefer-static": "Whether to try static linking before shared linking"
      "--stdsplit": "Split stdout and stderr in test logs"
      "--strip": "Strip targets on install"
      "--unity=": "Unity build (default: off)."
      "--unity-size=": "Unity block size (default:)."
      "--warnlevel=": "Compiler warning level to use (default: 1)."
      "--werror": "Treat warnings as errors"
      "--wrap-mode=": "Wrap mode (default: default)."
      "--force-fallback-for=": "Force fallback for those subprojects (default: [])."
      "--vsenv": "Activate Visual Studio environment"
      "--pkgconfig.relocatable": "Generate pkgconfig files as relocatable"
      "--python.bytecompile=": "Whether to compile bytecode (default: (-1, 2, 0))."
      "--python.install-env=": "Which python environment to install to (default: prefix)."
      "--python.platlibdir=": "Directory for site-specific, platform-specific files (default: )."
      "--python.purelibdir=": "Directory for site-specific, non-platform-specific files (default: )."
      "--python.allow-limited-api": "Whether to allow use of the Python Limited API"
      "--pkg-config-path=": "List of additional paths for pkg-config to search (default: [])."
      "--build.pkg-config-path=": "List of additional paths for pkg-config to search (default: [])."
      "--cmake-prefix-path=": "List of additional prefixes for cmake to search (default: [])."
      "--build.cmake-prefix-path=": "List of additional prefixes for cmake to search (default: [])."
      "-D=": "Set the value of an option, can be used several times to set multiple options."
      "--native-file=": "File containing overrides for native compilation environment."
      "--cross-file=": "File describing cross compilation environment."
      "-v, --version": "show program's version number and exit"
      "--fatal-meson-warnings": "Make all Meson warnings fatal"
      "--reconfigure": "Set options and reconfigure the project."
      "--wipe": "Wipe build directory and reconfigure using previous command line options."
      "--clearcache": "Clear cached state (e.g. found dependencies)."
    completion:
      flag:
        auto-features: [enabled, disabled, auto]
        backend: [ninja, vs, vs2010, vs2012, vs2013, vs2015, vs2017, vs2019, vs2022, xcode, none]
        buildtype: [plain, debug, debugoptimized, release, minsize, custom]
        default-library: [shared, static, both]
        layout: [mirror, flat]
        optimization: [plain, 0, g, 1, 2, 3, s]
        unity: ["on", "off", subprojects]
        unity-size: [2, None, 4]
        warnlevel: [0, 1, 2, 3, everything]
        wrap-mode: [default, nofallback, nodownload, forcefallback, nopromote]
        python.install-env: [auto, prefix, system, venv]
  - name: configure
    description: "Change project options"
    flags:
      "-h, --help": "show this help message and exit"
      "--prefix=": "Installation prefix (default: /usr/local)."
      "--bindir=": "Executable directory (default: bin)."
      "--datadir=": "Data file directory (default: share)."
      "--includedir=": "Header file directory (default: include)."
      "--infodir=": "Info page directory (default: share/info)."
      "--libdir=": "Library directory (default: lib/x86_64-linux-gnu)."
      "--licensedir=": "Licenses directory (default: )."
      "--libexecdir=": "Library executable directory (default: libexec)."
      "--localedir=": "Locale data directory (default: share/locale)."
      "--localstatedir=": "Localstate data directory (default: var)."
      "--mandir=": "Manual page directory (default: share/man)."
      "--sbindir=": "System executable directory (default: sbin)."
      "--sharedstatedir=": "Architecture-independent data directory (default: com)."
      "--sysconfdir=": "Sysconf data directory (default: etc)."
      "--auto-features=": "Override value of all 'auto' features (default: auto)."
      "--backend=": "Backend to use (default: ninja)."
      "--genvslite=": "Setup multiple buildtype-suffixed ninja-backend build directories, and a [builddir]_vs containing a Visual Studio meta-backend with multiple configurations that calls into them (default: vs2022)."
      "--buildtype=": "Build type to use (default: debug)."
      "--debug": "Enable debug symbols and other information"
      "--default-library=": "Default library type (default: shared)."
      "--errorlogs": "Whether to print the logs from failing tests"
      "--install-umask=": "Default umask to apply on permissions of installed files (default: 022)."
      "--layout=": "Build directory layout (default: mirror)."
      "--optimization=": "Optimization level (default: 0)."
      "--prefer-static": "Whether to try static linking before shared linking"
      "--stdsplit": "Split stdout and stderr in test logs"
      "--strip": "Strip targets on install"
      "--unity=": "Unity build (default: off)."
      "--unity-size=": "Unity block size (default:)."
      "--warnlevel=": "Compiler warning level to use (default: 1)."
      "--werror": "Treat warnings as errors"
      "--wrap-mode=": "Wrap mode (default: default)."
      "--force-fallback-for=": "Force fallback for those subprojects (default: [])."
      "--vsenv": "Activate Visual Studio environment"
      "--pkgconfig.relocatable": "Generate pkgconfig files as relocatable"
      "--python.bytecompile=": "Whether to compile bytecode (default: (-1, 2, 0))."
      "--python.install-env=": "Which python environment to install to (default: prefix)."
      "--python.platlibdir=": "Directory for site-specific, platform-specific files (default: )."
      "--python.purelibdir=": "Directory for site-specific, non-platform-specific files (default: )."
      "--python.allow-limited-api": "Whether to allow use of the Python Limited API"
      "--pkg-config-path=": "List of additional paths for pkg-config to search (default: [])."
      "--build.pkg-config-path=": "List of additional paths for pkg-config to search (default: [])."
      "--cmake-prefix-path=": "List of additional prefixes for cmake to search (default: [])."
      "--build.cmake-prefix-path=": "List of additional prefixes for cmake to search (default: [])."
      "-D=": "Set the value of an option, can be used several times to set multiple options."
      "--clearcache": "Clear cached state (e.g. found dependencies)"
      "--no-pager": "Do not redirect output to a pager"
    completion:
      flag:
        auto-features: [enabled, disabled, auto]
        backend: [ninja, vs, vs2010, vs2012, vs2013, vs2015, vs2017, vs2019, vs2022, xcode, none]
        buildtype: [plain, debug, debugoptimized, release, minsize, custom]
        default-library: [shared, static, both]
        layout: [mirror, flat]
        optimization: [plain, 0, g, 1, 2, 3, s]
        unity: ["on", "off", subprojects]
        unity-size: [2, None, 4]
        warnlevel: [0, 1, 2, 3, everything]
        wrap-mode: [default, nofallback, nodownload, forcefallback, nopromote]
        python.install-env: [auto, prefix, system, venv]
  - name: dist
    description: "Generate release archive"
    flags:
      "-h, --help": "show this help message and exit"
      "-C=": "directory to cd into before running"
      "--allow-dirty": "Allow even when repository contains uncommitted changes."
      "--formats=": "Comma separated list of archive types to create."
      "--include-subprojects": "Include source code of subprojects that have been used for the build."
      "--no-tests": "Do not build and test generated packages."
  - name: install
    description: "Install the project"
    flags:
      "-h, --help": "show this help message and exit"
      "-C=": "directory to cd into before running"
      "--no-rebuild": "Do not rebuild before installing."
      "--only-changed": "Only overwrite files that are older than the copied file."
      "--quiet": "Do not print every file that was installed."
      "--destdir=": "Sets or overrides DESTDIR environment."
      "-n, --dry-run": "Doesn't actually install, but print logs."
      "--skip-subprojects=*": {description: "Do not install files from given subprojects.", nargs: -1}
      "--tags=": "Install only targets having one of the given tags."
      "--strip": "Strip targets even if strip option was not set during configure."
  - name: introspect
    description: "Introspect project"
    flags:
      "-h, --help": "show this help message and exit"
      "--ast": "Dump the AST of the meson file."
      "--benchmarks": "List all benchmarks."
      "--buildoptions": "List all build options."
      "--buildsystem-files": "List files that make up the build system."
      "--compilers": "List used compilers."
      "--dependencies": "List external dependencies."
      "--scan-dependencies": "Scan for dependencies used in the meson.build file."
      "--installed": "List all installed files and directories."
      "--install-plan": "List all installed files and directories with their details."
      "--machines": "Information about host, build, and target machines."
      "--projectinfo": "Information about projects."
      "--targets": "List top level targets."
      "--tests": "List all unit tests."
      "--backend=": "The backend to use for the --buildoptions introspection."
      "-a, --all": "Print all available information."
      "-i, --indent": "Enable pretty printed JSON."
      "-f, --force-object-output": "Always use the new JSON format for multiple entries (even for 0 and 1 introspection commands)"
    completion:
      flag:
        backend: [ninja, none, vs, vs2010, vs2012, vs2013, vs2015, vs2017, vs2019, vs2022, xcode]
  - name: init
    description: "Create a new project"
    flags:
      "-h, --help": "show this help message and exit"
      "-C=": "directory to cd into before running"
      "-n, --name=": "project name."
      "-e, --executable=": "executable name."
      "-d, --deps=": "dependencies, comma-separated"
      "-l, --language=": "project language."
      "-b, --build": "build after generation"
      "--builddir=": "directory for build"
      "-f, --force": "force overwrite of existing files and directories."
      "--type=": "project type."
      "--version=": "project version."
    completion:
      flag:
        language: [c, cpp, cs, cuda, d, fortran, java, objc, objcpp, rust, vala]
        type: [executable, library]
  - name: test
    description: "Run tests"
    flags:
      "-h, --help": "show this help message and exit"
      "--maxfail=": "Number of failing tests before aborting the test run."
      "--repeat=": "Number of times to run the tests."
      "--no-rebuild": "Do not rebuild before running tests."
      "--gdb": "Run test under gdb."
      "--gdb-path=": "Path to the gdb binary (default: gdb)."
      "-i, --interactive": "Run tests with interactive input/output."
      "--list": "List available tests."
      "--wrapper=": "wrapper to run tests with (e.g. Valgrind)"
      "-C=": "directory to cd into before running"
      "--suite=": "Only run tests belonging to the given suite."
      "--no-suite=": "Do not run tests belonging to the given suite."
      "--no-stdsplit": "Do not split stderr and stdout in test logs."
      "--print-errorlogs": "Whether to print failing tests' logs."
      "--benchmark": "Run benchmarks instead of tests."
      "--logbase=": "Base name for log file."
      "-j, --num-processes=": "How many parallel processes to use."
      "-v, --verbose": "Do not redirect stdout and stderr"
      "-q, --quiet": "Produce less output to the terminal."
      "-t, --timeout-multiplier=": "Define a multiplier for test timeout, for example when running tests in particular conditions they might take more time to execute."
      "--setup=": "Which test setup to use."
      "--test-args=": "Arguments to pass to the specified test(s) or all tests"
      "--max-lines=": "Maximum number of lines to show from a long test log."
  - name: wrap
    description: "Wrap tools"
    flags:
      "-h, --help": "show this help message and exit"
    commands:
      - name: list
        description: "show all available projects"
        flags:
          "-h, --help": "show this help message and exit"
          "--allow-insecure": "Allow insecure server connections."
      - name: search
        description: "search the db by name"
        flags:
          "-h, --help": "show this help message and exit"
          "--allow-insecure": "Allow insecure server connections."
      - name: install
        description: "install the specified project"
        flags:
          "-h, --help": "show this help message and exit"
          "--allow-insecure": "Allow insecure server connections."
      - name: update
        description: "Update wrap files from WrapDB (Since 0.63.0)"
        flags:
          "-h, --help": "show this help message and exit"
          "--force": "Update wraps that does not seems to come from WrapDB"
          "--sourcedir=": "Path to source directory"
          "--types=": "Comma-separated list of subproject types."
          "-j, --num-processes=": "How many parallel processes to use (Since 0.59.0)."
          "--allow-insecure": "Allow insecure server connections."
      - name: info
        description: "show available versions of a project"
        flags:
          "-h, --help": "show this help message and exit"
          "--allow-insecure": "Allow insecure server connections."
      - name: status
        description: "show installed and available versions of your projects"
        flags:
          "-h, --help": "show this help message and exit"
          "--allow-insecure": "Allow insecure server connections."
      - name: promote
        description: "bring a subsubproject up to the master project"
        flags:
          "-h, --help": "show this help message and exit"
      - name: update-db
        description: "Update list of projects available in WrapDB (Since 0.61.0)"
        flags:
          "-h, --help": "show this help message and exit"
          "--allow-insecure": "Allow insecure server connections."
  - name: subprojects
    description: "Manage subprojects"
    flags:
      "-h, --help": "show this help message and exit"
    commands:
      - name: update
        description: "Update all subprojects from wrap files"
        flags:
          "-h, --help": "show this help message and exit"
          "--rebase": "Rebase your branch on top of wrap's revision."
          "--reset": "Checkout wrap's revision and hard reset to that commit."
          "--sourcedir=": "Path to source directory"
          "--types=": "Comma-separated list of subproject types."
          "-j, --num-processes=": "How many parallel processes to use (Since 0.59.0)."
          "--allow-insecure": "Allow insecure server connections."
      - name: checkout
        description: "Checkout a branch (git only)"
        flags:
          "-h, --help": "show this help message and exit"
          "-b": "Create a new branch"
          "--sourcedir=": "Path to source directory"
          "--types=": "Comma-separated list of subproject types."
          "-j, --num-processes=": "How many parallel processes to use (Since 0.59.0)."
          "--allow-insecure": "Allow insecure server connections."
      - name: download
        description: "Ensure subprojects are fetched, even if not in use."
        flags:
          "-h, --help": "show this help message and exit"
          "--sourcedir=": "Path to source directory"
          "--types=": "Comma-separated list of subproject types."
          "-j, --num-processes=": "How many parallel processes to use (Since 0.59.0)."
          "--allow-insecure": "Allow insecure server connections."
      - name: foreach
        description: "Execute a command in each subproject directory."
        flags:
          "-h, --help": "show this help message and exit"
          "--sourcedir=": "Path to source directory"
          "--types=": "Comma-separated list of subproject types."
          "-j, --num-processes=": "How many parallel processes to use (Since 0.59.0)."
          "--allow-insecure": "Allow insecure server connections."
      - name: purge
        description: "Remove all wrap-based subproject artifacts"
        flags:
          "-h, --help": "show this help message and exit"
          "--sourcedir=": "Path to source directory"
          "--types=": "Comma-separated list of subproject types."
          "-j, --num-processes=": "How many parallel processes to use (Since 0.59.0)."
          "--allow-insecure": "Allow insecure server connections."
          "--include-cache": "Remove the package cache as well"
          "--confirm": "Confirm the removal of subproject artifacts"
      - name: packagefiles
        description: "Manage the packagefiles overlay"
        flags:
          "-h, --help": "show this help message and exit"
          "--sourcedir=": "Path to source directory"
          "--types=": "Comma-separated list of subproject types."
          "-j, --num-processes=": "How many parallel processes to use (Since 0.59.0)."
          "--allow-insecure": "Allow insecure server connections."
          "--apply": "Apply packagefiles to the subproject"
          "--save": "Save packagefiles from the subproject"
  - name: rewrite
    description: "Modify the project definition"
    flags:
      "-h, --help": "show this help message and exit"
      "-s, --sourcedir=": "Path to source directory."
      "-V, --verbose": "Enable verbose output"
      "-S, --skip-errors": "Skip errors instead of aborting"
    commands:
      - name: target
        description: "Modify a target"
        flags:
          "-h, --help": "show this help message and exit"
          "-s, --subdir=": "Subdirectory of the new target (only for the \"add_target\" action)"
          "--type=": "Type of the target to add (only for the \"add_target\" action)"
        completion:
          flag:
            type: [both_libraries, executable, jar, library, shared_library, shared_module, static_library]
          positional:
            - []
            - [add, rm, add_target, rm_target, add_extra_files, rm_extra_files, info]
      - name: kwargs
        description: "Modify keyword arguments"
        flags:
          "-h, --help": "show this help message and exit"
        completion:
          positional:
            - [set, delete, add, remove, remove_regex, info]
            - [dependency, target, project]
      - name: default-options
        description: "Modify the project default options"
        flags:
          "-h, --help": "show this help message and exit"
        completion:
          positional:
            - [set, delete]
  - name: compile
    description: "Build the project"
    flags:
      "-h, --help": "show this help message and exit"
      "--clean": "Clean the build directory."
      "-C=": "directory to cd into before running"
      "-j, --jobs=": "The number of worker jobs to run (if supported)."
      "-l, --load-average=": "The system load average to try to maintain (if supported)."
      "-v, --verbose": "Show more verbose output."
      "--ninja-args=": "Arguments to pass to `ninja` (applied only on `ninja` backend)."
      "--vs-args=": "Arguments to pass to `msbuild` (applied only on `vs` backend)."
      "--xcode-args=": "Arguments to pass to `xcodebuild` (applied only on `xcode` backend)."
  - name: devenv
    description: "Run commands in developer environment"
    flags:
      "-h, --help": "show this help message and exit"
      "-C=": "Path to build directory"
      "-w, --workdir=": "Directory to cd into before running (default: builddir, Since 1.0.0)"
      "--dump=": "Only print required environment (Since 0.62.0) Takes an optional file path (Since 1.1.0)"
      "--dump-format=": "Format used with --dump (Since 1.1.0)"
    completion:
      flag:
        dump-format: [sh, export, vscode]
  - name: env2mfile
    description: "Convert current environment to a cross or native file"
    flags:
      "-h, --help": "show this help message and exit"
      "--debarch=": "The dpkg architecture to generate."
      "--gccsuffix=": "A particular gcc version suffix if necessary."
      "-o=": "The output file."
      "--cross": "Generate a cross compilation file."
      "--native": "Generate a native compilation file."
      "--system=": "Define system for cross compilation."
      "--subsystem=": "Define subsystem for cross compilation."
      "--kernel=": "Define kernel for cross compilation."
      "--cpu=": "Define cpu for cross compilation."
      "--cpu-family=": "Define cpu family for cross compilation."
      "--endian=": "Define endianness for cross compilation."
    completion:
      flag:
        endian: [big, little]
  - name: format
    description: "Format meson source file"
    flags:
      "-h, --help": "show this help message and exit"
      "-q, --check-only": "exit with 1 if files would be modified by meson format"
      "-i, --inplace": "format files in-place"
      "-r, --recursive": "recurse subdirs (requires --check-only or --inplace option)"
      "-c, --configuration=": "read configuration from meson.format"
      "-e, --editor-config": "try to read configuration from .editorconfig"
      "-o, --output=": "output file (implies having exactly one input)"
