# Converted from Fig's remotion.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: remotion
description: "Create videos programmatically in React"
flags:
  "--help": "Prints the list of commands and flags for quick lookup"
commands:
  - name: versions
    description: "Prints and validates versions of all Remotion packages"
  - name: gpu
    description: "Prints information about how Chrome uses the GPU"
  - name: compositions
    description: "Prints the list of available compositions"
    flags:
      "--props=": "Pass input props as filename or as JSON"
      "--env-file=": "Specify a location for a dotenv file"
      "--disable-headless": "Run Chrome in normal mode rather than headless"
      "--gl=": "Which OpenGL renderer to use"
      "--user-agent": "User agent to use for Chrome during rendering"
      "--ignore-certificate-errors": "Ignore SSL errors"
      "--disable-web-security": "Disable CORS and other web security features"
    completion:
      flag:
        props: ["$files"]
        env-file: ["$files"]
        gl: [angle, egl, swiftshader, swangle, vulkan]
      positional:
        - ["$files"]
  - name: lambda
    description: "Access functionality of @remotion/lambda"
    flags:
      "--quiet": "Print less output"
      "-q": "Print less output"
      "--log=": "Log level, \"error\", \"warning\", \"verbose\", \"info\" (default)"
      "--config=": "Custom location for a Remotion config file"
      "--yes": "Skip confirmation"
      "--force&": "Skip confirmation"
      "-y&": "Skip confirmation"
      "-f&": "Skip confirmation"
      "--region=": "The AWS region specifier"
    completion:
      flag:
        log: [verbose, info, warn, error]
        config: ["$files"]
        region: ["us-east-1\tNorth Virginia", "us-east-2\tOhio", "eu-central-1\tFrankfurt", "eu-west-1\tIreland", "eu-west-2\tLondon", "us-west-2\tOregon", "ap-south-1\tMumbai", "ap-southeast-1\tSingapore", "ap-southeast-2\tSydney", "ap-northeast-1\tTokyo"]
