# Converted from argc's grype.sh by tools/argc-to-spec. Do not edit by hand.
name: grype
flags:
  "--add-cpes-if-none": "generate CPEs for packages with no CPE data"
  "--by-cve": "orient results by CVE instead of the original vulnerability ID when possible"
  "-c, --config=": "grype configuration file"
  "--distro=": "distro to match against in the format: <distro>:<version>"
  "--exclude=*": {description: "exclude paths from being scanned using a glob expression", nargs: -1}
  "-f, --fail-on=": "set the return code to 1 if a vulnerability is found with a severity >= the given severity, options=[negligible low medium high critical]"
  "--file=": "file to write the default report output to (default is STDOUT)"
  "-h, --help": "help for grype"
  "--ignore-states=": "ignore matches for vulnerabilities with specified comma separated fix states, options=[fixed not-fixed unknown wont-fix]"
  "--name=": "set the name of the target being analyzed"
  "--only-fixed": "ignore matches for vulnerabilities that are not fixed"
  "--only-notfixed": "ignore matches for vulnerabilities that are fixed"
  "-o=": "--output*[json|table|cyclonedx|cyclonedx-json|sarif|template]|deprecated|formats=[embedded-cyclonedx-vex-json|embedded-cyclonedx-vex-xml] <string> report output formatter, formats=[json table cyclonedx cyclonedx-json sarif template], deprecated formats=[embedded-cyclonedx-vex-json embedded-cyclonedx-vex-xml]"
  "--platform=": "an optional platform specifier for container image sources (e.g. 'linux/arm64', 'linux/arm64/v8', 'arm64', 'linux')"
  "-q, --quiet": "suppress all logging output"
  "-s, --scope=": "selection of layers to analyze, options=[squashed all-layers] (default \"squashed\")"
  "--show-suppressed": "show suppressed/ignored vulnerabilities in the output (only supported with table output format)"
  "-t, --template=": "specify the path to a Go template file (requires 'template' output to be selected)"
  "-v, --verbose=": "increase verbosity (-v = info, -vv = debug)"
  "--version": "version for grype"
  "--vex=*": {description: "a list of VEX documents to consider when producing scanning results", nargs: -1}
completion:
  flag:
    fail-on: [negligible, low, medium, high, critical]
    ignore-states: [fixed, not-fixed, unknown, wont-fix]
    scope: [squashed, all-layers]
commands:
  - name: completion
    description: "Generate a shell completion for Grype (listing local docker images)"
    flags:
      "-h, --help": "help for completion"
      "-c, --config=": "grype configuration file"
      "-q, --quiet": "suppress all logging output"
      "-v, --verbose=": "increase verbosity (-v = info, -vv = debug)"
    completion:
      positional:
        - [bash, zsh, fish]
  - name: config
    description: "show the grype configuration"
    flags:
      "-h, --help": "help for config"
      "--load": "load and validate the grype configuration"
      "-c, --config=": "grype configuration file"
      "-q, --quiet": "suppress all logging output"
      "-v, --verbose=": "increase verbosity (-v = info, -vv = debug)"
    commands:
      - name: locations
        description: "shows all locations and the order in which grype will look for a configuration file"
        flags:
          "--all": "include every file extension supported"
          "-h, --help": "help for locations"
          "-c, --config=": "grype configuration file"
          "-q, --quiet": "suppress all logging output"
          "-v, --verbose=": "increase verbosity (-v = info, -vv = debug)"
  - name: db
    description: "vulnerability database operations"
    flags:
      "-h, --help": "help for db"
      "-c, --config=": "grype configuration file"
      "-q, --quiet": "suppress all logging output"
      "-v, --verbose=": "increase verbosity (-v = info, -vv = debug)"
    commands:
      - name: check
        description: "check to see if there is a database update available"
        flags:
          "-h, --help": "help for check"
          "-c, --config=": "grype configuration file"
          "-q, --quiet": "suppress all logging output"
          "-v, --verbose=": "increase verbosity (-v = info, -vv = debug)"
      - name: delete
        description: "delete the vulnerability database"
        flags:
          "-h, --help": "help for delete"
          "-c, --config=": "grype configuration file"
          "-q, --quiet": "suppress all logging output"
          "-v, --verbose=": "increase verbosity (-v = info, -vv = debug)"
      - name: diff
        description: "diff two DBs and display the result"
        flags:
          "-d, --delete": "delete downloaded databases after diff occurs"
          "-h, --help": "help for diff"
          "-o, --output=": "format to display results (available=[table, json]) (default \"table\")"
          "-c, --config=": "grype configuration file"
          "-q, --quiet": "suppress all logging output"
          "-v, --verbose=": "increase verbosity (-v = info, -vv = debug)"
        completion:
          flag:
            output: [table, json]
      - name: import
        description: "import a vulnerability database archive"
        flags:
          "-h, --help": "help for import"
          "-c, --config=": "grype configuration file"
          "-q, --quiet": "suppress all logging output"
          "-v, --verbose=": "increase verbosity (-v = info, -vv = debug)"
      - name: list
        description: "list all DBs available according to the listing URL"
        flags:
          "-h, --help": "help for list"
          "-o, --output=": "format to display results (available=) (default \"text\")"
          "-c, --config=": "grype configuration file"
          "-q, --quiet": "suppress all logging output"
          "-v, --verbose=": "increase verbosity (-v = info, -vv = debug)"
        completion:
          flag:
            output: [text, raw, json]
      - name: status
        description: "display database status"
        flags:
          "-h, --help": "help for status"
          "-c, --config=": "grype configuration file"
          "-q, --quiet": "suppress all logging output"
          "-v, --verbose=": "increase verbosity (-v = info, -vv = debug)"
      - name: update
        description: "download the latest vulnerability database"
        flags:
          "-h, --help": "help for update"
          "-c, --config=": "grype configuration file"
          "-q, --quiet": "suppress all logging output"
          "-v, --verbose=": "increase verbosity (-v = info, -vv = debug)"
  - name: explain
    description: "Ask grype to explain a set of findings"
    flags:
      "-h, --help": "help for explain"
      "--id=*": {description: "CVE IDs to explain", nargs: -1}
      "-c, --config=": "grype configuration file"
      "-q, --quiet": "suppress all logging output"
      "-v, --verbose=": "increase verbosity (-v = info, -vv = debug)"
  - name: version
    description: "show version information"
    flags:
      "-h, --help": "help for version"
      "-o, --output=": "the format to show the results (allowable: [text json]) (default \"text\")"
      "-c, --config=": "grype configuration file"
      "-q, --quiet": "suppress all logging output"
      "-v, --verbose=": "increase verbosity (-v = info, -vv = debug)"
    completion:
      flag:
        output: [text, json]
