# Converted from Fig's hyperfine.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: hyperfine
description: "A command-line benchmarking tool"
flags:
  "--warmup, -w=": "Perform warmupruns (number) before the actual benchmarking starts"
  "--min-runs, -m=": "Perform at least NUM runs for each command"
  "--max-runs, -M=": "Perform at most NUM runs for each command. Default: no limit"
  "--runs, -r=": "Perform exactly NUM runs for each command"
  "--setup, -s=": "Execute cmd once before each set of timing runs"
  "--prepare, -p=": "Execute cmd before each timing run. This is useful for clearing disk caches, for example"
  "--cleanup, -c=": "Execute cmd after the completion of all benchmarking runs for each individual command to be benchmarked"
  "--parameter-scan, -P=": {description: "Perform benchmark runs for each value in the range min..max", nargs: 3}
  "--parameter-step-size, -D=": "This argument requires --parameter-scan to be specified as well. Traverse the range min..max in steps of delta"
  "--parameter-list, -L=": {description: "Perform benchmark runs for each value in the comma-separated list of values", nargs: 2}
  "--style=": "Set output style type"
  "--shell, -S=": "Set the shell to use for executing benchmarked commands"
  "--ignore-failure, -i": "Ignore non-zero exit codes of the benchmarked commands"
  "--time-unit, -u=": "Set the time unit to use for the benchmark results"
  "--export-asciidoc=": "Export the timing summary statistics as an AsciiDoc table to the given file"
  "--export-csv=": "Export the timing summary statistics as CSV to the given file"
  "--export-json=": "Export the timing summary statistics and timings of individual runs as JSON to the given file"
  "--export-markdown=": "Export the timing summary statistics as a Markdown table to the given file"
  "--show-output": "Print the stdout and stderr of the benchmark instead of suppressing it"
  "--command-name=": "Identify a command with the given name"
  "--help": "Prints help message"
  "--version": "Shows version information"
completion:
  flag:
    style: ["basic\tDisable output coloring and interactive elements", "full\tEnable all effects even if no interactive terminal was detected", "nocolor\tKeep the interactive output without any colors", "color\tKeep the colors without any interactive output", "none\tDisable all the output of the tool"]
    shell: ["bash\tUse bash as the shell", "zsh\tUse zsh as the shell", "sh\tUse sh as the shell", "fish\tUse fish as the shell", "pwsh\tUse pwsh as the shell", "powershell\tUse powershell as the shell"]
    time-unit: [millisecond, second]
    export-asciidoc: ["$files"]
    export-csv: ["$files"]
    export-json: ["$files"]
    export-markdown: ["$files"]
