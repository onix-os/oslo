name: babel
flags:
  "-f, --filename=": "The filename to use when reading from stdin. This will be used in source-maps, errors etc"
  "--presets=": "A comma-separated list of preset names"
  "--plugins=": "A comma-separated list of plugin names"
  "--config-file=": "Path to a .babelrc file to use"
  "--env-name=": "The name of the 'env' to use when loading configs and plugins. Defaults to the value of BABEL_ENV, or else NODE_ENV, or else 'development'"
  "--root-mode=": "The project-root resolution mode"
  "--source-type=": ""
  "--no-babelrc": "Whether or not to look up .babelrc and .babelignore files"
  "--ignore=": "List of glob paths to **not** compile"
  "--only=": "List of glob paths to **only** compile"
  "--no-highlight-code": "Enable or disable ANSI syntax highlighting of code frames"
  "--no-comments": "Write comments to generated output"
  "--retain-lines": "Retain line numbers. This will result in really ugly code"
  "--compact=": "Do not include superfluous whitespace characters and line terminators"
  "--minified": "Save as many bytes when printing. (false by default)"
  "--auxiliary-comment-before=": "Print a comment before any injected non-user code"
  "--auxiliary-comment-after=": "Print a comment after any injected non-user code"
  "-s, --source-maps=": ""
  "--source-map-target=": "Set `file` on returned source map"
  "--source-file-name=": "Set `sources[0]` on returned source map"
  "--source-root=": "The root from which all sources are relative"
  "-x, --extensions=": "Comma separated list of extensions to compile when a directory has been the input. [js,ts,jsx,tsx]"
  "--keep-file-extension": "Preserve the file extensions of the input files"
  "-w, --watch": "Recompile files on changes"
  "--skip-initial-build": "Do not compile files before watching"
  "-o, --out-file=": "Compile all input files into a single file"
  "-d, --out-dir=": "Compile an input directory of modules into an output directory"
  "--relative": "Compile into an output directory relative to input directory or file"
  "-D, --copy-files": "When compiling a directory copy over non-compilable files"
  "--include-dotfiles": "Include dotfiles when compiling and copying non-compilable files"
  "--no-copy-ignored": "Exclude ignored files when copying non-compilable files"
  "--verbose": "Log everything. This option conflicts with --quiet"
  "--quiet": "Don't log anything. This option conflicts with --verbose"
  "--delete-dir-on-start": "Delete the out directory before compilation"
  "--out-file-extension=": "Use a specific extension for the output files"
  "-V, --version": "Output the version number"
  "-h, --help": "Output usage information"
exclusiveflags:
  - [verbose, quiet]
  - [quiet, verbose]
completion:
  flag:
    config-file: ["$files"]
    env-name: [production, development]
    root-mode: ["root\tPasses the \"root\" value through as unchanged", "upward\tWalks upward from the \"root\" directory, looking for a directory containing a babel.config.json file, and throws an error if a babel.config.json is not found", "upward-optional\tWalk upward from the \"root\" directory, looking for a directory containing a babel.config.json file, and falls back to \"root\" if a babel.config.json is not found"]
    source-type: [script, module]
    compact: ["true", "false", auto]
    source-maps: ["true", "false", inline, both]
    out-file: ["$files"]
    out-dir: ["$directories"]
    out-file-extension: [".es6", ".js", ".es", ".jsx", ".mjs"]
