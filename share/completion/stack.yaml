# Converted from Fig's stack.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: stack
description: "The Haskell Tool Stack"
flags:
  "--help, -h": "Show help for stack"
  "--version": "Show version for stack"
  "--numeric-version": "Show only the numeric version for stack"
  "--hpack-numeric-version": "Show only hpack's version number"
  "--verbosity": "Verbosity: silent, error, warn, info, debug"
  "--verbose, -v": "Enable verbose mode: verbosity level \"debug\""
  "--silent": "Enable silent mode: verbosity level \"silent\""
  "--stack-root": "Absolute path to the global stack root directory (Overrides any STACK_ROOT environment variable)"
  "--work-dir": "Relative path of work directory (Overrides any STACK_WORK environment variable, default is '.stack-work')"
  "--system-ghc": "Enable using the system installed GHC (on the PATH) if it is available and its version matches. Disabled by default"
  "--no-system-ghc": "Disable using the system installed GHC (on the PATH) if it is available and its version matches. Disabled by default"
  "--install-ghc": "Enable downloading and installing GHC if necessary (can be done manually with stack setup). Enabled by default)"
  "--no-install-ghc": "Disable downloading and installing GHC if necessary (can be done manually with stack setup). Enabled by default"
  "--ghc-variant": "Specialized GHC variant, e.g. integersimple (incompatible with --system-ghc)"
  "--ghc-build": "Specialized GHC build, e.g. 'gmp4' or 'standard' (usually auto-detected)"
  "--jobs, -j": "Number of concurrent jobs to run. Should be provied as ARGS"
  "--extra-include-dirs": "Extra directories to check for C header files"
  "--extra-lib-dir": "Extra directories to check for libraries"
  "--custom-preprocessor-extensions": "Extensions used for custom preprocessors"
  "--color, --colour=": "Specify when to use color in output"
  "--compiler=": "Use the specified compiler"
  "--terminal": "Enable overriding terminal detection in the case of running in a false terminal"
  "--no-terminal": "Disable overriding terminal detection in the case of running in a false terminal"
  "--stack-colors, --stack-colours=": "Specify stack's output styles"
  "--terminal-width=": "Specify the width of the terminal, used for pretty-print messages"
  "--stack-yaml=": "Override project stack.yaml file (overrides any STACK_YAML environment variable)"
  "--lock-file=": "Specify how to interact with lock files"
exclusiveflags:
  - [no-system-ghc, system-ghc]
  - [no-install-ghc, install-ghc]
  - [no-terminal, teminal]
completion:
  flag:
    color: [always, never, auto]
commands:
  - name: build
    description: "Build the package(s) in the current directory/configuration"
    flags:
      "--resolver=": "Override resolver in project file"
      "--bench": "Override resolver in project file"
      "--test": "Run complete test suite"
      "--copy-bins": "Enable copying any generated executables to the local bin path (default: disabled)"
      "--no-copy-bins": "Disable copying any generated executables to the local bin path (default: disabled)"
      "--haddock": "Enable generating Haddocks the package(s) in this directory/configuration (default: disabled)"
      "--no-haddock": "Disable generating Haddocks the package(s) in this directory/configuration (default: disabled)"
      "--open": "Enable opening the local Haddock"
      "--no-open": "Disable opening the local Haddock"
      "--haddock-deps": "Enable building Haddocks for dependencies (default: true if building Haddocks, false otherwise)"
      "--no-haddock-deps": "Disable building Haddocks for dependencies (default: true if building Haddocks, false otherwise)"
      "--pedantic": "Turn on all warnings(-Wall) and errors(-Werror)"
      "--only-locals": "Only build packages in the local database, fail if the build plan includes the snapshot database"
      "--file-watch": "Watch for changes in the files used to build the project, and kick off a new build when new changes are saved"
      "--watch-all": "Watch all local files not taking targets into account"
      "-file-watch-poll": "Like --file-watch, but polling the filesystem instead of using events"
      "--only-snapshot": "Only build packages for the snapshot database, not the local database"
      "--only-configure": "Only perform the configure step, not any builds. Intended for tool usage, may break when used on multiple packages at once!"
      "--trace": "Enable profiling in libraries, executables, etc. for all expressions and generate a backtrace on exception"
      "--profile": "Runs profiling in libraries, executables, etc. for all expressions and generate a profiling report in tests or benchmarks"
      "--no-strip": "Disable DWARF debugging symbol stripping in libraries, executables, etc. for all expressions, producing larger executables but allowing the use of standard debuggers/profiling tools/other utilities that use debugging symbols"
      "--library-profiling": "Enable library profiling for TARGETs and all its dependencies (default: disabled)"
      "--no-library-profiling": "Disable library profiling for TARGETs and all its dependencies (default: disabled)"
      "--executable-profiling": "Enable executable profiling for TARGETs and all its dependencies (default: disabled)"
      "--no-executable-profiling": "Disable executable profiling for TARGETs and all its dependencies (default: disabled)"
      "--library-stripping": "Enable library stripping for TARGETs and all its dependencies (default: enabled"
      "--no-library-stripping": "Disable library stripping for TARGETs and all its dependencies (default: enabled"
      "--executable-stripping": "Enable executable stripping for TARGETs and all its dependencies (default: enabled)"
      "--no-executable-stripping": "Disable executable stripping for TARGETs and all its dependencies (default: enabled)"
      "--ghc-options=": "Specify additional options passed to GHC for all local targets. Does not affect extra-dep and snapshot packages at all"
    exclusiveflags:
      - [no-copy-bins, no-copy-bins]
      - [no-haddock, no-haddock]
      - [no-haddock-deps, haddock-deps]
      - [no-executable-profiling, executable-profiling]
      - [no-library-stripping, library-stripping]
      - [no-executable-stripping, executable-stripping]
  - name: install
    description: "Builds the package in current directory and copies it as an executable for system wide usage. Shortcut for 'build --copy-bins"
  - name: test
    description: "Shortcut for 'build --test'"
  - name: bench
    description: "Shortcut for 'build --bench'"
  - name: haddock
    description: "Shortcut for 'build --haddock'"
  - name: new
    description: "Create a new project from a template. Run `stack templates' to see available templates. Note: you can also specify a local file or a remote URL as a template"
  - name: templates
    description: "Show how to find templates available for `stack new'. `stack new' can accept a template from a remote repository (default: github), local file or remote URL. Note: this downloads the help file"
  - name: init
    description: "Create stack project config from cabal or hpack package specifications'"
  - name: setup
    description: "Get the appropriate GHC for your project"
  - name: path
    description: "Print out handy path information"
  - name: ls
    description: "List command. Supports snapshots, dependencies and stack's styles"
  - name: unpack
    description: "Unpack one or more packages locally"
  - name: update
    description: "Update the package index"
  - name: upgrade
    description: "Upgrade to the latest stack version"
  - name: upload
    description: "Upload a package to Hackage"
  - name: sdist
    description: "Create source distribution tarballs"
  - name: dot
    description: "Visualize your project's dependency graph using Graphviz dot"
  - name: hoogle
    description: "Run hoogle, the Haskell API search engine. Use the '-- ARGUMENT(S)' syntax to pass Hoogle arguments, e.g. stack hoogle -- --count=20, or stack hoogle --server --local"
  - name: exec
    description: "Execute a command. If the command is absent, the first of any arguments is taken as the command"
    flags:
      "--snapshot-location-base=": "The base location of LTS/Nightly snapshots"
      "--cwd=": "Sets the working directory before executing the command"
      "--setup-info-yaml=": "Alternate URL or relative / absolute path for stack dependencies"
      "--ghc-package-path": "Enable setting the GHC_PACKAGE_PATH variable for the subprocess (default: enabled)"
      "--no-ghc-package-path": "Disable setting the GHC_PACKAGE_PATH variable for the subprocess (default: enabled)"
      "--package=": "Additional package(s) that must be installed"
      "--stack-exe": "Enable setting the STACK_EXE environment variable to the path for the stack executable (default: enabled)"
      "--no-stack-exe": "Disable setting the STACK_EXE environment variable to the path for the stack executable (default: enabled)"
  - name: run
    description: "Build and run an executable. Defaults to the first available executable if none is provided as the first argument"
  - name: repl
    description: "Load a REPL"
