# Converted from Fig's lerna.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: lerna
description: "A tool for managing JavaScript projects with multiple packages"
commands:
  - name: init
    description: "Create a new lerna repo or upgrade an existing repo to the current version of Lerna"
    flags:
      "--concurrency": "How many threads to use when Lerna parallelizes the tasks (defaults to count of logical CPU cores)"
      "--loglevel=": "What level of logs to report. On failure, all logs are written to lerna-debug.log in the current working directory"
      "--max-buffer=": "Set a max buffer length for each underlying process call"
      "--no-progress": "Disable progress bars. This is always the case in a CI environment"
      "--no-sort": "The --no-sort option disables sorting, instead executing tasks in an arbitrary order with maximum concurrency"
      "--reject-cycles": "Fail immediately if a cycle is found (in bootstrap, exec, publish or run)"
      "-h, --help": "Show help"
      "-v, --version": "Show version number"
      "--npm-client=": "The exececutable to run the script with"
      "-i, --independent": "Use independent versioning mode"
      "--exact": "Set the exact version of lerna in the package.json file"
    completion:
      flag:
        loglevel: [silent, error, warn, success, info, verbose, silly]
        npm-client: [npm, yarn, pnpm]
  - name: bootstrap
    description: "Bootstrap the packages in the current Lerna repo. Installing all their dependencies and linking any cross-dependencies"
    flags:
      "--scope=": "Include only packages with names matching the given glob"
      "--ignore=": "Exclude packages with names matching the given glob"
      "--no-private": "Exclude private packages. They are included by default"
      "--since?": "Only include packages that have been changed since the specified ref. If no ref is passed, it defaults to the most-recent tag"
      "--exclude-dependents": "Exclude all transitive dependents when running a command with --since, overriding the default 'changed' algorithm"
      "--include-dependents": "Exclude all transitive dependents when running a command with --since, overriding the default 'changed' algorithm"
      "--include-dependencies": "Include all transitive dependencies when running a command regardless of --scope, --ignore, or --since"
      "--include-merged-tags": "Include tags from merged branches when running a command with --since. This is only useful if you do a lot of publishing from feature branches, which is not generally recommended"
      "--npm-client=": "The exececutable to run the script with"
      "--hoist=": "Install external dependencies matching glob at the repo root so they're available to all packages"
      "--nohoist=": "Do not install external dependencies matching glob at the repo root. This can be used to opt out of hoisting for certain dependencies"
      "--strict": "When used in conjunction with hoist will throw an error and stop bootstrapping after emitting the version warnings. Has no effect if you aren't hoisting, or if there are no version warnings"
      "--ignore-prepublish": "Skip prepublish lifecycle scripts run by default in bootstrapped packages"
      "--ignore-scripts": "Skip any lifecycle scripts normally run (prepare, etc) in bootstrapped packages"
      "--registry=": "Forwarded npm commands will use the specified registry for your package(s)"
      "--use-workspaces": "Enables integration with Yarn Workspaces"
      "--no-ci": "Disable usage of `npm ci` in CI environments"
      "--force-local": "When passed, this flag causes the bootstrap command to always symlink local dependencies regardless of matching version range"
    completion:
      flag:
        npm-client: [npm, yarn, pnpm]
  - name: import
    description: "Import the package in the local path <pathToRepo> into packages/<directory-name> with commit history"
    flags:
      "--concurrency": "How many threads to use when Lerna parallelizes the tasks (defaults to count of logical CPU cores)"
      "--loglevel=": "What level of logs to report. On failure, all logs are written to lerna-debug.log in the current working directory"
      "--max-buffer=": "Set a max buffer length for each underlying process call"
      "--no-progress": "Disable progress bars. This is always the case in a CI environment"
      "--no-sort": "The --no-sort option disables sorting, instead executing tasks in an arbitrary order with maximum concurrency"
      "--reject-cycles": "Fail immediately if a cycle is found (in bootstrap, exec, publish or run)"
      "-h, --help": "Show help"
      "-v, --version": "Show version number"
      "--flatten": "Flatten the git history of the repository to import"
      "--dest": "Specify the destination directory by the directory listed in lerna.json"
