# Converted from Fig's molecule.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: molecule
description: "Molecule aids in the development and testing of Ansible roles"
flags:
  "--version": "Show molecule version"
persistentflags:
  "--help": "Show help"
commands:
  - name: check
    description: "Use the provisioner to perform a Dry-Run (destroy, dependency, create, prepare, converge)"
    flags:
      "--scenario-name, -s=": "Name of the scenario to target. (default)"
      "--parallel": "Enable parallel mode"
      "--no-parallel": "Disable parallel mode"
    exclusiveflags:
      - [parallel, no-parallel]
      - [no-parallel, parallel]
  - name: cleanup
    description: "Use the provisioner to cleanup any changes made to external systems during the stages of testing"
    flags:
      "--scenario-name, -s=": "Name of the scenario to target. (default)"
  - name: converge
    description: "Use the provisioner to configure instances (dependency, create, prepare converge)"
    flags:
      "--scenario-name, -s=": "Name of the scenario to target. (default)"
  - name: create
    description: "Use the provisioner to start the instances"
    flags:
      "--scenario-name, -s=": "Name of the scenario to target. (default)"
      "--driver-name, -d=": "Name of driver to use. (delegated)"
    completion:
      flag:
        driver-name: [delegated, docker, podman, vagrant, azure, hetzner]
  - name: dependency
    description: "Manage the role's dependencies"
    flags:
      "--scenario-name, -s=": "Name of the scenario to target. (default)"
  - name: destroy
    description: "Use the provisioner to destroy the instances"
    flags:
      "--scenario-name, -s=": "Name of the scenario to target. (default)"
      "--driver-name, -d=": "Name of driver to use. (delegated)"
      "--all": "Destroy all scenarios. Default is False"
      "--no-all": "Do not destroy all scenarios"
      "--parallel": "Enable parallel mode"
      "--no-parallel": "Disable parallel mode"
    exclusiveflags:
      - [all, no-all]
      - [no-all, all]
      - [parallel, no-parallel]
      - [no-parallel, parallel]
    completion:
      flag:
        driver-name: [delegated, docker, podman, vagrant, azure, hetzner]
  - name: drivers
    description: "List drivers"
    flags:
      "--format, -f=": "Change output format. (simple)"
    completion:
      flag:
        format: [simple, plain]
  - name: idempotence
    description: "Use the provisioner to configure the instances and parse the output to determine idempotence"
    flags:
      "--scenario-name, -s=": "Name of the scenario to target. (default)"
  - name: init
    description: "Initialize a new role or scenario"
    commands:
      - name: role
        description: "Initialize a new role for use with Molecule, namespace is required outside collections, like acme.myrole"
        parsing: non-interspersed
        flags:
          "--dependency-name=": "Name of dependency to initialize. (galaxy)"
          "--driver-name, -d=": "Name of driver to use. (delegated)"
          "--lint-name=": "Name of lint to initialize. (yamllint)"
          "--provisioner-name=": "Name of provisioner to initialize. (ansible)"
          "--verifier-name=": "Name of verifier to initialize. (ansible)"
        completion:
          flag:
            dependency-name: [galaxy]
            driver-name: [delegated, docker, podman, vagrant, azure, hetzner]
            lint-name: [yamllint]
            provisioner-name: [ansible]
            verifier-name: [ansible, testinfra]
      - name: scenario
        description: "Initialize a new scenario for use with Molecule"
        parsing: non-interspersed
        flags:
          "--dependency-name=": "Name of dependency to initialize. (galaxy)"
          "--driver-name, -d=": "Name of driver to use. (delegated)"
          "--lint-name=": "Name of lint to initialize. (yamllint)"
          "--provisioner-name=": "Name of provisioner to initialize. (ansible)"
          "--role-name, -r=": "Name of the role to create"
          "--verifier-name=": "Name of verifier to initialize. (ansible)"
        completion:
          flag:
            dependency-name: [galaxy]
            driver-name: [delegated, docker, podman, vagrant, azure, hetzner]
            lint-name: [yamllint]
            provisioner-name: [ansible]
            verifier-name: [ansible, testinfra]
  - name: lint
    description: "Lint the role (dependency, lint)"
    flags:
      "--scenario-name, -s=": "Name of the scenario to target. (default)"
  - name: list
    description: "List status of instances"
    flags:
      "--scenario-name, -s=": "Name of the scenario to target. (default)"
      "--format, -f=": "Change output format. (simple)"
    completion:
      flag:
        format: [simple, plain, yaml]
  - name: login
    description: "Log in to one instance"
    flags:
      "--host, -h=": "Host to access"
      "--scenario-name, -s=": "Name of the scenario to target. (default)"
  - name: matrix
    description: "List matrix of steps used to test instances"
    flags:
      "--scenario-name, -s=": "Name of the scenario to target. (default)"
  - name: prepare
    description: "Use the provisioner to prepare the instances into a particular starting state"
    flags:
      "--scenario-name, -s=": "Name of the scenario to target. (default)"
      "--driver-name, -d=": "Name of driver to use. (delegated)"
      "--force": "Enable force mode. Default is disabled"
      "--no-force": "Disable force mode"
    exclusiveflags:
      - [force, no-force]
      - [no-force, force]
    completion:
      flag:
        driver-name: [delegated, docker, podman, vagrant, azure, hetzner]
  - name: reset
    description: "Reset molecule temporary folders"
    flags:
      "--scenario-name, -s=": "Name of the scenario to target. (default)"
  - name: side-effect
    description: "Use the provisioner to perform side-effects to the instances"
    flags:
      "--scenario-name, -s=": "Name of the scenario to target. (default)"
  - name: syntax
    description: "Use the provisioner to syntax check the role"
    flags:
      "--scenario-name, -s=": "Name of the scenario to target. (default)"
  - name: test
    description: "Test (dependency, lint, cleanup, destroy, syntax, create, prepare, converge, idempotence, side_effect, verify, cleanup, destroy)"
    flags:
      "--scenario-name, -s=": "Name of the scenario to target. (default)"
      "--driver-name, -d=": "Name of driver to use. (delegated)"
      "--all": "Test all scenarios. Default is False"
      "--no-all": "Do not test all scenarios"
      "--destroy=": "The destroy strategy used at the conclusion of a Molecule run (always)"
      "--parallel": "Enable parallel mode"
      "--no-parallel": "Disable parallel mode"
    exclusiveflags:
      - [all, no-all]
      - [no-all, all]
      - [parallel, no-parallel]
      - [no-parallel, parallel]
    completion:
      flag:
        driver-name: [delegated, docker, podman, vagrant, azure, hetzner]
        destroy: [always, never]
