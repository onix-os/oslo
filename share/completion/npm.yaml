# Converted from Fig's npm.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: npm
description: "Node package manager"
commands:
  - name: install
    aliases: [i, add]
    description: "Install a package and its dependencies"
    flags:
      "-P, --save-prod": "Package will appear in your `dependencies`. This is the default unless `-D` or `-O` are present"
      "-D, --save-dev": "Package will appear in your `devDependencies`"
      "-O, --save-optional": "Package will appear in your `optionalDependencies`"
      "--no-save": "Prevents saving to `dependencies`"
      "-E, --save-exact": "Saved dependencies will be configured with an exact version rather than using npm's default semver range operator"
      "-B, --save-bundle": "Saved dependencies will also be added to your bundleDependencies list"
      "-g, --global": "Operates in 'global' mode, so that packages are installed into the prefix folder instead of the current working directory"
      "--global-style": "Causes npm to install the package into your local node_modules folder with the same layout it uses with the global node_modules folder"
      "--legacy-bundling": "Causes npm to install the package such that versions of npm prior to 1.4, such as the one included with node 0.8, can install the package"
      "--legacy-peer-deps": "Bypass peerDependency auto-installation. Emulate install behavior of NPM v4 through v6"
      "--strict-peer-deps": "If set to true, and --legacy-peer-deps is not set, then any conflicting peerDependencies will be treated as an install failure"
      "--no-package-lock": "Ignores package-lock.json files when installing"
      "--registry=": "The base URL of the npm registry"
      "--verbose=": "Show extra information"
      "--omit=*": "Dependency types to omit from the installation tree on disk"
      "--ignore-scripts": "If true, npm does not run scripts specified in package.json files"
      "--no-audit": "Submit audit reports alongside the current npm command to the default registry and all registries configured for scopes"
      "--no-bin-links": "Tells npm to not create symlinks (or .cmd shims on Windows) for package executables"
      "--no-fund": "Hides the message at the end of each npm install acknowledging the number of dependencies looking for funding"
      "--dry-run": "Indicates that you don't want npm to make any changes and that it should only report what it would have done"
      "-w, --workspace=": {description: "Enable running a command in the context of the configured workspaces of the current project", nargs: -1}
      "-ws, --workspaces": "Enable running a command in the context of all the configured workspaces"
    completion:
      flag:
        omit: [dev, optional, peer]
  - name: run
    aliases: [run-script]
    description: "Run arbitrary package scripts"
    flags:
      "-w, --workspace=": {description: "Enable running a command in the context of the configured workspaces of the current project", nargs: -1}
      "-ws, --workspaces": "Enable running a command in the context of all the configured workspaces"
      "--if-present": "Npm will not exit with an error code when run-script is invoked for a script that isn't defined in the scripts section of package.json"
      "--silent": ""
      "--ignore-scripts": "If true, npm does not run scripts specified in package.json files"
      "--script-shell=": "The shell to use for scripts run with the npm exec, npm run and npm init <pkg> commands"
      "--=": {description: "", nargs: -1}
  - name: init
    description: "Trigger the initialization"
    flags:
      "-y, --yes": "Automatically answer 'yes' to any prompts that npm might print on the command line"
      "-w=": "Create the folders and boilerplate expected while also adding a reference to your project workspaces property"
  - name: access
    description: "Set access controls on private packages"
  - name: adduser
    aliases: [login]
    description: "Add a registry user account"
    flags:
      "--registry=": "The base URL of the npm registry"
      "--scope=": "Associate an operation with a scope for a scoped registry"
  - name: audit
    description: "Run a security audit"
    flags:
      "-w, --workspace=": {description: "Enable running a command in the context of the configured workspaces of the current project", nargs: -1}
      "-ws, --workspaces": "Enable running a command in the context of all the configured workspaces"
      "--audit-level=": "The minimum level of vulnerability for npm audit to exit with a non-zero exit code"
      "--package-lock-only": "Current operation will only use the package-lock.json, ignoring node_modules"
      "--json": "Show output in json format"
      "--omit=*": "Dependency types to omit from the installation tree on disk"
    completion:
      flag:
        audit-level: [info, low, moderate, high, critical, none]
        omit: [dev, optional, peer]
    commands:
      - name: fix
        description: "If the fix argument is provided, then remediations will be applied to the package tree"
        flags:
          "--dry-run": "Indicates that you don't want npm to make any changes and that it should only report what it would have done"
          "-f, --force": "Removes various protections against unfortunate side effects, common mistakes, unnecessary performance degradation, and malicious input"
          "-w, --workspace=": {description: "Enable running a command in the context of the configured workspaces of the current project", nargs: -1}
          "-ws, --workspaces": "Enable running a command in the context of all the configured workspaces"
  - name: bin
    description: "Print the folder where npm will install executables"
    flags:
      "-g, --global": "Operates in 'global' mode, so that packages are installed into the prefix folder instead of the current working directory"
  - name: bugs
    aliases: [issues]
    description: "Report bugs for a package in a web browser"
    flags:
      "--no-browser": "Display in command line instead of browser"
      "--browser=": "The browser that is called by the npm bugs command to open websites"
      "--registry=": "The base URL of the npm registry"
    exclusiveflags:
      - [no-browser, browser]
      - [browser, no-browser]
  - name: cache
    description: "Manipulates packages cache"
    flags:
      "--cache=": "The location of npm's cache directory"
    commands:
      - name: add
        description: "Add the specified packages to the local cache"
      - name: clean
        description: "Delete all data out of the cache folder"
      - name: verify
        description: "Verify the contents of the cache folder, garbage collecting any unneeded data, and verifying the integrity of the cache index and all cached data"
  - name: ci
    aliases: [clean-install, install-clean]
    description: "Install a project with a clean slate"
    flags:
      "--audit=": "When \"true\" submit audit reports alongside the current npm command to the default registry and all registries configured for scopes"
      "--no-audit": "Do not submit audit reports alongside the current npm command"
      "--ignore-scripts": "If true, npm does not run scripts specified in package.json files"
      "--script-shell=": "The shell to use for scripts run with the npm exec, npm run and npm init <pkg> commands"
      "--verbose=": "Show extra information"
      "--registry=": "The base URL of the npm registry"
    exclusiveflags:
      - [audit, no-audit]
      - [no-audit, audit]
    completion:
      flag:
        audit: ["true", "false"]
  - name: cit
    description: "Install a project with a clean slate and run tests"
  - name: clean-install-test
    description: "Install a project with a clean slate and run tests"
  - name: completion
    description: "Tab completion for npm"
  - name: config
    aliases: [c]
    description: "Manage the npm configuration files"
    commands:
      - name: set
        description: "Sets the config key to the value"
        flags:
          "-g, --global": "Sets it globally"
      - name: get
        description: "Echo the config value to stdout"
      - name: list
        description: "Show all the config settings"
        flags:
          "-g": "Lists globally installed packages"
          "-l": "Also shows defaults"
          "--json": "Show output in json format"
      - name: delete
        description: "Deletes the key from all configuration files"
      - name: edit
        description: "Opens the config file in an editor"
        flags:
          "--global": "Edits the global config"
  - name: create
    description: "Create a package.json file"
  - name: dedupe
    aliases: [ddp]
    description: "Reduce duplication in the package tree"
  - name: deprecate
    description: "Deprecate a version of a package"
    flags:
      "--registry=": "The base URL of the npm registry"
  - name: dist-tag
    description: "Modify package distribution tags"
  - name: docs
    aliases: [home]
    description: "Open documentation for a package in a web browser"
    flags:
      "-w, --workspace=": {description: "Enable running a command in the context of the configured workspaces of the current project", nargs: -1}
      "-ws, --workspaces": "Enable running a command in the context of all the configured workspaces"
      "--registry=": "The base URL of the npm registry"
      "--no-browser": "Display in command line instead of browser"
      "--browser=": "The browser that is called by the npm docs command to open websites"
    exclusiveflags:
      - [no-browser, browser]
      - [browser, no-browser]
  - name: doctor
    description: "Check your npm environment"
    flags:
      "--registry=": "The base URL of the npm registry"
  - name: edit
    description: "Edit an installed package"
    flags:
      "--editor": "The command to run for npm edit or npm config edit"
  - name: explore
    description: "Browse an installed package"
  - name: fund
    description: "Retrieve funding information"
  - name: get
    description: "Echo the config value to stdout"
  - name: help
    description: "Get help on npm"
    flags:
      "--viewer=": "The program to use to view help content"
  - name: help-search
    description: "Search npm help documentation"
    flags:
      "-l, --long": "Show extended information"
  - name: hook
    description: "Manage registry hooks"
  - name: install-ci-test
    description: "Install a project with a clean slate and run tests"
  - name: install-test
    description: "Install package(s) and run tests"
  - name: it
    description: "Install package(s) and run tests"
  - name: link
    description: "Symlink a package folder"
    completion:
      positional:
        - ["$files"]
  - name: ln
    description: "Symlink a package folder"
  - name: logout
    description: "Log out of the registry"
    flags:
      "--registry=": "The base URL of the npm registry"
      "--scope=": "Associate an operation with a scope for a scoped registry"
  - name: ls
    aliases: [list]
    description: "List installed packages"
    flags:
      "-a, -all": "Show all outdated or installed packages"
      "--json": "Show output in json format"
      "-l, --long": "Show extended information"
      "-p, --parseable": "Output parseable results from commands that write to standard output"
      "--depth=": "The depth to go when recursing packages"
      "--link": "Limits output to only those packages that are linked"
      "--package-lock-only": "Current operation will only use the package-lock.json, ignoring node_modules"
      "--no-unicode": "Uses unicode characters in the tree output"
      "-g, --global": "Operates in 'global' mode, so that packages are installed into the prefix folder instead of the current working directory"
      "--omit=*": "Dependency types to omit from the installation tree on disk"
      "-w, --workspace=": {description: "Enable running a command in the context of the configured workspaces of the current project", nargs: -1}
      "-ws, --workspaces": "Enable running a command in the context of all the configured workspaces"
    completion:
      flag:
        omit: [dev, optional, peer]
  - name: org
    description: "Manage orgs"
    commands:
      - name: set
        description: "Add a user to an org or manage roles"
        flags:
          "--registry=": "The base URL of the npm registry"
          "--otp=": "One-time password from a two-factor authenticator"
        completion:
          positional:
            - []
            - []
            - [developer, admin, owner]
      - name: rm
        description: "Remove a user from an org"
        flags:
          "--registry=": "The base URL of the npm registry"
          "--otp=": "One-time password from a two-factor authenticator"
      - name: ls
        description: "List users in an org or see what roles a particular user has in an org"
        flags:
          "--registry=": "The base URL of the npm registry"
          "--otp=": "One-time password from a two-factor authenticator"
          "--json": "Show output in json format"
          "-p, --parseable": "Output parseable results from commands that write to standard output"
  - name: outdated
    description: "Check for outdated packages"
    flags:
      "-a, -all": "Show all outdated or installed packages"
      "--json": "Show output in json format"
      "-l, --long": "Show extended information"
      "-p, --parseable": "Output parseable results from commands that write to standard output"
      "-g": "Checks globally"
      "-w, --workspace=": {description: "Enable running a command in the context of the configured workspaces of the current project", nargs: -1}
      "-ws, --workspaces": "Enable running a command in the context of all the configured workspaces"
  - name: owner
    aliases: [author]
    description: "Manage package owners"
    commands:
      - name: ls
        description: "List all the users who have access to modify a package and push new versions. Handy when you need to know who to bug for help"
        flags:
          "--registry=": "The base URL of the npm registry"
      - name: add
        description: "Add a new user as a maintainer of a package. This user is enabled to modify metadata, publish new versions, and add other owners"
        flags:
          "--registry=": "The base URL of the npm registry"
          "--otp=": "One-time password from a two-factor authenticator"
      - name: rm
        description: "Remove a user from the package owner list. This immediately revokes their privileges"
        flags:
          "--registry=": "The base URL of the npm registry"
          "--otp=": "One-time password from a two-factor authenticator"
  - name: pack
    description: "Create a tarball from a package"
    flags:
      "--json": "Show output in json format"
      "--dry-run": "Indicates that you don't want npm to make any changes and that it should only report what it would have done"
      "-w, --workspace=": {description: "Enable running a command in the context of the configured workspaces of the current project", nargs: -1}
      "-ws, --workspaces": "Enable running a command in the context of all the configured workspaces"
      "--pack-destination=": "Directory in which npm pack will save tarballs"
    completion:
      flag:
        pack-destination: ["$directories"]
  - name: ping
    description: "Ping npm registry"
    flags:
      "--registry=": "The base URL of the npm registry"
  - name: pkg
    description: "Manages your package.json"
    commands:
      - name: get
        description: "Retrieves a value key, defined in your package.json file. It is possible to get multiple values and values for child fields"
        flags:
          "--json": "Show output in json format"
          "-w, --workspace=": {description: "Enable running a command in the context of the configured workspaces of the current project", nargs: -1}
          "-ws, --workspaces": "Enable running a command in the context of all the configured workspaces"
      - name: set
        description: "Sets a value in your package.json based on the field value. It is possible to set multiple values and values for child fields"
        flags:
          "--json": "Show output in json format"
          "-w, --workspace=": {description: "Enable running a command in the context of the configured workspaces of the current project", nargs: -1}
          "-ws, --workspaces": "Enable running a command in the context of all the configured workspaces"
          "-f, --force": "Removes various protections against unfortunate side effects, common mistakes, unnecessary performance degradation, and malicious input. Allow clobbering existing values in npm pkg"
      - name: delete
        description: "Deletes a key from your package.json"
        flags:
          "-w, --workspace=": {description: "Enable running a command in the context of the configured workspaces of the current project", nargs: -1}
          "-ws, --workspaces": "Enable running a command in the context of all the configured workspaces"
          "-f, --force": "Removes various protections against unfortunate side effects, common mistakes, unnecessary performance degradation, and malicious input. Allow clobbering existing values in npm pkg"
  - name: prefix
    description: "Display prefix"
    flags:
      "-g, --global": "Print the global prefix to standard out"
  - name: profile
    description: "Change settings on your registry profile"
    commands:
      - name: get
        description: "Display all of the properties of your profile, or one or more specific properties"
        flags:
          "--registry=": "The base URL of the npm registry"
          "--json": "Show output in json format"
          "-p, --parseable": "Output parseable results from commands that write to standard output"
          "--otp=": "One-time password from a two-factor authenticator"
      - name: set
        description: "Set the value of a profile property"
        flags:
          "--registry=": "The base URL of the npm registry"
          "--json": "Show output in json format"
          "-p, --parseable": "Output parseable results from commands that write to standard output"
          "--otp=": "One-time password from a two-factor authenticator"
        completion:
          positional:
            - [email, fullname, homepage, freenode, twitter, github]
        commands:
          - name: password
            description: "Change your password. This is interactive, you'll be prompted for your current password and a new password"
      - name: enable-2fa
        description: "Enables two-factor authentication"
        flags:
          "--registry=": "The base URL of the npm registry"
          "--otp=": "One-time password from a two-factor authenticator"
        completion:
          positional:
            - ["auth-only\tRequire an OTP when logging in or making changes to your account's authentication", "auth-and-writes\tRequires an OTP at all the times auth-only does, and also requires one when publishing a module, setting the latest dist-tag, or changing access via npm access and npm owner"]
      - name: disable-2fa
        description: "Disables two-factor authentication"
        flags:
          "--registry=": "The base URL of the npm registry"
          "--otp=": "One-time password from a two-factor authenticator"
  - name: prune
    description: "Remove extraneous packages"
    flags:
      "--omit=*": "Dependency types to omit from the installation tree on disk"
      "--dry-run": "Indicates that you don't want npm to make any changes and that it should only report what it would have done"
      "--json": "Show output in json format"
      "--production": "Remove the packages specified in your devDependencies"
      "-w, --workspace=": {description: "Enable running a command in the context of the configured workspaces of the current project", nargs: -1}
      "-ws, --workspaces": "Enable running a command in the context of all the configured workspaces"
    completion:
      flag:
        omit: [dev, optional, peer]
  - name: publish
    description: "Publish a package"
    flags:
      "--tag=": "Registers the published package with the given tag"
      "-w, --workspace=": {description: "Enable running a command in the context of the configured workspaces of the current project", nargs: -1}
      "-ws, --workspaces": "Enable running a command in the context of all the configured workspaces"
      "--access=": "Sets scoped package to be publicly viewable if set to 'public'"
      "--dry-run": "Indicates that you don't want npm to make any changes and that it should only report what it would have done"
      "--otp=": "One-time password from a two-factor authenticator"
    completion:
      flag:
        access: [restricted, public]
      positional:
        - ["$directories"]
  - name: rebuild
    aliases: [rb]
    description: "Rebuild a package"
    flags:
      "-g, --global": "Operates in 'global' mode, so that packages are installed into the prefix folder instead of the current working directory"
      "-w, --workspace=": {description: "Enable running a command in the context of the configured workspaces of the current project", nargs: -1}
      "-ws, --workspaces": "Enable running a command in the context of all the configured workspaces"
      "--ignore-scripts": "If true, npm does not run scripts specified in package.json files"
      "--no-bin-links": "Tells npm to not create symlinks (or .cmd shims on Windows) for package executables"
  - name: repo
    description: "Open package repository page in the browser"
    flags:
      "-w, --workspace=": {description: "Enable running a command in the context of the configured workspaces of the current project", nargs: -1}
      "-ws, --workspaces": "Enable running a command in the context of all the configured workspaces"
      "--no-browser": "Display in command line instead of browser"
      "--browser=": "The browser that is called by the npm repo command to open websites"
    exclusiveflags:
      - [no-browser, browser]
      - [browser, no-browser]
  - name: restart
    description: "Restart a package"
    flags:
      "--ignore-scripts": "If true, npm does not run scripts specified in package.json files"
      "--script-shell=": "The shell to use for scripts run with the npm exec, npm run and npm init <pkg> commands"
      "--=": ""
  - name: root
    description: "Display npm root"
    flags:
      "-g, --global": "Print the effective global node_modules folder to standard out"
  - name: search
    aliases: [s, se, find]
    description: "Search for packages"
    flags:
      "-l, --long": "Show extended information"
      "--json": "Show output in json format"
      "--color=": "Show colors"
      "--no-color": "Do not show colors"
      "-p, --parseable": "Output parseable results from commands that write to standard output"
      "--no-description": "Do not show descriptions"
      "--searchopts=": "Space-separated options that are always passed to search"
      "--searchexclude=": "Space-separated options that limit the results from search"
      "--registry=": "The base URL of the npm registry"
      "--prefer-online": "If true, staleness checks for cached data will be forced, making the CLI look for updates immediately even for fresh package data"
      "--prefer-offline": "If true, staleness checks for cached data will be bypassed, but missing data will be requested from the server"
      "--offline": "Force offline mode: no network requests will be done during install"
    exclusiveflags:
      - [color, no-color]
      - [no-color, color]
      - [prefer-online, prefer-offline, offline]
      - [prefer-offline, prefer-online, offline]
      - [offline, prefer-online, prefer-offline]
    completion:
      flag:
        color: [always]
  - name: set
    description: "Sets the config key to the value"
  - name: set-script
    description: "Set tasks in the scripts section of package.json"
    flags:
      "-w, --workspace=": {description: "Enable running a command in the context of the configured workspaces of the current project", nargs: -1}
      "-ws, --workspaces": "Enable running a command in the context of all the configured workspaces"
  - name: shrinkwrap
    description: "Lock down dependency versions for publication"
  - name: star
    description: "Mark your favorite packages"
    flags:
      "--registry=": "The base URL of the npm registry"
      "--no-unicode": "Do not use unicode characters in the tree output"
  - name: stars
    description: "View packages marked as favorites"
    flags:
      "--registry=": "The base URL of the npm registry"
  - name: start
    description: "Start a package"
    flags:
      "--ignore-scripts": "If true, npm does not run scripts specified in package.json files"
      "--script-shell=": "The shell to use for scripts run with the npm exec, npm run and npm init <pkg> commands"
      "--=": ""
  - name: stop
    description: "Stop a package"
    flags:
      "--ignore-scripts": "If true, npm does not run scripts specified in package.json files"
      "--script-shell=": "The shell to use for scripts run with the npm exec, npm run and npm init <pkg> commands"
      "--=": ""
  - name: team
    description: "Manage organization teams and team memberships"
    commands:
      - name: create
        flags:
          "--registry=": "The base URL of the npm registry"
          "--otp=": "One-time password from a two-factor authenticator"
      - name: destroy
        flags:
          "--registry=": "The base URL of the npm registry"
          "--otp=": "One-time password from a two-factor authenticator"
      - name: add
        flags:
          "--registry=": "The base URL of the npm registry"
          "--otp=": "One-time password from a two-factor authenticator"
      - name: rm
        flags:
          "--registry=": "The base URL of the npm registry"
          "--otp=": "One-time password from a two-factor authenticator"
      - name: ls
        flags:
          "--registry=": "The base URL of the npm registry"
          "--json": "Show output in json format"
          "-p, --parseable": "Output parseable results from commands that write to standard output"
  - name: test
    aliases: [tst, t]
    description: "Test a package"
    flags:
      "--ignore-scripts": "If true, npm does not run scripts specified in package.json files"
      "--script-shell=": "The shell to use for scripts run with the npm exec, npm run and npm init <pkg> commands"
  - name: token
    description: "Manage your authentication tokens"
    flags:
      "--registry=": "The base URL of the npm registry"
      "--otp=": "One-time password from a two-factor authenticator"
    commands:
      - name: list
        description: "Shows a table of all active authentication tokens"
        flags:
          "--json": "Show output in json format"
          "-p, --parseable": "Output parseable results from commands that write to standard output"
      - name: create
        description: "Create a new authentication token"
        flags:
          "--read-only": "This is used to mark a token as unable to publish when configuring limited access tokens with the npm token create command"
          "--cidr=*": "This is a list of CIDR address to be used when configuring limited access tokens with the npm token create command"
      - name: revoke
        description: "Immediately removes an authentication token from the registry. You will no longer be able to use it"
  - name: uninstall
    description: "Uninstall a package"
    flags:
      "-S, --save": "Package will be removed from your dependencies"
      "-D, --save-dev": "Package will appear in your `devDependencies`"
      "-O, --save-optional": "Package will appear in your `optionalDependencies`"
      "--no-save": "Prevents saving to `dependencies`"
      "-g": "Uninstall global package"
      "-w, --workspace=": {description: "Enable running a command in the context of the configured workspaces of the current project", nargs: -1}
      "-ws, --workspaces": "Enable running a command in the context of all the configured workspaces"
  - name: r
    aliases: [rm]
    description: "Uninstall a package"
    flags:
      "-S, --save": "Package will be removed from your dependencies"
      "-D, --save-dev": "Package will appear in your `devDependencies`"
      "-O, --save-optional": "Package will appear in your `optionalDependencies`"
      "--no-save": "Prevents saving to `dependencies`"
      "-g": "Uninstall global package"
      "-w, --workspace=": {description: "Enable running a command in the context of the configured workspaces of the current project", nargs: -1}
      "-ws, --workspaces": "Enable running a command in the context of all the configured workspaces"
  - name: un
    description: "Uninstall a package"
    flags:
      "-S, --save": "Package will be removed from your dependencies"
      "-D, --save-dev": "Package will appear in your `devDependencies`"
      "-O, --save-optional": "Package will appear in your `optionalDependencies`"
      "--no-save": "Prevents saving to `dependencies`"
      "-g": "Uninstall global package"
      "-w, --workspace=": {description: "Enable running a command in the context of the configured workspaces of the current project", nargs: -1}
      "-ws, --workspaces": "Enable running a command in the context of all the configured workspaces"
  - name: remove
    description: "Uninstall a package"
    flags:
      "-S, --save": "Package will be removed from your dependencies"
