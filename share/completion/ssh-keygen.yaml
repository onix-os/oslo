# Converted from Fig's ssh-keygen.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: ssh-keygen
description: "Generates, manages and converts authentication keys for ssh"
flags:
  "-A": "For each of the key types (rsa, dsa, ecdsa and ed25519) for which host keys do not exist, generate the host keys with the default key file path, an empty passphrase, default bits for the key type, and default comment"
  "-a?": "When saving a private key, this option specifies the number of KDF"
  "-B": "Show the bubblebabble digest of specified private or public key file"
  "-b=": "Specifies the number of bits in the key to create"
  "-C=": "Provides a new comment"
  "-c": "Requests changing the comment in the private and public key files"
  "-D=": "Download the public keys provided by the PKCS#11"
  "-E=": "Specifies the hash algorithm used"
  "-e": "Read a OpenSSH key file and print to stdout"
  "-F=": "Search for the specified hostname (with optional port number)"
  "-f=": "Specifies the filename of the key file"
  "-g": "Use generic DNS format when printing fingerprint resource records"
  "-H": "Hash a known_hosts file"
  "-h": "Create a host certificate instead of a user"
  "-I=": "Specify the key identity when signing a public key"
  "-i": "Read an unencrypted private (or public) key file"
  "-K": "Download resident keys from a FIDO authenticator"
  "-k": "Generate a KRL file"
  "-L": "Generate a KRL file"
  "-l": "Show fingerprint of specified public key file"
  "-M=": "Use for Moduli generation"
  "-m=": "Specify a key format for key generation"
  "-N=": "Provides the new passphrase"
  "-n=": "Specify one or more principals (user or host names) to be included in a certificate when signing a key"
  "-O=*": "Specify a key/value option"
  "-P=": "Provides the (old) passphrase"
  "-p": "Requests changing the passphrase of a private key file instead of creating a new private key"
  "-Q": "Test whether keys have been revoked in a KRL"
  "-q": "Silence ssh-keygen"
  "-R=": "Removes all keys belonging to hostname"
  "-r=": "Print the SSHFP fingerprint resource record named hostname for the specified public key file"
  "-s=": "Certify (sign) a public key using the specified CA key"
  "-t=": "Specifies the type of key to create"
  "-U": "When used in combination with -s, this option indicates that a CA key resides in a ssh-agent(1)"
  "-u": "Update a KRL"
  "-V=": "Specify a validity interval when signing a certificate"
  "-v*": "Verbose mode"
  "-w=": "Specifies a path to a library that will be used when creating FIDO authenticator-hosted keys"
  "-Y=": {description: "Multiple functions: find principals, match principals, check novalidate, sign, verify", nargs: -1}
  "-y": "Read a private OpenSSH format file and print an OpenSSH public key to stdout"
  "-Z=": "Specifies the cipher to use for encryption when writing an OpenSSH-format private key file"
  "-z=": "Specifies a serial number to be embedded in the certificate to distinguish this certificate from others from the same CA"
