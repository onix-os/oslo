# Converted from Fig's arduino-cli.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: arduino-cli
description: "Arduino Command Line Interface"
flags:
  "-h, --help": "Help for arduino-cli"
persistentflags:
  "--additional-urls=": "Comma-separated list of additional URLs for the Boards Manager"
  "--config-file=": "The custom config file (if not specified the default will be used)"
  "--format=": "The output format for the logs, can be: text, json, jsonmini, yaml (default 'text')"
  "--log": "Print the logs on the standard output"
  "--log-file=": "Path to the file where logs will be written"
  "--log-format=": "The output format for the logs, can be: text, json"
  "--log-level=": "Messages with this level and above will be logged. Valid levels are: trace, debug, info, warn, error, fatal, panic"
  "--no-color": "Disable colored output"
completion:
  flag:
    config-file: ["$files"]
    format: ["text\tOutput in 'text'", "json\tOutput in 'json'", "jsonmini\tOutput in 'jsonmini'", "yaml\tOutput in 'yaml'"]
    log-file: ["$files"]
    log-format: ["text\tOutput in 'text'", "json\tOutput in 'json'"]
    log-level: ["trace\tLog level of 'trace", "debug\tLog level of 'debug", "info\tLog level of 'info'", "warn\tLog level of 'warn'", "error\tLog level of 'error'", "fatal\tLog level of 'fatal'", "panic\tLog level of 'panic'"]
commands:
  - name: board
    description: "Arduino board commands"
    flags:
      "-h, --help": "Help for board"
    commands:
      - name: attach
        description: "Sets the default values for port and FQBN. If no port or FQBN are specified, the current default port and FQBN are displayed"
        flags:
          "--board-options=": "List of board options separated by commas. Or can be used multiple times for multiple options"
          "--discovery-timeout=": "Max time to wait for port discovery, example: '30s, 1m (default 1s)'"
          "-b, --fqbn=": "Fully Qualified Board Name, example: 'arduino:avr:uno'"
          "-h, --help": "Help for attach"
          "-p, --port=": "Upload port address, example: 'COM3 or /dev/ttyACM2'"
          "-l, --protocol=": "Upload port protocol, example: 'serial'"
      - name: details
        description: "Show information about a board, in particular if the board has options to be specified in the FQBN'"
        flags:
          "--board-options=": "List of board options separated by commas. Or can be used multiple times for multiple options"
          "-b, --fqbn=": "Fully Qualified Board Name, example: 'arduino:avr:uno'"
          "-f, --full": "Show full board details"
          "-h, --help": "Help for details"
          "--list-programmers": "Show list of available programmers"
          "--show-properties=": "Show build properties. The properties are expanded, use \"--show-properties=unexpanded\" if you want them exactly as they are defined. (default \"disabled\")"
      - name: list
        description: "Detects and displays a list of boards connected to the current computer"
        flags:
          "--board-options=": "List of board options separated by commas. Or can be used multiple times for multiple options"
          "--discovery-timeout=": "Max time to wait for port discovery, example: '30s, 1m (default 1s)'"
          "-b, --fqbn=": "Fully Qualified Board Name, example: 'arduino:avr:uno'"
          "-h, --help": "Help for list"
          "-w, --watch=": "Command keeps running and prints list of connected boards whenever there is a change"
      - name: listall
        description: "List all boards that have the support platform installed, You can search for a specific board if you specify the board name"
        flags:
          "-h, --help": "Help for listall"
          "-a, --show-hidden": "Show also boards marked as 'hidden' in the platform"
      - name: search
        description: "Search for a board in the Boards Manager using the specified keywords"
        flags:
          "-h, --help": "Help for search"
          "-a, --show-hidden": "Show also boards marked as 'hidden' in the platform"
  - name: burn-bootloader
    description: "Upload the bootloader on the board using an external programmer"
    flags:
      "--board-options=": "List of board options separated by commas. Or can be used multiple times for multiple options"
      "--discovery-timeout=": "Max time to wait for port discovery, example: '30s, 1m (default 1s)'"
      "-b, --fqbn=": "Fully Qualified Board Name, example: 'arduino:avr:uno'"
      "-h, --help": "Help for burn-bootloader"
      "-p, --port=": "Upload port address, example: 'COM3 or /dev/ttyACM2'"
      "-P, --programmer=": "Programmer to use, example: 'atmel_ice'"
      "-l, --protocol=": "Upload port protocol, example: 'serial'"
      "-v, --verbose": "Turns on verbose mode"
      "-t, --verify": "Verify uploaded binary after upload"
  - name: cache
    description: "Arduino cache commands"
    flags:
      "-h, --help": "Help for cache"
    commands:
      - name: clean
        description: "Delete contents of the directories.downloads folder, where archive files are staged during installation of libraries and boards platforms"
        flags:
          "-h, --help": "Help for clean"
  - name: compile
    description: "Compiles Arduino sketches"
    flags:
      "--board-options=": "List of board options separated by commas. Or can be used multiple times for multiple option"
      "--build-cache-path=": "Builds of 'core.a' are saved into this path to be cached and reused"
      "--build-path=": "Path where to save compiled files. If omitted, a directory will be created in the default temporary path of your OS"
      "--build-property=": "Override a build property with a custom value. Can be used multiple times for multiple properties"
      "--clean": "Optional, cleanup the build folder and do not use any cached build"
      "--discovery-timeout=": "Max time to wait for port discovery, example: '30s, 1m (default 1s)'"
      "--dump-profile": "Create and print a profile configuration from the build"
      "--encrypt-key=": "The name of the custom encryption key to use to encrypt a binary during the compile process. Used only by the platforms that support it"
      "--export-binaries": "If set built binaries will be exported to the sketch folder"
      "-b, --fqbn=": "Fully Qualified Board Name, example: 'arduino:avr:uno'"
      "-h, --help": "Help for compile"
      "--keys-keychain=": "The path of the dir to search for the custom keys to sign and encrypt a binary. Used only by the platforms that support it"
      "--libraries=": "Path to a collection of libraries. Can be used multiple times or entries can be comma separated"
      "--library=": "Path to a single library’s root folder. Can be used multiple times or entries can be comma separated"
      "--only-compilation-database": "Just produce the compilation database, without actually compiling. All build commands are skipped except pre* hooks"
      "--optimize-for-debug": "Optional, optimize compile output for debugging, rather than for release"
      "--output-dir=": "Save build artifacts in this directory"
      "-p, --port=": "Upload port address, example: 'COM3 or /dev/ttyACM2'"
      "--preprocess": "Print preprocessed code to stdout instead of compiling"
      "-m, --profile=": "Sketch profile to use"
      "-P, --programmer=": "Programmer to use, example: 'atmel_ice'"
      "-l, --protocol=": "Upload port protocol, example: 'serial'"
      "--quiet": "Optional, suppresses almost every output"
      "--show-properties=": "Show build properties. The properties are expanded, use \"--show-properties=unexpanded\" if you want them exactly as they are defined. (default \"disabled\")"
      "--sign-key=": "The name of the custom signing key to use to sign a binary during the compile process. Used only by the platforms that support it"
      "-u, --upload": "Upload the binary after the compilation"
      "-v, --verbose": "Optional, turns on verbose mode"
      "-t, --verify": "Verify uploaded binary after the upload"
      "--warnings=": "Optional, can be: none, default, more, all. Used to tell gcc which warning level to use (-W flag). (default \"none\")"
    completion:
      flag:
        build-path: ["$files"]
        keys-keychain: ["$files", "$directories"]
        libraries: ["$files", "$directories"]
        library: ["$files", "$directories"]
        output-dir: ["$directories"]
        warnings: ["none\tUse warning level 'none'", "default\tUse warning level 'default'", "more\tUse warning level 'more'", "all\tUse warning level 'all'"]
  - name: completion
    description: "Generates completion scripts for various shells"
    flags:
      "-h, --help": "Help for completion"
      "--no-description": "Disable completion description for shells that support it"
  - name: config
    description: "Arduino configuration commands"
    flags:
      "-h, --help": "Help for config"
    commands:
      - name: add
        description: "Adds one or more values to a setting"
        flags:
          "-h, --help": "Help for add"
      - name: delete
        description: "Deletes a settings key and all its sub keys"
        flags:
          "-h, --help": "Help for delete"
      - name: dump
        description: "Prints the current configuration"
        flags:
          "-h, --help": "Help for dump"
      - name: init
        description: "Creates or updates the configuration file in the data directory or custom directory with the current configuration settings"
        flags:
          "--dest-dir=": "Sets where to save the configuration file"
          "--dest-file=": "Sets where to save the configuration file"
          "-h, --help": "Help for init"
          "--overwrite": "Overwrite existing config file"
        completion:
          flag:
            dest-dir: ["$directories"]
            dest-file: ["$files"]
      - name: remove
        description: "Removes one or more values from a setting"
        flags:
          "-h, --help": "Help for remove"
      - name: set
        description: "Sets a setting value"
        flags:
          "-h, --help": "Help for set"
  - name: core
    description: "Arduino core operations"
    flags:
      "-h, --help": "Help for core"
    commands:
      - name: download
        description: "Downloads one or more cores and corresponding tool dependencies"
        flags:
          "-h, --help": "Help for download"
      - name: install
        description: "Installs one or more cores and corresponding tool dependencies"
        flags:
          "-h, --help": "Help for install"
          "--no-overwrite": "Do not overwrite already installed platforms"
          "--run-post-install": "Force run of post-install scripts (if the CLI is not running interactively)"
          "--run-pre-uninstall": "Force run of pre-uninstall scripts (if the CLI is not running interactively)"
          "--skip-post-install": "Force skip of post-install scripts (if the CLI is running interactively)"
          "--skip-pre-uninstall": "Force skip of pre-uninstall scripts (if the CLI is running interactively)"
      - name: list
        description: "Show the list of installed platforms"
        flags:
          "-h, --help": "Help for list"
          "--updatable": "List updatable platforms"
      - name: search
        description: "Search for a core in Boards Manager using the specified keywords"
        flags:
          "-h, --help": "Help for search"
      - name: uninstall
        description: "Uninstalls one or more cores and corresponding tool dependencies if no longer used"
        flags:
          "-h, --help": "Help for uninstall"
          "--run-post-install": "Force run of post-install scripts (if the CLI is not running interactively)"
          "--run-pre-uninstall": "Force run of pre-uninstall scripts (if the CLI is not running interactively)"
          "--skip-post-install": "Force skip of post-install scripts (if the CLI is running interactively)"
          "--skip-pre-uninstall": "Force skip of pre-uninstall scripts (if the CLI is running interactively)"
      - name: update-index
        description: "Updates the index of cores to the latest version"
        flags:
          "-h, --help": "Help for update-index"
      - name: upgrade
        description: "Upgrades one or all installed platforms to the latest version"
        flags:
          "-h, --help": "Help for upgrade"
          "--run-post-install": "Force run of post-install scripts (if the CLI is not running interactively)"
          "--run-pre-uninstall": "Force run of pre-uninstall scripts (if the CLI is not running interactively)"
          "--skip-post-install": "Force skip of post-install scripts (if the CLI is running interactively)"
          "--skip-pre-uninstall": "Force skip of pre-uninstall scripts (if the CLI is running interactively)"
  - name: daemon
    description: "Run as a daemon on port: 50051, the initialization of cores and libraries is done only once"
    flags:
      "--daemonize": "Do not terminate daemon process if the parent process dies"
      "--debug": "Enable debug logging of gRPC calls"
      "--debug-file=": "Append debug logging to the specified file"
      "--debug-filter=": "Display only the provided gRPC calls"
      "-h, --help": "Help for daemon"
      "--port=": "The TCP port the daemon will listen to"
    completion:
      flag:
        debug-file: ["$files"]
  - name: debug
    description: "Debug Arduino sketches. (this command opens an interactive gdb session)"
    flags:
      "--board-options=": "List of board options separated by commas. Or can be used multiple times for multiple options"
      "--discovery-timeout=": "Max time to wait for port discovery, example: '30s, 1m (default 1s)'"
      "-b, --fqbn=": "Fully Qualified Board Name, example: 'arduino:avr:uno'"
      "-h, --help": "Help for debug"
      "-I, --info": "Show metadata about the debug session instead of starting the debugger"
      "--input-dir=": "Directory containing binaries for debug"
      "--interpreter=": "Debug interpreter, example: console, mi, mi1, mi2, mi3 (default \"console\")"
      "-p, --port=": "Upload port address, example: 'COM3 or /dev/ttyACM2'"
      "-P, --programmer=": "Programmer to use, example: 'atmel_ice'"
      "-l, --protocol=": "Upload port protocol, example: 'serial'"
    completion:
      flag:
        input-dir: ["$directories"]
        interpreter: ["console\tDebug interpreter 'console'", "mi\tDebug interpreter 'mi'", "mi1\tDebug interpreter 'mi1'", "mi2\tDebug interpreter 'mi2'", "mi3\tDebug interpreter 'mi3'"]
    commands:
      - name: check
        description: "Check if the given board/programmer combination supports debugging"
        flags:
          "--board-options=": "List of board options separated by commas. Or can be used multiple times for multiple options"
          "--discovery-timeout=": "Max time to wait for port discovery, example: '30s, 1m (default 1s)'"
          "-b, --fqbn=": "Fully Qualified Board Name, example: 'arduino:avr:uno'"
          "-h, --help": "Help for check"
          "--interpreter=": "Debug interpreter, example: console, mi, mi1, mi2, mi3 (default \"console\")"
          "-p, --port=": "Upload port address, example: 'COM3 or /dev/ttyACM2'"
          "-P, --programmer=": "Programmer to use, example: 'atmel_ice'"
          "-l, --protocol=": "Upload port protocol, example: 'serial'"
        completion:
          flag:
            interpreter: ["console\tDebug interpreter 'console'", "mi\tDebug interpreter 'mi'", "mi1\tDebug interpreter 'mi1'", "mi2\tDebug interpreter 'mi2'", "mi3\tDebug interpreter 'mi3'"]
  - name: help
    description: "Help provides help for any command in the application"
    flags:
      "-h, --help": "Help for help"
  - name: lib
    description: "Arduino commands about libraries"
    flags:
      "-h, --help": "Help for lib"
    commands:
      - name: deps
        description: "Check dependencies status for the specified library"
        flags:
          "-h, --help": "Help for deps"
      - name: download
        description: "Downloads one or more libraries without installing them"
        flags:
          "-h, --help": "Help for download"
      - name: examples
        description: "Shows the list of the examples for libraries. A name may be given as argument to search a specific library"
        flags:
          "--board-options=": "List of board options separated by commas. Or can be used multiple times for multiple options"
          "-b, --fqbn=": "Fully Qualified Board Name, example: 'arduino:avr:uno'"
          "-h, --help": "Help for examples"
      - name: install
        description: "Installs one or more specified libraries into the system"
        flags:
          "--git-url": "Enter git url for libraries hosted on repositories"
          "-h, --help": "Help for install"
          "--install-in-builtin-dir": "Install libraries in the IDE-Builtin directory"
          "--no-deps": "Do not install dependencies"
          "--no-overwrite": "Do not overwrite already installed libraries"
          "--zip-path": "Enter a path to zip file"
      - name: list
        description: "Shows a list of installed libraries. If the LIBNAME parameter is specified the listing is limited to that specific library. By default the libraries provided as built-in by platforms/core are not listed, they can be listed by adding the --all flag"
        flags:
          "--all": "Include built-in libraries (from platforms and IDE) in listing"
          "--board-options=": "List of board options separated by commas. Or can be used multiple times for multiple options"
          "-b, --fqbn=": "Fully Qualified Board Name, example: 'arduino:avr:uno'"
          "-h, --help": "Help for list"
          "--updatable": "List updatable libraries"
      - name: search
        description: "Search for one or more libraries data (case insensitive search)"
        flags:
          "--h, --help": "Help for search"
          "--names": "Show library names only"
          "--omit-releases-details": "Omit library details far all versions except the latest (produce a more compact JSON output)"
      - name: uninstall
        description: "Uninstalls one or more libraries"
        flags:
          "--h, --help": "Help for uninstall"
      - name: update-index
        description: "Updates the libraries index to the latest version"
        flags:
          "--h, --help": "Help for update-index"
      - name: upgrade
        description: "Upgrades installed libraries. This command upgrades an installed library to the latest available version. Multiple libraries can be passed separated by a space. If no arguments are provided, the command will upgrade all the installed libraries where an update is available"
        flags:
          "--h, --help": "Help for upgrade"
  - name: monitor
    description: "Open a communication port with a board"
    flags:
      "--board-options=": "List of board options separated by commas. Or can be used multiple times for multiple options"
      "-c, --config=": "Configure communication port settings. The format is <ID>=<value>[,<ID>=<value>]"
      "--describe": "Show all the settings of the communication port"
      "--discovery-timeout=": "Max time to wait for port discovery, example: '30s, 1m (default 1s)'"
      "-b, --fqbn=": "Fully Qualified Board Name, example: 'arduino:avr:uno'"
      "-h, --help": "Help for monitor"
      "-p, --port=": "Upload port address, example: 'COM3 or /dev/ttyACM2'"
      "-l, --protocol=": "Upload port protocol, example: 'serial'"
      "-q, --quiet": "Run in silent mode, show only monitor input and output"
      "--raw": "Set terminal in raw mode (unbuffered)"
      "--timestamp": "Timestamp each incoming line"
  - name: outdated
    description: "This commands shows a list of installed cores and/or libraries that can be upgraded. If nothing needs to be updated the output is empty"
    flags:
      "-h, --help": "Help for outdated"
  - name: sketch
    description: "Arduino CLI sketch commands"
    flags:
      "-h, --help": "Help for sketch"
    commands:
      - name: archive
        description: "Creates a zip file containing all sketch files"
        flags:
          "-h, --help": "Help for archive"
          "--include-build-dir": "Includes build in directory in the archive"
          "-f, --overwrite": "Overwrites an already existing archive"
      - name: new
        description: "Create a new Sketch"
        flags:
          "-h, --help": "Help for archive"
          "-f, --overwrite": "Overwrites an already existing .ino sketch"
  - name: update
    description: "Updates the index of cores and libraries to the latest versions"
    flags:
      "-h, --help": "Help for update"
      "--show-outdated": "Show outdated cores and libraries after index update"
  - name: upgrade
    description: "Upgrades installed cores and libraries to latest version"
    flags:
      "-h, --help": "Help for update"
      "--run-post-install": "Force run of post-install scripts (if the CLI is not running interactively)"
      "--run-pre-uninstall": "Force run of pre-uninstall scripts (if the CLI is not running interactively)"
      "--skip-post-install": "Force skip of post-install scripts (if the CLI is running interactively)"
      "--skip-pre-uninstall": "Force skip of pre-uninstall scripts (if the CLI is running interactively)"
  - name: upload
    description: "Upload Arduino sketches. This does NOT compile the sketch prior to upload"
    flags:
      "--board-options=": "List of board options separated by commas. Or can be used multiple times for multiple options"
      "--discovery-timeout=": "Max time to wait for port discovery, example: '30s, 1m (default 1s)'"
      "-b, --fqbn=": "Fully Qualified Board Name, example: 'arduino:avr:uno'"
      "-h, --help": "Help for upload"
      "--input-dir=": "Directory containing binaries to upload"
      "-i, --input-file=": "Binary file to upload"
      "-p, --port=": "Binary file to upload, example: 'COM3 or /dev/ttyACM2'"
      "-m, --profile=": "Sketch profile to use"
      "-P, --programmer=": "Programmer to use, example: 'atmel_ice'"
      "-l, --protocol=": "Upload port protocol, example: 'serial'"
      "-F, --upload-field=": "Set a value for a field required to upload, 'key=value'"
      "-v, --verbose": "Optional, turns on verbose mode"
      "-t, --verify": "Verify uploaded binary after the upload"
    completion:
      flag:
        input-dir: ["$directories"]
        input-file: ["$files"]
  - name: version
    description: "Shows the version number of Arduino CLI which is installed on your system"
    flags:
      "-h, --help": "Help for version"
