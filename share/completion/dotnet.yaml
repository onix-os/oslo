# Converted from Fig's dotnet.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: dotnet
description: "The dotnet cli"
flags:
  "--version": "Prints out the version of the .NET SDK used by dotnet commands. Includes the effects of any global.json"
  "--info": "Prints out detailed information about a .NET installation and the machine environment, such as the current operating system, and commit SHA of the .NET version"
  "--list-runtimes": "Prints out a list of the installed .NET runtimes. An x86 version of the SDK lists only x86 runtimes, and an x64 version of the SDK lists only x64 runtimes"
  "--list-sdks": "Prints out a list of the installed .NET SDKs"
  "-?, -h, --help": "Prints out a list of available commands"
  "-d, --diagnostics": "Enables diagnostic output"
  "-v, --verbosity=": "Sets the verbosity level of the command. Allowed values are q[uiet], m[inimal], n[ormal], d[etailed], and diag[nostic]. Not supported in every command. See specific command page to determine if this option is available"
  "--additionalprobingpath=": "Path containing probing policy and assemblies to probe"
  "--additional-deps=": "Path to an additional .deps.json file. A deps.json file contains a list of dependencies, compilation dependencies, and version information used to address assembly conflicts. For more information, see Runtime Configuration Files on GitHub"
  "-depsfile=": "Path to the deps.json file. A deps.json file is a configuration file that contains information about dependencies necessary to run the application. This file is generated by the .NET SDK"
  "--runtimeconfig=": "Path to a runtimeconfig.json file. A runtimeconfig.json file is a configuration file that contains run-time settings"
  "--roll-forward=": "Controls how roll forward is applied to the app. The SETTING can be one of the following values. If not specified, Minor is the default"
  "--fx-version=": "Version of the .NET runtime to use to run the application"
completion:
  flag:
    verbosity: [quiet, minimal, normal, detailed, diagnostic]
    additionalprobingpath: ["$directories"]
    additional-deps: ["$files"]
    depsfile: ["$files"]
    runtimeconfig: ["$files"]
    roll-forward: [LatestPatch, Minor, Major, LatestMinor, LatestMajor, Disable]
commands:
  - name: new
    flags:
      "--dry-run": "Displays a summary of what would happen if the given command were run if it would result in a template creation"
      "--force": "Forces content to be generated even if it would change existing files. This is required when the template chosen would override existing files in the output directory"
      "-?, -h, --help": "Prints out help for the command. It can be invoked for the dotnet new command itself or for any template. For example, dotnet new mvc --help"
      "-lang, --language=": "The language of the template to create"
      "-n, --name=": "The name for the created output. If no name is specified, the name of the current directory is used"
      "-o, --output=": "Location to place the generated output. The default is the current directory"
    completion:
      flag:
        language: ["C#", "F#", VB]
        output: ["$directories"]
    commands:
      - name: "--list"
        description: "The dotnet new --list option lists available templates to use with dotnet new"
        flags:
          "--author": ""
          "--columns=": "Comma-separated list of columns to display in the output"
          "--columns-all": "Displays all columns in the output. Available since .NET Core 5.0.300 SDK"
          "--tag=": "Filters templates based on template tags. To be selected, a template must have at least one tag that exactly matches the criteria. Available since .NET Core 5.0.300 SDK"
          "--type=": ""
        completion:
          flag:
            columns: [language, tags, author, type]
            type: [project, item]
      - name: "--search"
        description: "The dotnet new --search option searches for templates supported by dotnet new on NuGet.org"
        flags:
          "--author=": "Filters templates based on template author. Partial match is supported"
          "--columns=": "Comma-separated list of columns to display in the output"
          "--columns-all": "Displays all columns in the output"
          "-lang, --language=": "Filters templates based on language supported by the template. The language accepted varies by the template. Not valid for some templates"
          "--package=": "Filters templates based on NuGet package ID. Partial match is supported"
          "--tag=": "Filters templates based on template tags. To be selected, a template must have at least one tag that exactly matches the criteria"
          "--type=": "Filters templates based on template type. Predefined values are project and item"
        completion:
          flag:
            columns: [language, tags, author, type]
            language: ["C#", "F#", VB]
            type: [project, item]
      - name: "-i"
        aliases: ["--install"]
        flags:
          "--interactive": "Allows the command to stop and wait for user input or action. For example, to complete authentication. Available since .NET 5.0 SDK"
          "--nuget-source=": "By default, dotnet new --install uses the hierarchy of NuGet configuration files from the current directory to determine the NuGet source the package can be installed from. If --nuget-source is specified, the source will be added to the list of sources to be checked"
      - name: "-u"
        aliases: ["--uninstall"]
        description: "The dotnet new --uninstall command uninstalls a template package at the PATH or NUGET_ID provided"
      - name: "--update-check"
        description: "The dotnet new --update-check option checks if there are updates available for the template packs that are currently installed"
      - name: "--update-apply"
        description: "The dotnet new --update-apply option checks if there are updates available for the template packages that are currently installed and installs them"
  - name: add
    commands:
      - name: package
        description: "The package reference to add"
        flags:
          "-f, --framework=": "Adds a package reference only when targeting a specific framework"
          "--interactive": "Allows the command to stop and wait for user input or action. For example, to complete authentication"
          "-n, --no-restore": "Adds a package reference without performing a restore preview and compatibility check"
          "--package-directory=": "The directory where to restore the packages. The default package restore location is %userprofile%.nugetpackages on Windows and ~/.nuget/packages on macOS and Linux"
          "--prerelease": "Allows prerelease packages to be installed. Available since .NET Core 5 SDK"
          "-s, --source": "The URI of the NuGet package source to use during the restore operation"
          "-v, --version=": "Version of the package"
        completion:
          flag:
            package-directory: ["$directories"]
      - name: reference
        description: "The dotnet add reference command provides a convenient option to add project references to a project. After running the command, the <ProjectReference> elements are added to the project file"
        flags:
          "-f, --framework=": "Adds a package reference only when targeting a specific framework"
  - name: list
    commands:
      - name: package
        description: "The dotnet list package command provides a convenient option to list all NuGet package references for a specific project or a solution. You first need to build the project in order to have the assets needed for this command to process"
        flags:
          "--config=": "The NuGet sources to use when searching for newer packages. Requires the --outdated option"
          "--deprecated": "Displays packages that have been deprecated"
          "--framework=": "Displays only the packages applicable for the specified target framework. To specify multiple frameworks, repeat the option multiple times. For example: --framework netcoreapp2.2 --framework netstandard2.0"
          "--highest-minor": "Considers only the packages with a matching major version number when searching for newer packages. Requires the --outdated or --deprecated option"
          "--highest-patch": "Considers only the packages with a matching major and minor version numbers when searching for newer packages. Requires the --outdated or --deprecated option"
          "--include-prerelease": "Considers packages with prerelease versions when searching for newer packages. Requires the --outdated or --deprecated option"
          "--include-transitive": "Lists transitive packages, in addition to the top-level packages. When specifying this option, you get a list of packages that the top-level packages depend on"
          "--interactive": "Allows the command to stop and wait for user input or action. For example, to complete authentication. Available since .NET Core 3.0 SDK"
          "--outdated": "Lists packages that have newer versions available"
          "-s, --source": "The NuGet sources to use when searching for newer packages. Requires the --outdated or --deprecated option"
          "-v, --verbosity=": "Sets the verbosity level of the command. Allowed values are q[uiet], m[inimal], n[ormal], d[etailed], and diag[nostic]. Not supported in every command. See specific command page to determine if this option is available"
          "--vulnerable": "Lists packages that have known vulnerabilities. Cannot be combined with --deprecated or --outdated options"
        completion:
          flag:
            verbosity: [quiet, minimal, normal, detailed, diagnostic]
      - name: reference
        description: "The dotnet list reference command provides a convenient option to list project references for a given project"
  - name: remove
    commands:
      - name: package
        description: "The dotnet remove package command provides a convenient option to remove a NuGet package reference from a project"
      - name: reference
        description: "The dotnet remove reference command provides a convenient option to remove project references from a project"
  - name: build
    flags:
      "-a, --arch=": "Specifies the target architecture. This is a shorthand syntax for setting the Runtime Identifier (RID), where the provided value is combined with the default RID. For example, on a win-x64 machine, specifying --arch x86 sets the RID to win-x86. If you use this option, don't use the -r|--runtime option. Available since .NET 6 Preview 7"
      "-c, --configuration=": "Defines the build configuration. The default for most projects is Debug, but you can override the build configuration settings in your project"
      "-f, --framework": "Compiles for a specific framework. The framework must be defined in the project file"
      "--force": "Forces all dependencies to be resolved even if the last restore was successful. Specifying this flag is the same as deleting the project.assets.json file"
      "--interactive": "Allows the command to stop and wait for user input or action. For example, to complete authentication. Available since .NET Core 3.0 SDK"
      "--no-dependencies": "Ignores project-to-project (P2P) references and only builds the specified root project"
      "--no-incremental": "Marks the build as unsafe for incremental build. This flag turns off incremental compilation and forces a clean rebuild of the project's dependency graph"
      "--no-restore": "Doesn't execute an implicit restore during build"
      "--nologo": "Doesn't display the startup banner or the copyright message. Available since .NET Core 3.0 SDK"
      "--no-self-contained": "Publishes the application as a framework dependent application. A compatible .NET runtime must be installed on the target machine to run the application"
      "-o, --output=": "Directory in which to place the built binaries. If not specified, the default path is ./bin/<configuration>/<framework>/. For projects with multiple target frameworks (via the TargetFrameworks property), you also need to define --framework when you specify this option"
      "--os=": "Specifies the target operating system (OS). This is a shorthand syntax for setting the Runtime Identifier (RID), where the provided value is combined with the default RID. For example, on a win-x64 machine, specifying --os os sets the RID to os-x64. If you use this option, don't use the -r|--runtime option. Available since .NET 6 Preview 7"
      "-r, --runtime=": "Specifies the target runtime. For a list of Runtime Identifiers (RIDs), see the RID catalog. If you use this option, use --self-contained or --no-self-contained also"
      "--self-contained?": "Publishes the .NET runtime with the application so the runtime doesn't need to be installed on the target machine. The default is true if a runtime identifier is specified"
      "--source=": "The URI of the NuGet package source to use during the restore operation"
      "-v, --verbosity=": "Sets the verbosity level of the command. Allowed values are q[uiet], m[inimal], n[ormal], d[etailed], and diag[nostic]. Not supported in every command. See specific command page to determine if this option is available"
      "--version-suffix=": "Sets the value of the $(VersionSuffix) property to use when building the project. This only works if the $(Version) property isn't set. Then, $(Version) is set to the $(VersionPrefix) combined with the $(VersionSuffix), separated by a dash"
    completion:
      flag:
        arch: [x86, x64, arm, arm64]
        output: ["$directories"]
        self-contained: ["true", "false"]
        verbosity: [quiet, minimal, normal, detailed, diagnostic]
  - name: build-server
    commands:
      - name: shutdown
        description: "Shuts down build servers that are started from dotnet. By default, all servers are shut down"
        flags:
          "--msbuild": "Shuts down the MSBuild build server"
          "--razor": "Shuts down the Razor build server"
          "--vbcscompiler": "Shuts down the VB/C# compiler build server"
  - name: clean
    flags:
      "-c, --configuration=": "Defines the build configuration. The default for most projects is Debug, but you can override the build configuration settings in your project. This option is only required when cleaning if you specified it during build time"
      "-f, --framework=": "The framework that was specified at build time. The framework must be defined in the project file. If you specified the framework at build time, you must specify the framework when cleaning"
      "--interactive": "Allows the command to stop and wait for user input or action. For example, to complete authentication. Available since .NET Core 3.0 SDK"
      "--nologo": "Doesn't display the startup banner or the copyright message. Available since .NET Core 3.0 SDK"
      "-o, --output=": "The directory that contains the build artifacts to clean. Specify the -f|--framework <FRAMEWORK> switch with the output directory switch if you specified the framework when the project was built"
      "-r, --runtime": "Cleans the output folder of the specified runtime. This is used when a self-contained deployment was created"
      "-v, --verbosity=": "Sets the verbosity level of the command. Allowed values are q[uiet], m[inimal], n[ormal], d[etailed], and diag[nostic]. Not supported in every command. See specific command page to determine if this option is available"
    completion:
      flag:
        configuration: [Debug, Release]
        output: ["$directories"]
        verbosity: [quiet, minimal, normal, detailed, diagnostic]
  - name: format
    flags:
      "--diagnostics=": "A space-separated list of diagnostic IDs to use as a filter when fixing code style or third party issues. Default value is whichever IDs are listed in the editorconfig file"
      "--severity?": "The minimum severity of diagnostics to fix. Allowed values are info, warn, and error. The default value is warn"
      "--no-restore": "Doesn't execute an implicit restore before formatting. Default is to do implicit restore"
      "--verify-no-changes": "Verifies that no formatting changes would be performed. Terminates with a non zero exit code if any files would have been formatted"
      "--include=": "A space-separated list of relative file or folder paths to include in formatting. All files in the solution or project are formatted if empty"
      "--exclude=": "A space-separated list of relative file or folder paths to exclude from formatting. The default is none"
      "--include-generated": "Formats files generated by the SDK"
      "-v, --verbosity=": "Sets the verbosity level of the command. Allowed values are q[uiet], m[inimal], n[ormal], d[etailed], and diag[nostic]. Not supported in every command. See specific command page to determine if this option is available"
      "--binarylog=": "Logs all project or solution load information to a binary log file"
      "--report=": "Produces a JSON report in the directory specified by <REPORT_PATH>"
    completion:
      flag:
        severity: [info, warn, error]
        include: ["$directories", "$files"]
        exclude: ["$directories", "$files"]
        verbosity: [quiet, minimal, normal, detailed, diagnostic]
        binarylog: ["$files"]
        report: ["$directories"]
  - name: migrate
    flags:
      "--format-report-file-json=": "Output migration report file as JSON rather than user messages"
      "-r, --report=": "Output migration report to a file in addition to the console"
      "-s, --skip-project-references?": "Skip migrating project references. By default, project references are migrated recursively"
      "--skip-backup": "Skip moving project.json, global.json, and *.xproj to a backup directory after successful migration"
      "-t, --template-file=": "Template csproj file to use for migration. By default, the same template as the one dropped by dotnet new console is used"
      "-v, --sdk-package-version=": "The version of the sdk package that's referenced in the migrated app. The default is the version of the SDK in dotnet new"
      "-x, --xproj-file=": "The path to the xproj file to use. Required when there is more than one xproj in a project directory"
    completion:
      flag:
        format-report-file-json: ["$files"]
        report: ["$files"]
        skip-project-references: [Debug, Release]
        xproj-file: ["$files"]
  - name: msbuild
  - name: nuget
    commands:
      - name: delete
        description: "The dotnet nuget delete command deletes or unlists a package from the server. For nuget.org, the action is to unlist the package"
        flags:
          "--force-english-output": "Forces the application to run using an invariant, English-based culture"
          "--interactive": "Allows the command to stop and wait for user input or action. For example, to complete authentication. Available since .NET Core 3.0 SDK"
          "-k, --api-key=": "The API key for the server"
          "--no-service-endpoint": "Doesn't append \"api/v2/package\" to the source URL. Option available since .NET Core 2.1 SDK"
          "--non-interactive": "Doesn't prompt for user input or confirmations"
          "-s, --source=": "Specifies the server URL. Supported URLs for nuget.org include https://www.nuget.org, https://www.nuget.org/api/v3, and https://www.nuget.org/api/v2/package. For private feeds, replace the host name (for example, %hostname%/api/v3)"
      - name: locals
        description: "The dotnet nuget locals command clears or lists local NuGet resources in the http-request cache, temporary cache, or machine-wide global packages folder"
        flags:
          "-c, --clear": "The clear option executes a clear operation on the specified cache type. The contents of the cache directories are deleted recursively. The executing user/group must have permission to the files in the cache directories. If not, an error is displayed indicating the files/folders that weren't cleared"
          "-l, --list": "The list option is used to display the location of the specified cache type"
        completion:
          positional:
            - [all, http-cache, global-packages, temp]
      - name: push
        description: "The dotnet nuget push command pushes a package to the server and publishes it. The push command uses server and credential details found in the system's NuGet config file or chain of config files. For more information on config files, see Configuring NuGet Behavior. NuGet's default configuration is obtained by loading %AppData%NuGetNuGet.config (Windows) or $HOME/.local/share (Linux/macOS), then loading any nuget.config or .nuget uget.config starting from the root of drive and ending in the current directory"
        flags:
          "-d, --disable-buffering": "Disables buffering when pushing to an HTTP(S) server to reduce memory usage"
          "--force-english-output": "Forces the application to run using an invariant, English-based culture"
          "--interactive": "Allows the command to stop and wait for user input or action. For example, to complete authentication. Available since .NET Core 3.0 SDK"
          "-k, --api-key=": "The API key for the server"
          "-n, --no-symbols": "Doesn't push symbols (even if present)"
          "--no-service-endpoint": "Doesn't append \"api/v2/package\" to the source URL. Option available since .NET Core 2.1 SDK"
          "-s, --source=": "Specifies the server URL. NuGet identifies a UNC or local folder source and simply copies the file there instead of pushing it using HTTP"
          "--skip-duplicate": "When pushing multiple packages to an HTTP(S) server, treats any 409 Conflict response as a warning so that the push can continue. Available since .NET Core 3.1 SDK"
          "-sk, --symbol-api-key=": "The API key for the symbol server"
          "-ss, --symbol-source=": "Specifies the symbol server URL"
          "-t, --timeout?": "Specifies the timeout for pushing to a server in seconds. Defaults to 300 seconds (5 minutes). Specifying 0 applies the default value"
      - name: add
        commands:
          - name: source
            description: "The dotnet nuget add source command adds a new package source to your NuGet configuration files"
            flags:
              "--configfile=": "The NuGet configuration file (nuget.config) to use. If specified, only the settings from this file will be used. If not specified, the hierarchy of configuration files from the current directory will be used"
              "-n, --name=": "Name of the source"
              "-p, --password=": "Password to be used when connecting to an authenticated source"
              "--store-password-in-clear-text=": "Enables storing portable package source credentials by disabling password encryption"
              "-u, --username=": "Username to be used when connecting to an authenticated source"
              "--valid-authentication-types=": "Comma-separated list of valid authentication types for this source. Set this to basic if the server advertises NTLM or Negotiate and your credentials must be sent using the Basic mechanism, for instance when using a PAT with on-premises Azure DevOps Server. Other valid values include negotiate, kerberos, ntlm, and digest, but these values are unlikely to be useful"
            completion:
              flag:
                valid-authentication-types: [negotiate, kerberos, ntlm, digest]
      - name: disable
        commands:
          - name: source
            description: "The dotnet nuget disable source command disables an existing source in your NuGet configuration files"
            flags:
              "--configfile=": "The NuGet configuration file (nuget.config) to use. If specified, only the settings from this file will be used. If not specified, the hierarchy of configuration files from the current directory will be used"
      - name: enable
        commands:
          - name: source
            description: "The dotnet nuget enable source command enables an existing source in your NuGet configuration files"
            flags:
              "--configfile=": "The NuGet configuration file (nuget.config) to use. If specified, only the settings from this file will be used. If not specified, the hierarchy of configuration files from the current directory will be used"
      - name: list
        flags:
          "--configfile=": "The NuGet configuration file (nuget.config) to use. If specified, only the settings from this file will be used. If not specified, the hierarchy of configuration files from the current directory will be used"
          "--format=": "The format of the list command output: Detailed (the default) and Short"
        completion:
          flag:
            format: [Detailed, Short]
        commands:
          - name: source
            description: "The dotnet nuget list source command lists all existing sources from your NuGet configuration files"
      - name: remove
        commands:
          - name: source
            description: "The dotnet nuget remove source command removes an existing source from your NuGet configuration files"
            flags:
              "--configFile=": "The NuGet configuration file (nuget.config) to use. If specified, only the settings from this file will be used. If not specified, the hierarchy of configuration files from the current directory will be used"
      - name: update
        commands:
          - name: source
            description: "The dotnet nuget update source command updates an existing source in your NuGet configuration files"
            flags:
              "--configfile=": "The NuGet configuration file (nuget.config) to use. If specified, only the settings from this file will be used. If not specified, the hierarchy of configuration files from the current directory will be used"
              "-n, --name=": "Name of the source"
              "-p, --password=": "Password to be used when connecting to an authenticated source"
              "--store-password-in-clear-text=": "Enables storing portable package source credentials by disabling password encryption"
              "-u, --username=": "Username to be used when connecting to an authenticated source"
              "--valid-authentication-types=": "Comma-separated list of valid authentication types for this source. Set this to basic if the server advertises NTLM or Negotiate and your credentials must be sent using the Basic mechanism, for instance when using a PAT with on-premises Azure DevOps Server. Other valid values include negotiate, kerberos, ntlm, and digest, but these values are unlikely to be useful"
            completion:
              flag:
                valid-authentication-types: [negotiate, kerberos, ntlm, digest]
      - name: verify
        description: "The dotnet nuget verify command verifies a signed NuGet package"
        flags:
          "--all": "Specifies that all verifications possible should be performed on the package(s). By default, only signatures are verified"
          "--certificate-fingerprint=": "Verify that the signer certificate matches with one of the specified SHA256 fingerprints. This option can be supplied multiple times to provide multiple fingerprints"
          "-v, --verbosity=": "Sets the verbosity level of the command. Allowed values are q[uiet], m[inimal], n[ormal], d[etailed], and diag[nostic]. Not supported in every command. See specific command page to determine if this option is available"
        completion:
          flag:
            verbosity: [quiet, minimal, normal, detailed, diagnostic]
      - name: trust
        description: "The dotnet nuget trust command manages the trusted signers. By default, NuGet accepts all authors and repositories. These commands allow you to specify only a specific subset of signers whose signatures will be accepted, while rejecting all others"
        commands:
          - name: list
            description: "Lists all the trusted signers in the configuration. This option will include all the certificates (with fingerprint and fingerprint algorithm) each signer has. If a certificate has a preceding [U], it means that certificate entry has allowUntrustedRoot set as true"
            flags:
              "--configfile=": "The NuGet configuration file (nuget.config) to use. If specified, only the settings from this file will be used. If not specified, the hierarchy of configuration files from the current directory will be used"
              "-v, --verbosity=": "Sets the verbosity level of the command. Allowed values are q[uiet], m[inimal], n[ormal], d[etailed], and diag[nostic]. The default is minimal"
            completion:
              flag:
                verbosity: [quiet, minimal, normal, detailed, diagnostic]
          - name: sync
            description: "Deletes the current list of certificates and replaces them with an up-to-date list from the repository"
            flags:
              "--configfile=": "The NuGet configuration file (nuget.config) to use. If specified, only the settings from this file will be used. If not specified, the hierarchy of configuration files from the current directory will be used"
              "-v, --verbosity=": "Sets the verbosity level of the command. Allowed values are q[uiet], m[inimal], n[ormal], d[etailed], and diag[nostic]. The default is minimal"
            completion:
              flag:
                verbosity: [quiet, minimal, normal, detailed, diagnostic]
          - name: remove
            description: "Removes any trusted signers that match the given name"
            flags:
              "--configfile=": "The NuGet configuration file (nuget.config) to use. If specified, only the settings from this file will be used. If not specified, the hierarchy of configuration files from the current directory will be used"
              "-v, --verbosity=": "Sets the verbosity level of the command. Allowed values are q[uiet], m[inimal], n[ormal], d[etailed], and diag[nostic]. The default is minimal"
            completion:
              flag:
                verbosity: [quiet, minimal, normal, detailed, diagnostic]
          - name: author
            description: "Adds a trusted signer with the given name, based on the author signature of the package"
            flags:
              "--allow-untrusted-root": "Specifies if the certificate for the trusted signer should be allowed to chain to an untrusted root. This is not recommended"
              "--configfile=": "The NuGet configuration file (nuget.config) to use. If specified, only the settings from this file will be used. If not specified, the hierarchy of configuration files from the current directory will be used"
              "-v, --verbosity=": "Sets the verbosity level of the command. Allowed values are q[uiet], m[inimal], n[ormal], d[etailed], and diag[nostic]. The default is minimal"
            completion:
              flag:
                verbosity: [quiet, minimal, normal, detailed, diagnostic]
          - name: repository
            description: "Adds a trusted signer with the given name, based on the repository signature or countersignature of a signed package"
            flags:
              "--allow-untrusted-root": "Specifies if the certificate for the trusted signer should be allowed to chain to an untrusted root. This is not recommended"
              "--owners": "Semicolon-separated list of trusted owners to further restrict the trust of a repository"
              "--configfile=": "The NuGet configuration file (nuget.config) to use. If specified, only the settings from this file will be used. If not specified, the hierarchy of configuration files from the current directory will be used"
              "-v, --verbosity=": "Sets the verbosity level of the command. Allowed values are q[uiet], m[inimal], n[ormal], d[etailed], and diag[nostic]. The default is minimal"
            completion:
              flag:
                verbosity: [quiet, minimal, normal, detailed, diagnostic]
          - name: certificate
            description: "Adds a trusted signer with the given name, based on a certificate fingerprint"
            flags:
              "--algorithm": "Specifies the hash algorithm used to calculate the certificate fingerprint. Defaults to SHA256. Values supported are SHA256, SHA384 and SHA512"
              "--configfile=": "The NuGet configuration file (nuget.config) to use. If specified, only the settings from this file will be used. If not specified, the hierarchy of configuration files from the current directory will be used"
