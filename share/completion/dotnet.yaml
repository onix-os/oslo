          - name: source
            description: "Adds a trusted signer based on a given package source"
            flags:
              "--source-url=": "If a source-url is provided, it must be a v3 package source URL (like https://api.nuget.org/v3/index.json). Other package source types are not supported"
              "--configfile=": "The NuGet configuration file (nuget.config) to use. If specified, only the settings from this file will be used. If not specified, the hierarchy of configuration files from the current directory will be used"
