            completion:
              flag:
                verbosity: [quiet, minimal, normal, detailed, diagnostic]
      - name: sign
        description: "The dotnet nuget sign command signs all the packages matching the first argument with a certificate. The certificate with the private key can be obtained from a file or from a certificate installed in a certificate store by providing a subject name or a SHA-1 fingerprint"
        flags:
          "--certificate-path=": "Specifies the file path to the certificate to be used in signing the package"
          "--certificate-store-name=": "Specifies the name of the X.509 certificate store to use to search for the certificate. Defaults to \"My\", the X.509 certificate store for personal certificates. This option should be used when specifying the certificate via --certificate-subject-name or --certificate-fingerprint options"
          "--certificate-store-location=": "Specifies the name of the X.509 certificate store use to search for the certificate. Defaults to \"CurrentUser\", the X.509 certificate store used by the current user. This option should be used when specifying the certificate via --certificate-subject-name or --certificate-fingerprint options"
          "--certificate-subject-name=": "Specifies the subject name of the certificate used to search a local certificate store for the certificate. The search is a case-insensitive string comparison using the supplied value, which will find all certificates with the subject name containing that string, regardless of other subject values. The certificate store can be specified by --certificate-store-name and --certificate-store-location options"
          "--certificate-fingerprint=": "SHA-1 fingerprint of the certificate used to search a local certificate store for the certificate"
          "--certificate-password=": "Specifies the certificate password, if needed. If a certificate is password protected but no password is provided, the sign command will fail"
          "--hash-algorithm=": "Hash algorithm to be used to sign the package. Defaults to SHA256. Possible values are SHA256, SHA384, and SHA512"
          "-o, --output=": "Specifies the directory where the signed package should be saved. If this option is not specified, by default the original package is overwritten by the signed package"
          "--overwrite": "Indicate that the current signature should be overwritten. By default the command will fail if the package already has a signature"
          "--timestamp-hash-algorithm=": "Hash algorithm to be used by the RFC 3161 timestamp server. Defaults to SHA256"
          "--timestamper=": "URL to an RFC 3161 timestamping server"
          "-v, --verbosity=": "Sets the verbosity level of the command. Allowed values are q[uiet], m[inimal], n[ormal], d[etailed], and diag[nostic]. The default is minimal"
        completion:
          flag:
            hash-algorithm: [SHA256, SHA384, SHA512]
            output: ["$directories"]
            timestamp-hash-algorithm: [SHA256]
            verbosity: [quiet, minimal, normal, detailed, diagnostic]
