# Converted from Fig's tree.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: tree
description: "Display directories as trees (with optional color/HTML output)"
flags:
  "-a": "All files are listed"
  "-d": "List directories only"
  "-l": "Follow symbolic links like directories"
  "-f": "Print the full path prefix for each file"
  "-x": "Stay on current filesystem only"
  "-L=": "Descend only level directories deep"
  "-R": "Rerun tree when max dir level reached"
  "-P=": "List only those files that match the pattern given"
  "-I=": "Do not list files that match the given pattern"
  "--ignore-case": "Ignore case when pattern matching"
  "--matchdirs": "Include directory names in -P pattern matching"
  "--noreport": "Turn off file/directory count at end of tree listing"
  "--charset=": "Use charset X for terminal/HTML and indentation line output"
  "--filelimit=": "Do not descend dirs with more than # files in them"
  "--timefmt=": "Print and format time according to the format <f>"
  "-o=": "Output to file instead of stdout"
  "-q": "Print non-printable characters as '?'"
  "-N": "Print non-printable characters as is"
  "-Q": "Quote filenames with double quotes"
  "-p": "Print the protections for each file"
  "-u": "Displays file owner or UID number"
  "-g": "Displays file group owner or GID number"
  "-s": "Print the size in bytes of each file"
  "-h": "Print the size in a more human readable way"
  "--si": "Like -h but use SI units (powers of 1000) instead"
  "--du": "For each directory report its size as the accumulation of sizes of all its files and sub-directories (and their files, and so on). The total amount of used space is also given in the final report (like the 'du -c' command.) This option requires tree to read the entire directory tree before emitting it, see BUGS AND NOTES below. Implies -s"
  "-D": "Print the date of the last modification time or if -c is used, the last status change time for the file listed"
  "-F": "Appends '/', '=', '*', '@', '|' or '>' as per ls -F"
  "--inodes": "Print inode number of each file"
  "--device": "Print device ID number to which each file belongs"
  "-v": "Sort files alphanumerically by version"
  "-t": "Sort files by last modification time"
  "-c": "Sort files by last status change time"
  "-U": "Leave files unsorted"
  "-r": "Reverse the order of the sort"
  "--dirsfirst": "List directories before files (-U disables)"
  "--sort?": "Select sort"
  "-i": "Don't print indentation lines"
  "-A": "Print ANSI lines graphic indentation lines"
  "-S": "Print with CP437 (console) graphics indentation lines"
  "-n": "Turn colorization off always (-C overrides)"
  "-C": "Turn colorization on always"
  "-X": "Prints out an XML representation of the tree"
  "-J": "Prints out an JSON representation of the tree"
  "-H=": "Prints out HTML format with baseHREF as top directory"
  "-T=": "Replace the default HTML title and H1 header with string"
  "--nolinks": "Turn off hyperlinks in HTML output"
  "--fromfile": "Reads paths from files"
  "--version": "Print version and exit"
  "--help": "Print usage and this help message and exit"
  "--": "Options processing terminator"
completion:
  flag:
    sort: [name, version, size, mtime, ctime]
  positional:
    - ["$directories"]
