# Converted from Fig's vela.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: vela
description: "A Highly Extensible Platform Engine based on Kubernetes and Open Application Model"
flags:
  "--help, -h": "Show help for vela"
commands:
  - name: show
    description: "Show the reference doc for component, trait or workflow types"
    flags:
      "-e, --env=": "Specify environment name for application"
      "--help, -h": "Help for show command"
      "-n, --namespace=": "Specify the Kubernetes namespace to use"
  - name: env
    description: "Manage environments for vela applications to run"
    commands:
      - name: delete
        description: "Delete an environment"
      - name: init
        description: "Delete an environment"
        flags:
          "--namespace=": "Specify K8s namespace for env"
      - name: ls
        aliases: [list]
        description: "List all environments for vela applications to run"
      - name: set
        aliases: [sw]
        description: "Set an environment as the default one for running vela applications"
  - name: init
    description: "Create scaffold for vela application"
    flags:
      "--env, -e=": "Specify environment name for application"
      "--namespace, -n=": "Specify the Kubernetes namespace to use"
      "--render-only": "Rendering vela.yaml in current dir and do not deploy"
  - name: up
    description: "Deploy one application"
    flags:
      "--env, -e=": "The environment name for the CLI request"
      "--file, -f=": "The file path for appfile or application. It could be a remote url"
      "--namespace, -n=": "If present, the namespace scope for this CLI request"
      "--publish-version, -v=": "The publish version for deploying application"
      "--revision, -r=": "The revision to use for deploying the application, if empty, the current application configuration will be used"
    completion:
      flag:
        file: ["$files"]
  - name: cluster
    description: "Manage Kubernetes Clusters for Continuous Delivery"
    commands:
      - name: alias
        description: "Alias a named cluster"
      - name: detach
        description: "Detach managed cluster"
        flags:
          "--kubeconfig-path, -p=": "Specify the kubeconfig path of managed cluster. If you use ocm to manage your cluster, you must set the kubeconfig-path"
        completion:
          flag:
            kubeconfig-path: ["$files"]
      - name: join
        description: "Join managed cluster by kubeconfig"
        flags:
          "--create-namespace=": "Specifies the namespace need to create in managedCluster (default \"vela-system\")"
          "--name, -n=": "Specify the cluster name. If empty, it will use the cluster name in config file. Default to be empty"
      - name: labels
        description: "Manage Kubernetes Cluster Labels"
        commands:
          - name: add
            description: "Add labels to managed cluster"
          - name: del
            description: "Delete labels for managed cluster"
      - name: list
        aliases: [ls]
        description: "List managed clusters"
      - name: probe
        description: "Health probe managed cluster"
      - name: rename
        description: "Rename managed cluster"
  - name: workflow
    description: "Operate the Workflow during Application Delivery"
    commands:
      - name: restart
        description: "Restart an application workflow"
        flags:
          "--env, -e=": "Specify environment name for application"
          "--namespace, -n=": "Specify the Kubernetes namespace to use"
      - name: resume
        description: "Resume a suspend application workflow"
        flags:
          "--env, -e=": "Specify environment name for application"
          "--namespace, -n=": "Specify the Kubernetes namespace to use"
      - name: rollback
        description: "Rollback an application workflow to the latest revision"
        flags:
          "--env, -e=": "Specify environment name for application"
          "--namespace, -n=": "Specify the Kubernetes namespace to use"
      - name: suspend
        description: "Suspend an application workflow"
        flags:
          "--env, -e=": "Specify environment name for application"
          "--namespace, -n=": "Specify the Kubernetes namespace to use"
      - name: terminate
        description: "Terminate an application workflow"
        flags:
          "--env, -e=": "Specify environment name for application"
          "--namespace, -n=": "Specify the Kubernetes namespace to use"
  - name: addon
    description: "Manage addons for extension"
    commands:
      - name: disable
        description: "Disable an addon"
        flags:
          "--force, -f": "Skip checking if applications are still using this addon"
      - name: enable
        description: "Enable an addon"
        flags:
          "--clusters, -c=": "Specify the runtime-clusters to enable"
      - name: list
        description: "List addons"
      - name: registry
        description: "Manage addon registry"
        commands:
          - name: add
            description: "Add an addon registry"
            flags:
              "--bucket=": "Specify the OSS bucket name"
              "--endpoint=": "Specify the addon registry endpoint"
              "--gitToken=": "Specify the github repo token"
              "--path=": "Specify the addon registry OSS path"
              "--type=": "Specify the addon registry type"
          - name: delete
            description: "Delete an addon registry"
          - name: get
            description: "Get an addon registry"
          - name: list
            description: "List addon registries"
          - name: update
            description: "Update an addon registry"
            flags:
              "--bucket=": "Specify the OSS bucket name"
              "--endpoint=": "Specify the addon registry endpoint"
              "--gitToken=": "Specify the github repo token"
              "--path=": "Specify the addon registry OSS path"
              "--type=": "Specify the addon registry type"
      - name: status
        description: "Get addon status"
      - name: upgrade
        description: "Upgrade an addon"
  - name: uischema
    aliases: [ui]
    description: "Manage UI schema for addons"
    commands:
      - name: apply
        description: "Apply UI schema from a file or dir"
  - name: def
    description: "Manage X-Definition for addons"
    commands:
      - name: apply
        description: "Apply X-Definition"
        flags:
          "--dry-run": "Only build definition from CUE into CRB object without applying it to kubernetes clusters"
          "--namespace, -n=": "Specify which namespace to apply. (default \"vela-system\")"
        completion:
          positionalany: ["$files", "$directories"]
      - name: del
        description: "Delete X-Definition"
        flags:
          "--namespace, -n=": "Specify which namespace to apply. (default \"vela-system\")"
          "--type, -t=": "Specify the definition type of target. Valid types: workflow-step, component, trait, policy, workload, scope"
        completion:
          positionalany: ["$files", "$directories"]
      - name: doc-gen
        description: "Generate documentation of definitions (Only Terraform typed definitions are supported)"
        flags:
          "--type, -t=": "Specify the definition type of target. Valid types: workflow-step, component, trait, policy, workload, scope"
      - name: edit
        description: "Edit X-Definition"
        flags:
          "--namespace, -n=": "Specify which namespace to apply. (default \"vela-system\")"
          "--type, -t=": "Specify the definition type of target. Valid types: workflow-step, component, trait, policy, workload, scope"
      - name: get
        description: "Get X-Definition"
        flags:
          "--namespace, -n=": "Specify which namespace to apply. (default \"vela-system\")"
          "--type, -t=": "Specify the definition type of target. Valid types: workflow-step, component, trait, policy, workload, scope"
      - name: init
        description: "Init a new definition"
        flags:
          "--desc, -d=": "Specify the description of the new definition"
          "--interactive, -i": "Specify whether use interactive process to help generate definitions"
          "--git=": "Specify which git repository the configuration(HCL) is stored in. Valid when --provider/-p is set"
          "--local=": "Specify the local path of the configuration(HCL) file. Valid when --provider/-p is set"
          "--output, -o=": "Specify the output path of the generated definition. If empty, the definition will be printed in the console"
          "--path=": "Specify which path the configuration(HCL) is stored in the Git repository. Valid when --git is set"
          "--provider, -p=": "Specify which provider the cloud resource definition belongs to. Only alibaba, `aws`, `azure` are supported"
          "--template-yaml, -f=": "Specify the template yaml file that definition will use to build the schema. If empty, a default template for the given definition type will be used"
          "--type, -t=": "Specify the type of the new definition. Valid types: scope, workflow-step, component, trait, policy, workload"
        completion:
          flag:
            template-yaml: ["$files"]
      - name: list
        description: "List X-Definition"
        flags:
          "--namespace, -n=": "Specify which namespace to apply. (default \"vela-system\")"
          "--type, -t=": "Specify the definition type of target. Valid types: workflow-step, component, trait, policy, workload, scope"
      - name: render
        description: "Render X-Definition"
        flags:
          "--message=": "Specify the header message of the generated YAML file. For example, declaring author information"
          "--output, -o=": "Specify the output path of the rendered definition YAML. If empty, the definition will be printed in the console. If input is a directory, the output path is expected to be a directory as well"
        completion:
          flag:
            output: ["$directories"]
      - name: vet
        description: "Validate X-Definition"
        completion:
          positionalany: ["$files", "$directories"]
  - name: registry
    description: "Manage Registry of X-Definitions for extension"
    commands:
      - name: config
        description: "Configure (add if not exist) a registry, default is local (built-in capabilities)"
        flags:
          "--token, -t=": "Github Repo token"
      - name: ls
        description: "List all configured registry"
      - name: remove
        aliases: [rm]
        description: "Remove specified registry"
  - name: component
    aliases: [comp, components]
    description: "List component types installed and discover more registry"
    flags:
      "--discover=": "Discover more registry"
      "--label=": "A label to filter components, the format is --label type=terraform"
      "--registry=": "Specify the registry name (default \"default\")"
      "--token=": "Specify token when using --url to specify registry url"
      "--url=": "Specify the registry url"
    commands:
      - name: get
        description: "Get component from type"
        flags:
          "--registry=": "Specify the registry name (default \"default\")"
          "--token=": "Specify token when using --url to specify registry url"
          "--url=": "Specify the registry url"
  - name: trait
    aliases: [traits]
    description: "List trait types installed and discover more in registry"
    flags:
      "--discover": "Discover traits in registries"
      "--registry=": "Specify the registry name (default \"default\")"
      "--token=": "Specify token when using --url to specify registry url"
      "--url=": "Specify the registry url"
    commands:
      - name: get
        description: "Get trait from registry"
        flags:
          "--registry=": "Specify the registry name (default \"default\")"
          "--token=": "Specify token when using --url to specify registry url"
          "--url=": "Specify the registry url"
  - name: uninstall
    description: "Uninstalls KubeVela from a Kubernetes cluster"
    flags:
      "--force, -f": "Force uninstall whole vela include all addons"
      "--detail, -d": "Show detail log of uninstall information"
      "--namespace, -n=": "Namespace scope for installing KubeVela Core. (default \"vela-system\")"
  - name: install
    description: "Installs KubeVela into a Kubernetes cluster"
    flags:
      "--file, -f=": "Custom the chart path of KubeVela control plane"
      "--detail, -d": "Show detail log of install information"
      "--namespace, -n=": "Namespace scope for installing KubeVela Core"
      "--reuse, -r=": "Will re-use the user's last supplied values. (default true)"
      "--version, -v=": "Specify the version of KubeVela to install"
    completion:
      flag:
        file: ["$files"]
  - name: completion
    description: "Output shell completion code for the specified shell (bash or zsh). The shell code must be evaluated to provide interactive completion of vela commands"
    commands:
      - name: bash
        description: "Output bash completion code"
      - name: zsh
        description: "Output zsh completion code"
  - name: export
    description: "Export deploy manifests from appfile or application"
    flags:
      "--file, -f=": "Specify the appfile path"
      "--env, -e=": "Specify environment name for application"
      "--namespace, -n=": "Specify the Kubernetes namespace to use"
    completion:
      flag:
        file: ["$files"]
  - name: version
    description: "Prints the version"
    commands:
      - name: list
        description: "List all available versions"
