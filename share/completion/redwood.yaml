# Converted from Fig's redwood.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: redwood
description: "Redwood provides a first-class CLI that helps you at every stage of development, from your first commit to your first deploy"
flags:
  "--help, -h": "Show help for redwood"
commands:
  - name: dev
    description: "Start development servers for api and web"
    flags:
      "--forward, --fwd=": "String of one or more Webpack Dev Server config options"
    completion:
      positional:
        - ["api\tBuild the api server", "web\tBuild the web server"]
  - name: deploy
    description: "Deploy your redwood project to a hosting provider target"
    commands:
      - name: aws
        description: "Deploy to AWS using the selected provider"
        flags:
          "--side=": "Show help for command"
        completion:
          flag:
            side: ["api\tDeploy the api server", "web\tDeploy the web server"]
          positional:
            - [serverless]
      - name: netlify
        description: "Build command for Netlify deploy"
        flags:
          "--build": "Build for production [default: \"true\"]"
          "--prisma": "Apply database migrations [default: \"true\"]"
          "--data-migrate, --dm": "Migrate the data in your database [default: \"true\"]"
      - name: render
        description: "Build (web) and Start (api) command for Render deploy"
        flags:
          "--serve": "Run server for api in production [default: \"true\"]"
          "--prisma": "Apply database migrations [default: \"true\"]"
          "--data-migrate, --dm": "Migrate the data in your database [default: \"true\"]"
        completion:
          positional:
            - [api, web]
      - name: vercel
        description: "Build command for Vercel deploy"
        flags:
          "--build": "Build for production [default: \"true\"]"
          "--prisma": "Apply database migrations [default: \"true\"]"
          "--data-migrate, --dm": "Migrate the data in your database [default: \"true\"]"
  - name: destroy
    aliases: [d]
    description: "Rollback changes made by the generate command"
    commands:
      - name: cell
        description: "Destroy a cell component"
      - name: component
        description: "Destroy a component"
      - name: function
        description: "Destroy a Function"
      - name: layout
        description: "Destroy a layout component"
      - name: page
        description: "Destroy a page and route component"
      - name: scaffold
        description: "Destroy pages, SDL, and Services files based on a given DB schema Model"
      - name: sdl
        description: "Destroy a GraphQL schema and service component based on a given DB schema Model"
      - name: service
        description: "Destroy a service component"
  - name: generate
    aliases: [g]
    description: "Save time by generating boilerplate code"
    commands:
      - name: cell
        description: "Generate a cell component"
        flags:
          "--force, -f": "Overwrite existing files"
          "--typescript, --ts": "Generate TypeScript files Enabled by default if we detect your project is TypeScript"
          "--list": "Use this flag to generate a list cell. This flag is needed when dealing with irregular words whose plural and singular is identical such as equipment or pokemon"
          "--tests": "Generate test files [default: true]"
          "--stories": "Generate Storybook files [default: true]"
      - name: component
        description: "Generate a component component"
        flags:
          "--force, -f": "Overwrite existing files"
          "--typescript, --ts": "Generate TypeScript files Enabled by default if we detect your project is TypeScript"
          "--tests": "Generate test files [default: true]"
          "--stories": "Generate Storybook files [default: true]"
      - name: dataMigration
        description: "Generate a data migration component"
      - name: directive
        description: "Generate a directive"
        flags:
          "--force, -f": "Overwrite existing files"
          "--typescript, --ts": "Generate TypeScript files Enabled by default if we detect your project is TypeScript"
          "--type": "Directive type [Choices: \"validator\", \"transformer\"]"
      - name: function
        description: "Generate a Function"
        flags:
          "--force, -f": "Overwrite existing files"
          "--typescript, --ts": "Generate TypeScript files Enabled by default if we detect your project is TypeScript"
      - name: layout
        description: "Generate a layout component"
        flags:
          "--force, -f": "Overwrite existing files"
          "--typescript, --ts": "Generate TypeScript files Enabled by default if we detect your project is TypeScript"
          "--tests": "Generate test files [default: true]"
          "--stories": "Generate Storybook files [default: true]"
          "--skipLink": "Generate a layout with a skip link [default: false]"
      - name: page
        description: "Generate a page component"
        flags:
          "--force, -f": "Overwrite existing files"
          "--typescript, --ts": "Generate TypeScript files Enabled by default if we detect your project is TypeScript"
          "--tests": "Generate test files [default: true]"
          "--stories": "Generate Storybook files [default: true]"
      - name: scaffold
        description: "Generate Pages, SDL, and Services files based on a given DB schema Model. Also accepts <path/model>"
        flags:
          "--force, -f": "Overwrite existing files"
          "--typescript, --ts": "Generate TypeScript files Enabled by default if we detect your project is TypeScript"
      - name: sdl
        description: "Generate a GraphQL schema and service object"
        flags:
          "--force, -f": "Overwrite existing files"
          "--typescript, --ts": "Generate TypeScript files Enabled by default if we detect your project is TypeScript"
          "--crud": "Also generate mutations"
      - name: service
        description: "Generate a service component"
        flags:
          "--force, -f": "Overwrite existing files"
          "--typescript, --ts": "Generate TypeScript files Enabled by default if we detect your project is TypeScript"
          "--tests": "Generate test files [default: true]"
          "--stories": "Generate Storybook files [default: true]"
      - name: types
        description: "Generate types and supplementary code"
      - name: script
        description: "Generate a script that can use your services/libs to execute with redwood exec script <name>"
        flags:
          "--typescript, --ts": "Generate TypeScript files Enabled by default if we detect your project is TypeScript"
  - name: exec
    description: "Execute scripts generated by yarn redwood generate script to run one-off operations, long-running jobs, or utility scripts"
  - name: build
    description: "Build the api and web"
    flags:
      "--stats": "Use Webpack Bundle Analyzer to visualize the size of Webpack output files via an interactive zoomable treemap"
      "--verbose, -v": "Print more information while building"
    completion:
      positional:
        - ["api\tBuild the api server", "web\tBuild the web server"]
  - name: diagnostics
    aliases: [check]
    description: "Get structural diagnostics for a Redwood project (experimental)"
  - name: console
    aliases: [c]
    description: "Launch an interactive Redwood shell (experimental)"
  - name: info
    description: "Print your system environment information"
  - name: upgrade
    description: "Upgrade all @redwoodjs packages via an interactive CLI"
    flags:
      "--dry-run, -d": "Check for outdated packages without upgrading"
      "--tag, -t=": "Choices are \"canary\", \"rc\", or a specific version (e.g. \"0.19.3\"). WARNING: Unstable releases in the case of \"canary\" and \"rc\", which will force upgrade packages to the most recent release of the specified tag"
      "--pr": "Installs packages for the given PR"
    completion:
      flag:
        tag: ["canary\tUpgrade to the latest canary release", "rc\tUpgrade to the latest RC release"]
  - name: serve
    description: "Runs a server that serves both the api and the web sides"
    flags:
      "--port=": "What port should the server run on [default: 8911]"
      "--socket=": "The socket the server should run. This takes precedence over port"
      "--apiRootPath=": "The root path where your api functions are served"
      "--apiHost=": "Forwards requests from the apiProxyPath (defined in redwood.toml) to the specified host"
    completion:
      flag:
        apiRootPath: ["$directories"]
      positional:
        - ["api\tCheck the api server", "web\tCheck the web server"]
  - name: type-check
    aliases: [tsc, tc]
    description: "Runs a TypeScript compiler check on both the api and the web sides"
    completion:
      positional:
        - ["api\tCheck the api server", "web\tCheck the web server"]
  - name: test
    description: "Run Jest tests for api and web"
    flags:
      "--help": "Show help"
      "--version": "Show version number"
      "--watch": "Run tests related to changed files based on hg/git (uncommitted files). Specify the name or path to a file to focus on a specific set of tests [default: true]"
      "--watchAll": "Run all tests"
      "--collectCoverage": "Show test coverage summary and output info to coverage directory in project root. See this directory for an .html coverage report"
      "--clearCache": "Delete the Jest cache directory and exit without running tests"
      "--db-push": "Syncs the test database with your Prisma schema without requiring a migration. It creates a test database if it doesn't already exist [default: true]. This flag is ignored if your project doesn't have an api side"
    completion:
      positional:
        - [api, web]
  - name: storybook
    description: "Starts Storybook locally"
    flags:
      "--open": "Open Storybook in your browser on start"
      "--build": "Build Storybook"
      "--port=": "Which port to run Storybook on (defaults to 7910)"
  - name: lint
    description: "Lint your files"
    flags:
      "--fix": "Try to fix linting errors"
  - name: open
    description: "Open your project in your browser"
  - name: setup
    description: "Initialize project config and install packages"
    commands:
      - name: auth
        description: "Setup auth configuration for a provider"
        flags:
          "--force, -f": "Overwrite existing files"
        completion:
          positional:
            - [auth0, firebase, goTrue, magicLink, netlify]
      - name: custom-web-index
        description: "Setup an index.js file in web/src so you can customize how your Redwood App mounts to the DOM"
        flags:
          "--force, -f": "Overwrite existing files"
      - name: generator
        description: "SCopies a given generator's template files to your local app for customization. The next time you generate that type again, it will use your custom template instead of Redwood's default"
        flags:
          "--force, -f": "Overwrite existing copied template files"
      - name: tsconfig
        description: "Setup tsconfig.json on both web and api sides"
        flags:
          "--force, -f": "Overwrite existing files"
      - name: deploy
        description: "Setup auth configuration for a provider"
        flags:
          "--database, -d?": "Database deployment for Render only [default: \"postgresql\"]"
          "--force, -f": "Overwrite existing files"
        completion:
          flag:
            database: [none, postgresql, sqlite]
          positional:
            - [aws-serverless, netlify, render, vercel]
  - name: data-migrate
    aliases: [dm, dataMigrate]
    description: "Data migration tools"
    completion:
      positional:
        - ["install\tAppends DataMigration model to schema.prisma, creates api/db/dataMigrations directory", "up\tExecutes outstanding data migrations"]
  - name: prisma
    description: "Prisma commands"
    commands:
      - name: init
        description: "Setup Prisma for your app"
        flags:
          "-h, --help": "Display this help message"
          "--datasource-provider=": "Define the datasource provider to use"
          "--url=": "Define a custom datasource url"
        completion:
          flag:
            datasource-provider: [PostgreSQL, MySQL, SQLite, SQLServer, MongoDB, CockroachDB]
            url: ["$files"]
      - name: generate
        description: "Generate artifacts (e.g. Prisma Client)"
        flags:
          "-h, --help": "Display this help message"
          "--schema=": "Custom path to your Prisma schema"
          "--data-proxy": "Enable the Data Proxy in the Prisma Client"
          "--no-hints": "Hides the hint messages but still outputs errors and warnings"
          "--no-engine": "Generate a client for use with Accelerate only"
          "--watch": "Watch the Prisma schema and rerun after a change"
          "--allow-no-models": "Allow generating a client without models"
        completion:
          flag:
            schema: ["$files"]
      - name: studio
        description: "Open Prisma Studio"
        flags:
          "-h, --help": "Display this help message"
          "--schema=": "Custom path to your Prisma schema"
          "-p, --port=": "Port to start Studio on"
          "-b, --browser=": "Browser to open Studio in"
          "-n, --hostname=": "Hostname to bind the Express server to"
        completion:
          flag:
            schema: ["$files"]
            browser: [firefox, chrome, safari, none]
      - name: format
        description: "Format your schema"
        flags:
          "-h, --help": "Display this help message"
          "--schema=": "Custom path to your Prisma schema"
        completion:
          flag:
            schema: ["$files"]
      - name: migrate
        description: "Migrate your database"
        commands:
          - name: dev
            description: "The migrate dev command updates your database using migrations files during development"
            flags:
              "-h, --help": "Display this help message"
              "--schema=": "Custom path to your Prisma schema"
              "--skip-seed": "Skip triggering seed"
              "--skip-generate": "Skip triggering generators (e.g. Prisma Client)"
              "--create-only": "Create a new migration but do not apply it. The migration will be empty if there are no changes in Prisma schema"
              "-n, --name?": "The name of the migration. If no name is provided, the CLI will prompt you"
            completion:
              flag:
                schema: ["$files"]
          - name: reset
            description: "Reset your database and apply all migrations, all data will be lost"
            flags:
              "-h, --help": "Display this help message"
              "--schema=": "Custom path to your Prisma schema"
              "--skip-seed": "Skip triggering seed"
              "--skip-generate": "Skip triggering generators (e.g. Prisma Client)"
              "-f, --force": "Skip the confirmation prompt"
            completion:
              flag:
                schema: ["$files"]
          - name: deploy
            description: "Apply pending migrations to update the database schema in production/staging"
            flags:
              "-h, --help": "Display this help message"
              "--schema=": "Custom path to your Prisma schema"
            completion:
              flag:
                schema: ["$files"]
          - name: resolve
            description: "Resolve issues with database migrations in deployment databases"
            flags:
              "-h, --help": "Display this help message"
              "--schema=": "Custom path to your Prisma schema"
              "--applied=": "Record a specific migration as applied"
              "--rolled-back=": "Record a specific migration as rolled back"
            completion:
              flag:
                schema: ["$files"]
                applied: ["$files"]
                rolled-back: ["$files"]
          - name: status
            description: "Check the status of your database migrations"
            flags:
              "-h, --help": "Display this help message"
              "--schema=": "Custom path to your Prisma schema"
            completion:
              flag:
                schema: ["$files"]
          - name: diff
            description: "Compares the database schema from two arbitrary sources, and outputs the differences either as a human-readable summary (by default) or an executable script"
            flags:
              "-h, --help": "Display this help message"
              "--from-url=": "A datasource url"
              "--to-url=": "A datasource url"
              "--from-empty": "Flag to assume from is an empty datamodel"
              "--to-empty": "Flag to assume to is an empty datamodel"
              "--from-schema-datamodel=": "Path to a Prisma schema file, uses the 'datamodel' for the diff"
              "--to-schema-datamodel=": "Path to a Prisma schema file, uses the 'datamodel' for the diff"
              "--from-schema-datasource=": "Path to a Prisma schema file, uses the 'datasource url' for the diff"
              "--to-schema-datasource=": "Path to a Prisma schema file, uses the 'datasource url' for the diff"
              "--from-migrations=": "Path to the Prisma Migrate migrations directory"
              "--to-migrations=": "Path to the Prisma Migrate migrations directory"
              "--shadow-database-url=": "URL for the shadow database. Only required if using --from-migrations or --to-migrations"
              "--script=": "Render a SQL script to stdout instead of the default human readable summary (not supported on MongoDB)"
              "--exit-code": "Change the exit code behavior to signal if the diff is empty or not (Empty: 0, Error: 1, Not empty: 2). Default behavior is Success: 0, Error: 1.`"
            completion:
              flag:
                from-url: ["$files"]
                to-url: ["$files"]
                from-schema-datamodel: ["$files"]
                to-schema-datamodel: ["$files"]
                from-schema-datasource: ["$files"]
                to-schema-datasource: ["$files"]
                from-migrations: ["$directories"]
                to-migrations: ["$directories"]
                shadow-database-url: ["$files"]
                script: ["$files"]
      - name: db
        description: "Manage your database schema and lifecycle (Preview)"
        commands:
          - name: pull
            flags:
              "-h, --help": "Display this help message"
              "--schema=": "Custom path to your Prisma schema"
              "--force": "Ignore current Prisma schema file"
              "--print": "Print the introspected Prisma schema to stdout"
              "--url=": "The datasource url"
              "--composite-type-depth=": "Specify the depth for introspecting composite types (e.g. Embedded Documents in MongoDB). Number, default is -1 for infinite depth, 0 = off"
            completion:
              flag:
                schema: ["$files"]
                url: ["$files"]
          - name: push
            description: "This command pushes the state of your Prisma schema file to the database without using migrations files"
            flags:
              "-h, --help": "Display this help message"
              "--schema=": "Custom path to your Prisma schema"
              "--skip-generate": "Skip generation of artifacts such as Prisma Client"
              "--force-reset": "Resets the database and then updates the schema - useful if you need to start from scratch due to unexecutable migrations"
              "--accept-data-loss": "Ignore data loss warnings. This option is required if as a result of making the schema changes, data may be lost"
            completion:
              flag:
                schema: ["$files"]
          - name: seed
            description: "Seed your database"
            flags:
              "-h, --help": "Display this help message"
              "--schema=": "Custom path to your Prisma schema"
            completion:
              flag:
                schema: ["$files"]
          - name: execute
            description: "Execute native commands to your database"
            flags:
              "-h, --help": "Display this help message"
              "--schema=": "Custom path to your Prisma schema"
              "--url=": "The datasource url"
              "--file=": "Path to a file. The content will be sent as the script to be executed"
              "--stdin": "Use the terminal standard input as the script to be executed"
            completion:
              flag:
                schema: ["$files"]
                url: ["$files"]
                file: ["$files"]
      - name: version
        aliases: ["-v"]
        description: "Print current version of Prisma components"
        commands:
          - name: "--json"
            description: "Output JSON"
