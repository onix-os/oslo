# Converted from Fig's pijul.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: pijul
description: "A distributed version control system that is at the same time theoretically sound, fast and easy to learn and use"
commands:
  - name: add
    description: "Adds a path to the tree"
    flags:
      "-f, --force": ""
      "-h, --help": "Print help information"
      "-r, --recursive": ""
  - name: apply
    description: "Applies changes to a channel"
    flags:
      "--channel=": "Apply change to this channel"
      "--deps-only": "Only apply the dependencies of the change, not the change itself. Only applicable for a single change"
      "-h, --help": "Print help information"
      "--repository=": "Set the repository where this command should run. Defaults to the first ancestor of the current directory that contains a .pijul directory"
  - name: archive
    description: "Creates an archive of the repository"
    flags:
      "--change=": "Apply these changes after switching to the channel"
      "--channel=": "Use this channel, instead of the current channel"
      "-h, --help": "Print help information"
      "-k": "Do not check certificates (HTTPS remotes only, this option might be dangerous)"
      "-o=": "Name of the output file"
      "--prefix=": "Append this path in front of each path inside the archive"
      "--remote=": "Ask the remote to send an archive"
      "--repository=": "Set the repository where this command should run. Defaults to the first ancestor of the current directory that contains a .pijul directory"
      "--state=": "Archive in this state"
      "--umask=": "Append this path in front of each path inside the archive"
  - name: change
    description: "Shows information about a particular change"
    flags:
      "-h, --help": "Print help information"
      "--repository=": "Use the repository at PATH instead of the current directory"
  - name: channel
    description: "Manages different channels"
    flags:
      "-h, --help": "Print help information"
      "--repository=": "Set the repository where this command should run. Defaults to the first ancestor of the current directory that contains a .pijul directory"
    commands:
      - name: delete
        description: "Delete a channel. The channel must not be the current channel"
        flags:
          "-h, --help": "Print help information"
      - name: help
        description: "Print this message or the help of the given subcommand(s)"
      - name: new
        description: "Create a new, empty channel"
      - name: rename
        description: "Rename a channel"
        flags:
          "-h, --help": "Print help information"
      - name: switch
        description: "Switch to a channel. There must not be unrecorded changes in the working copy"
  - name: clone
    description: "Clones an existing pijul repository"
    flags:
      "--change=": "Clone this change and its dependencies"
      "--channel=": "Set the remote channel [default: main]"
      "-h, --help": "Print help information"
      "-k": "Do not check certificates (HTTPS remotes only, this option might be dangerous)"
      "--path=": "Clone this path only"
      "--state=": "Clone this state"
  - name: credit
    description: "Shows which change last affected each line of the given file(s)"
    flags:
      "--channel=": "Use this channel instead of the current channel"
      "-h, --help": "Print help information"
      "--repository=": "Set the repository where this command should run. Defaults to the first ancestor of the current directory that contains a .pijul directory"
  - name: diff
    description: "Shows difference between two channels/changes"
    flags:
      "--channel=": "Compare with this channel"
      "-h, --help": "Print help information"
      "--json": "Output the diff in JSON format instead of the default change text format"
      "--repository=": "Set the repository where this command should run. Defaults to the first ancestor of the current directory that contains a .pijul directory"
      "-s, --short": "Show a short version of the diff"
      "--tag": "Add all the changes of this channel as dependencies (except changes implied transitively), instead of the minimal dependencies"
      "-u, --untracked": "Include the untracked files"
  - name: fork
    description: "Create a new channel"
    flags:
      "--change=": "Apply this change after creating the channel"
      "--channel=": "Make the new channel from this channel instead of the current channel"
      "-h, --help": "Print help information"
      "--repository=": "Set the repository where this command should run. Defaults to the first ancestor of the current directory that contains a .pijul directory"
  - name: init
    description: "Initializes an empty pijul repository"
    flags:
      "--channel=": "Set the name of the current channel (defaults to “main”)"
      "-h, --help": "Print help information"
      "-k, --kind=": "Project kind; if Pijul knows about your project kind, the .ignore file will be populated with a conservative list of commonly ignored entries. Example: pijul init --kind=rust"
  - name: log
    description: "Show the entire log of changes"
    flags:
      "--channel=": "Show logs for this channel instead of the current channel"
      "--description": "Include full change description in the output"
      "-h, --help": "Print help information"
      "--hash-only": "Only show the change hashes"
      "--limit=": "Output at most this many changes"
      "--offset=": "Start after this many changes"
      "--output-format=": ""
      "--repository=": "Set the repository where this command should run. Defaults to the first ancestor of the current directory that contains a .pijul directory"
      "--state": "Include state identifiers in the output"
  - name: ls
  - name: mv
  - name: pull
    description: "Pulls changes from a remote upstream"
    flags:
      "-a, --all": "Pull all changes"
      "-f, --force-cache": "Force an update of the local remote cache. May effect some reporting of unrecords/concurrent changes in the remote"
      "--from-channel=": "Pull from this remote channel"
      "--full": "Download full changes, even when not necessary"
      "-h, --help": "Print help information"
      "-k": "Do not check certificates (HTTPS remotes only, this option might be dangerous)"
      "--path=": "Only pull to these paths"
      "--repository=": "Set the repository where this command should run. Defaults to the first ancestor of the current directory that contains a .pijul directory"
      "--to-channel=": "Pull into this channel instead of the current channel"
  - name: push
    description: "Pushes changes to a remote upstream"
    flags:
      "-a, --all": "Push all changes"
      "-f, --force-cache": "Force an update of the local remote cache. May effect some reporting of unrecords/concurrent changes in the remote"
      "--from-channel=": "Push from this channel instead of the default channel"
      "-h, --help": "Print help information"
      "-k": "Do not check certificates (HTTPS remotes only, this option might be dangerous)"
      "--path=": "Push changes only relating to these paths"
      "--repository=": "Path to the repository. Uses the current repository if the argument is omitted"
      "--to-channel=": "Push to this remote channel instead of the remote’s default channel"
  - name: record
    description: "Creates a new change"
    flags:
      "-a, --all": "Record all paths that have changed"
      "--amend=": "Amend this change instead of creating a new change"
      "--author=": "Set the author field"
      "--channel=": "Record the change in this channel instead of the current channel"
      "-h, --help": "Print help information"
      "--ignore-missing": "Ignore missing (deleted) files"
      "-m, --message=": "Set the change message"
      "--repository=": "Set the repository where this command should run. Defaults to the first ancestor of the current directory that contains a .pijul directory"
      "--timestamp=": "Set the timestamp field"
      "--working-copy=": ""
  - name: remote
    description: "Manages remote repositories"
    flags:
      "-h, --help": "Print help information"
      "--repository=": "Set the repository where this command should run. Defaults to the first ancestor of the current directory that contains a .pijul directory"
    commands:
      - name: delete
        description: "Deletes the remote"
        flags:
          "-h, --help": "Print help information"
      - name: help
        description: "Print this message or the help of the given subcommand(s)"
  - name: remove
    description: "Removes a file from the tree of tracked files (pijul record will then record this as a deletion)"
    flags:
      "-h, --help": "Print help information"
  - name: reset
    description: "Resets the working copy to the last recorded change. In other words, discards all unrecorded changes"
    flags:
      "--channel=": "Reset the working copy to this channel, and change the current channel to this channel"
      "--dry-run": "Print this file to the standard output, without modifying the repository (works for a single file only)"
      "-f, --force": "Reset even if there are unrecorded changes"
      "-h, --help": "Print help information"
      "--repository=": "Set the repository where this command should run. Defaults to the first ancestor of the current directory that contains a .pijul directory"
  - name: unrecord
    description: "Unrecords a list of changes"
    flags:
      "--channel=": "Unrecord changes from this channel instead of the current channel"
      "-h, --help": "Print help information"
      "--repository=": "Set the repository where this command should run. Defaults to the first ancestor of the current directory that contains a .pijul directory"
      "--reset": "Also undo the changes in the working copy (preserving unrecorded changes if there are any)"
      "--show-changes=": "Show N changes in a text editor if no s were given. Defaults to the value of unrecord_changes in your global configuration"
