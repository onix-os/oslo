            - ["$files"]
      - name: "--timeout"
        description: "Timeout (default: 5m0s) [$TRIVY_TIMEOUT]"
      - name: "--ignore-policy"
        description: "Specify the Rego file to evaluate each vulnerability [$TRIVY_IGNORE_POLICY]"
        completion:
