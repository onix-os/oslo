            - [table, json, sarif, template]
      - name: "--severity"
        aliases: ["-s"]
        description: "Severities of vulnerabilities to be displayed (comma separated) (default: \"UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL\") [$TRIVY_SEVERITY]"
