completion:
  flag:
    help: [syntax, theme, plugin, config]
    list-scripts: [langs, themes, plugins]
    out-format: [html, xhtml, latex, tex, rtf, odt, ansi, xterm256, truecolor, bbcode, pango, svg]
    reformat: [allman, gnu, google, horstmann, java, kr, linux, lisp, mozilla, otbs, pico, vtk, ratliff, stroustrup, webkit, whitesmith]
    kw-case: [upper, lower, capitalize]
    page-size: [a3, a4, a5, b4, b5, b6, letter]
