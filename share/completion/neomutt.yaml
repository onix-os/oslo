# Converted from argc's neomutt.sh by tools/argc-to-spec. Do not edit by hand.
name: neomutt
flags:
  "-A=": "Print an expanded version of the given alias to stdout and exit"
  "-a=": "Attach one or more files to a message (must be the last option) Add any addresses after the '--' argument"
  "-B": "Run in batch mode (do not start the ncurses UI)"
  "-b=": "Specify a blind carbon copy (Bcc) recipient"
  "-c=": "Specify a carbon copy (Cc) recipient"
  "-C": "Enable Command-line Crypto (signing/encryption)"
  "-D": "Dump all config variables as 'name=value' pairs to stdout"
  "-O": "Like -D, but show one-liner documentation"
  "-S": "Like -D, but hide the value of sensitive variables"
  "-d=": "Log debugging output to a file (default is \"~/.neomuttdebug0\") The level can range from 1-5 and affects verbosity"
  "-E": "Edit draft (-H) or include (-i) file during message composition"
  "-e=": "Specify a command to be run after reading the config files"
  "-F=": "Specify an alternative initialization file to read"
  "-f=": "Specify a mailbox (as defined with 'mailboxes' command) to load"
  "-G": "Start NeoMutt with a listing of subscribed newsgroups"
  "-g=": "Like -G, but start at specified news server"
  "-H=": "Specify a draft file with header and body for message composing"
  "-h": "Print this help message and exit"
  "-i=": "Specify an include file to be embedded in the body of a message"
  "-l=": "Specify a file for debugging output (default \"~/.neomuttdebug0\")"
  "-m=": "Specify a default mailbox format type for newly created folders The type is either MH, MMDF, Maildir or mbox (case-insensitive)"
  "-n": "Do not read the system-wide configuration file"
  "-p": "Resume a prior postponed message, if any"
  "-Q=": "Query a configuration variable and print its value to stdout (after the config has been read and any commands executed) Add -O for one-liner documentation"
  "-R": "Open mailbox in read-only mode"
  "-s=": "Specify a subject (must be enclosed in quotes if it has spaces)"
  "-v": "Print the NeoMutt version and compile-time definitions and exit"
  "-vv": "Print the NeoMutt license and copyright information and exit"
  "-y": "Start NeoMutt with a listing of all defined mailboxes"
  "-Z": "Open the first mailbox with new message or exit immediately with exit code 1 if none is found in all defined mailboxes"
  "-z": "Open the first or specified (-f) mailbox if it holds any message or exit immediately with exit code 1 otherwise"
  "-help": "Print help"
  "-V, -version": "Print version"
completion:
  flag:
    d: [1, 2, 3, 4, 5]
    m: [MH, MMDF, Maildir, mbox]
