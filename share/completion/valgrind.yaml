  "--unw-stack-scan-frames=": "Max number of frames that can be recovered by stack scanning [5]"
  "--resync-filter=": "attempt to avoid expensive address-space-resync operations"
  "--max-threads=": "maximum number of threads that valgrind can handle [500]"
  "--leak-check=": "search for memory leaks at exit? [summary]"
  "--leak-resolution=": "differentiation of leak stack traces [high]"
  "--show-leak-kinds=*": {description: "which leak kinds to show? [definite,possible]", nargs: -1}
  "--errors-for-leak-kinds=*": {description: "which leak kinds are errors? [definite,possible] where kind is one of: definite indirect possible reachable all none", nargs: -1}
  "--leak-check-heuristics=*": {description: "which heuristics to use for improving leak search false positive [all] where heur is one of:", nargs: -1}
  "--show-reachable=": "same as --show-leak-kinds=definite"
  "--show-possibly-lost=": "same as --show-leak-kinds=definite"
  "--xtree-leak=": "output leak result in xtree format? [no]"
  "--xtree-leak-file=": "xtree leak report file [xtleak.kcg.%p]"
  "--undef-value-errors=": "check for undefined value errors [yes]"
  "--track-origins=": "show origins of undefined values? [no]"
  "--partial-loads-ok=": "too hard to explain here; see manual [yes]"
  "--expensive-definedness-checks=": "Use extra-precise definedness tracking [auto]"
  "--freelist-vol=": "volume of freed blocks queue [20000000]"
  "--freelist-big-blocks=": "releases first blocks with size>= [1000000]"
  "--workaround-gcc296-bugs=": "self explanatory [no]."
  "--ignore-ranges=": "assume given addresses are OK"
  "--ignore-range-below-sp=": "do not report errors for accesses at the given offsets below SP"
  "--malloc-fill=": "fill malloc'd areas with given value"
  "--free-fill=": "fill free'd areas with given value"
  "--keep-stacktraces=": "stack trace(s) to keep for malloc'd/free'd areas [alloc-and-free]"
  "--show-mismatched-frees=": "show frees that don't match the allocator? [yes]"
  "--show-realloc-size-zero=": "show realocs with a size of zero? [yes]"
  "--cachegrind-out-file=": "output file name [cachegrind.out.%p]"
  "--cache-sim=": "collect cache stats? [no]"
  "--branch-sim=": "collect branch prediction stats? [no]"
  "--instr-at-start=": "instrument at start? [yes]"
  "--I1=": "set I1 cache manually"
  "--D1=": "set D1 cache manually"
  "--LL=": "set LL cache manually"
  "--free-is-write=": "treat heap frees as writes [no]"
  "--track-lockorders=": "show lock ordering errors? [yes]"
  "--history-level=": ""
  "--history-backtrace-size=": "record <number> callers for full history level [8]"
  "--delta-stacktrace=": "no : always compute a full history stacktrace from unwind info yes : derive a stacktrace from the previous stacktrace"
  "--conflict-cache-size=": "size of 'full' history cache [2000000]"
  "--check-stack-refs=": "race-check reads and writes on the main stack and thread stacks? [yes]"
  "--ignore-thread-creation=": "Ignore activities during thread creation [no]"
  "--heap=": "profile heap blocks [yes]"
  "--heap-admin=": "average admin bytes per heap block; ignored if --heap=no [8]"
  "--stacks=": "profile stack(s) [no]"
  "--pages-as-heap=": "profile memory at the page level [no]"
  "--depth=": "depth of contexts [30]"
  "--alloc-fn=": "specify <name> as an alloc function [empty]"
  "--ignore-fn=": "ignore heap allocations within <name> [empty]"
  "--threshold=": "significance threshold, as a percentage [1.0]"
  "--peak-inaccuracy=": "maximum peak inaccuracy, as a percentage [1.0]"
  "--time-unit=": "time unit: instructions executed, milliseconds or heap bytes alloc'd/dealloc'd [i]"
  "--detailed-freq=": "every Nth snapshot should be detailed [10]"
