  "--extra-debuginfo-path=": "absolute path to search for additional debug symbols, in addition to existing default well known search paths."
  "--debuginfo-server=": "also query this server (valgrind-di-server) for debug symbols"
  "--allow-mismatched-debuginfo=": "[no] for the above two flags only, accept debuginfo objects that don't \"match\" the main object"
  "--smc-check=": "checks for self-modifying code: none, only for code found in stacks, for all code, or for all code except that from file-backed mappings"
  "--read-inline-info=": "read debug info about inlined function calls and use it to do better stack traces."
  "--read-var-info=": "read debug info on stack and global variables and use it to print better error messages in tools that make use of it [no]"
