  "--vgdb-shadow-registers=": "let gdb see the shadow registers [no]"
  "--vgdb-prefix=": "prefix for vgdb FIFOs [/tmp/vgdb-pipe]"
  "--run-libc-freeres=": "free up glibc memory at exit on Linux? [yes]"
