name: pandoc
description: "A universal document converter"
flags:
  "-f, -r, --from, --read=": "Specify input format"
  "-t, -w, --to, --write=": "Specify output format"
  "-o, --output=": "Write output to FILE instead of stdout"
  "--data-dir=": "Specify the user data directory to search for pandoc data files"
  "-d, --defaults=": "Specify a set of default option settings"
  "--bash-completion": "Generate a bash completion script"
  "--verbose": "Give verbose debugging output"
  "--quiet": "Suppress warning messages"
  "--fail-if-warnings": "Exit with error status if there are any warnings"
  "--log=": "Write log messages in machine-readable JSON format to FILE"
  "--list-input-formats": "List supported input formats, one per line"
  "--list-output-formats": "List supported output formats, one per line"
  "--list-extensions?": "List supported extensions for FORMAT, one per line, preceded by a + or - indicating whether it is enabled by default in FORMAT"
  "--list-highlight-languages": "List supported languages for syntax highlighting, one per line"
  "--list-highlight-styles": "List supported styles for syntax highlighting, one per line"
  "-v, --version": "Print version"
  "-h, --help": "Show usage message"
  "--shift-heading-level-by=": "Shift heading levels by a positive or negative integer"
  "--indented-code-classes=": "Specify classes to use for indented code blocks–for example, perl,numberLines or haskell. Multiple classes may be separated by spaces or commas"
  "--default-image-extension=": "Specify a default extension to use when image paths/URLs have no extension. This allows you to use the same source for formats that require different kinds of images. Currently this option only affects the Markdown and LaTeX readers"
  "--file-scope": "Parse each file individually before combining for multifile documents. This will allow footnotes in different files with the same identifiers to work as expected"
  "-F, --filter=": "Specify an executable to be used as a filter transforming the pandoc AST after the input is parsed and before the output is written"
  "-L, --lua-filter=": "Transform the document in a similar fashion as JSON filters, but use pandoc’s built-in Lua filtering system"
  "-M, --metadata=": "Set the metadata field KEY to the value VAL"
  "--metadata-file=": "Read metadata from the supplied YAML (or JSON) file"
  "-p, --preserve-tabs": "Preserve tabs instead of converting them to spaces"
  "--tab-stop=": "Specify the number of spaces per tab"
  "--track-changes=": "Specifies what to do with insertions, deletions, and comments produced by the MS Word `Track Changes` feature"
  "--extract-media=": "Extract images and other media contained in or linked from the source document to the path DIR, creating it if necessary, and adjust the images references in the document so they point to the extracted files"
  "--abbreviations=": "Specifies a custom abbreviations file, with abbreviations one to a line. If this option is not specified, pandoc will read the data file abbreviations from the user data directory or fall back on a system default"
  "-s, --standalone": "Produce output with an appropriate header and footer (e.g. a standalone HTML, LaTeX, TEI, or RTF file, not a fragment). This option is set automatically for pdf, epub, epub3, fb2, docx, and odt output"
  "--template=": "Use the specified file as a custom template for the generated document"
  "-V, --variable=": "Set the template variable KEY to the value VAL when rendering the document in standalone mode. If no VAL is specified, the key will be given the value true"
  "-D, --print-default-template=": "Print the system default template for an output FORMAT. Templates in the user data directory are ignored"
  "--print-default-data-file=": "Print a system default data file. Files in the user data directory are ignored"
  "--eol=": "Manually specify line endings: crlf (Windows), lf (macOS/Linux/UNIX), or native (line endings appropriate to the OS on which pandoc is being run). The default is native"
  "--dpi=": "Specify the default dpi (dots per inch) value for conversion from pixels to inch/centimeters and vice versa"
  "--wrap=": "Determine how text is wrapped in the output (the source code, not the rendered version)"
  "--columns=": "Specify length of lines in characters. This affects text wrapping in the generated source code"
  "--toc, --table-of-contents": "Include an automatically generated table of contents (or, in the case of latex, context, docx, odt, opendocument, rst, or ms, an instruction to create one) in the output document. It has no effect on man, docbook4, docbook5, or jats output"
  "--toc-depth=": "Specify the number of section levels to include in the table of contents"
  "--strip-comments": "Strip out HTML comments in the Markdown or Textile source, rather than passing them on to Markdown, Textile or HTML output as raw HTML. This does not apply to HTML comments inside raw HTML blocks when the markdown_in_html_blocks extension is not set"
  "--no-highlight": "Disables syntax highlighting for code blocks and inlines, even when a language attribute is given"
  "--highlight-style=": "Specifies the coloring style to be used in highlighted source code"
  "--print-highlight-style=": "Prints a JSON version of a highlighting style, which can be modified, saved with a .theme extension, and used with --highlight-style"
  "--syntax-definition=": "Instructs pandoc to load a KDE XML syntax definition file, which will be used for syntax highlighting of appropriately marked code blocks"
  "-H, --include-in-header=": "Include contents of FILE, verbatim, at the end of the header"
  "-B, --include-before-body=": "Include contents of FILE, verbatim, at the beginning of the document body"
  "-A, --include-after-body=": "Include contents of FILE, verbatim, at the end of the document body"
  "--resource-path=": "List of paths to search for images and other resources. If --resource-path is not specified, the default resource path is the working directory"
  "--request-header=": "Set the request header NAME to the value VAL when making HTTP requests. If you’re behind a proxy, you also need to set the environment variable http_proxy to http://"
  "--no-check-certificate": "Disable the certificate verification to allow access to unsecure HTTP resources"
  "--self-contained": "Produce a standalone HTML file with no external dependencies, using data: URIs to incorporate the contents of linked scripts, stylesheets, images, and videos"
  "--html-q-tags": "Use <q> tags for quotes in HTML. This option only has an effect if the smart extension is enabled"
  "--ascii": "Use only ASCII characters in output. Currently supported for XML, HTML formats, CommonMark, gfm, Markdown, roff ms , and to a limited degree LaTeX, roff man output uses ASCII by default"
  "--reference-links": "Use reference-style links, rather than inline links, in writing Markdown or reStructuredText"
  "--reference-location=": "Specify whether footnotes (and references, if reference-links is set) are placed at the end of the current (top-level) block, the current section, or the document. Currently only affects the markdown writer"
  "--markdown-headings=": "Specify whether to use ATX-style (#-prefixed) or Setext-style (underlined) headings for level 1 and 2 headings in Markdown output"
  "--atx-headers": "Deprecated synonym for --markdown-headings=atx"
  "--top-level-division=": "Treat top-level headings as the given division type in LaTeX, ConTeXt, DocBook, and TEI output"
  "-N, --number-sections": "Number section headings in LaTeX, ConTeXt, HTML, Docx, ms, or EPUB output. By default, sections are not numbered"
  "--number-offset=": {description: "Offset for section headings in HTML output (ignored in other output formats)", nargs: -1}
  "--listings": "Use the listings package for LaTeX code blocks. The package does not support multi-byte encoding for source code. To handle UTF-8 you would need to use a custom template"
  "-i, --incremental": "Make list items in slide shows display incrementally"
  "--slide-level=": "Specifies that headings with the specified level create slides (for beamer, s5, slidy, slideous, dzslides). Headings above this level in the hierarchy are used to divide the slide show into sections; headings below this level create subheads within a slide"
  "--section-divs": "Wrap sections in <section> tags (or <div> tags for html4), and attach identifiers to the enclosing <section> (or <div>) rather than the heading itself"
  "--email-obfuscation=": "Specify a method for obfuscating mailto: links in HTML documents references . The default is none"
  "--id-prefix=": "Specify a prefix to be added to all identifiers and internal links in HTML and DocBook output, and to footnote numbers in Markdown and Haddock output"
  "-T, --title-prefix=": "Specify STRING as a prefix at the beginning of the title that appears in the HTML header (but not in the title as it appears at the beginning of the HTML body)"
  "-c, --css=": "Link to a CSS style sheet. This option can be used repeatedly to include multiple files. They will be included in the order specified"
  "--reference-doc=": "Use the specified file as a style reference in producing a docx or ODT file"
  "--epub-cover-image=": "Use the specified image as the EPUB cover. It is recommended that the image be less than 1000px in width and height. Note that in a Markdown source document you can also specify cover-image in a YAML metadata block"
  "--epub-metadata=": "Look in the specified XML file for metadata for the EPUB. The file should contain a series of Dublin Core elements"
  "--epub-embed-font=": "Embed the specified font in the EPUB. This option can be repeated to embed multiple fonts. Wildcards can also be used"
  "--pdf-engine=": "Use the specified engine when producing PDF output"
  "--pdf-engine-opt=": "Use the given string as a command-line argument to the pdf-engine"
  "-C, --citeproc": "Process the citations in the file, replacing them with rendered citations and adding a bibliography. Citation processing will not take place unless bibliographic data is supplied, either through an external file specified using the --bibliography option or the bibliography field in metadata, or via a references section in metadata containing a list of citations in CSL YAML format with Markdown formatting. The style is controlled by a CSL stylesheet specified using the --csl option or the csl field in metadata. (If no stylesheet is specified, the chicago-author-date style will be used by default)"
  "--bibliography=*": "Set the bibliography field in the document’s metadata to FILE, overriding any value set in the metadata. If you supply this argument multiple times, each FILE will be added to bibliography. If FILE is a URL, it will be fetched via HTTP. If FILE is not found relative to the working directory, it will be sought in the resource path"
  "--csl=": "Set the csl field in the document’s metadata to FILE, overriding any value set in the metadata. (This is equivalent to --metadata csl=FILE.) If FILE is a URL, it will be fetched via HTTP. If FILE is not found relative to the working directory, it will be sought in the resource path and finally in the csl subdirectory of the pandoc user data directory"
  "--citation-abbreviations=": "Set the citation-abbreviations field in the document’s metadata to FILE, overriding any value set in the metadata. If FILE is a URL, it will be fetched via HTTP. If FILE is not found relative to the working directory, it will be sought in the resource path and finally in the csl subdirectory of the pandoc user data directory"
  "--natbib": "Use natbib for citations in LaTeX output. It is intended for use in producing a LaTeX file that can be processed with bibtex"
  "--biblatex": "Use biblatex for citations in LaTeX output. It is intended for use in producing a LaTeX file that can be processed with bibtex or biber"
  "--mathjax=": "Use MathJax to display embedded TeX math in HTML output. TeX math will be put between (...) (for inline math) or [...] (for display math) and wrapped in <span> tags with class math. Then the MathJax JavaScript will render it. The URL should point to the MathJax.js load script. If a URL is not provided, a link to the Cloudflare CDN will be inserted"
  "--mathml": "Convert TeX math to MathML (in epub3, docbook4, docbook5, jats, html4 and html5). This is the default in odt output. Note that currently only Firefox and Safari (and select e-book readers) natively support MathML"
  "--webtex=": "Convert TeX formulas to <img> tags that link to an external script that converts formulas to images. The formula will be URL-encoded and concatenated with the URL provided. For SVG images you can for example use --webtex https://latex.codecogs.com/svg.latex?. If no URL is specified, the CodeCogs URL generating PNGs will be used (https://latex.codecogs.com/png.latex?). Note: the --webtex option will affect Markdown output as well as HTML, which is useful if you’re targeting a version of Markdown without native math support"
  "--katex=": "Use KaTeX to display embedded TeX math in HTML output. The URL is the base URL for the KaTeX library. That directory should contain a katex.min.js and a katex.min.css file. If a URL is not provided, a link to the KaTeX CDN will be inserted"
  "--gladtex": "Enclose TeX math in <eq> tags in HTML output. The resulting HTML can then be processed by GladTeX to produce SVG images of the typeset formulas and an HTML file with these images embedded"
  "--dump-args": "Print information about command-line arguments to stdout, then exit. This option is intended primarily for use in wrapper scripts"
  "--ignore-args": "Ignore command-line arguments (for use in wrapper scripts). Regular pandoc options are not ignored"
exclusiveflags:
  - [natbib, citeproc]
  - [biblatex, citeproc]
completion:
  flag:
    output: ["$files"]
    data-dir: ["$directories"]
    log: ["$files"]
    filter: ["$files"]
    lua-filter: ["$files"]
    track-changes: ["accept\tProcesses all the insertions and deletions and ignores comments", "reject\tIgnores all the insertions and deletions and ignores comments", "all\tIncludes all insertions, deletions, and comments, wrapped in spans with insertion, deletion, comment-start, and comment-end classes, respectively"]
    extract-media: ["$directories"]
    abbreviations: ["$files"]
    template: ["$files"]
    print-default-data-file: ["$files"]
    eol: ["crlf\tWindows", "lf\tMacOS/Linux/UNIX", "native\tLine endings appropriate to the OS on which Pandoc is being run"]
    wrap: ["auto\tAttempts to wrap lines to the column width specified by --columns (default 72)", "none\tWill not wrap lines at all", "preserve\tAttempts to preserve the wrapping from the source document"]
    highlight-style: [pygments, kate, monochrome, breezeDark, espresso, zenburn, haddock, tango, "$files"]
    print-highlight-style: [pygments, kate, monochrome, breezeDark, espresso, zenburn, haddock, tango, "$files"]
    syntax-definition: ["$files"]
    include-in-header: ["$files"]
    include-before-body: ["$files"]
    include-after-body: ["$files"]
    resource-path: ["$directories"]
    reference-location: [block, section, document]
    markdown-headings: [setext, atx]
    top-level-division: [default, section, chapter, part]
    email-obfuscation: ["none\tLeaves mailto: links as they are", "javascript\tObfuscates mailto: links using JavaScript", "references\tObfuscates mailto: links by printing their letters as decimal or hexadecimal character references"]
    reference-doc: ["$files"]
    epub-cover-image: ["$files"]
    epub-metadata: ["$files"]
    epub-embed-font: ["$files"]
    pdf-engine: [pdflatex, lualatex, xelatex, latexmk, tectonic, wkhtmltopdf, weasyprint, prince, context, pdfroff]
    bibliography: ["$files"]
    csl: ["$files"]
    citation-abbreviations: ["$files"]
  positionalany: ["$files"]
