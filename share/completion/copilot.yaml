          "--resource-tags=": "Optional. Labels with a key and value separated by commas. Allows you to categorize resources"
          "--secrets=": "Optional. Secrets to inject into the container. Specified by key=value separated by commas"
          "--security-groups=": "Optional. The security group IDs for the task to use. Can be specified multiple times"
