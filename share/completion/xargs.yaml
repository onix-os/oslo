# Converted from Fig's xargs.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: xargs
description: "Execute a command with whitespace-delimited strings (from stdin) as arguments"
flags:
  "-0": "Use NUL (0x00) as a separator, instead of whitespace"
  "-E=": "Use this string as a logical EOF marker"
  "-I=": "Replace occurrences of this string with the input"
  "-J=": "Replace an argument exactly equal to this string with the input"
  "-L=": "Run the program each time this many lines of input are read"
  "-n=": "The maximum number of arguments that can be taken from stdin on each run"
  "-o": "Reopen stdin as /dev/tty (useful for running interactive applications)"
  "-P=": "Run up to this many commands in parallel (as many as possible if 0)"
  "-p": "Prompt to run each command"
  "-r": "Run the command once if there's no input (compatible with GNU xargs)"
  "-R=": "Specify the maximum number of occurrences that -I will replace"
  "-S=": "Specify the maximum size in bytes that -I can use for replacements (default: 255)"
  "-s=": "Maximum number of bytes that can be provided to the program (default: 4096)"
  "-t": "Echo the command to stderr before it's executed"
  "-x": "Terminal if the arguments will not fit in the maximum line length"
exclusiveflags:
  - [L, n]
  - [n, L]
