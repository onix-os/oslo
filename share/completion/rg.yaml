completion:
  flag:
    color: ["never\tColors will never be used", "auto\tRipgrep tries to be smart", "always\tColors will always be used regardless of where output is sent", "ansi\tColors will always be used, but emits ANSI escapes"]
    engine: [default, pcre2, auto]
    file: ["$files"]
    iglob: ["$files", "$directories"]
    ignore-file: ["$files"]
    sort: ["none\tDo not sort results. Fastest. Can be multi-threaded", "path\tSort by file path, Always single-threaded", "modified\tSort by the last modified time on a file. Always single-threaded", "accessed\tSort by the last accessed time on a file. Always single-threaded", "created\tSort by the creation time on a file. Always single-threaded"]
    sortr: ["none\tDo not sort results. Fastest. Can be multi-threaded", "path\tSort by file path, Always single-threaded", "modified\tSort by the last modified time on a file. Always single-threaded", "accessed\tSort by the last accessed time on a file. Always single-threaded", "created\tSort by the creation time on a file. Always single-threaded"]
  positionalany: ["$files", "$directories"]
