            fields: [ID, post_title, post_name, post_date, post_status, post_author, post_date_gmt, post_content, post_excerpt, comment_status, ping_status, post_password, to_ping, pinged, post_modified, post_modified_gmt, post_content_filtered, post_parent, guid, menu_order, post_type, post_mime_type, comment_count, filter, url]
            format: [table, csv, ids, json, count, yaml]
      - name: meta
        description: "Adds, updates, deletes, and lists post custom fields"
        commands:
          - name: add
            description: "Add a meta field"
            flags:
              "--format?": "The serialization format for the value"
            completion:
              flag:
                format: [plaintext, json]
          - name: delete
            description: "Delete a meta field"
            flags:
              "--all": "Delete all meta for the object"
          - name: get
            description: "Get meta field value"
            flags:
              "--format?": "Get value in a particular format"
            completion:
              flag:
                format: [var_export, json, yaml]
          - name: list
            description: "List all metadata associated with an object"
            flags:
              "--keys?": "Limit output to metadata of specific keys"
              "--fields?": "Limit the output to specific row fields. Defaults to id,meta_key,meta_value"
              "--format?": "Render output in a particular format"
              "--orderby?": "Set orderby which field"
              "--order?": "Set ascending or descending order"
              "--unserialize": "Unserialize meta_value output"
            completion:
