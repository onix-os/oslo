  - name: global
    description: "Sets Flutter SDK version as global"
  - name: install
    description: "Installs Flutter SDK version"
    flags:
      "-h, --help": "Print this usage information"
      "-s, --skip-setup": "Skips Flutter setup after install"
    completion:
      positional:
        - ["stable\tLatest stable release of Flutter", "beta\tLatest beta release of Flutter", "dev\tLatest dev release of Flutter (master)"]
  - name: list
    description: "Lists installed Flutter SDK versions"
    flags:
      "-h, --help": "Print this usage information"
  - name: releases
    description: "View all Flutter SDK releases available for install"
    flags:
      "-h, --help": "Print this usage information"
  - name: remove
    description: "Removes Flutter SDK version"
    flags:
      "-h, --help": "Print this usage information"
      "--force": "Skips version global check"
  - name: spawn
    description: "Spawn a Flutter SDK version command"
  - name: use
    description: "Sets a Flutter SDK version to be used in a project"
    flags:
      "-h, --help": "Print this usage information"
      "-f, --force": "Skips command guards that does Flutter project checks"
      "-p, --pin": "If version provided is a channel. Will pin the latest release of the channel"
      "--flavor": "Sets version for a project flavor"
