    description: "Build a gem from a gemspec"
    flags:
      "--platform=": "Specify the platform of gem to build"
      "--force": "Skip validation of the spec"
      "--strict": "Consider warnings as errors when validating the spec"
      "-o, --output=": "Output gem with the given filename"
      "-C=": "Run as if gem build was started in <PATH> instead of the current working directory"
    completion:
      flag:
        C: ["$directories"]
  - name: push
    description: "Push a gem up to the gem server"
    flags:
      "--host=": "Use another gemcutter-compatible host (e.g. https://rubygems.org)"
      "-k, --key=": "Use the given API key"
      "--otp=": "Digit code for multifactor authentication You can also use the environment variable GEM_HOST_OTP_CODE"
      "-p, --http-proxy?": "Use HTTP proxy for remote operations"
      "--no-http-proxy": "Do not use HTTP proxy for remote operations"
    exclusiveflags:
      - [http-proxy, no-http-proxy]
      - [no-http-proxy, http-proxy]
  - name: server
    description: "Starts up a web server that hosts the RDoc (requires rubygems-server)"
  - name: owner
    description: "Manage gem owners of a gem on the push server"
    flags:
      "-a, --add=": "Add an owner by user identifier"
      "-r, --remove=": "Remove an owner by user identifier"
      "--host=": "Use another gemcutter-compatible host (e.g. https://rubygems.org)"
      "-k, --key=": "Use the given API key"
      "--otp=": "Digit code for multifactor authentication You can also use the environment variable GEM_HOST_OTP_CODE"
  - name: which
    description: "Find the location of a library file you can require"
    flags:
      "-a, --all": "Show all matching files"
      "-g, --gems-first": "Search gems before non-gems"
    completion:
      positional:
        - ["$files"]
  - name: outdated
    description: "Display all gems that need updates"
    flags:
      "--platform=": {description: "Specify the platform of gem to outdated", nargs: -1}
  - name: update
    description: "Update installed gems to the latest version"
    flags:
      "--system?": "Update the RubyGems system software"
      "--platform=": "Update the RubyGems system software"
      "--prerelease": "Allow prerelease versions of a gem as update targets"
      "--install-dir, -i=": "Gem repository directory to get installed gems"
      "--bindir, -n=": "Directory where executables will be placed when the gem is installed"
