# Converted from Fig's op.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: op
description: "Official 1Password CLI"
flags:
  "-v, --version": "Version for op"
persistentflags:
  "--account=": "Select the account to execute the command by account shorthand, sign-in address, account ID, or user ID. For a list of available accounts, run 'op account list'. Can be set as the OP_ACCOUNT environment variable"
  "--cache": "Store and use cached information"
  "--config=": "Use this configuration directory"
  "--debug": "Output debug logs. Can also be set using $OP_DEBUG environment variable"
  "--encoding=": "Use this character encoding type. Default: UTF-8. Supported: SHIFT_JIS, gbk"
  "--format=": "Use this output format. Can be 'human-readable' or 'json'. Can be set as the OP_FORMAT environment variable. (default \"human-readable\")"
  "-h, --help": "Get help for op"
  "--iso-timestamps": "Format timestamps according to ISO 8601 / RFC 3339. Can be set as the OP_ISO_TIMESTAMPS environment variable"
  "--no-color": "Print output without color"
  "--session=": "Authenticate with this session token. 1Password CLI outputs session tokens for successful 'op signin' commands when biometric unlock is disabled"
completion:
  flag:
    config: ["$directories"]
    encoding: [UTF-8, SHIFT_JIS, gbk]
    format: [human-readable, json]
commands:
  - name: account
    description: "Manage your locally configured 1Password accounts"
    commands:
      - name: add
        description: "Add an account to sign in to for the first time"
        flags:
          "--address=": "The sign-in address for your account"
          "--email=": "The email address associated with your account"
          "--raw": "Only return the session token"
          "--shorthand=": "Set the short account name"
      - name: get
        description: "Get details about your account"
      - name: list
        aliases: [ls]
        description: "List users and accounts set up on this device"
      - name: forget
        description: "Remove a 1Password account from this device"
        flags:
          "--all": "Forget all authenticated accounts"
  - name: connect
    description: "Manage Connect instances and Connect tokens in your 1Password account"
    commands:
      - name: group
        description: "Manage group access to Secrets Automation"
        commands:
          - name: grant
            description: "Grant a group access to manage Secrets Automation"
            flags:
              "--all-servers": "Grant access to all current and future servers in the authenticated account"
              "--group=": "The group to receive access"
          - name: revoke
            description: "Revoke a group's access to manage Secrets Automation"
            flags:
              "--all-servers": "Revoke access to all current and future servers in the authenticated account"
              "--group=": "The group to revoke access from"
      - name: server
        description: "Manage Connect servers"
        commands:
          - name: create
            description: "Set up a Connect server"
          - name: get
            description: "Get a Connect server"
            completion:
              positional:
                - ["-\tRead from stdin"]
          - name: edit
            description: "Rename a Connect server"
          - name: delete
            aliases: [remove, rm]
            description: "Remove a Connect server"
            completion:
              positional:
                - ["-\tRead from stdin"]
          - name: list
            aliases: [ls]
            description: "List Connect servers"
      - name: token
        description: "Manage Connect tokens"
        commands:
          - name: create
            description: "Issue a token for a 1Password Connect server"
            flags:
              "--expires-in=": "Set how long the Connect token is valid for in (s)econds, (m)inutes, or (h)ours"
              "--server=": "Issue a token for this server"
          - name: edit
            description: "Rename a Connect token"
            flags:
              "--name=": "Change the token's name"
          - name: delete
            aliases: [remove, rm]
            description: "Revoke a token for a Connect server"
          - name: list
            aliases: [ls]
            description: "Get a list of tokens"
      - name: vault
        description: "Manage connect server vault access"
        commands:
          - name: grant
            description: "Grant a Connect server access to a vault"
            flags:
              "--server=": "The server to be granted access"
          - name: revoke
            description: "Revoke a Connect server's access to a vault"
            flags:
              "--server=": "The server to revoke access from"
  - name: document
    description: "Perform CRUD operations on Document items in your vaults"
    commands:
      - name: create
        description: "Create a document item"
        flags:
          "--file-name=": "Set the file's name"
          "--tags=": "Set the tags to the specified (comma-separated) values"
          "--title=": "Set the document item's title"
        completion:
          positional:
            - ["-\tRead from stdin"]
      - name: get
        description: "Download a document"
        flags:
          "--include-archive": "Include document items in the Archive. Can also be set using OP_INCLUDE_ARCHIVE environment variable"
          "--output=": "Save the document to the file path instead of stdout"
      - name: edit
        description: "Edit a document item"
        flags:
          "--file-name=": "Set the file's name"
          "--tags=": "Set the tags to the specified (comma-separated) values. An empty value will remove all tags"
          "--title=": "Set the document item's title"
        completion:
          positional:
            - []
            - ["-\tRead from stdin"]
      - name: delete
        aliases: [remove, rm]
        description: "Delete or archive a document item"
        flags:
          "--archive": "Move the document to the Archive"
        completion:
          positional:
            - ["-\tRead from stdin"]
      - name: list
        aliases: [ls]
        description: "Get a list of documents"
        flags:
          "--include-archive": "Include document items in the Archive. Can also be set using OP_INCLUDE_ARCHIVE environment variable"
  - name: events-api
    description: "Manage Events API integrations in your 1Password account"
    commands:
      - name: create
        description: "Set up an integration with the Events API"
  - name: group
    description: "Perform CRUD operations on the groups of users in your 1Password account"
    commands:
      - name: user
        description: "Manage users in groups"
        commands:
          - name: grant
            description: "Grant a user access to a group"
            flags:
              "--group=": "Specify the group to grant the user access to"
              "--role=": "Specify the user's role as a member or manager. Default: member"
          - name: revoke
            description: "Revoke a user's access to a vault or group"
            flags:
              "--group=": "Specify the group to revoke the user's access to"
          - name: list
            aliases: [ls]
            description: "Retrieve users that belong to a group"
      - name: create
        description: "Create a group"
        flags:
          "--description=": "Set the group's description"
      - name: get
        description: "Get details about a group"
        completion:
          positional:
            - ["-\tRead from stdin"]
      - name: edit
        description: "Edit a group's name or description"
        flags:
          "--description=": "Change the group's description"
        completion:
          positional:
            - ["-\tRead from stdin"]
      - name: delete
        aliases: [remove, rm]
        description: "Remove a group"
        completion:
          positional:
            - ["-\tRead from stdin"]
      - name: list
        aliases: [ls]
        description: "List groups"
        flags:
          "--user=": "List groups that a user belongs to"
  - name: item
    description: "Perform CRUD operations on the 1Password items in your vaults"
    commands:
      - name: template
        description: "Manage templates"
        commands:
          - name: get
            description: "Get an item template"
            flags:
              "-f, --force": "Do not prompt for confirmation"
            completion:
              positional:
                - ["-\tRead from stdin"]
          - name: list
            aliases: [ls]
            description: "Get a list of templates"
      - name: create
        description: "Create an item"
        flags:
          "--category=": "Set the item's category"
          "--dry-run": "Perform a dry run of the command and output a preview of the resulting item"
          "--generate-password?": "Give the item a randomly generated password"
          "--tags=": "Set the tags to the specified (comma-separated) values"
          "--template=": "Specify the filepath to read an item template from"
          "--title=": "Set the item's title"
          "--url=": "Set the URL associated with the item"
      - name: get
        description: "Get an item's details"
        flags:
          "--fields=": "Only return data from these fields. Use 'label=' to get the field by name or 'type=' to filter fields by type"
          "--include-archive": "Include items in the Archive. Can also be set using OP_INCLUDE_ARCHIVE environment variable"
          "--otp": "Output the primary one-time password for this item"
          "--share-link": "Get a shareable link for the item"
        completion:
          positional:
            - ["-\tRead from stdin"]
      - name: edit
        description: "Edit an item's details"
      - name: delete
        aliases: [remove, rm]
        description: "Delete or archive an item"
        flags:
          "--archive": "Move the item to the Archive"
        completion:
          positional:
            - ["-\tRead from stdin"]
      - name: list
        aliases: [ls]
        description: "List items"
        flags:
          "--categories=": "Only list items in these categories (comma-separated)"
          "--include-archive": "Include items in the Archive. Can also be set using OP_INCLUDE_ARCHIVE environment variable"
          "--long": "Output a more detailed item list"
          "--tags=": "Only list items with these tags (comma-separated)"
      - name: share
        description: "Share an item"
        flags:
          "--emails=": "Email addresses to share with"
          "--expiry=": "Link expiring after the specified duration in (s)econds, (m)inutes, or (h)ours (default 7h)"
          "--vault=": "Look for the item in this vault"
  - name: user
    description: "Manage users within this 1Password account"
    commands:
      - name: provision
        description: "Provision a user in the authenticated account"
        flags:
          "--email=": "Provide the user's email address"
          "--language=": "Provide the user's account language. (default \"en\")"
      - name: confirm
        description: "Confirm a user"
        flags:
          "--all": "Confirm all unconfirmed users"
        completion:
          positional:
            - ["-\tRead from stdin"]
      - name: get
        description: "Get details about a user"
        flags:
          "--fingerprint": "Get the user's public key fingerprint"
        completion:
          positional:
            - ["-\tRead from stdin", "--me\tGet the authenticated user's details"]
      - name: edit
        description: "Edit a user's name or Travel Mode status"
        flags:
          "--name=": "Set the user's name"
        completion:
          positional:
            - ["-\tRead from stdin"]
      - name: suspend
        description: "Suspend a user"
        flags:
          "--deauthorize-devices-after=": "Deauthorize the user's devices after a time (rounded down to seconds)"
        completion:
          positional:
            - ["-\tRead from stdin"]
      - name: reactivate
        description: "Reactivate a suspended user"
        completion:
          positional:
            - ["-\tRead from stdin"]
      - name: delete
        aliases: [remove, rm]
        description: "Remove a user and all their data from the account"
        completion:
          positional:
            - ["-\tRead from stdin"]
      - name: list
        aliases: [ls]
        description: "List users"
        flags:
          "--group=": "List users who belong to a group"
  - name: vault
    description: "Manage permissions and perform CRUD operations on your 1Password vaults"
    commands:
      - name: group
        description: "Manage group vault access"
        commands:
          - name: grant
            description: "Grant a group permissions to a vault"
            flags:
              "--group=": "The group to receive access"
              "--no-input=": "Do not prompt for input on interactive terminal"
              "--permissions=": "The permissions to grant to the group"
          - name: revoke
            description: "Revoke a portion or the entire access of a group to a vault"
            flags:
              "--group=": "The group to revoke access from"
              "--no-input=": "Do not prompt for input on interactive terminal"
              "--permissions=": "The permissions to revoke from the group"
          - name: list
            aliases: [ls]
            description: "List all the groups that have access to the given vault"
            completion:
              positional:
                - ["-\tRead from stdin"]
      - name: user
        description: "Manage user vault access"
        commands:
          - name: grant
            description: "Grant a user access to a vault"
            flags:
              "--no-input=": "Do not prompt for input on interactive terminal"
              "--permissions=": "The permissions to grant to the user"
              "--user=": "The user to receive access"
          - name: revoke
            description: "Revoke a portion or the entire access of a user to a vault"
            flags:
              "--no-input=": "Do not prompt for input on interactive terminal"
              "--permissions=": "The permissions to revoke from the user"
              "--user=": "The user to revoke access from"
          - name: list
            aliases: [ls]
            description: "List all users with access to the vault and their permissions"
      - name: create
        description: "Create a new vault"
        flags:
          "--allow-admins-to-manage=": "Set whether admins can manage the vault. Default: false"
          "--description=": "Set the group's description"
      - name: get
        description: "Get details about a vault"
        completion:
          positional:
            - ["-\tRead from stdin"]
      - name: edit
        description: "Edit a vault's name, description, icon or Travel Mode status"
        flags:
          "--description=": "Change the vault's description"
          "--icon=": "Change the vault's icon"
          "--name=": "Change the vault's name"
          "--travel-mode=": "Turn Travel Mode on or off for the vault. Only vaults with Travel Mode enabled will be accessible while a user has Travel Mode turned on. (default off)"
        completion:
          positional:
            - ["-\tRead from stdin"]
      - name: delete
        aliases: [remove, rm]
        description: "Remove a vault"
        completion:
          positional:
            - ["-\tRead from stdin"]
      - name: list
        aliases: [ls]
        description: "List all vaults in the account"
        flags:
          "--group=": "List vaults a group has access to"
  - name: completion
    description: "Generate shell completion information"
  - name: inject
    description: "Inject secrets into a config file"
  - name: read
    description: "Read a secret using the secrets reference syntax"
    flags:
      "--file-mode=": "Set filemode for the output file if it does not yet exist. It is ignored without the --out-file flag. (default 0600)"
      "-f, --force": "Do not prompt for confirmation"
      "-n, --no-newline": "Do not print a new line after the secret"
  - name: run
    description: "Pass secrets as environment variables to a process"
    flags:
      "--env-file?": "Enable Dotenv integration with specific Dotenv files to parse. For example: --env-file=.env"
      "--no-masking": "Disable masking of secrets on stdout and stderr"
  - name: signin
    description: "Sign in to a 1Password account"
    flags:
      "-f, --force": "Ignore warnings and print raw output from this command"
  - name: signout
    description: "Sign out of a 1Password account"
    flags:
      "--all": "Sign out of all signed-in accounts"
      "--forget": "Remove the details for a 1Password account from this device"
  - name: update
    description: "Check for and download updates"
    flags:
      "--directory=": "Download the update to this ''path''"
    completion:
      flag:
        directory: ["$directories"]
  - name: whoami
    description: "Get information about a signed-in account"
