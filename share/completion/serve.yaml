    listen: ["port\tE.g. serve --listen 1234", "host/port\tE.g. serve --listen tcp://hostname:1234", "unix domain\tE.g. serve --listen unix:/path/to/socket.sock", "windows pipe\tE.g. serve -l pipe:\\.pipePipeName"]
