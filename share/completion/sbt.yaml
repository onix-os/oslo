# Converted from argc's sbt.sh by tools/argc-to-spec. Do not edit by hand.
name: sbt
flags:
  "-h, --help": "print this message"
  "-v, --verbose": "this runner is chattier"
  "-V, --version": "print sbt version information"
  "--numeric-version": "print the numeric sbt version (sbt sbtVersion)"
  "--script-version": "print the version of sbt script"
  "-d, --debug": "set sbt log level to debug"
  "-debug-inc": "enable extra debugging for the incremental debugger"
  "--debug-inc": "enable extra debugging for the incremental debugger"
  "--no-colors": "disable ANSI color codes"
  "--color=": "enable or disable ANSI color codes (sbt 1.3 and above)"
  "--supershell=": "enable or disable supershell (sbt 1.3 and above)"
  "--traces": "generate Trace Event report on shutdown (sbt 1.3 and above)"
  "--timings": "display task timings report on shutdown"
  "--sbt-create": "start sbt even if current directory contains no sbt project"
  "--sbt-dir=": "path to global settings/plugins directory (default: ~/.sbt)"
  "--sbt-boot=": "path to shared boot directory (default: ~/.sbt/boot in 0.11 series)"
  "--sbt-cache=": "path to global cache directory (default: operating system specific)"
  "--ivy=": "path to local Ivy repository (default: ~/.ivy2)"
  "--mem=": "set memory options (default: 1024)"
  "--no-share": "use all local caches; no sharing"
  "--no-global": "uses global caches, but does not use global ~/.sbt directory."
  "--jvm-debug=": "Turn on JVM debugging, open at the given port."
  "--batch": "disable interactive mode"
  "--sbt-version=": "use the specified version of sbt"
  "--sbt-jar=": "use the specified jar as the sbt launcher"
  "--java-home=": "alternate JAVA_HOME"
  "-Dkey=": "pass -Dkey=val directly to the java runtime"
  "-J-X": "pass option -X directly to the java runtime (-J is stripped)"
completion:
  flag:
    color: [auto, always, "true", "false", never]
    supershell: [auto, always, "true", "false", never]
commands:
  - name: about
    description: "Displays basic information about sbt and the build."
    flags:
      "-h, --help": ""
  - name: tasks
    description: "Lists the tasks defined for the current project."
    flags:
      "-v*": ""
      "-V": ""
      "-h, -help": ""
  - name: settings
    description: "Lists the settings defined for the current project."
    flags:
      "-v*": ""
      "-V": ""
      "-h, -help": ""
  - name: reload
    description: "(Re)loads the current project or changes to plugins project or returns from it."
    flags:
      "-h, --help": ""
  - name: new
    description: "Creates a new sbt build."
    flags:
      "-h, --help": ""
  - name: projects
    description: "Lists the names of available projects or temporarily adds/removes extra builds to the session."
    flags:
      "-h, --help": ""
  - name: project
    description: "Displays the current project or changes to the provided `project`."
    flags:
      "-h, --help": ""
  - name: set
    description: "Evaluates a Setting and applies it to the current project."
    flags:
      "-h, --help": ""
  - name: session
    description: "Manipulates session settings."
    flags:
      "-h, --help": ""
    completion:
      positional:
        - [clear, clear-all, list, list-all, remove, save, save-all]
  - name: inspect
    description: "Prints the value for 'key', the defining scope, delegates, related definitions, and dependencies."
    flags:
      "-h, --help": ""
    completion:
      positional:
        - [tree, uses, definitions, actual]
  - name: plugins
    description: "Lists currently available plugins."
    flags:
      "-h, --help": ""
  - name: last
    description: "Displays output from a previous command or the output from a specific task."
    flags:
      "-h, --help": ""
  - name: last-grep
    aliases: [lastGrep]
    description: "Shows lines from the last output for 'key' that match 'pattern'."
    flags:
      "-h, --help": ""
  - name: export
    description: "Executes tasks and displays the equivalent command lines."
    flags:
      "--last": "Uses information from the previous execution"
      "-h, --help": "Print help"
  - name: show
    description: "Displays the result of evaluating the setting or task associated with 'key'."
    flags:
      "-h, --help": ""
  - name: print
    description: "Prints the result of evaluating the setting or task associated with 'key' to standard output."
    flags:
      "-h, --help": ""
  - name: all
    description: "Executes all of the specified tasks concurrently."
    flags:
      "-h, --help": ""
  - name: completions
    description: "Displays a list of completions for the given argument string (run 'completions <string>')."
    flags:
      "-h, --help": ""
  - name: early
    description: "Schedules a command to run before other commands on startup."
    flags:
      "-h, --help": ""
  - name: exit
    description: "Terminates the remote client or the build when called from the console."
    flags:
      "-h, --help": ""
  - name: shutdown
    description: "Terminates the build."
    flags:
      "-h, --help": ""
  - name: alias
    description: "Manage aliases."
    flags:
      "-h, --help": ""
  - name: append
    description: "Appends 'command' to list of commands to run."
    flags:
      "-h, --help": ""
  - name: apply
    description: "Transforms the current State by calling <module-name>.apply(currentState) for each listed module name."
    flags:
      "-h, --help": ""
  - name: clearCaches
    description: "Clears all of sbt's internal caches."
    flags:
      "-h, --help": ""
  - name: client
    description: "Provides an interactive prompt from which commands can be run on a server."
    flags:
      "-h, --help": ""
  - name: eval
    description: "Evaluates the given Scala expression and prints the result and type."
    flags:
      "-h, --help": ""
  - name: iflast
    description: "If there are no more commands after this one, 'command' is run."
    flags:
      "-h, --help": ""
  - name: onFailure
    description: "Registers 'command' to run when a command fails to complete normally."
    flags:
      "-h, --help": ""
  - name: reboot
    description: "This command is equivalent to exiting sbt, restarting, and running the remaining commands with the exception that the JVM is not shut down."
    flags:
      "-h, --help": ""
  - name: shell
    description: "Launch an interactive sbt prompt."
    flags:
      "-h, --help": ""
  - name: startServer
    description: "Starts the server if it has not been started."
    flags:
      "-h, --help": ""
