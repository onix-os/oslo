      "-n, --limit=": "Number of invocations to return"
      "-s, --since=": "View logs since the specified time. valid formats: YYYY-MM-DD, ISO 8061 timestamp or a relative time (e.g: 5m, 10h, 2d)"
      "-g, --grouped": "Group logs by invocation ID"
      "-h, --help": "Display help for command"
  - name: providers
    description: "Manage external providers"
    flags:
      "--verbose": "Enable verbose mode"
      "-h, --help": "Display help for command"
    commands:
      - name: configure
        description: "Configure provider credentials"
        flags:
          "--verbose": "Enable verbose mode"
