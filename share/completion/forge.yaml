name: forge
description: "A command line interface for managing Atlassian-hosted apps"
flags:
  "-V, --version": "Output the version number"
  "--verbose": "Enable verbose mode"
  "-h, --help": "Display help for command"
commands:
  - name: autocomplete
    description: "Configures autocomplete for the Forge CLI"
    flags:
      "--verbose": "Enable verbose mode"
      "-h, --help": "Display help for command"
    completion:
      positional:
        - [install, uninstall]
  - name: create
    description: "Create an app"
    flags:
      "--verbose": "Enable verbose mode"
      "-t, --template=": "Specify the template to use"
      "-d, --directory=": "Specify the directory to create (uses the template name by default)"
      "-h, --help": "Display help for command"
  - name: deploy
    description: "Deploy your app to an environment"
    flags:
      "--verbose": "Enable verbose mode"
      "-f, --no-verify": "Disable pre-deployment checks"
      "-e, --environment?": "Specify the environment from options: development, staging, production (default: development)"
      "--non-interactive": "Run the command without input prompts"
      "-h, --help": "Display help for command"
  - name: feedback
    description: "Let us know what you think about Forge"
    flags:
      "--verbose": "Enable verbose mode"
      "-h, --help": "Display help for command"
  - name: install
    description: "Manage app installations"
    flags:
      "--verbose": "Enable verbose mode"
      "-e, --environment?": "Specify the environment from options: development, staging, production (default: development)"
      "-s, --site?": "Site URL (example.atlassian.net)"
      "-p, --product?": "Product (Jira, Confluence, Compass)"
      "--upgrade": "Upgrade an existing installation"
      "--confirm-scopes": "Skip confirmation of scopes for the app before installing or upgrading the app"
      "--non-interactive": "Run the command without input prompts"
      "-h, --help": "Display help for command"
    commands:
      - name: list
        description: "List app installations"
        flags:
          "--verbose": "Enable verbose mode"
          "-h, --help": "Display help for command"
      - name: help
        description: "Display help for command"
  - name: lint
    description: "Check the source files for common errors"
    flags:
      "--verbose": "Enable verbose mode"
      "--fix": "Attempt to automatically fix any issues encountered"
      "-e, --environment?": "Specify the environment from options: development, staging, production (default: development)"
      "-h, --help": "Display help for command"
  - name: login
    description: "Log in to your Atlassian account"
    flags:
      "--verbose": "Enable verbose mode"
      "-u, --email=": "Specify the email to use"
      "-t, --token=": "Specify the API token to use"
      "--non-interactive": "Run the command without input prompts"
      "-h, --help": "Display help for command"
  - name: logout
    description: "Log out of your Atlassian account"
    flags:
      "--verbose": "Enable verbose mode"
      "-h, --help": "Display help for command"
  - name: logs
    description: "View app logs"
    flags:
      "--verbose": "Enable verbose mode"
      "-e, --environment?": "Specify the environment from options: development, staging, production (default: development)"
