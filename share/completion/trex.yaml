name: trex
description: "Advanced package management for deno, based on import_map.json"
flags:
  "-v, --version": "Print version"
  "-c, --custom=": "Install custom package"
persistentflags:
  "-h, --help": "Print help info"
commands:
  - name: i
    aliases: [install]
    description: "Install a package"
