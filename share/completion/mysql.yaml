completion:
  flag:
    character-sets-dir: ["$directories"]
    compression-algorithms: [zlib, zstd, uncompressed]
    defaults-extra-file: ["$files"]
    defaults-file: ["$files"]
    load-data-local-dir: ["$directories"]
    local-infile: ["0\tDisable", "1\tEnable"]
    plugin-dir: ["$directories"]
    protocol: [TCP, SOCKET, PIPE, MEMORY]
    server-public-key-path: ["$files"]
    ssl-ca: ["$files"]
    ssl-capath: ["$directories"]
    ssl-cert: ["$files"]
    ssl-crl: ["$files"]
    ssl-crlpath: ["$directories"]
    ssl-fips-mode: ["OFF", "ON", STRICT]
    ssl-key: ["$files"]
    tee: ["$files"]
    tls-ciphersuites: ["$files"]
