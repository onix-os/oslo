# Converted from Fig's sanity.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: sanity
description: "Sanity CLI tool for managing Sanity installations, managing plugins, schemas and datasets"
flags:
  "--help, -h": "Show help for sanity"
commands:
  - name: help
    description: "Displays help information about Sanity"
  - name: build
    description: "Builds the current Sanity configuration to a static bundle"
    flags:
      "--source-maps": "Enable source maps for built bundles (increases size of bundle)"
      "--no-minify": "Skip minifying built JavaScript (speeds up build, increases size of bundle)"
      "-y, --yes": "Use unattended mode, accepting defaults and using only flags for choices"
  - name: codemod
    description: "Runs a code modification script"
    flags:
      "--dry": "Dry run (no changes are made to files)"
      "--extensions=": "Transform files with these file extensions (comma separated list) (default: js,ts,tsx)"
      "--no-verify": "Skip verification before running codemod"
  - name: configcheck
    description: "Checks if the required configuration files for plugins exists and are up to date"
  - name: cors
    description: "Interact with CORS-entries for your project"
    commands:
      - name: add
        description: "Allow a new origin to use your project API through CORS"
        flags:
          "--credentials": "Allow credentials (token/cookie) to be sent from this origin"
          "--no-credentials": "Disallow credentials (token/cookie) to be sent from this origin"
        exclusiveflags:
          - [credentials, no-credentials]
          - [no-credentials, credentials]
      - name: delete
        description: "Delete an existing CORS-origin from your project"
      - name: list
        description: "List all origins allowed to access the API for this project"
  - name: dataset
    description: "Interact with datasets in your project"
    commands:
      - name: alias
        description: "You can manage your dataset alias using this command"
        commands:
          - name: create
          - name: delete
          - name: link
            flags:
              "--force": "Skips security prompt and forces link command"
          - name: unlink
      - name: copy
        description: "Manages dataset copying, including starting a new copy job, listing copy jobs and following the progress of a running copy job"
        flags:
          "--detach": "Start the copy without waiting for it to finish"
          "--attach=": "Attach to the running copy process to show progress"
          "--skip-history": "Don't preserve document history on copy"
          "--list": "Lists all dataset copy jobs corresponding to a certain criteria"
          "--offset=": "Start position in the list of jobs. Default 0. With --list"
          "--limit=": "Maximum number of jobs returned. Default 10. Maximum 1000. With --list"
      - name: create
        description: "Create a new dataset within your project"
        flags:
          "--visibility=": "Set visibility for this dataset (public/private)"
        completion:
          flag:
            visibility: [public, private]
      - name: delete
        description: "Delete a dataset within your project"
      - name: export
        description: "Export dataset to local filesystem as a gzipped tarball"
        flags:
          "--raw": "Extract only documents, without rewriting asset references"
          "--no-assets": "Export only non-asset documents and remove references to image assets"
          "--no-drafts": "Export only published versions of documents"
          "--no-compress": "Skips compressing tarball entries (still generates a gzip file)"
          "--types=": "Defines which document types to export"
          "--overwrite": "Overwrite any file with the same name"
          "--asset-concurrency=": "Concurrent number of asset downloads"
        completion:
          positional:
            - []
            - ["$directories"]
      - name: import
        description: "Import documents to given dataset from ndjson file"
        flags:
          "--missing": "On duplicate document IDs, skip importing document in question"
          "--replace": "On duplicate document IDs, replace existing document with imported document"
          "--allow-failing-assets": "Skip assets that cannot be fetched/uploaded"
          "--replace-assets": "Skip reuse of existing assets"
        completion:
          positional:
            - ["$files"]
      - name: list
        description: "List datasets of your project"
      - name: visibility
        description: "Set visibility of a dataset"
        completion:
          positional:
            - []
            - [get, set]
  - name: debug
    description: "Gathers information on Sanity environment"
    flags:
      "--secrets": "Include API keys in output"
  - name: deploy
    description: "Deploys a statically built Sanity studio"
    flags:
      "--source-maps": "Enable source maps for built bundles (increases size of bundle)"
      "--no-minify": "Skip minifying built JavaScript (speeds up build, increases size of bundle)"
      "--no-build": "Don't build the studio prior to deploy, instead deploying the version currently in `dist/`"
    completion:
      positional:
        - ["$directories"]
  - name: docs
    description: "Opens the Sanity documentation"
  - name: documents
    description: "Interact with documents in your project"
    commands:
      - name: create
        description: "Create one or more documents"
        flags:
          "--replace": "On duplicate document IDs, replace existing document with specified document(s)"
          "--missing": "On duplicate document IDs, don't modify the target document(s)"
          "--watch": "Write the documents whenever the target file or buffer changes"
          "--json5": "Use JSON5 file type to allow a \"simplified\" version of JSON"
          "--id=": "Specify a document ID to use. Will fetch remote document ID and populate editor"
          "--dataset=": "NAME to override dataset"
        completion:
          positional:
            - ["$files"]
      - name: delete
        description: "Delete a document by ID"
        flags:
          "--dataset=": "NAME to override dataset"
      - name: get
        description: "Get and print a document by ID"
        flags:
          "--pretty": "Colorized JSON output"
          "--dataset=": "NAME to override dataset"
      - name: query
        description: "Query for documents"
        flags:
          "--pretty": "Colorized JSON output"
          "--dataset=": "NAME to override dataset"
          "--api-version=": "API version to use (defaults to `v1`)"
  - name: exec
    description: "Runs a script in Sanity context"
    flags:
      "--with-user-token": "Preload access token from CLI config into 'part:@sanity/base/client' part"
      "--mock-browser-env": "Mocks a browser-like environment using jsdom"
    completion:
      positional:
        - ["$files"]
  - name: graphql
    description: "Interact with GraphQL APIs"
    commands:
      - name: deploy
        description: "Deploy a GraphQL API from the current Sanity schema"
        flags:
          "--dataset=": "Deploy API for the given dataset"
          "--tag=": "Deploy API to given tag (defaults to 'default')"
          "--generation=": "API generation to deploy (defaults to 'gen3')"
          "--non-null-document-fields": "Set document interface fields (_id, _type etc) as non-null"
          "--playground": "Deploy a GraphQL playground for easily testing queries (public)"
          "--no-playground": "Skip playground prompt (do not deploy a playground)"
          "--force": "Deploy API without confirming breaking changes"
      - name: list
        description: "Lists all the GraphQL endpoints deployed for this project"
      - name: undeploy
        description: "Remove a deployed GraphQL API"
        flags:
          "--dataset=": "Delete GraphQL API for the given dataset"
          "--tag=": "Delete GraphQL API for the given tag (defaults to 'default')"
  - name: hook
    description: "Interact with hooks in your project"
    commands:
      - name: attempt
        description: "Print details of a given webhook delivery attempt"
      - name: create
        description: "Create a new hook for the given dataset"
      - name: delete
        description: "Delete a hook within your project"
      - name: list
        description: "List hooks for a given project"
      - name: logs
        description: "List latest log entries for a given hook"
  - name: init
    description: "Initialize a new Sanity project or plugin"
    flags:
      "-y, --yes": "Use unattended mode, accepting defaults and using only flags for choices"
      "--project=": "Project ID to use for the studio"
      "--organization=": "Organization ID to use for the project"
      "--dataset=": "Dataset name for the studio"
      "--dataset-default": "Set up a project with a public dataset named \"production\""
      "--output-path=": "Path to write studio project to"
      "--template=": "Project template to use [default: \"clean\"]"
      "--provider=": "Login provider to use"
      "--visibility=": "Visibility mode for dataset (public/private)"
      "--create-project=": "Create a new project with the given name"
      "--project-plan=": "Optionally select a plan for a new project"
      "--coupon=": "Optionally select a coupon for a new project (cannot be used with --project-plan)"
      "--reconfigure": "Reconfigure Sanity studio in current folder with new project/dataset"
    exclusiveflags:
      - [coupon, project-plan]
    completion:
      flag:
        visibility: [public, private]
  - name: install
    description: "Installs a Sanity plugin to the current Sanity configuration"
  - name: login
    description: "Authenticates against the Sanity.io API (no flag) or a third-party identity provider (with --sso flag)"
    flags:
      "--sso=": "Authenticate against a third-party identity provider"
  - name: logout
    description: "Logs out of the Sanity.io session"
  - name: manage
    description: "Opens the Sanity project management UI"
  - name: projects
    description: "Interact with projects connected to your logged in user"
    commands:
      - name: list
        description: "Lists projects connected to your user"
        flags:
          "--sort=": "Sort output by specified column"
          "--order=": "Sort output ascending/descending"
        completion:
          flag:
            order: [asc, desc]
  - name: start
    description: "Starts a web server for the Content Studio"
    flags:
      "--port=": "TCP port to start server on. [default: 3333]"
      "--host=": "The local network interface at which to listen. [default: \"127.0.0.1\"]"
  - name: undeploy
    description: "Removes the deployed studio from <hostname>.sanity.studio"
  - name: uninstall
    description: "Removes a Sanity plugin from the current Sanity configuration"
  - name: upgrade
    description: "Upgrades all (or some) Sanity modules to their latest versions"
    flags:
      "--range=": "Version range to upgrade to, eg '^2.2.7' or '2.1.x'"
      "--tag=": "Tagged release to upgrade to, eg 'canary' or 'some-feature'"
      "--save-exact": "Pin the resolved version numbers in package.json (no ^ prefix)"
  - name: users
    description: "Manage users of your project"
    commands:
      - name: invite
        description: "Invite a new user to the project"
        flags:
          "--role=": "Role to invite the user as"
      - name: list
        description: "List users of the project"
        flags:
          "--no-invitations": "Don't include pending invitations"
          "--no-robots": "Don't include robots (token users)"
          "--sort=": "Sort users by specified column: id, name, role, date"
          "--order=": "Sort output ascending/descending"
        completion:
          flag:
            sort: [id, name, role, date]
            order: [asc, desc]
  - name: versions
    description: "Shows the installed versions of Sanity CLI and core components"
