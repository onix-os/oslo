# Converted from Fig's starkli.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: starkli
description: "Starkli, a ⚡ blazing ⚡ fast ⚡ CLI tool for Starknet powered by 🦀 starknet-rs 🦀"
commands:
  - name: account
    description: "Account management commands"
    flags:
      "-h, --help": "Print help"
    commands:
      - name: fetch
        description: "Fetch account config from an already deployed account contract"
        flags:
          "--rpc=": "Starknet JSON-RPC endpoint"
          "--network=": "Starknet network"
          "--force": "Overwrite the file if it already exists"
          "--output=": "Path to save the account config file"
          "--log-traffic": "Log raw request/response traffic of providers"
          "-h, --help": "Print help"
        completion:
          flag:
            network: [mainnet, goerli-1, goerli-2, integration]
            output: ["$files"]
      - name: deploy
        description: "Deploy account contract with a DeployAccount transaction"
        flags:
          "--rpc=": "Starknet JSON-RPC endpoint"
          "--network=": "Starknet network"
          "--keystore=": "Path to keystore JSON file"
          "--keystore-password=": "Supply keystore password from command line option instead of prompt"
          "--private-key=": "Private key in hex in plain text"
          "--max-fee=": "Maximum transaction fee in Ether (18 decimals)"
          "--max-fee-raw=": "Maximum transaction fee in Wei"
          "--estimate-only": "Only estimate transaction fee without sending transaction"
          "--log-traffic": "Log raw request/response traffic of providers"
          "-h, --help": "Print help"
        completion:
          flag:
            network: [mainnet, goerli-1, goerli-2, integration]
            keystore: ["$files"]
          positional:
            - ["$files"]
      - name: oz
        description: "Create and manage OpenZeppelin account contracts"
        flags:
          "-h, --help": "Print help"
        commands:
          - name: init
            description: "Create a new account configuration without actually deploying"
