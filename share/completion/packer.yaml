    commands:
      - name: install
        description: "Install latest Packer plugin [matching version constraint]"
        flags:
          "-h, --help": ""
      - name: installed
        description: "List all installed Packer plugin binaries"
        flags:
          "-h, --help": ""
      - name: remove
        description: "Remove Packer plugins [matching a version]"
        flags:
          "-h, --help": ""
      - name: required
        description: "List plugins required by a config"
        flags:
          "-h, --help": ""
  - name: validate
    description: "check that a template is valid"
    flags:
      "-syntax-only": "Only check syntax."
      "-except=": "Validate all builds other than these."
      "-only=": "Validate only these builds."
      "-machine-readable": "Produce machine-readable output."
      "-var=": "Variable for templates, can be used multiple times."
      "-var-file=": "JSON or HCL2 file containing user variables, can be used multiple times."
      "-no-warn-undeclared-var": "Disable warnings for user variable files containing undeclared variables."
      "-evaluate-datasources": "Evaluate data sources during validation (HCL2 only, may incur costs); Defaults to false."
      "-ignore-prerelease-plugins": "Disable the loading of prerelease plugin binaries (x.y.z-dev)."
      "-h, -help": "Print help"
  - name: version
    description: "Prints the Packer version"
    flags:
      "-h, --help": ""
