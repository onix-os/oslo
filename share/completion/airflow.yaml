          "-o, --output=": "Output format. Allowed values: json, yaml, plain, table (default: table)"
          "-S, --subdir=": "File location or directory from which to look for the dag. Defaults to '[AIRFLOW_HOME]/dags' where [AIRFLOW_HOME] is the value you set for 'AIRFLOW_HOME' config you set in 'airflow.cfg'"
          "-v, --verbose": "Make logging output more verbose"
        completion:
