# Converted from Fig's vapor.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: vapor
description: "Vapor Toolbox (Server-side Swift web framework)"
flags:
  "--help, -h=": "Show help for vapor"
completion:
  flag:
    help: [clean, heroku, new, run, supervisor, xcode, build]
commands:
  - name: build
    description: "Builds an app in the console"
  - name: new
    description: "Generates a new app"
    flags:
      "--template, -T": "The URL of a Git repository to use as a template"
      "--branch": "Template repository branch to use"
      "--output, -o": "The directory to place the new project in"
      "--no-commit": "Skips adding a first commit to the newly created repo"
  - name: clean
    description: "Cleans temporary files"
    flags:
      "--update, -u": "Delete Package.resolved file if it exists"
      "--global, -g": "Clean Xcode's global DerivedData cache"
      "--swiftpm, -s": "Delete .swiftpm folder"
  - name: heroku
    description: "Commands for working with Heroku"
    commands:
      - name: init
        description: "Configures app for deployment to Heroku"
      - name: push
        description: "Deploys app to Heroku"
  - name: run
    description: "Runs an app from the console. Equivalent to `swift run --enable-test-discovery Run`"
  - name: supervisor
    description: "Commands for working with Supervisord"
    commands:
      - name: init
        description: "Creates a Supervisor entry for the current project"
      - name: restart
        description: "Restarts current project in Supervisor"
      - name: update
        description: "Updates Supervisor entry for current project"
  - name: xcode
    description: "Opens an app in Xcode"
