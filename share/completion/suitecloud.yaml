# Converted from Fig's suitecloud.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: suitecloud
description: "SuiteCloud CLI"
flags:
  "--version": "Outputs the version number"
  "-h, --help": "Displays help for the command"
commands:
  - name: "account:manageauth"
    description: "Manages authentication IDs (authID) for all your projects. An authentication ID is a custom alias you gave to a specific account-role combination"
    flags:
      "-i, --interactive": "Runs the command in interactive mode"
      "--info=": "Prints the following information for the specified authentication ID (authID): account ID, role ID, and url. Usage: account:manageauth --info {authID}"
      "--list": "Prints a list of all the configured authentication IDs (authID). Usage: account:manageauth --list"
      "--remove=": "Removes an authentication ID (authID). Usage: account:manageauth --remove {authID}"
      "--rename=": "Renames an authentication ID (authID). You must specify it together with the renameto option. Usage: account:manageauth --rename {authID} --renameto {newauthID}"
      "--renameto=": "Specifies the new ID for an authentication ID (authID). You must specify it together with the rename option. Usage: account:manageauth --rename {authID} --renameto {newauthID}"
      "-h, --help": "Displays help for the command"
  - name: "account:savetoken"
    description: "Saves a TBA token that you issued previously in NetSuite"
    flags:
      "--account=": "Specifies the ID of the account to log in to"
      "--authid=": "References the custom name you gave to a specific account-role combination"
      "--tokenid=": "Specifies the token ID of a TBA token you issued previously in NetSuite"
      "--tokensecret=": "Specifies the token secret of a TBA token you issued previously in NetSuite"
      "--url=": "Specifies the NetSuite domain of the account you want to use. You only need to specify the NetSuite domain if you are not using a production account"
      "-h, --help": "Displays help for the command"
  - name: "account:setup"
    description: "Sets up an account to use with the SuiteCloud CLI for Node.js"
    flags:
      "-i, --interactive": "Runs the command in interactive mode"
      "-d, --dev": "Specifies the NetSuite domain of the account you want to use. You only need to specify the NetSuite domain if you are not using a production account"
      "-h, --help": "Displays help for the command"
  - name: "file:create"
    description: "Creates a SuiteScript file"
    flags:
      "-i, --interactive": "Runs the command in interactive mode"
      "--module=": "Specifies the SuiteScript modules you want to add to the SuiteScript file. For example, \"N/record\""
      "--path=": "Specifies the File Cabinet path of the SuiteScript file to create. For example, \"/SuiteScripts/ClientScipt.js\""
      "--type=": "Specifies the type of the SuiteScript file that you want to create. For example, \"ClientScript\""
      "-h, --help": "Displays help for the command"
  - name: "file:import"
    description: "Imports files from an account to your account customization project. You cannot import files from a SuiteApp"
    flags:
      "-i, --interactive": "Runs the command in interactive mode"
      "--path=": "Specifies the File Cabinet paths of the files to import. For example, \"/SuiteScripts/file.js\""
      "--calledfromcomparefiles": "Message displayed should be different if called from Compare Files"
      "--excludeproperties": "Excludes all file properties within the .attributes folder"
      "-h, --help": "Displays help for the command"
  - name: "file:list"
    description: "Lists the files in the File Cabinet of your account"
    flags:
      "-i, --interactive": "Runs the command in interactive mode"
      "--folder=": "Specifies the File Cabinet path, for example, \"/SuiteScripts\". All files within subfolders are included"
      "-h, --help": "Displays help for the command"
    completion:
      flag:
        folder: ["$directories"]
  - name: "file:upload"
    description: "Uploads files from your project to an account"
    flags:
      "-i, --interactive": "Runs the command in interactive mode"
      "--paths=": {description: "Specifies the file cabinet paths of the files to upload. To specify multiple paths, enter a space between paths and enclose the entire argument in double quotes. For example, \"/SuiteScripts/file.js\" for account customization projects, and \"/SuiteApps/com.project.example/script.js\" for SuiteApp projects", nargs: -1}
      "-h, --help": "Displays help for the command"
    completion:
      flag:
        paths: ["$files"]
  - name: "object:import"
    description: "Imports custom objects from your NetSuite account to the SuiteCloud project. In account customization projects (ACP), if SuiteScript files are referenced in the custom objects you import, these files get imported by default"
    flags:
      "-i, --interactive": "Runs the command in interactive mode"
      "--appid=": "Specifies your application ID. If specified, only custom objects with that application ID are imported. Otherwise, only custom objects with no application ID are imported"
      "--destinationfolder": "Specifies the project folder where objects will be stored. It must be within the Objects folder of your project. For example, /Objects/MyObjects"
      "--excludefiles": "Indicates that the SuiteScript files referenced in custom objects are not imported. It can only be used in account customization projects (ACP)"
      "--scriptid": "Specifies the script ID. To specify multiple IDs, enter the IDs separated by spaces. Enter \"ALL\" to import all custom objects of the specified type"
      "--type": "Specifies the type of custom objects to import. Enter \"ALL\" to import all custom objects. To see what custom objects are supported by SDF, see https://system.netsuite.com/app/help/helpcenter.nl?fid=sdfxml.html"
      "-h, --help": "Displays help for the command"
  - name: "object:list"
    description: "Lists the custom objects deployed in an account"
    flags:
      "-i, --interactive": "Runs the command in interactive mode"
      "--appid=": "Specifies your application ID. If specified, only custom objects with that application ID are listed. Otherwise, only custom objects with no application ID are listed"
      "--scriptid=": "Specifies the script ID. If you specify it, only objects containing that script ID will be listed. Otherwise, all objects are listed"
      "--type=": {description: "Specifies the type of custom objects to list. To specify multiple types, enter the types separated by spaces. Otherwise, all types are listed. To see what custom objects are supported by SDF, see https://system.netsuite.com/app/help/helpcenter.nl?fid=sdfxml.html", nargs: -1}
      "-h, --help": "Displays help for the command"
  - name: "object:update"
    description: "Overwrites the custom objects in the project with the custom objects in an account"
    flags:
      "-i, --interactive": "Runs the command in interactive mode"
      "--includeinstances": "Includes instances. This is only available for custom records"
      "--scriptid=": "Specifies the script ID of the objects you want to overwrite"
      "-h, --help": "Displays help for the command"
  - name: "project:adddependencies"
    description: "Adds the missing dependencies to the manifest file"
  - name: "project:create"
    description: "Creates a SuiteCloud project, either a SuiteApp or an account customization project (ACP)"
    flags:
      "-i, --interactive": "Runs the command in interactive mode"
      "--overwrite": "Overwrites the existing project"
      "--projectid=": "Specifies the project ID. It is mandatory for SuiteApps"
      "--projectname=": "Specifies the project name"
      "--projectversion=": "Specifies the project version. It is mandatory for SuiteApps"
      "--publisherid=": "Specifies the publisher ID. It is mandatory for SuiteApps"
      "--type=": "Specifies the project type. Enter one of the following options: ACCOUNTCUSTOMIZATION or SUITEAPP"
      "-h, --help": "Displays help for the command"
    completion:
      flag:
        type: [ACCOUNTCUSTOMIZATION, SUITEAPP]
  - name: "project:deploy"
    description: "Deploys the folder containing the project. The project folder is zipped before deployment, only including the files and folders referenced in the deploy.xml file"
    flags:
      "-i, --interactive": "Runs the command in interactive mode"
      "--dryrun": "Runs a preview of your deploy process. Your project is not deployed"
      "--log=": "Sets the deployment log file location, as either a directory or a file name. If it is a directory, a default log file is generated in the specified location. If a log file already exists in the specified location, deployment log details are appended to that existing file"
      "--validate": "Validates the project before deploying. If an error ocurrs during the deployment, the process is stopped"
      "--accountspecificvalues=": "Indicates how to handle the presence of account-specific values in an account customization project. If there are account-specific values in the project, enter WARNING to continue with the deployment process, or ERROR to stop it. If the option is not specified, the default value is ERROR. It only applies to account customization projects"
      "-a, --applyinstallprefs": "Applies the settings from the hiding.xml, locking.xml, and overwriting.xml files. It only applies to SuiteApps"
      "-h, --help": "Displays help for the command"
    completion:
      flag:
        log: ["$directories", "$files"]
        accountspecificvalues: [ERROR, WARNING]
  - name: "project:package"
    description: "Generates a ZIP file from your project, respecting the structure specified in the deploy.xml file"
    flags:
      "-i, --interactive": "Runs the command in interactive mode"
      "-h, --help": "Displays help for the command"
  - name: "project:validate"
    description: "Validates the folder containing the SuiteCloud project"
    flags:
      "-i, --interactive": "Runs the command in interactive mode"
      "--log=": "Sets the validation log file location, as either a directory or a file name. If it is a directory, a default log file is generated in the specified location. If a log file already exists in the specified location, validation log details are appended to that existing file"
      "--server": "Indicates that the server will perform the validation"
      "--accountspecificvalues=": "Indicates how to handle the presence of account-specific values in an account customization project. If there are account-specific values in the project, enter WARNING to continue with the deployment process, or ERROR to stop it. If the option is not specified, the default value is ERROR. It only applies to account customization projects"
      "-a, --applyinstallprefs": "Applies the settings from the hiding.xml, locking.xml, and overwriting.xml files. It only applies to SuiteApps"
      "-h, --help": "Displays help for the command"
    completion:
      flag:
        log: ["$directories", "$files"]
        accountspecificvalues: [ERROR, WARNING]
