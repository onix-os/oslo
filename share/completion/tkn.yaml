        flags:
          "--allow-missing-template-keys": "If true, ignore any errors in templates when a field or map key is missing in the template. Only applies to golang and jsonpath output formats"
          "--cache-dir=": "A directory to cache Tekton bundles in"
          "--no-cache": "If set to true, pulls a Tekton bundle from the remote even its exact digest is available in the cache"
          "--output, -o=": "Output format. One of: (json, yaml, name, go-template, go-template-file, template, templatefile, jsonpath, jsonpath-as-json, jsonpath-file)"
          "--remote-bearer=": "A Bearer token to authenticate against the repository"
          "--remote-password=": "A password to pass to the registry for basic auth. Must be used with --remote-username"
          "--remote-skip-tls": "If set to true, skips TLS check when connecting to the registry"
          "--remote-username=": "A username to pass to the registry for basic auth. Must be used with --remote-password"
          "--show-managed-fields": "If true, keep the managedFields when printing objects in JSON or YAML format"
          "--template=": "Template string or path to template file to use when -o=go-template, -o=go-template-file. The template format is golang templates [http://golang.org/pkg/text/template/#pkg-overview]"
