# Converted from Fig's stow.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: stow
description: "Manage farms of symbolic links"
flags:
  "-n, --no": "Do not perform any operations that modify the filesystem; merely show what would happen"
  "-d, --dir=": "Set the stow directory to 'DIR' instead of the current directory. This also has the effect of making the default target directory be the parent of 'DIR'"
  "-t, --target=": "Set the target directory to 'DIR' instead of the parent of the stow directory"
  "-v, --verbose=": "Send verbose output to standard error describing what Stow is doing. Verbosity levels are from 0 to 5; 0 is the default. Using '-v' or '--verbose' increases the verbosity by one; using `--verbose=N' sets it to N"
  "-S, --stow": "Stow the packages that follow this option into the target directory. This is the default action and so can be omitted if you are only stowing packages rather than performing a mixture of stow/delete/restow actions"
  "-D, --delete": "Unstow the packages that follow this option from the target directory rather than installing them"
  "-R, --restow": "Restow packages (first unstow, then stow again). This is useful for pruning obsolete symlinks from the target tree after updating the software in a package"
  "--adopt": "This behaviour is specifically intended to alter the contents of your stow directory. If you do not want that, this option is not for you"
  "--no-folding": "Disable folding of newly stowed directories when stowing, and refolding of newly foldable directories when unstowing"
  "--ignore=": "Ignore files ending in this Perl regex"
  "--defer=": "Don't stow files beginning with this Perl regex if the file is already stowed to another package"
  "--override=": "Force stowing files beginning with this Perl regex if the file is already stowed to another package"
  "--dotfiles": "Enable special handling for 'dotfiles' (files or folders whose name begins with a period) in the package directory. If this option is enabled, Stow will add a preprocessing step for each file or folder whose name begins with 'dot - ', and replace the 'dot- ' prefix in the name by a period (.). This is useful when Stow is used to manage collections of dotfiles, to avoid having a package directory full of hidden files"
  "-V, --version": "Show Stow version, and exit"
  "-h, --help": "Show Stow command syntax, and exit"
completion:
  flag:
    dir: ["$directories"]
    target: ["$directories"]
    verbose: [0, 1, 2, 3, 4, 5]
