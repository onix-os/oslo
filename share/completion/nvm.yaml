# Converted from Fig's nvm.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: nvm
description: "Node Package Manager"
flags:
  "--help": "Show help page"
  "--version": "Print out the installed version of nvm"
  "--no-colors": "Suppress colored output"
commands:
  - name: install
    description: "Download and install a <version>. Uses .nvmrc if available and version is omitted"
    flags:
      "-s": "Skip binary download, install from source only"
      "--reinstall-packages-from=": "When installing, reinstall packages installed in <version>"
      "--lts": "When installing, only select from LTS (long-term support) versions"
      "--lts=": "When installing, only select from versions for a specific LTS line"
      "--skip-default-packages": "When installing, skip the default-packages file if it exists"
      "--latest-npm": "After installing, attempt to upgrade to the latest working npm on the given node version"
      "--no-progress": "Disable the progress bar on any downloads"
      "--alias=": "After installing, set the alias specified to the version specified. (same as: nvm alias <name> <version>)"
      "--default": "After installing, set default alias to the version specified. (same as: nvm alias default <version>)"
    completion:
      flag:
        reinstall-packages-from: ["node\tThe latest version of node", "iojs\tThe latest version of io.js", "system\tSystem-installed version of node"]
      positional:
        - ["node\tThe latest version of node", "iojs\tThe latest version of io.js", "system\tSystem-installed version of node"]
  - name: uninstall
    description: "Uninstall a version"
    flags:
      "--lts": "Uninstall using automatic LTS (long-term support) alias `lts/*`, if available"
      "--lts=": "Uninstall using automatic alias for provided LTS line, if available"
    completion:
      positional:
        - ["node\tThe latest version of node", "iojs\tThe latest version of io.js", "system\tSystem-installed version of node"]
  - name: use
    description: "Modify PATH to use <version>. Uses .nvmrc if available and version is omitted"
    flags:
      "--silent": "Silences stdout/stderr output"
      "--lts": "Uses automatic LTS (long-term support) alias `lts/*`, if available"
      "--lts=": "Uses automatic alias for provided LTS line, if available"
    completion:
      positional:
        - ["node\tThe latest version of node", "iojs\tThe latest version of io.js", "system\tSystem-installed version of node"]
  - name: exec
    description: "Run <command> on <version>. Uses .nvmrc if available and version is omitted"
    flags:
      "--silent": "Silences stdout/stderr output"
      "--lts": "Uses automatic LTS (long-term support) alias `lts/*`, if available"
      "--lts=": "Uses automatic alias for provided LTS line, if available"
    completion:
      positional:
        - ["node\tThe latest version of node", "iojs\tThe latest version of io.js", "system\tSystem-installed version of node"]
  - name: run
    description: "Run `node` on <version> with <args> as arguments. Uses .nvmrc if available and version is omitted"
    flags:
      "--silent": "Silences stdout/stderr output"
      "--lts": "Uses automatic LTS (long-term support) alias `lts/*`, if available"
      "--lts=": "Uses automatic alias for provided LTS line, if available"
    completion:
      positional:
        - ["node\tThe latest version of node", "iojs\tThe latest version of io.js", "system\tSystem-installed version of node"]
  - name: current
    description: "Display currently activated version of Node"
  - name: ls
    description: "List installed versions, matching a given <version> if provided"
    flags:
      "--no-colors": "Suppress colored output"
      "--no-alias": "Suppress `nvm alias` output"
    completion:
      positional:
        - ["node\tThe latest version of node", "iojs\tThe latest version of io.js", "system\tSystem-installed version of node"]
  - name: ls-remote
    description: "List remote versions available for install, matching a given <version> if provided"
    flags:
      "--lts": "When listing, only show LTS (long-term support) versions"
      "--lts=": "When listing, only show versions for a specific LTS line"
      "--no-colors": "Suppress colored output"
    completion:
      positional:
        - ["node\tThe latest version of node", "iojs\tThe latest version of io.js", "system\tSystem-installed version of node"]
  - name: version
    description: "Resolve the given description to a single local version"
    completion:
      positional:
        - ["node\tThe latest version of node", "iojs\tThe latest version of io.js", "system\tSystem-installed version of node"]
  - name: version-remote
    description: "Resolve the given description to a single remote version"
    flags:
      "--lts": "When listing, only show LTS (long-term support) versions"
      "--lts=": "When listing, only show versions for a specific LTS line"
    completion:
      positional:
        - ["node\tThe latest version of node", "iojs\tThe latest version of io.js", "system\tSystem-installed version of node"]
  - name: deactivate
    description: "Undo effects of `nvm` on current shell"
    flags:
      "--silent": "Silences stdout/stderr output"
  - name: alias
    description: "Show all aliases beginning with <pattern> or Set an alias named <name> pointing to <version>"
  - name: unalias
    description: "Deletes the alias named <name>"
  - name: install-latest-npm
    description: "Attempt to upgrade to the latest working `npm` on the current node version"
  - name: reinstall-packages
    description: "Reinstall global `npm` packages contained in <version> to current version"
    completion:
      positional:
        - ["node\tThe latest version of node", "iojs\tThe latest version of io.js", "system\tSystem-installed version of node"]
  - name: unload
    description: "Unload `nvm` from shell"
  - name: which
    description: "Display path to installed node version. Uses .nvmrc if available and version is omitted"
    flags:
      "--silent": "Silences stdout/stderr output when a version is omitted"
    completion:
      positional:
        - ["node\tThe latest version of node", "iojs\tThe latest version of io.js", "system\tSystem-installed version of node"]
    commands:
      - name: current
  - name: cache
    completion:
      positional:
        - ["dir\tDisplay path to the cache directory for nvm", "clear\tEmpty cache directory for nvm"]
  - name: set-colors
    description: "Set five text colors using format \"yMeBg\". Available when supported"
