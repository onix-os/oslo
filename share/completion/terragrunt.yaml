  "--terragrunt-exclude-dir=": "Unix-style glob of directories to exclude when running *-all commands"
  "--terragrunt-include-dir=": "Unix-style glob of directories to include when running *-all commands"
  "--terragrunt-strict-include": "Only modules under the directories passed in with –terragrunt-include-dir will be included. All dependencies of the included directories will be excluded if they are not in the included directories. If no –terragrunt-include-dir flags are included, terragrunt will not include any modules during the execution of the commands"
