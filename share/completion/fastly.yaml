# Converted from Fig's fastly.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: fastly
description: "A CLI for interacting with the Fastly platform"
flags:
  "--help": "Show context-sensitive help"
  "--accept-defaults": "Accept default options for all interactive prompts apart from Yes/No confirmations"
  "--auto-yes": "Answer yes automatically to all Yes/No confirmations. This may suppress security warnings"
  "--non-interactive": "Do not prompt for user input - suitable for CI processes. Equivalent to --accept-defaults and --auto-yes"
  "--profile=": "Switch account profile for single command execution (see also: 'fastly profile switch')"
  "--token=": "Fastly API token (or via FASTLY_API_TOKEN)"
  "--verbose": "Verbose logging"
commands:
  - name: acl
    description: "Manipulate Fastly ACLs (Access Control Lists)"
    commands:
      - name: create
        description: "Create a new ACL attached to the specified service version"
        flags:
          "--name=": "Name for the ACL. Must start with an alphanumeric character and contain only alphanumeric characters, underscores, and whitespace"
          "--version=": "'latest', 'active', or the number of a specific version"
          "--autoclone": "If the selected service version is not editable, clone it and use the clone"
          "--service-id=": "Service ID (falls back to FASTLY_SERVICE_ID, then fastly.toml)"
          "--service-name=": "The name of the service"
      - name: delete
        description: "Delete an ACL from the specified service version"
        flags:
          "--name=": "The name of the ACL to delete"
          "--version=": "'latest', 'active', or the number of a specific version"
          "--autoclone": "If the selected service version is not editable, clone it and use the clone"
          "--service-id=": "Service ID (falls back to FASTLY_SERVICE_ID, then fastly.toml)"
          "--service-name=": "The name of the service"
      - name: describe
        description: "Retrieve a single ACL by name for the version and service"
        flags:
          "--name=": "The name of the ACL"
          "--version=": "'latest', 'active', or the number of a specific version"
          "--json": "Render output as JSON"
          "--service-id=": "Service ID (falls back to FASTLY_SERVICE_ID, then fastly.toml)"
          "--service-name=": "The name of the service"
      - name: list
        description: "List ACLs"
        flags:
          "--version=": "'latest', 'active', or the number of a specific version"
          "--json": "Render output as JSON"
          "--service-id=": "Service ID (falls back to FASTLY_SERVICE_ID, then fastly.toml)"
          "--service-name=": "The name of the service"
      - name: update
        description: "Update an ACL for a particular service and version"
        flags:
          "--name=": "The name of the ACL to update"
          "--new-name=": "The new name of the ACL"
          "--version=": "'latest', 'active', or the number of a specific version"
          "--autoclone": "If the selected service version is not editable, clone it and use the clone"
          "--service-id=": "Service ID (falls back to FASTLY_SERVICE_ID, then fastly.toml)"
          "--service-name=": "The name of the service"
  - name: acl-entry
    description: "Manipulate Fastly ACL (Access Control List) entries"
    commands:
      - name: create
        description: "Add an ACL entry to an ACL"
        flags:
          "--acl-id=": "Alphanumeric string identifying a ACL"
          "--ip=": "An IP address"
          "--comment=": "A freeform descriptive note"
          "--negated": "Whether to negate the match"
          "--service-id=": "Service ID (falls back to FASTLY_SERVICE_ID, then fastly.toml)"
          "--service-name=": "The name of the service"
          "--subnet=": "Number of bits for the subnet mask applied to the IP address"
      - name: delete
        description: "Delete an ACL entry from a specified ACL"
        flags:
          "--acl-id=": "Alphanumeric string identifying a ACL"
          "--id=": "Alphanumeric string identifying an ACL Entry"
          "--service-id=": "Service ID (falls back to FASTLY_SERVICE_ID, then fastly.toml)"
          "--service-name=": "The name of the service"
      - name: describe
