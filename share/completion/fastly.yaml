          "--service-name=": "The name of the service"
          "--sort=": "Field on which to sort"
      - name: update
        description: "Update an ACL entry for a specified ACL"
        flags:
          "--acl-id=": "Alphanumeric string identifying a ACL"
          "--comment=": "A freeform descriptive note"
          "--file=": "Batch update json passed as file path or content, e.g. $(< batch.json)"
          "--id=": "Alphanumeric string identifying an ACL Entry"
          "--ip=": "An IP address"
          "--negated": "Whether to negate the match"
          "--service-id=": "Service ID (falls back to FASTLY_SERVICE_ID, then fastly.toml)"
