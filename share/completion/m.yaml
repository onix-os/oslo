        description: "Show help"
  - name: battery
    description: "Manage battery"
    commands:
      - name: status
        description: "Show battery status"
      - name: help
        description: "Show help"
  - name: bluetooth
    description: "Manage Bluetooth"
    commands:
      - name: status
        description: "Show bluetooth status"
      - name: "on"
        description: "Enable bluetooth"
      - name: enable
        description: "Enable bluetooth"
      - name: "off"
        description: "Disable bluetooth"
      - name: disable
        description: "Disable bluetooth"
      - name: help
        description: "Show help"
  - name: dir
    description: "Manage directories"
    commands:
      - name: tree
        description: "Show tree view of folders in the current path"
        completion:
          positional:
            - ["$directories"]
      - name: delete
        description: "Delete folders"
        commands:
          - name: empty
            description: "Delete empty folders recursively in the current path"
            completion:
              positional:
                - ["$directories"]
          - name: dsfiles
            description: "Delete .DS_Store files recursively in the current path"
            completion:
              positional:
                - ["$directories"]
      - name: dsfiles
        description: "Manage .DS_Store files"
        commands:
          - name: "on"
            description: "Restore generation of .DS_Store"
          - name: "off"
            description: "Prohibit generation of .DS_Store"
      - name: size
        description: "Calculate current folder size"
        completion:
          positional:
            - ["$directories"]
      - name: help
        description: "Show help"
  - name: disk
    description: "Manage disks"
    commands:
      - name: ls
        aliases: [list]
        description: "List disk partitions"
      - name: info
        description: "Show disk information"
      - name: ejectall
        description: "Eject all mountable volumes"
      - name: verify
        description: "Verify disk"
        commands:
          - name: volume
            description: "Verify volume"
          - name: disk
            description: "Verify disk"
      - name: repair
        description: "Repair disk"
        commands:
          - name: volume
            description: "Repair volume"
          - name: disk
            description: "Repair disk"
      - name: format
        description: "Format disk"
        commands:
          - name: MS-DOS
            description: "Format the entire disk with a windows format (MS-DOS)"
          - name: volume
            description: "Format the volume with a windows format (MS-DOS)"
      - name: reformat
        description: "Reformat a volume"
      - name: rename
        description: "Rename a volume"
      - name: help
        description: "Show help"
