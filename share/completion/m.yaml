# Converted from Fig's m.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: m
description: "Swiss Army Knife for macOS"
flags:
  "--update": "Update m-cli to the latest version"
  "--uninstall": "Uninstall m-cli"
commands:
  - name: airdrop
    description: "Manage AirDrop"
    commands:
      - name: status
        description: "Show AirDrop status"
      - name: "on"
        description: "Enable AirDrop"
      - name: enable
        description: "Enable AirDrop"
      - name: "off"
        description: "Disable AirDrop"
      - name: disable
        description: "Disable AirDrop"
      - name: help
        description: "Show help"
  - name: appearance
    description: "Manage appearance"
    commands:
      - name: darkmode
        description: "Manage dark mode"
        completion:
          positional:
            - ["YES", "NO"]
      - name: transparency
        description: "Manage transparency"
        completion:
          positional:
            - ["YES", "NO"]
      - name: antialiasthreshold
        description: "Manage antialiasing threshold"
      - name: sidebariconsize
        description: "Manage sidebar icon size"
        completion:
          positional:
            - [small, medium, large]
      - name: maincolor
        description: "Manage main color"
        completion:
          positional:
            - [blue, graphite]
      - name: highlightcolor
        description: "Manage highlight color"
        completion:
          positional:
            - [graphite, cayenne, asparagus, clover, teal, midnight, plum, tin, nickel, mocha, fern, moss, ocean, eggplant, maroon, steel, aluminum, maraschino, lemon, spring, turquoise, blueberry, magenta, iron, magnesium, tangerine, lime, seafoam, aqua, grape, strawberry, tungsten, silver, salmon, banana, flora, ice, orchid, bubblegum, lead, mercery, cantaloupe, honeydew, spindrift, sky, lavender, carnation, licorice, snow]
