name: objdump
flags:
  "-a, --archive-header": "If any of the objfile files are archives, display the archive header information (in a format similar to ls -l)."
  "--adjust-vma=": "When dumping information, first add offset to all the section addresses."
  "-b, --target=": "Specify that the object-code format for the object files is bfdname."
  "-C, --demangle=": "Decode (demangle) low-level symbol names into user-level names."
  "--recurse-limit": "Enables or disables a limit on the amount of recursion performed whilst demangling strings."
  "--no-recurse-limit": "Enables or disables a limit on the amount of recursion performed whilst demangling strings."
  "--recursion-limit": "Enables or disables a limit on the amount of recursion performed whilst demangling strings."
  "--no-recursion-limit": "Enables or disables a limit on the amount of recursion performed whilst demangling strings."
  "-g, --debugging": "Display debugging information."
  "-e, --debugging-tags": "Like -g, but the information is generated in a format compatible with ctags tool."
  "-d, --disassemble=": "Display the assembler mnemonics for the machine instructions from the input file."
  "-D, --disassemble-all": "Like -d, but disassemble the contents of all sections, not just those expected to contain instructions."
  "--no-addresses": "When disassembling, don't print addresses on each line or for symbols and relocation offsets."
  "--prefix-addresses": "When disassembling, print the complete address on each line."
  "-EB=": "Specify the endianness of the object files."
  "-EL=": "Specify the endianness of the object files."
  "--endian=": "Specify the endianness of the object files."
  "-f, --file-headers": "Display summary information from the overall header of each of the objfile files."
  "-F, --file-offsets": "When disassembling sections, whenever a symbol is displayed, also display the file offset of the region of data that is about to be dumped."
  "--file-start-context": "Specify that when displaying interlisted source code/disassembly (assumes -S) from a file that has not yet been displayed, extend the context to the start of the file."
  "-h": "Display summary information from the section headers of the object file."
  "--section-headers": "Display summary information from the section headers of the object file."
  "--headers": "Display summary information from the section headers of the object file."
  "-H, --help": "Print a summary of the options to objdump and exit."
  "-i, --info": "Display a list showing all architectures and object formats available for specification with -b or -m."
  "-j, --section=": "Display information only for section name."
  "-L, --process-links": "Display the contents of non-debug sections found in separate debuginfo files that are linked to the main file."
  "-l, --line-numbers": "Label the display (using debugging information) with the filename and source line numbers corresponding to the object code or relocs shown."
  "-m, --architecture=": "Specify the architecture to use when disassembling object files."
  "-M, --disassembler-options=": "Pass target specific information to the disassembler."
  "-p, --private-headers": "Print information that is specific to the object file format."
  "-P, --private=": "Print information that is specific to the object file format."
  "-r, --reloc": "Print the relocation entries of the file."
  "-R, --dynamic-reloc": "Print the dynamic relocation entries of the file."
  "-s, --full-contents": "Display the full contents of any sections requested."
  "-S, --source": "Display source code intermixed with disassembly, if possible."
  "--source-comment=": "Like the -S option, but all source code lines are displayed with a prefix of txt."
  "--prefix=": "Specify prefix to add to the absolute paths when used with -S."
  "--prefix-strip=": "Indicate how many initial directory names to strip off the hardwired absolute paths."
  "--show-raw-insn": "When disassembling instructions, print the instruction in hex as well as in symbolic form."
  "--no-show-raw-insn": "When disassembling instructions, do not print the instruction bytes."
  "--insn-width=": "Display width bytes on a single line when disassembling instructions."
  "--visualize-jumps=": "Visualize jumps that stay inside a function by drawing ASCII art between the start and target addresses."
  "-W, --dwarf=": "Displays the contents of the DWARF debug sections in the file, if any are present."
  "--dwarf-depth=": "Limit the dump of the \".debug_info\" section to n children."
  "--dwarf-start=": "Print only DIEs beginning with the DIE numbered n."
  "--dwarf-check": "Enable additional checks for consistency of Dwarf information."
  "--ctf=": "Display the contents of the specified CTF section."
  "--ctf-parent=": "If the CTF section contains ambiguously-defined types, it will consist of an archive of many CTF dictionaries, all inheriting from one dictionary containing unambiguous types."
  "-G, --stabs": "Display the full contents of any sections requested."
  "--start-address=": "Start displaying data at the specified address."
  "--stop-address=": "Stop displaying data at the specified address."
  "-t, --syms": "Print the symbol table entries of the file."
  "-T, --dynamic-syms": "Print the dynamic symbol table entries of the file."
  "--special-syms": "When displaying symbols include those which the target considers to be special in some way and which would not normally be of interest to the user."
  "-U, --unicode=": "Controls the display of UTF-8 encoded multibyte characters in strings."
  "-V, --version": "Print the version number of objdump and exit."
  "-x, --all-headers": "Display all available header information, including the symbol table and relocation entries."
  "-w, --wide": "Format some lines for output devices that have more than 80 columns."
  "-z, --disassemble-zeroes": "Normally the disassembly output will skip blocks of zeroes."
completion:
  flag:
    EB: [big, little]
    EL: [big, little]
    endian: [big, little]
    visualize-jumps: [color, extended-color, "off"]
    unicode: [default, invalid, locale, escape, hex, highlight]
