            file: ["$files"]
            iglob: ["$files", "$directories"]
            ignore-file: ["$files"]
            sort: ["none\tDo not sort results. Fastest. Can be multi-threaded", "path\tSort by file path, Always single-threaded", "modified\tSort by the last modified time on a file. Always single-threaded", "accessed\tSort by the last accessed time on a file. Always single-threaded", "created\tSort by the creation time on a file. Always single-threaded"]
