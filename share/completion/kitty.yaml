# Converted from Fig's kitty.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: kitty
flags:
  "-T, --title=": "Set the OS window title"
  "-C, --config=": "Specify a path to the configuration file(s) to use"
  "-o, --override*": "Override individual configuration options"
  "-d, --directory, --working-directory=": "Change to the specified directory when launching"
  "--session=": "Path to a file containing the startup session"
  "--hold": "Remain open after child process exits"
  "-1, --single-instance": "Only a single instance of kitty will run"
  "--instance-group=": "Kitty will open a new window in an existing instance and quit immediately"
  "--wait-for-single-instance-window-close": "The new window will not quit till the newly opened window is closed"
  "--listen-on=": "Tell kitty to listen on the specified address for control messages"
  "--start-as=": "Control how the initial kitty window is created"
  "-v, --version": "The current kitty version"
  "-h, --help": "Display this help message"
completion:
  flag:
    config: ["$files"]
    directory: ["$directories"]
    session: ["-\tRead from stdin", "$files"]
    start-as: [normal, fullscreen, maximized, minimized]
commands:
  - name: "@"
    flags:
      "--to=": "An address for the kitty instance to control"
    commands:
      - name: close-tab
        description: "Close the specified tab(s)"
        flags:
          "-m, --match=": "The tab to match"
          "--self": "Close the tab of the window this command is run in, rather than the active tab"
          "--target-group=": "Close the specified group of tabs"
      - name: close-window
        description: "Close the specified window(s)"
        flags:
          "-m, --match=": "The window to match"
          "--self": "Close the window this command is run in, rather than the active window"
      - name: create-marker
        flags:
          "-m, --match=": "The window to match"
          "--self": "Close the window this command is run in, rather than the active window"
      - name: detach-tab
        description: "Detach the specified tab"
        flags:
          "-m, --match=": "The tab to match"
          "-t, --target-tab=": "The tab to match"
          "--self": "Detach the tab this command is run in, rather than the active tab"
      - name: detach-window
        description: "Detach the specified window"
        flags:
          "-m, --match=": "The window to match"
          "-t, --target-tab=": "The tab to match"
          "--self": "Detach the window this command is run in, rather than the active window"
      - name: disable-ligatures
        description: "Control ligature rendering for the specified windows/tabs"
        flags:
          "-a, --all": "Disable in all windows"
          "-m, --match=": "The window to match"
          "-t, --match-tab": "The tab to match"
        completion:
          positional:
            - [never, always, cursor]
      - name: env
        description: "Change the environment variables seen by processing in newly launched windows"
      - name: focus-tab
        description: "The active window in the specified tab will be focused"
        flags:
          "-m, --match=": "The tab to match"
          "--no-response": "Don't wait for a response indicating the success of the action"
      - name: focus-window
        description: "Focus the specified window, if no window is specified, focus the window this command is run inside"
        flags:
          "-m, --match=": "The window to match"
          "--no-response": "Don't wait for a response indicating the success of the action"
      - name: get-colors
        description: "Get the terminal colors for the specified window"
        flags:
          "-c, --configured": "Instead of outputting the colors for the specified window, output the currently configured colors"
          "-m, --match": "The window to match"
      - name: get-text
      - name: goto-layout
      - name: kitten
      - name: last-used-layout
      - name: launch
      - name: ls
      - name: new-window
      - name: remove-marker
      - name: resize-os-window
      - name: resize-window
      - name: scroll-window
      - name: select-window
      - name: send-text
      - name: set-background-image
      - name: set-background-opacity
      - name: set-colors
      - name: set-enabled-layouts
      - name: set-font-size
      - name: set-spacing
      - name: set-tab-color
        description: "The foreground and background colors when active and inactive can be overridden using this command"
        flags:
          "-m, --match=": "The tab to match"
          "--self": "Close the window this command is run in, rather than the active window"
      - name: set-tab-title
        description: "Set the title for the specified tab(s)"
        flags:
          "-m, --match": "The tab to match"
      - name: set-window-logo
      - name: set-window-title
        description: "Set the title of the specified window(s)"
        flags:
          "-m, --match": "The window to match"
          "--temporary": "The title can be overwritten by escape sequences"
      - name: signal-child
        description: "Send one or more signals to the foreground process in the specified window(s)"
        flags:
          "-m, --match": "The window to match"
  - name: icat
    description: "A cat like utility to display images in the terminal"
    flags:
      "--align=": "Horizontal alignment for the displayed image"
      "--place=": "Choose where on the screen to display the image"
      "--scale-up": "Images that are smaller than the specified area to be scaled up to use as much of the specified area as possible"
      "--background=": "Specify a background color, this will cause transparent images to be composited on top of the specified color"
      "--mirror=": "Mirror the image about a horizontal or vertical axis or both"
      "--clear": "Remove all images currently displayed on the screen"
      "--transfer-mode=": "Which mechanism to use to transfer images to the terminal"
      "--detect-support": "Detect support for image display in the terminal"
      "--detection-timeout=": "How long to wait for detection to complete before aborting"
      "--print-window-size": "Print the current terminal window size in pixels"
      "--stdin": "Read an image from stdin"
    completion:
      flag:
        align: [center, left, right]
        background: [none, black, white, gray, red, green, blue, yellow, magenta, cyan]
        mirror: [horizontal, both, none, vertical]
        transfer-mode: [file, detect, stream]
      positional:
        - ["$files"]
  - name: "+icat"
    description: "A cat like utility to display images in the terminal"
    flags:
      "--align=": "Horizontal alignment for the displayed image"
      "--place=": "Choose where on the screen to display the image"
      "--scale-up": "Images that are smaller than the specified area to be scaled up to use as much of the specified area as possible"
      "--background=": "Specify a background color, this will cause transparent images to be composited on top of the specified color"
      "--mirror=": "Mirror the image about a horizontal or vertical axis or both"
      "--clear": "Remove all images currently displayed on the screen"
      "--transfer-mode=": "Which mechanism to use to transfer images to the terminal"
      "--detect-support": "Detect support for image display in the terminal"
      "--detection-timeout=": "How long to wait for detection to complete before aborting"
      "--print-window-size": "Print the current terminal window size in pixels"
      "--stdin": "Read an image from stdin"
    completion:
      flag:
        align: [center, left, right]
        background: [none, black, white, gray, red, green, blue, yellow, magenta, cyan]
        mirror: [horizontal, both, none, vertical]
        transfer-mode: [file, detect, stream]
      positional:
        - ["$files"]
  - name: "+list-fonts"
  - name: "+hold"
  - name: "+complete"
  - name: "+runpy"
  - name: "+launch"
  - name: "+open"
  - name: "+kitten"
    commands:
      - name: icat
        description: "A cat like utility to display images in the terminal"
        flags:
          "--align=": "Horizontal alignment for the displayed image"
          "--place=": "Choose where on the screen to display the image"
          "--scale-up": "Images that are smaller than the specified area to be scaled up to use as much of the specified area as possible"
          "--background=": "Specify a background color, this will cause transparent images to be composited on top of the specified color"
          "--mirror=": "Mirror the image about a horizontal or vertical axis or both"
          "--clear": "Remove all images currently displayed on the screen"
          "--transfer-mode=": "Which mechanism to use to transfer images to the terminal"
          "--detect-support": "Detect support for image display in the terminal"
          "--detection-timeout=": "How long to wait for detection to complete before aborting"
          "--print-window-size": "Print the current terminal window size in pixels"
          "--stdin": "Read an image from stdin"
        completion:
          flag:
            align: [center, left, right]
            background: [none, black, white, gray, red, green, blue, yellow, magenta, cyan]
            mirror: [horizontal, both, none, vertical]
            transfer-mode: [file, detect, stream]
          positional:
            - ["$files"]
      - name: diff
        completion:
          positional:
            - ["$files"]
            - ["$files"]
      - name: show_key
      - name: clipboard
      - name: unicode_input
      - name: panel
      - name: transfer
      - name: query_terminal
      - name: broadcast
      - name: hyperlinked_grep
