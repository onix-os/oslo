# Converted from Fig's surreal.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: surreal
description: "SurrealDB is the ultimate cloud database for tomorrow's applications - https://surrealdb.com/"
flags:
  "--help, -h": "Print help information"
commands:
  - name: help
    description: "Print this message or the help of the given subcommand(s)"
  - name: start
    description: "Start the database server"
    flags:
      "--": "Everything after this is an argument"
      "--addr=": "The allowed networks for master authentication [env: ADDR=] [default: 127.0.0.1/32]"
      "--bind, -b=": "The hostname or ip address to listen for connections on [env: BIND=] [default: 0.0.0.0:8000]"
      "--key, -k=": "Encryption key to use for on-disk encryption [env: KEY=]"
      "--kvs-ca=": "Path to the CA file used when connecting to the remote KV store [env: KVS_CA=]"
      "--kvs-crt=": "Path to the certificate file used when connecting to the remote KV store [env: KVS_CRT=]"
      "--kvs-key=": "Path to the private key file used when connecting to the remote KV store [env: KVS_KEY=]"
      "--log, -l=": "The logging level for the database server [env: LOG=] [default: info] [possible values: warn, info, debug, trace, full]"
      "--pass, -p=": "The master password for the database [env: PASS=]"
      "--strict, -s=": "Whether strict mode is enabled on this database instance [env: STRICT=]"
      "--user, -u=": "The master username for the database [env: USER=] [default: root]"
      "--web-crt=": "Path to the certificate file for encrypted client connections [env: WEB_CRT=]"
      "--web-key=": "Path to the private key file for encrypted client connections [env: WEB_KEY=]"
    completion:
      flag:
        log: [warn, info, debug, trace, full]
  - name: backup
    description: "Backup data to or from an existing database"
    flags:
      "--pass, -p=": "Database authentication password to use when connecting [default: root]"
      "--user, -u=": "Database authentication username to use when connecting [default: root]"
  - name: import
    description: "Import a SurrealQL script into an existing database"
    flags:
      "--pass, -p=": "Database authentication password to use when connecting [default: root]"
      "--user, -u=": "Database authentication username to use when connecting [default: root]"
      "--conn, -c=": "Remote database server url to connect to [default: https://cloud.surrealdb.com]"
      "--ns=!": "The namespace to import the data into"
      "--db=!": "The database to import the data into"
  - name: export
    description: "Export an existing database as a SurrealQL script"
    flags:
      "--pass, -p=": "Database authentication password to use when connecting [default: root]"
      "--user, -u=": "Database authentication username to use when connecting [default: root]"
      "--conn, -c=": "Remote database server url to connect to [default: https://cloud.surrealdb.com]"
      "--ns=!": "The namespace to export the data from"
      "--db=!": "The database to export the data from"
  - name: version
    description: "Output the command-line tool version information"
  - name: sql
    description: "Start an SQL REPL in your terminal with pipe support"
    flags:
      "--pass, -p=": "Database authentication password to use when connecting [default: root]"
      "--user, -u=": "Database authentication username to use when connecting [default: root]"
      "--conn, -c=": "Remote database server url to connect to [default: https://cloud.surrealdb.com]"
      "--ns=!": "The namespace to export the data from"
      "--db=!": "The database to export the data from"
      "--pretty": "Whether database responses should be pretty printed"
