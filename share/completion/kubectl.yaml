# Converted from Fig's kubectl.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: kubectl
flags:
  "-n, --namespace=": "If present, the namespace scope for this CLI request"
commands:
  - name: alpha
    description: "These commands correspond to alpha features that are not enabled in Kubernetes clusters by default"
    commands:
      - name: debug
        description: "Tools for debugging Kubernetes resources"
        flags:
          "--arguments-only=": "If specified, everything after -- will be passed to the new container as Args instead of Command"
          "--attach=": "If true, wait for the Pod to start running, and then attach to the Pod as if 'kubectl attach ...' were called. Default false, unless '-i/--stdin' is set, in which case the default is true"
          "--container=": "Container name to use for debug container"
          "--env=": "Environment variables to set in the container"
          "--image=": "Container image to use for debug container"
          "--image-pull-policy=": "The image pull policy for the container"
          "--quiet=": "If true, suppress prompt messages"
          "-i, --stdin=": "Keep stdin open on the container(s) in the pod, even if nothing is attached"
          "--target=": "Target processes in this container name"
          "-t, --tty=": "Allocated a TTY for each container in the pod"
  - name: annotate
    description: "Update the annotations on one or more resources"
    flags:
      "-f, --filename=": "Filename, directory, or URL to files identifying the resource"
      "-k, --kustomize=": "Process the kustomization directory. This flag can't be used together with -f or -R"
      "-o, --output=": "Output format. One of: json|yaml|name|go-template|go-template-file|template|templatefile|jsonpath|jsonpath-file"
      "--resource-version?": "If non-empty, the annotation update will only succeed if this is the current resource-version for the object. Only valid when specifying a single resource"
      "--dry-run?": "Must be \"none\", \"server\", or \"client\". If client strategy, only print the object that would be sent, without sending it. If server strategy, submit server-side request without persisting the resource"
      "--field-selector?": "Selector (field query) to filter on, supports '=', '==', and '!='.(e.g. --field-selector key1=value1,key2=value2). The server only supports a limited number of field queries per type"
      "--local": "If true, annotation will NOT contact api-server but run locally"
      "--all": "Select all resources, including uninitialized ones, in the namespace of the specified resource types"
      "--allow-missing-template-keys": "If true, ignore any errors in templates when a field or map key is missing in the template. Only applies to golang and jsonpath output formats"
      "-R, --recursive": "Process the directory used in -f, --filename recursively. Useful when you want to manage related manifests organized within the same directory"
      "-l, --selector=": "Selector (label query) to filter on, not including uninitialized ones, supports '=', '==', and '!='.(e.g. -l key1=value1,key2=value2)"
      "--template?": "Template string or path to template file to use when -o=go-template, -o=go-template-file. The template format is golang templates [http://golang.org/pkg/text/template/#pkg-overview]"
      "--overwrite": "If true, allow annotations to be overwritten, otherwise reject annotation updates that overwrite existing annotations"
      "--record": "Record current kubectl command in the resource annotation. If set to false, do not record the command. If set to true, record the command. If not set, default to updating the existing annotation value only if one already exists"
    completion:
      flag:
        filename: ["$files"]
        kustomize: ["$directories"]
        output: [json, yaml, name, go-template, go-template-file, template, templatefile, jsonpath, jsonpath-file]
        dry-run: [none, server, client]
  - name: api-resources
    description: "Print the supported API resources on the server"
    flags:
      "-o, --output=": "Output format. One of: json|yaml|name|go-template|go-template-file|template|templatefile|jsonpath|jsonpath-file"
      "--api-group=": "Limit to resources in the specified API group"
      "--cached": "Use the cached list of resources if available"
      "--namespaced": "If false, non-namespaced resources will be returned, otherwise returning namespaced resources by default"
      "--no-headers": "When using the default or custom-column output format, don't print headers (default print headers)"
      "--sort-by?": "If non-empty, sort nodes list using specified field. The field can be either 'name' or 'kind'"
      "--verbs?": "Limit to resources that support the specified verbs"
    completion:
      flag:
        output: [json, yaml, name, go-template, go-template-file, template, templatefile, jsonpath, jsonpath-file]
  - name: api-versions
    description: "Print the supported API versions on the server, in the form of \"group/version\""
  - name: apply
    description: "Apply a configuration to a resource by filename or stdin. The resource name must be specified. This resource will be created if it doesn't exist yet. To use 'apply', always create the resource initially with either 'apply' or 'create --save-config'"
    flags:
      "-f, --filename=": "Filename, directory, or URL to files identifying the resource"
      "-k, --kustomize=": "Process the kustomization directory. This flag can't be used together with -f or -R"
      "-o, --output=": "Output format. One of: json|yaml|name|go-template|go-template-file|template|templatefile|jsonpath|jsonpath-file"
      "--resource-version?": "If non-empty, the annotation update will only succeed if this is the current resource-version for the object. Only valid when specifying a single resource"
      "--dry-run?": "Must be \"none\", \"server\", or \"client\". If client strategy, only print the object that would be sent, without sending it. If server strategy, submit server-side request without persisting the resource"
      "--field-selector?": "Selector (field query) to filter on, supports '=', '==', and '!='.(e.g. --field-selector key1=value1,key2=value2). The server only supports a limited number of field queries per type"
      "--local": "If true, annotation will NOT contact api-server but run locally"
      "--all": "Select all resources, including uninitialized ones, in the namespace of the specified resource types"
      "--allow-missing-template-keys": "If true, ignore any errors in templates when a field or map key is missing in the template. Only applies to golang and jsonpath output formats"
      "-R, --recursive": "Process the directory used in -f, --filename recursively. Useful when you want to manage related manifests organized within the same directory"
      "-l, --selector=": "Selector (label query) to filter on, not including uninitialized ones, supports '=', '==', and '!='.(e.g. -l key1=value1,key2=value2)"
      "--template?": "Template string or path to template file to use when -o=go-template, -o=go-template-file. The template format is golang templates [http://golang.org/pkg/text/template/#pkg-overview]"
      "--overwrite": "Automatically resolve conflicts between the modified and live configuration by using values from the modified configuration"
      "--record": "Record current kubectl command in the resource annotation. If set to false, do not record the command. If set to true, record the command. If not set, default to updating the existing annotation value only if one already exists"
      "--cascade": "If true, cascade the deletion of the resources managed by this resource (e.g. Pods created by a ReplicationController). Default true"
      "--field-manager?": "Name of the manager used to track field ownership"
      "--force": "If true, immediately remove resources from API and bypass graceful deletion. Note that immediate deletion of some resources may result in inconsistency or data loss and requires confirmation"
      "--force-conflicts": "If true, server-side apply will force the changes against conflicts"
      "--grace-period?": "Period of time in seconds given to the resource to terminate gracefully. Ignored if negative. Set to 1 for immediate shutdown. Can only be set to 0 when --force is true (force deletion)"
      "--openapi-patch": "If true, use openapi to calculate diff when the openapi presents and the resource can be found in the openapi spec. Otherwise, fall back to use baked-in types"
      "--prune": "Automatically delete resource objects, including the uninitialized ones, that do not appear in the configs and are created by either apply or create --save-config. Should be used with either -l or --all"
      "--prune-whitelist?": "Overwrite the default whitelist with <group/version/kind> for --prune"
      "--server-side": "If true, apply runs in the server instead of the client"
      "--timeout?": "The length of time to wait before giving up on a delete, zero means determine a timeout from the size of the object"
      "--validate": "If true, use a schema to validate the input before sending it"
      "--wait": "If true, wait for resources to be gone before returning. This waits for finalizers"
    completion:
      flag:
        filename: ["$files"]
        kustomize: ["$directories"]
        output: [json, yaml, name, go-template, go-template-file, template, templatefile, jsonpath, jsonpath-file]
        dry-run: [none, server, client]
    commands:
      - name: edit-last-applied
        description: "Edit the latest last-applied-configuration annotations of resources from the default editor"
        flags:
          "--allow-missing-template-keys": "If true, ignore any errors in templates when a field or map key is missing in the template. Only applies to golang and jsonpath output formats"
          "-f, --filename=": "Filename, directory, or URL to files identifying the resource"
          "-k, --kustomize=": "Process the kustomization directory. This flag can't be used together with -f or -R"
          "-o, --output=": "Output format. One of: json|yaml|name|go-template|go-template-file|template|templatefile|jsonpath|jsonpath-file"
          "--record": "Record current kubectl command in the resource annotation. If set to false, do not record the command. If set to true, record the command. If not set, default to updating the existing annotation value only if one already exists"
          "-R, --recursive": "Process the directory used in -f, --filename recursively. Useful when you want to manage related manifests organized within the same directory"
          "--template?": "Template string or path to template file to use when -o=go-template, -o=go-template-file. The template format is golang templates [http://golang.org/pkg/text/template/#pkg-overview]"
          "--windows-line-endings": "Defaults to the line ending native to your platform"
          "--field-manager=": "Name of the manager used to track field ownership"
          "--show-manged-fields": "If true, keep the managedFields when printing objects in JSON or YAML format"
        completion:
          flag:
            filename: ["$files"]
            kustomize: ["$directories"]
            output: [json, yaml, name, go-template, go-template-file, template, templatefile, jsonpath, jsonpath-file]
      - name: set-last-applied
        description: "Set the latest last-applied-configuration annotations by setting it to match the contents of a file. This results in the last-applied-configuration being updated as though 'kubectl apply -f<file> ' was run, without updating any other parts of the object"
        flags:
          "--allow-missing-template-keys": "If true, ignore any errors in templates when a field or map key is missing in the template. Only applies to golang and jsonpath output formats"
          "-f, --filename=": "Filename, directory, or URL to files identifying the resource"
          "-o, --output=": "Output format. One of: json|yaml|name|go-template|go-template-file|template|templatefile|jsonpath|jsonpath-file"
          "--template?": "Template string or path to template file to use when -o=go-template, -o=go-template-file. The template format is golang templates [http://golang.org/pkg/text/template/#pkg-overview]"
          "--show-manged-fields": "If true, keep the managedFields when printing objects in JSON or YAML format"
          "--create-annotation": "Will create 'last-applied-configuration' annotations if current objects doesn't have one"
        completion:
          flag:
            filename: ["$files"]
            output: [json, yaml, name, go-template, go-template-file, template, templatefile, jsonpath, jsonpath-file]
      - name: view-last-applied
        description: "View the latest last-applied-configuration annotations by type/name or file"
        flags:
          "--all": "Select all resources, including uninitialized ones, in the namespace of the specified resource types"
          "-f, --filename=": "Filename, directory, or URL to files identifying the resource"
          "-k, --kustomize=": "Process the kustomization directory. This flag can't be used together with -f or -R"
          "-o, --output=": "Output format. One of: json|yaml|name|go-template|go-template-file|template|templatefile|jsonpath|jsonpath-file"
          "-R, --recursive": "Process the directory used in -f, --filename recursively. Useful when you want to manage related manifests organized within the same directory"
          "-l, --selector=": "Selector (label query) to filter on, not including uninitialized ones, supports '=', '==', and '!='.(e.g. -l key1=value1,key2=value2)"
        completion:
          flag:
            filename: ["$files"]
            kustomize: ["$directories"]
            output: [json, yaml, name, go-template, go-template-file, template, templatefile, jsonpath, jsonpath-file]
  - name: attach
    description: "Attach to a process that is already running inside an existing container"
    flags:
      "-c, --container=": "Container name. If omitted, the first container in the pod will be chosen"
      "--pod-running-timeout?": "The length of time (like 5s, 2m, or 3h, higher than zero) to wait until at least one pod is running"
      "-i, --stdin": "Pass stdin to the container"
      "-t, --tty": "Stdin is a TTY"
  - name: auth
    description: "Inspect authorization"
    commands:
      - name: can-i
        description: "Check whether an action is allowed"
        flags:
          "-A, --all-namespaces": "If true, check the specified action in all namespaces"
          "--list": "If true, prints all allowed actions"
          "--no-headers": "If true, prints allowed actions without headers"
          "-q, --quiet": "If true, suppress output and just return the exit code"
          "--subresource?": "SubResource such as pod/log or deployment/scale"
        completion:
          positional:
            - ["*", get, list, watch, delete, create, update, patch]
      - name: reconcile
        description: "Reconciles rules for RBAC Role, RoleBinding, ClusterRole, and ClusterRole binding objects"
        flags:
          "--allow-missing-template-keys": "If true, ignore any errors in templates when a field or map key is missing in the template. Only applies to golang and jsonpath output formats"
          "--dry-run?": "Must be \"none\", \"server\", or \"client\". If client strategy, only print the object that would be sent, without sending it. If server strategy, submit server-side request without persisting the resource"
          "-f, --filename=": "Filename, directory, or URL to files identifying the resource"
          "-k, --kustomize=": "Process the kustomization directory. This flag can't be used together with -f or -R"
          "-o, --output=": "Output format. One of: json|yaml|name|go-template|go-template-file|template|templatefile|jsonpath|jsonpath-file"
          "-R, --recursive": "Process the directory used in -f, --filename recursively. Useful when you want to manage related manifests organized within the same directory"
          "--template?": "Template string or path to template file to use when -o=go-template, -o=go-template-file. The template format is golang templates [http://golang.org/pkg/text/template/#pkg-overview]"
          "--remove-extra-permissions": "If true, removes extra permissions added to roles"
          "--remove-extra-subjects": "If true, removes extra subjects added to rolebindings"
          "--show-managed-fields": "If true, keep the managedFields when printing objects in JSON or YAML format"
        completion:
          flag:
            dry-run: [none, server, client]
            filename: ["$files"]
            kustomize: ["$directories"]
            output: [json, yaml, name, go-template, go-template-file, template, templatefile, jsonpath, jsonpath-file]
  - name: autoscale
    description: "Creates an autoscaler that automatically chooses and sets the number of pods that run in a kubernetes cluster"
    flags:
      "--allow-missing-template-keys": "If true, ignore any errors in templates when a field or map key is missing in the template. Only applies to golang and jsonpath output formats"
      "-o, --output=": "Output format. One of: json|yaml|name|go-template|go-template-file|template|templatefile|jsonpath|jsonpath-file"
      "--record": "Record current kubectl command in the resource annotation. If set to false, do not record the command. If set to true, record the command. If not set, default to updating the existing annotation value only if one already exists"
      "-R, --recursive": "Process the directory used in -f, --filename recursively. Useful when you want to manage related manifests organized within the same directory"
      "--dry-run?": "Must be \"none\", \"server\", or \"client\". If client strategy, only print the object that would be sent, without sending it. If server strategy, submit server-side request without persisting the resource"
      "-f, --filename=": "Filename, directory, or URL to files identifying the resource"
      "-k, --kustomize=": "Process the kustomization directory. This flag can't be used together with -f or -R"
      "--template?": "Template string or path to template file to use when -o=go-template, -o=go-template-file. The template format is golang templates [http://golang.org/pkg/text/template/#pkg-overview]"
      "--cpu-percent?": "The target average CPU utilization (represented as a percent of requested CPU) over all the pods. If it's not specified or negative, a default autoscaling policy will be used"
      "--generator?": "The name of the API generator to use. Currently there is only 1 generator"
      "--max?": "The upper limit for the number of pods that can be set by the autoscaler. Required"
      "--min?": "The lower limit for the number of pods that can be set by the autoscaler. If it's not specified or negative, the server will apply a default value"
      "--name?": "The name for the newly created object. If not specified, the name of the input resource will be used"
      "--save-config": "If true, the configuration of current object will be saved in its annotation. Otherwise, the annotation will be unchanged. This flag is useful when you want to perform kubectl apply on this object in the future"
    completion:
      flag:
        output: [json, yaml, name, go-template, go-template-file, template, templatefile, jsonpath, jsonpath-file]
        dry-run: [none, server, client]
        filename: ["$files"]
        kustomize: ["$directories"]
  - name: certificate
    description: "Modify certificate resources"
    commands:
      - name: approve
        description: "Approve a certificate signing request"
        flags:
          "--allow-missing-template-keys": "If true, ignore any errors in templates when a field or map key is missing in the template. Only applies to golang and jsonpath output formats"
          "-f, --filename=": "Filename, directory, or URL to files identifying the resource"
          "-k, --kustomize=": "Process the kustomization directory. This flag can't be used together with -f or -R"
          "-o, --output=": "Output format. One of: json|yaml|name|go-template|go-template-file|template|templatefile|jsonpath|jsonpath-file"
          "-R, --recursive": "Process the directory used in -f, --filename recursively. Useful when you want to manage related manifests organized within the same directory"
          "--template?": "Template string or path to template file to use when -o=go-template, -o=go-template-file. The template format is golang templates [http://golang.org/pkg/text/template/#pkg-overview]"
          "--force": "Update the CSR even if it is already approved"
        completion:
          flag:
            filename: ["$files"]
            kustomize: ["$directories"]
            output: [json, yaml, name, go-template, go-template-file, template, templatefile, jsonpath, jsonpath-file]
      - name: deny
        description: "Deny a certificate signing request"
        flags:
          "--allow-missing-template-keys": "If true, ignore any errors in templates when a field or map key is missing in the template. Only applies to golang and jsonpath output formats"
          "-f, --filename=": "Filename, directory, or URL to files identifying the resource"
          "-k, --kustomize=": "Process the kustomization directory. This flag can't be used together with -f or -R"
          "-o, --output=": "Output format. One of: json|yaml|name|go-template|go-template-file|template|templatefile|jsonpath|jsonpath-file"
          "-R, --recursive": "Process the directory used in -f, --filename recursively. Useful when you want to manage related manifests organized within the same directory"
          "--template?": "Template string or path to template file to use when -o=go-template, -o=go-template-file. The template format is golang templates [http://golang.org/pkg/text/template/#pkg-overview]"
          "--force": "Update the CSR even if it is already approved"
        completion:
          flag:
            filename: ["$files"]
            kustomize: ["$directories"]
            output: [json, yaml, name, go-template, go-template-file, template, templatefile, jsonpath, jsonpath-file]
  - name: cluster-info
    description: "Display addresses of the master and services with label kubernetes.io/cluster-service=true To further debug and diagnose cluster problems, use 'kubectl cluster-info dump'"
    commands:
      - name: dump
        description: "Dumps cluster info out suitable for debugging and diagnosing cluster problems. By default, dumps everything to stdout. You can optionally specify a directory with --output-directory. If you specify a directory, kubernetes will build a set of files in that directory. By default only dumps things in the 'kube-system' namespace, but you can switch to a different namespace with the --namespaces flag, or specify --all-namespaces to dump all namespaces"
        flags:
          "--allow-missing-template-keys": "If true, ignore any errors in templates when a field or map key is missing in the template. Only applies to golang and jsonpath output formats"
          "-o, --output=": "Output format. One of: json|yaml|name|go-template|go-template-file|template|templatefile|jsonpath|jsonpath-file"
          "--template?": "Template string or path to template file to use when -o=go-template, -o=go-template-file. The template format is golang templates [http://golang.org/pkg/text/template/#pkg-overview]"
          "-A, --all-namespaces": "If true, dump all namespaces. If true, --namespaces is ignored"
          "--namespaces=": "A comma separated list of namespaces to dump"
          "--output-directory?": "Where to output the files. If empty or '-' uses stdout, otherwise creates a directory hierarchy in that directory"
          "--pod-running-timeout?": "The length of time (like 5s, 2m, or 3h, higher than zero) to wait until at least one pod is running"
          "--show-managed-fields": "If true, keep the managedFields when printing objects in JSON or YAML format"
        completion:
          flag:
            output: [json, yaml, name, go-template, go-template-file, template, templatefile, jsonpath, jsonpath-file]
  - name: completion
    description: "Output shell completion code for the specified shell (bash or zsh). The shell code must be evaluated to provide interactive completion of kubectl commands. This can be done by sourcing it from the .bash_profile"
  - name: config
    description: "Modify kubeconfig files using subcommands like \"kubectl config set current-context my-context\""
    flags:
      "--kubeconfig?": ""
    completion:
      flag:
        kubeconfig: ["$files"]
    commands:
      - name: current-context
        description: "Displays the current-context"
      - name: delete-cluster
        description: "Delete the specified cluster from the kubeconfig"
      - name: delete-context
        description: "Delete the specified context from the kubeconfig"
      - name: get-clusters
        description: "Display clusters defined in the kubeconfig"
      - name: get-contexts
        description: "Displays one or many contexts from the kubeconfig file"
        flags:
          "-o, --output=": "Output format. One of: json|yaml|name|go-template|go-template-file|template|templatefile|jsonpath|jsonpath-file"
          "--no-headers=": "When using the default or custom-column output format, don't print headers (default print headers)"
        completion:
          flag:
            output: [json, yaml, name, go-template, go-template-file, template, templatefile, jsonpath, jsonpath-file]
      - name: get-users
        description: "Display users defined in the kubeconfig"
      - name: rename-context
        description: "Renames a context from the kubeconfig file"
      - name: set
        description: "Sets an individual value in a kubeconfig file"
        flags:
          "--set-raw-bytes=": "When writing a []byte PROPERTY_VALUE, write the given string directly without base64 decoding"
      - name: set-cluster
        description: "Sets a cluster entry in kubeconfig"
        flags:
          "--embed-certs": "Embed-certs for the cluster entry in kubeconfig"
          "--server?": ""
          "--certificate-authority?": "Path to certificate authority"
          "--insecure-skip-tls-verify?": ""
          "--tls-server-name?": ""
        completion:
          flag:
            certificate-authority: ["$files"]
            insecure-skip-tls-verify: ["true", "false"]
      - name: set-context
        description: "Sets a context entry in kubeconfig"
        flags:
          "--current": "Modify the current context"
          "--cluster?": ""
          "--user?": ""
          "--namespace?": ""
      - name: set-credentials
        description: "Sets a user entry in kubeconfig"
        flags:
          "--client-certificate?": "Client cert for user entry"
          "--client-key?": "Client key for user entry"
          "--token?": "Bearer Token for user entry"
          "--username?": "Username for basic authentication"
          "--password?": "Password for basic authentication"
          "--auth-provider?": "Auth provider for the user entry in kubeconfig"
          "--auth-provider-arg?": "'key=value' arguments for the auth provider"
          "--embed-certs": "Embed client cert/key for the user entry in kubeconfig"
          "--exec-api-version?": "API version of the exec credential plugin for the user entry in kubeconfig"
          "--exec-arg?": "New arguments for the exec credential plugin command for the user entry in kubeconfig"
          "--exec-command?": "Command for the exec credential plugin for the user entry in kubeconfig"
          "--exec-env?": "'key=value' environment values for the exec credential plugin"
        completion:
          flag:
            client-certificate: ["$files"]
            client-key: ["$files"]
      - name: unset
        description: "Unsets an individual value in a kubeconfig file"
      - name: use-context
        description: "Sets the current-context in a kubeconfig file"
      - name: view
        description: "Display merged kubeconfig settings or a specified kubeconfig file"
        flags:
          "--allow-missing-template-keys": "If true, ignore any errors in templates when a field or map key is missing in the template. Only applies to golang and jsonpath output formats"
          "-o, --output=": "Output format. One of: json|yaml|name|go-template|go-template-file|template|templatefile|jsonpath|jsonpath-file"
          "--template?": "Template string or path to template file to use when -o=go-template, -o=go-template-file. The template format is golang templates [http://golang.org/pkg/text/template/#pkg-overview]"
          "--flatten": "Flatten the resulting kubeconfig file into self-contained output (useful for creating portable kubeconfig files)"
          "--merge": "Merge the full hierarchy of kubeconfig files"
          "--minify": "Remove all information not used by current-context from the output"
          "--raw": "Display raw byte data"
          "--show-managed-fields": "If true, keep the managedFields when printing objects in JSON or YAML format"
        completion:
          flag:
            output: [json, yaml, name, go-template, go-template-file, template, templatefile, jsonpath, jsonpath-file]
  - name: convert
    description: "Convert config files between different API versions. Both YAML and JSON formats are accepted"
    flags:
      "--allow-missing-template-keys": "If true, ignore any errors in templates when a field or map key is missing in the template. Only applies to golang and jsonpath output formats"
      "-f, --filename=": "Filename, directory, or URL to files identifying the resource"
      "-k, --kustomize=": "Process the kustomization directory. This flag can't be used together with -f or -R"
      "-o, --output=": "Output format. One of: json|yaml|name|go-template|go-template-file|template|templatefile|jsonpath|jsonpath-file"
      "-R, --recursive": "Process the directory used in -f, --filename recursively. Useful when you want to manage related manifests organized within the same directory"
      "--template?": "Template string or path to template file to use when -o=go-template, -o=go-template-file. The template format is golang templates [http://golang.org/pkg/text/template/#pkg-overview]"
