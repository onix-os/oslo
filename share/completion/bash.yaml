name: bash
flags:
  "-c=": "If the -c option is present, then commands are read from the first non-option argument command_string."
  "-i": "If the -i option is present, the shell is interactive."
  "-l": "Make bash act as if it had been invoked as a login shell (see INVOCATION below)."
  "-r": "If the -r option is present, the shell becomes restricted (see RESTRICTED SHELL below)."
  "-s": "If the -s option is present, or if no arguments remain after option processing, then commands are read from the standard input."
  "-v": "Print shell input lines as they are read."
  "-x": "Print commands and their arguments as they are executed."
  "-D": "A list of all double-quoted strings preceded by $ is printed on the standard output."
  "-O=": "shopt_option is one of the shell options accepted by the shopt builtin (see SHELL BUILTIN COMMANDS below)."
  "--debugger": "Arrange for the debugger profile to be executed before the shell starts."
  "--dump-po-strings": "Equivalent to -D, but the output is in the GNU gettext po (portable object) file format."
  "--dump-strings": "Equivalent to -D."
  "--help": "Display a usage message on standard output and exit successfully."
  "--init-file=": ""
  "--rcfile=": "Execute commands from file instead of the system wide initialization file /etc/bash.bashrc and the standard personal initialization file ~/.bashrc if the shell is interactive (see INVOCATION below)."
  "--login": "Equivalent to -l."
  "--noediting": "Do not use the GNU readline library to read command lines when the shell is interactive."
  "--noprofile": "Do not read either the system-wide startup file /etc/profile or any of the personal initialization files ~/.bash_profile, ~/.bash_login, or ~/.profile."
  "--norc": "Do not read and execute the system wide initialization file /etc/bash.bashrc and the personal initialization file ~/.bashrc if the shell is interactive."
  "--posix": "Change the behavior of bash where the default operation differs from the POSIX standard to match the standard (posix mode)."
  "--restricted": "The shell becomes restricted (see RESTRICTED SHELL below)."
  "--verbose": "Equivalent to -v."
  "--version": "Show version information for this instance of bash on the standard output and exit successfully."
