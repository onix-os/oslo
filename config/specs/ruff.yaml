# Converted from Fig's ruff.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: ruff
description: "Ruff: An extremely fast Python linter"
persistentflags:
  "-v, --verbose": "Enable verbose logging"
  "-q, --quiet": "Print diagnostics, but nothing else"
  "-s, --silent": "Disable all logging (but still exit with status code \"1\" upon detecting diagnostics)"
  "--config?": "Path to the `pyproject.toml` or `ruff.toml` file to use for configuration"
  "--isolated": "Ignore all configuration files"
  "--help": "Print help"
completion:
  flag:
    config: ["$files"]
commands:
  - name: check
    description: "Run Ruff on the given files or directories"
    flags:
      "--fix": "Apply fixes to resolve lint violations"
      "--unsafe-fixes": "Include fixes that may not retain the original intent of the code"
      "--show-fixes": "Show an enumeration of all fixed lint violations"
      "--diff": "Avoid writing any fixed files back; instead, output a diff for each changed file to stdout, and exit 0 if there are no diffs. Implies `--fix-only`"
      "-w, --watch": "Run in watch mode by re-running whenever files change"
      "--fix-only": "Apply fixes to resolve lint violations, but don't report on, or exit non-zero for, leftover violations. Implies `--fix`"
      "--ignore-noqa": "Ignore any `# noqa` comments"
      "--output-format?": "Output serialization format for violations. The default serialization format is 'full'"
      "-o, --output-file?": "Specify file to write the linter output to (default: stdout)"
      "--target-version?": "The minimum Python version that should be supported"
      "--preview": "Enable preview mode; checks will include unstable rules and fixes"
      "--extension?": "List of mappings from file extension to language (one of `python`, `ipynb`, `pyi`). For example, to treat `.ipy` files as IPython notebooks, use `--extension ipy:ipynb`"
      "--statistics": "Show counts for every rule with at least one violation"
      "--add-noqa": "Enable automatic additions of `noqa` directives to failing lines"
      "--show-files": "See the files Ruff will be run against with the current settings"
      "--show-settings": "See the settings Ruff will use to lint a given Python file"
      "-h, --help": "Print help"
      "--select?": "Comma-separated list of rule codes to enable (or ALL, to enable all rules)"
      "--ignore?": "Comma-separated list of rule codes to disable"
      "--extend-select?": "Like --select, but adds additional rule codes on top of the selected ones"
      "--per-file-ignores?": "List of mappings from file pattern to code to exclude"
      "--extend-per-file-ignores?": "Like `--per-file-ignores`, but adds additional ignores on top of those already specified"
      "--fixable?": "List of rule codes to treat as eligible for fix. Only applicable when fix itself is enabled (e.g., via `--fix`)"
      "--unfixable?": "List of rule codes to treat as ineligible for fix. Only applicable when fix itself is enabled (e.g., via `--fix`)"
      "--extend-fixable?": "Like --fixable, but adds additional rule codes on top of those already specified"
      "--exclude?": "List of paths, used to omit files and/or directories from analysis"
      "--extend-exclude?": "Like --exclude, but adds additional files and directories on top of those already excluded"
      "--respect-gitignore": "Respect file exclusions via `.gitignore` and other standard ignore files"
      "--force-exclude": "Enforce exclusions, even for paths passed to Ruff directly on the command-line"
      "-n, --no-cache": "Disable cache reads"
      "--cache-dir?": "Path to the cache directory"
      "--stdin-filename?": "The name of the file when passing it through stdin"
      "-e, --exit-zero": "Exit with status code \"0\", even upon detecting lint violations"
      "--exit-non-zero-on-fix": "Exit with a non-zero status code if any files were modified via fix, even if no lint violations remain"
    completion:
      flag:
        output-format: [concise, full, json, json-lines, junit, grouped, github, gitlab, pylint, rdjson, azure, sarif]
        output-file: ["$files"]
        target-version: [py37, py38, py39, py310, py311, py312, py313]
        cache-dir: ["$files"]
        stdin-filename: ["$files"]
      positionalany: ["$files"]
