  "-a, --no-static": "The -a option causes \"gprof\" to suppress the printing of statically declared (private) functions."
  "-c, --static-call-graph": "The -c option causes the call graph of the program to be augmented by a heuristic which examines the text space of the object file and identifies function calls in the binary machine code."
  "-D, --ignore-non-functions": "The -D option causes \"gprof\" to ignore symbols which are not known to be functions."
  "-k=": "The -k option allows you to delete from the call graph any arcs from symbols matching symspec from to those matching symspec to."
