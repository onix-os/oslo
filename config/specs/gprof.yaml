  "-C, --exec-counts=": "The -C option causes \"gprof\" to print a tally of functions and the number of times each was called."
  "-i, --file-info": "The -i option causes \"gprof\" to display summary information about the profile data file(s) and then exit."
  "-I, --directory-path=": "The -I option specifies a list of search directories in which to find source files."
