  "-T, --traditional": "The -T option causes \"gprof\" to print its output in \"traditional\" BSD style."
  "-w, --width=": "Sets width of output lines to width."
  "-x, --all-lines": "This option affects annotated source output only."
  "--demangle=": "These options control whether C++ symbol names should be demangled when printing output."
