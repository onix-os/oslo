  "-m, --min-count=": "This option affects execution count output only."
  "-nsymspec=": "The -n option causes \"gprof\", in its call graph analysis, to only propagate times for symbols matching symspec."
  "--time=": "The -n option causes \"gprof\", in its call graph analysis, to only propagate times for symbols matching symspec."
  "-Nsymspec=": "The -n option causes \"gprof\", in its call graph analysis, not to propagate times for symbols matching symspec."
  "--no-time=": "The -n option causes \"gprof\", in its call graph analysis, not to propagate times for symbols matching symspec."
  "-Sfilename=": "The -S option causes \"gprof\" to read an external symbol table file, such as /proc/kallsyms, rather than read the symbol table from the given object file (the default is \"a.out\")."
  "--external-symbol-table=": "The -S option causes \"gprof\" to read an external symbol table file, such as /proc/kallsyms, rather than read the symbol table from the given object file (the default is \"a.out\")."
  "-z, --display-unused-functions": "If you give the -z option, \"gprof\" will mention all functions in the flat profile, even those that were never called, and that had no time spent in them."
  "-d, --debug=": "The -d num option specifies debugging options."
  "-h, --help": "The -h option prints command line usage."
  "-Oname=": "Selects the format of the profile data files."
  "--file-format=": "Selects the format of the profile data files."
  "-s, --sum": "The -s option causes \"gprof\" to summarize the information in the profile data files it read in, and write out a profile data file called gmon.sum, which contains all the information from the profile data files that \"gprof\" read in."
  "-v, --version": "The -v flag causes \"gprof\" to print the current version number, and then exit."
  "-e=": "The -e function option tells \"gprof\" to not print information about the function function_name (and its children...) in the call graph."
  "-E=": "The \"-E function\" option works like the \"-e\" option, but time spent in the function (and children who were not called from anywhere else), will not be used to compute the percentages-of-time for the call graph."
  "-f=": "The -f function option causes \"gprof\" to limit the call graph to the function function_name and its children (and their children...)."
  "-F=": "The -F function option works like the \"-f\" option, but only time spent in the function and its children (and their children...) will be used to determine total-time and percentages-of-time for the call graph."
