  "--exists": "Test whether the packages on the command line exist"
  "--atleast-version=": "Test whether the packages on the command line exist and are at least the specified version"
  "--exact-version=": "Test whether the packages on the command line exist and are exactly the specified version"
  "--max-version=": "Test whether the packages on the command line exist and are at most the specified version"
  "--validate": "Check the syntax of a package's .pc file for validity"
  "--msvc-syntax": "Output -l and -L flags in the form recognized by the Microsoft Visual C++ command-line compiler"
  "--define-prefix": "Use the installed location of the .pc file to determine the prefix"
