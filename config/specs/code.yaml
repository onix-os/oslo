  "-r, --reuse-window": "Force to open a file or folder in an already opened window"
  "-w, --wait": "Wait for the files to be closed before returning"
  "--locale=": "The locale to use (e.g. en-US or zh-TW)"
  "--user-data-dir=": "Specifies the directory that user data is kept in. Can be used to open multiple distinct instances of Code"
  "--profile=": "Opens the provided folder or workspace with the given profile and associates the profile with the workspace. If the profile does not exist, a new empty one is created. A folder or workspace must be provided for the profile to take effect"
  "-h, --help": "Print usage"
  "--extensions-dir=": "Set the root path for extensions"
  "--list-extensions": "List the installed extensions"
  "--show-versions": "Show versions of installed extensions, when using --list-extensions"
  "--category=": "Filters installed extensions by provided category, when using --list-extensions"
  "--install-extension=": "Installs or updates an extension. The argument is either an extension id or a path to a VSIX. The identifier of an extension is '${publisher}.${name}'. Use '--force' argument to update to latest version. To install a specific version provide '@${version}'. For example: 'vscode.csharp@1.2.3'"
