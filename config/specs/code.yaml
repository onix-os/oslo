name: code
description: "Visual Studio Code"
flags:
  "-": "Read from stdin (e.g. 'ps aux | grep code | code -')"
  "-d, --diff=": {description: "Compare two files with each other", nargs: 2}
  "-m, --merge=": {description: "Perform a three-way merge by providing paths for two modified versions of a file, the common origin of both modified versions and the output file to save merge results", nargs: 4}
  "-a, --add=": {description: "Add folder(s) to the last active window", nargs: -1}
  "-g, --goto=": "Open a file at the path on the specified line and character position"
