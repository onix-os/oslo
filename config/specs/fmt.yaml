# Converted from Fig's fmt.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: fmt
description: "Simple text formatter"
parsing: non-interspersed
flags:
  "-c": "Center the text, line by line. In this case, most of the other options are ignored; no splitting or joining of lines is done"
  "-m": "Try to format mail header lines contained in the input sensibly"
  "-n": "Format lines beginning with a ‘.’ (dot) character"
  "-p": "Allow indented paragraphs. Without the -p flag, any change in the amount of whitespace at the start of a line results in a new paragraph being begun"
  "-s": "Collapse whitespace inside lines, so that multiple whitespace characters are turned into a single space. (Or, at the end of a sentence, a double space.)"
  "-d=": "Treat the chars (and no others) as sentence-ending characters. By default the sentence-ending characters are full stop (‘.’), question mark (‘?’) and exclamation mark (‘!’). Remember that some characters may need to be escaped to protect them from your shell"
  "-l=": "Replace multiple spaces with tabs at the start of each output line, if possible. Each number spaces will be replaced with one tab. The default is 8. If number is 0, spaces are preserved"
  "-t=": "Assume that the input files' tabs assume number spaces per tab stop. The default is 8"
completion:
  flag:
    d: [".", "?", "!"]
    l: [8]
    t: [8]
  positionalany: ["$files"]
