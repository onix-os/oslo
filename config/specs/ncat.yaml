# Converted from argc's ncat.sh by tools/argc-to-spec. Do not edit by hand.
name: ncat
flags:
  "-4": "Force the use of IPv4 only."
  "-6": "Force the use of IPv6 only."
  "-U, --unixsock": "Use Unix domain sockets rather than network sockets."
  "-u, --udp": "Use UDP for the connection (the default is TCP)."
  "--sctp": "Use SCTP for the connection (the default is TCP)."
  "--vsock": "Use AF_VSOCK sockets rather than the default TCP sockets (Linux only)."
  "-g=": "Sets hops for IPv4 loose source routing."
  "-G=": "Sets the IPv4 source route “pointer” for use with -g."
  "-p, --source-port=": "Set the port number for Ncat to bind to."
  "-s, --source=": "Set the address for Ncat to bind to."
  "-l, --listen": "Listen for connections rather than connecting to a remote machine"
  "-m, --max-conns=": "The maximum number of simultaneous connections accepted by an Ncat instance."
  "-k, --keep-open": "Normally a listening server accepts only one connection and then quits when the connection is closed."
  "--broker": "Allow multiple parties to connect to a centralised Ncat server and communicate with each other."
  "--chat": "The --chat option enables chat mode, intended for the exchange of text between several users."
  "--ssl": "In connect mode, this option transparently negotiates an SSL session with an SSL server to securely encrypt the connection."
  "--ssl-verify": "In client mode, --ssl-verify is like --ssl except that it also requires verification of the server certificate."
  "--ssl-cert=": "This option gives the location of a PEM-encoded certificate files used to authenticate the server (in listen mode) or the client (in connect mode)."
  "--ssl-key=": "This option gives the location of the PEM-encoded private key file that goes with the certificate named with --ssl-cert."
  "--ssl-trustfile=": "This option sets a list of certificates that are trusted for purposes of certificate verification."
  "--ssl-ciphers=": "This option sets the list of ciphersuites that Ncat will use when connecting to servers or when accepting SSL connections from clients."
  "--ssl-servername=": "In client mode, this option sets the TLS SNI (Server Name Indication) extension, which tells the server the name of the logical server Ncat is contacting."
  "--ssl-alpn": "ALPN list This option allows you to specify a comma-separated list of protocols to send via the Application-Layer Protocol Negotiation (ALPN) TLS extension."
  "--proxy=": "Requests proxying through host:port, using the protocol specified by --proxy-type."
  "--proxy-type=": "In connect mode, this option requests the protocol proto to connect through the proxy host specified by --proxy."
  "--proxy-auth=": "In connect mode, gives the credentials that will be used to connect to the proxy server."
  "--proxy-dns=": "In connect mode, it provides control over whether proxy destination hostnames are resolved by the remote proxy server or locally, by Ncat itself."
  "-e, --exec=": "Execute the specified command after a connection has been established."
  "-c, --sh-exec=": "Same as -e, except it tries to execute the command via /bin/sh."
  "--lua-exec=": "Runs the specified file as a Lua script after a connection has been established, using a built-in interpreter."
  "--allow=*": {description: "The list of hosts specified will be the only hosts allowed to connect to the Ncat process.", nargs: -1}
  "--allowfile=": "This has the same functionality as --allow, except that the allowed hosts are provided in a new-line delimited allow file, rather than directly on the command line."
  "--deny=*": {description: "Issue Ncat with a list of hosts that will not be allowed to connect to the listening Ncat process.", nargs: -1}
  "--denyfile=": "This is the same functionality as --deny, except that excluded hosts are provided in a new-line delimited deny file, rather than directly on the command line."
  "-d, --delay=": "Set the delay interval for lines sent."
  "-i, --idle-timeout=": "Set a fixed timeout for idle connections."
  "-w, --wait=": "Set a fixed timeout for connection attempts."
  "-o, --output=": "Dump session data to a file"
  "-x, --hex-dump=": "Dump session data in hex to a file."
  "--append-output": "Issue Ncat with --append-ouput along with -o and/or -x and it will append the resulted output rather than truncating the specified output files."
  "-v, --verbose": "Issue Ncat with -v and it will be verbose and display all kinds of useful connection based information."
  "-C, --crlf": "This option tells Ncat to convert LF line endings to CRLF when taking input from standard input."
  "-h, --help": "Displays a short help screen with common options and parameters, and then exits."
  "--recv-only": "If this option is passed, Ncat will only receive data and will not try to send anything."
  "--send-only": "If this option is passed, then Ncat will only send data and will ignore anything received."
  "--no-shutdown": "If this option is passed, Ncat will not invoke shutdown on a socket after seeing EOF on stdin."
  "-n, --nodns": "Completely disable hostname resolution across all Ncat options, such as the destination, source address, source routing hops, and the proxy."
  "-t, --telnet": "Handle DO/DONT WILL/WONT Telnet negotiations."
  "--version": "Displays the Ncat version number and exits."
