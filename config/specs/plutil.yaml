# Converted from Fig's plutil.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: plutil
description: "Check the syntax of property list files, or convert a plist file from one format to another. Specifying - as an input file reads from stdin"
parsing: non-interspersed
flags:
  "-help": "Show the usage information for the command and exit"
  "-p": "Print the property list in a human-readable fashion"
  "-lint": "Check the named property list files for syntax errors. This is the default command option if none is specified"
  "-convert=": "Convert the named file to the indicated format and write back to the file system"
  "--": "Specifies that all further arguments are file names"
  "-s": "Don't print anything on success"
  "-r": "For JSON, add whitespace and indentation to make the output more human-readable"
  "-o=": "Specify an alternate path name for the result of the -convert operation; this option is only useful with a single file to be converted. Specifying - as the path outputs to stdout"
  "-e=": "Specify an alternate extension for converted files, and the output file names are otherwise the same"
completion:
  flag:
    convert: ["xml1\tFor version 1 of the XML plist format", "binary1\tFor version 1 of the binary plist", "json\tFor the JSON format"]
