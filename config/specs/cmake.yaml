# Converted from Fig's cmake.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: cmake
description: "Command-line interface of the cross-platform buildsystem generator CMake"
flags:
  "-S=": "Path to root directory of the CMake project to build"
  "--help": ""
  "-B=": "Path to directory which CMake will use as the root of build directory. If the directory doesn't already exist CMake will make it"
  "-C=": "Pre-load a script to populate the cache"
  "-D=": "Create or update a CMake CACHE entry"
  "-U=": "Remove matching entries from CMake CACHE"
  "-G=": "Specify a build system generator"
  "-T=": "Toolset specification for the generator, if supported"
  "-A=": "Specify platform name if supported by generator"
  "--install-prefix=": "Specify the installation directory, used by the CMAKE_INSTALL_PREFIX variable. Must be an absolute path"
  "-Wno-dev": "Suppress developer warnings"
  "-Wdev": "Enable developer warnings"
  "-Werror=": "Enable the type of warnings"
  "-Wno-error=": "Disable the type of warnings"
  "-Wdeprecated": "Enable deprecated functionality warnings"
  "-Wno-deprecated": "Suppress deprecated functionality warnings"
  "-L": "List non-advanced cached-variables"
  "-N": "View mode only"
  "--graphviz?": "Generate graphviz of dependencies"
  "--system-information?": "Dump information about this system"
  "--log-level=": "Set log-level"
  "--log-context": "Enable the message() command outputting context attached to each message"
  "--debug-trycompile": "Do not delete the try_compile() build tree"
  "--debug-output": "Put cmake in a debug mode"
  "--debug-find": "Put cmake find commands in a debug mode"
  "--trace": "Put cmake in trace mode"
  "--trace-expand": "Put cmake in trace mode with variables expanded"
  "--trace-format=": "Put cmake in trace mode and sets the trace output format"
  "--trace-source=": "Put cmake in trace mode, but output only lines of a specified file"
  "--trace-redirect=": "Put cmake in trace mode and redirect trace output to a file instead of stderr"
  "--warn-uninitialized": "Warn about uninitialized values"
  "--warn-unused-vars": "Does nothing. In CMake versions 3.2 and below this enabled warnings about unused variables. In CMake versions 3.3 through 3.18 the option was broken. In CMake 3.19 and above the option has been removed"
  "--no-warn-unused-cli": "Don't warn about command line options. Don't find variables that are declared on the command line, but not used"
  "--check-system-vars": "Find problems with variable usage in system files"
  "--preset=": "Reads a preset from <path-to-source>/CMakePresets.json and <path-to-source>/CMakeUserPresets.json. The preset may specify the generator and the build directory, and a list of variables and other arguments to pass to CMake. The current working directory must contain CMake preset files. The CMake GUI can also recognize CMakePresets.json and CMakeUserPresets.json files"
  "--list-presets?": "Lists the available presets"
completion:
  flag:
    S: ["$directories"]
    B: ["$directories"]
    C: ["$files"]
    install-prefix: ["$directories"]
    Werror: ["dev\tMake developer warnings errors", "deprecated\tMake deprecated macro and function warnings errors"]
    Wno-error: ["dev\tMake developer warnings not errors", "deprecated\tMake deprecated macro and function warnings not errors"]
    graphviz: ["$files"]
    system-information: ["$files"]
    log-level: [ERROR, WARNING, NOTICE, STATUS, VERBOSE, DEBUG, TRACE]
    trace-format: [human, json-v1]
    trace-source: ["$files"]
    trace-redirect: ["$files"]
    list-presets: [configure, build, test, all]
  positional:
    - ["$directories"]
commands:
  - name: "--build"
    description: "Project binary directory to be built and must be first. This is required unless a preset is specified"
    flags:
      "--preset=": "Use a build preset to specify build options"
      "--list-presets": "Lists the available presets. If no option is specified only configure presets will be listed. The current working directory must contain CMake preset files"
      "--parallel, -j?": "The maximum number of concurrent processes to use when building. If <jobs> is omitted the native build tool's default number is used"
      "--target, -t=": {description: "Build <tgt> instead of the default target. Multiple targets may be given, separated by spaces", nargs: -1}
      "--config=": "For multi-configuration tools, choose configuration <cfg>"
      "--clean-first": "Build target clean first, then build"
      "--use-stderr": "Ignored. Behavior is default in CMake >= 3.0"
      "--verbose, -v": "Enable verbose output - if supported - including the build commands to be executed"
      "--": "Pass remaining options to the native tool"
    completion:
      positional:
        - ["$directories"]
  - name: "--install"
    description: "Project binary directory to install. This is required and must be first"
    flags:
      "--config=": "For multi-configuration generators"
      "--component=": "Component-based install. Only install component specified"
      "--default-directory-permissions=": "Default directory install permissions"
      "--prefix=": "Override the installation prefix"
      "--strip": "Strip before installing"
      "--verbose, -v": "Enable verbose output"
    completion:
      positional:
        - ["$directories"]
  - name: "--open"
    description: "Open the generated project in the associated application. This is only supported by some generators"
    completion:
      positional:
        - ["$directories"]
  - name: "-P"
    description: "Process the given cmake file as a script written in the CMake language. No configure or generate step is performed and the cache is not modified. If variables are defined using -D, this must be done before the -P argument"
    completion:
      positional:
        - ["$files"]
  - name: "-E"
    description: "CMake provides builtin command-line tools through the signature"
    commands:
      - name: capabilities
        description: "Report cmake capabilities in JSON format. The output is a JSON object with the following keys"
      - name: cat
        description: "Concatenate files and print on the standard output"
        completion:
          positionalany: ["$files"]
      - name: chdir
        description: "Change the current working directory and run a command"
        completion:
          positional:
            - ["$directories"]
      - name: compare_files
        description: "Check if file1 is the same as file2. If fails are the same, then returns 0, if not returns 1. In case of invalid arguments, it returns 2"
        flags:
          "--ignore-eol": "Implies line-wise comparison and ignores LF/CRLF differences"
        completion:
          positional:
            - ["$files"]
            - ["$files"]
      - name: copy
        description: "Copy files to <destination> (either file or directory). If multiple files are specified, the <destination> must be directory and it must exist. Wildcards are not supported. copy does follow symlinks. That means it does not copy symlinks, but the files or directories it point to"
        completion:
          positionalany: ["$files"]
      - name: copy_directory
        description: "Copy content of <dir>... directories to <destination> directory. If <destination> directory does not exist it will be created. copy_directory does follow symlinks"
        completion:
          positionalany: ["$directories"]
      - name: copy_if_different
        description: "Copy files to <destination> (either file or directory) if they have changed. If multiple files are specified, the <destination> must be directory and it must exist. copy_if_different does follow symlinks"
        completion:
          positionalany: ["$files"]
      - name: create_symlink
        description: "Create a symbolic link <new> naming <old>"
      - name: create_hardlink
        description: "Create a hard link <new> naming <old>"
      - name: echo
        description: "Displays arguments as text"
      - name: echo_append
        description: "Displays arguments as text but no new line"
      - name: env
        description: "Run command in a modified environment"
        flags:
          "--unset=": ""
      - name: environment
        description: "Display the current environment variables"
      - name: "false"
        description: "Do nothing, with an exit code of 1"
      - name: make_directory
        description: "Create <dir> directories. If necessary, create parent directories too. If a directory already exists it will be silently ignored"
        completion:
          positionalany: ["$directories"]
      - name: md5sum
        description: "Create MD5 checksum of files in md5sum compatible format"
        completion:
          positionalany: ["$files"]
      - name: sha1sum
        description: "Create SHA1 checksum of files in sha1sum compatible format"
        completion:
          positionalany: ["$files"]
      - name: sha224sum
        description: "Create SHA224 checksum of files in sha224sum compatible format"
        completion:
          positionalany: ["$files"]
      - name: sha226sum
        description: "Create SHA226 checksum of files in sha226sum compatible format"
        completion:
          positionalany: ["$files"]
      - name: sha384sum
        description: "Create SHA384 checksum of files in sha384sum compatible format"
        completion:
          positionalany: ["$files"]
      - name: sha512sum
        description: "Create SHA512 checksum of files in sha512sum compatible format"
        completion:
          positionalany: ["$files"]
      - name: remove
        description: "Remove the file(s). The planned behavior was that if any of the listed files already do not exist, the command returns a non-zero exit code, but no message is logged"
        flags:
          "-f": "The -f option changes the behavior to return a zero exit code (i.e. success) in such situations instead. remove does not follow symlinks. That means it remove only symlinks and not files it point to"
        completion:
          positionalany: ["$files"]
      - name: remove_directory
        description: "Remove <dir> directories and their contents. If a directory does not exist it will be silently ignored. If <dir> is a symlink to a directory, just the symlink will be removed. Use rm instead"
        completion:
          positionalany: ["$directories"]
      - name: rm
        description: "Remove the files <file> or directories dir"
        flags:
          "-r, -R": "Use -r or -R to remove directories and their contents recursively. If any of the listed files/directories do not exist, the command returns a non-zero exit code, but no message is logged"
          "-f": "The -f option changes the behavior to return a zero exit code (i.e. success) in such situations instead"
        completion:
          positionalany: ["$files"]
      - name: server
        description: "Launch cmake-server(7) mode"
      - name: sleep
        description: "Sleep for given number of seconds"
      - name: tar
        description: "Create or extract a tar or zip archive"
        flags:
          "--zstd": "Compress the resulting archive with Zstandard"
          "--files-from=": "Read file names from the given file, one per line. Blank lines are ignored. Lines may not start in - except for --add-file=<name> to add files whose names start in -"
          "--format=": "Specify the format of the archive to be created"
          "--mtime=": "Specify modification time recorded in tarball entries"
          "--": "Stop interpreting options and treat all remaining arguments as file names, even if they start with -"
        completion:
          flag:
            files-from: ["$files"]
            format: [7zip, gnutar, pax, paxr, zip]
      - name: time
        description: "Run command and display elapsed time"
      - name: touch
        description: "Creates <file> if file do not exist. If <file> exists, it is changing <file> access and modification times"
        completion:
          positionalany: ["$files"]
      - name: touch_nocreate
        description: "Touch a file if it exists but do not create it. If a file does not exist it will be silently ignored"
        completion:
          positionalany: ["$files"]
      - name: "true"
        description: "Do nothing, with an exit code of 0"
