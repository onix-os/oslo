    requirement-machine-protocol-signatures: ["on", "off", verify, check]
    strict-concurrency: [minimal, targeted, complete]
    swift-isa-ptrauth-mode: [LegacyAndStrip, NewAndStrip, NewAndAuth]
    swift-ptrauth-mode: [LegacyAndStrip, NewAndStrip, NewAndAuth]
