          "-a, --all": "Show all containers (default shows just running)"
          "-f, --filter=": "Filter output based on conditions provided"
          "--format=": "Pretty-print containers using a Go template"
          "-n, --last=": "Show n last created containers (includes all states) (default -1)"
          "-l, --latest": "Show the latest created container (includes all states)"
          "--no-trunc": "Don't truncate output"
          "-q, --quiet": "Only display container IDs"
          "-s, --size": "Display total file sizes"
      - name: pull
        description: "Pull an image or a repository from a registry"
        flags:
          "-a, --all-tags": "Download all tagged images in the repository"
          "--disable-content-trust": "Skip image verification (default true)"
          "--platform=": "Set platform if server is multi-platform capable"
          "-q, --quiet": "Suppress verbose output"
      - name: push
        description: "Push an image or a repository to a registry"
        flags:
          "-a, --all-tags": "Push all tagged images in the repository"
          "--disable-content-trust": "Skip image signing (default true)"
          "-q, --quiet": "Suppress verbose output"
      - name: rename
        description: "Rename a container"
      - name: restart
        description: "Restart one or more containers"
        flags:
          "-t, --time=": "Seconds to wait for stop before killing the container (default 10)"
      - name: rm
        description: "Remove one or more containers"
        flags:
          "-f, --force": "Force the removal of a running container (uses SIGKILL)"
          "-l, --link": "Remove the specified link"
          "-v, --volumes": "Remove the anonymous volumes associated with the container"
      - name: rmi
        description: "Remove one or more images"
        flags:
          "-f, --force": "Force removal of the image"
          "--no-prune": "Do not delete untagged parents"
      - name: run
        description: "Run a command in a new container"
        flags:
          "-it": "Launch an interactive session"
          "--add-host=": "Add a custom host-to-IP mapping (host:ip)"
          "-a, --attach=": "Attach to STDIN, STDOUT or STDERR"
          "--blkio-weight=": "Block IO (relative weight), between 10 and 1000, or 0 to disable (default 0)"
          "--blkio-weight-device=": "Block IO weight (relative device weight) (default [])"
          "--cap-add=": "Add Linux capabilities"
          "--cap-drop=": "Drop Linux capabilities"
          "--cgroup-parent=": "Optional parent cgroup for the container"
