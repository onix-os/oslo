# Converted from Fig's tns.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: tns
description: "The NativeScript CLI lets you create, build, and deploy NativeScript based apps on iOS and Android devices"
flags:
  "-v, --version": "View your current Nativescript CLI version"
commands:
  - name: help
    description: "Open the CLI's documentation in your web browser"
    flags:
      "--help, -h": "Show help for the help subcommand"
  - name: info
    description: "Displays version information about the NativeScript CLI, core modules, and runtimes"
    flags:
      "--help, -h": "Show help for the info subcommand"
  - name: update
    description: "Updates the project with the latest versions of platform runtimes, cross-platform modules and webpack"
    flags:
      "--help, -h": "Show help for the update subcommand"
    commands:
      - name: next
        description: "The latest development release"
  - name: package-manager
    description: "Prints the value of the current package manager"
    flags:
      "--help, -h": "Show help for the package-manager subcommand"
    commands:
      - name: get
        description: "Prints the value of the current package manager"
      - name: set
        description: "Enables the specified package manager for the NativeScript CLI. Supported values are npm, yarn and pnpm"
  - name: doctor
    description: "Checks your system for configuration problems which might prevent the NativeScript CLI from working properly for the specified platform, if configured"
    flags:
      "--help, -h": "Show help for the doctor subcommand"
    commands:
      - name: android
        description: "Check your system configuration for android"
      - name: ios
        description: "Check your system configuration for ios"
  - name: migrate
    description: "Migrates the app dependencies to a form compatible with NativeScript 6.0"
    flags:
      "--help, -h": "Show help for the migrate subcommand"
  - name: usage-reporting
    description: "Configures anonymous usage reporting for the NativeScript CLI. All data gathered is used strictly for improving the product and will never be used to identify or contact you"
    flags:
      "--help, -h": "Show help for the usage-reporting subcommand"
    commands:
      - name: status
        description: "Shows the current configuration for anonymous usage reporting for the NativeScript CLI"
      - name: enable
        description: "Enables anonymous usage reporting"
      - name: disable
        description: "Disables anonymous usage reporting"
  - name: error-reporting
    description: "Configures anonymous error reporting for the NativeScript CLI. All data gathered is used strictly for improving the product and will never be used to identify or contact you"
    flags:
      "--help, -h": "Show help for the error-reporting subcommand"
    commands:
      - name: status
        description: "Shows the current configuration for anonymous error reporting for the NativeScript CLI"
      - name: enable
        description: "Enables anonymous error reporting"
      - name: disable
        description: "Disables anonymous error reporting"
  - name: proxy
    description: "Displays the current proxy settings of the NativeScript CLI"
    flags:
      "--help, -h": "Show help for the proxy subcommand"
    commands:
      - name: clear
        description: "Clears the currently configured proxy settings of the NativeScript CLI"
      - name: set
        description: "Sets the proxy settings of the NativeScript CLI"
        flags:
          "--insecure": "Allows insecure SSL connections and transfers to be performed. In case your proxy doesn't have a CA certificate or has an invalid one you need to use this flag"
  - name: create
    description: "Create a new Nativescript project. Press Enter for an interactive walkthrough"
    flags:
      "--template=": "Create a project using a predefined template"
      "--angular, --ng": "Create a project using the Angular template"
      "--react": "Create a project using the React template"
      "--vue, --vuejs": "Create a project using the Vue template"
      "--svelte": "Create a project using the Svelte template"
      "--typescript, --tsc, --ts": "Create a project using plain TypeScript"
      "--javascript, --js": "Create a project using plain JavaScript"
      "--path=": "Specifies the directory where you want to create the project, if different from the current directory. <directory> is the absolute path to an empty directory in which you want to create the project"
      "--appid=": "Sets the application identifier of your project. <appid> is the value of the application identifier and it must meet the specific requirements of each platform that you want to target. If not specified, the application identifier is set to org.nativescript.<Project Name>. The application identifier must be a domain name in reverse"
      "--help, -h": "Show help for the create subcommand"
    completion:
      flag:
        path: ["$directories"]
  - name: clean
    description: "Clean your Nativescript project"
    flags:
      "--help, -h": "Show help for the clean subcommand"
  - name: preview
    description: "Produces a QR code which can be used to preview the app on a device"
    flags:
      "--force": "Skips the application compatibility checks and forces npm i to ensure all dependencies are installed"
      "--no-hmr": "Disables Hot Module Replacement (HMR)"
      "--help, -h": "Show help for the preview subcommand"
  - name: platform
    description: "Lists all platforms that the project currently targets. You can build and deploy your project only for these target platforms"
    flags:
      "--help, -h": "Show help for the platform subcommand"
    commands:
      - name: list
        description: "Lists all platforms that the project currently targets. You can build and deploy your project only for these target platforms"
      - name: add
        description: "Configures the current project to target the selected platform"
        commands:
          - name: android
            description: "The latest android platform"
            flags:
              "--framework-path=": "Sets the path to a NativeScript runtime for the specified platform that you want to use instead of the default runtime. <File Path> must point to a valid npm package"
            completion:
              flag:
                framework-path: ["$files"]
          - name: "android@[Version]"
            description: "The defined android platform eg. 1.0.0"
            flags:
              "--framework-path=": "Sets the path to a NativeScript runtime for the specified platform that you want to use instead of the default runtime. <File Path> must point to a valid npm package"
            completion:
              flag:
                framework-path: ["$files"]
          - name: ios
            description: "The latest ios platform"
            flags:
              "--framework-path=": "Sets the path to a NativeScript runtime for the specified platform that you want to use instead of the default runtime. <File Path> must point to a valid npm package"
            completion:
              flag:
                framework-path: ["$files"]
          - name: "ios@[Version]"
            description: "The defined ios platform eg. 1.0.0"
            flags:
              "--framework-path=": "Sets the path to a NativeScript runtime for the specified platform that you want to use instead of the default runtime. <File Path> must point to a valid npm package"
            completion:
              flag:
                framework-path: ["$files"]
      - name: remove
        description: "Removes the selected platform from the platforms that the project currently targets"
        commands:
          - name: android
            description: "The latest android platform"
          - name: ios
            description: "The latest ios platform"
      - name: update
        description: "Updates the NativeScript runtime for the specified platform"
        commands:
          - name: android
            description: "The latest android platform"
          - name: ios
            description: "The latest ios platform"
