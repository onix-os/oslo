name: ln
description: "Create (default hard) symbolic links to files"
flags:
  "-s=": {description: "Create a symbolic link", nargs: 2}
  "-v": Verbose
  "-F=": {description: "If link name already exists replace it", nargs: 2}
  "-h": "Don't follow symbolic links"
  "-f=": {description: "If link name already exists unlink the old one before creating the new one", nargs: 2}
  "-i=": {description: "Prompt if proposed link already exists", nargs: 2}
  "-n": "Same as -h don't follow symbolic links"
completion:
  flag:
    s: ["$files", "$directories"]
    F: ["$files", "$directories"]
    f: ["$files", "$directories"]
    i: ["$files", "$directories"]
  positional:
    - ["$files", "$directories"]
