  "-j, --jmeterlogfile=": "JMeter run log file"
  "-n, --nongui": "Run JMeter in nongui mode"
  "-s, --server": "Run the JMeter server"
  "-E, --proxyScheme=": "Set a proxy scheme to use for the proxy server"
