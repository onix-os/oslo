# Converted from Fig's twilio.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: twilio
description: "Manage your Twilio resources from your terminal"
persistentflags:
  "-h, --help": "Show a help message"
commands:
  - name: autocomplete
    description: "Display autocomplete installation instructions"
    hidden: true
    flags:
      "-r, --refresh-cache": "Refresh cache (ignores displaying instructions)"
    completion:
      positional:
        - [bash, zsh]
  - name: "config:list"
    description: "List Twilio CLI configurations"
    hidden: true
    flags:
      "-l=": ""
      "-o=": "Format of command output"
      "--silent": "Suppress output and logs. This is a shorthand for \"-l none -o none\""
    completion:
      flag:
        l: [debug, info, warn, error, none]
        o: [columns, json, tsv, none]
  - name: "config:set"
    description: "Update Twilio CLI configurations"
    hidden: true
    flags:
      "-l=": ""
      "-o=": "Format of command output"
      "--silent": "Suppress output and logs. This is a shorthand for \"-l none -o none\""
      "-e, --edge": "Sets an Edge configuration"
      "--require-profile-input": ""
      "--no-require-profile-input": ""
    exclusiveflags:
      - [require-profile-input, no-require-profile-input]
      - [no-require-profile-input, require-profile-input]
    completion:
      flag:
        l: [debug, info, warn, error, none]
        o: [columns, json, tsv, none]
  - name: "debugger:logs:list"
    description: "Show a list of log events generated for the account"
    hidden: true
  - name: "email:send"
    description: "Sends emails to single or multiple recipients"
    hidden: true
    flags:
      "-l=": ""
      "-o=": "Format of command output"
      "--silent": "Suppress output and logs. This is a shorthand for \"-l none -o none\""
      "--attachment=": "Path for the file that you want to attach"
      "--from=": "Email address of the sender"
      "--no-attachment": "Do not include or prompt for an attachment"
      "--subject=": "The subject line for an email"
      "--text=": "Text to send within the email body"
      "--to=": "Email address of recipient (comma-separated)"
    completion:
      flag:
        l: [debug, info, warn, error, none]
        o: [columns, json, tsv, none]
        attachment: ["$files"]
  - name: "email:set"
    description: "Sets a default sending email address and subject line"
    hidden: true
    flags:
      "-l=": ""
      "-o=": "Format of command output"
      "--silent": "Suppress output and logs. This is a shorthand for \"-l none -o none\""
      "--from=": "Email address of the sender"
      "--subject=": "The subject line for an email"
    completion:
      flag:
        l: [debug, info, warn, error, none]
        o: [columns, json, tsv, none]
  - name: feedback
    description: "Provide feedback to the CLI team"
    hidden: true
  - name: login
    description: "Create a new profile to store Twilio Account credentials and configuration"
    hidden: true
    flags:
      "-l=": ""
      "-o=": "Format of command output"
      "--silent": "Suppress output and logs. This is a shorthand for \"-l none -o none\""
      "-f, --force": "Force overwriting existing profile credentials"
      "-p, --profile=": "Shorthand identifier for your profile"
      "--auth-token=": "Your Twilio Auth Token for your Twilio Account or Subaccount"
      "--region=": "Twilio region to use"
    completion:
      flag:
        l: [debug, info, warn, error, none]
        o: [columns, json, tsv, none]
