        values: ["$files"]
  - name: ls
    aliases: [list]
    description: "List releases"
    flags:
      "--all, -a": "Show all releases without any filter applied"
      "--all-namespaces, -A": "List releases across all namespaces"
      "--date, -d": "Sort by release date"
