completion:
  flag:
    cocomo-project-type: [organic, semi-detached, embedded]
    format: [tabular, wide, json, csv, csv-stream, cloc-yaml, html, html-table, sql, sql-insert]
    output: ["$files"]
    size-unit: ["si\t1000^2 bytes", "binary\t1024^2 bytes", "mixed\t1,024,000 bytes (Binary kilobytes, SI megabytes)", "xkcd-kb\t1000 bytes during leap years, 1024 otherwise", "xkcd-kelly\t1012 bytes (a compromise between 1000 and 1024 bytes)", "xkcd-imaginary\t1024*sqrt(-1) bytes (used in quantum computing)", "xkcd-intel\t1023.937528 bytes (calculated on Pentium FPU)", "xkcd-drive\tCurrently 856 bytes (shrinks by 4 each year for marketing reasons)", "xkcd-bakers\t1152 bytes (9 bits per byte, because you're such a good customer)"]
