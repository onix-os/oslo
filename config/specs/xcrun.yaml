# Converted from Fig's xcrun.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: xcrun
description: "Find and execute the named command line tool from the active xCode developer directory"
flags:
  "-h, --help": "Help message"
  "--version": "Show the xcrun version"
  "-v, --verbose": "Show verbose logging output"
  "--sdk=": "Find the tool for the given SDK name"
  "--toolchain=": "Find the tool for the given toolchain"
  "-l, --log": "Show command path to be executed (and --run)"
  "-f, --find": "Find and print the tool path"
  "--run": "(Default) find and execute the tool"
  "-n, --no-cache": "Do not use the lookup cache"
  "-k, --kill-cache": "Invalidate all existing cache entries"
  "--show-sdk-path": "Show selected SDK install path"
  "--show-sdk-version": "Show selected SDK version"
  "--show-sdk-build-version": "Show selected SDK build version"
  "--show-sdk-platform-path": "Show selected SDK platform path"
  "--show-sdk-platform-version": "Show selected SDK platform version"
commands:
  - name: scntool
    description: "SceneKit CLI utilities"
    flags:
      "--convert=": "File to convert"
      "--format=": "Format to convert to"
      "--output=": "Path to the output file"
      "--force-y-up": "Convert objects to use y axis up"
      "--force-interleaved": "Interleave the vertex data for multiple semantics in the same array to achieve better rendering performance"
      "--prefer-compressed-textures": "Use .ktx, .astc and .pvrtc files for textures if available in the asset catalog"
      "--verbose": "Get pretty error message"
    completion:
      flag:
        convert: ["$files"]
        format: [scn, dae, c3d]
        output: ["$files"]
  - name: xcodebuild
    flags:
      "-usage": "Print brief usage"
      "-help": "Print complete usage"
      "-verbose": "Provide additional status output"
      "-license": "Show the Xcode and SDK license agreements"
      "-checkFirstLaunchStatus": "Check if any First Launch tasks need to be performed"
      "-runFirstLaunch": "Install packages and agree to the license"
      "-project=": "Build the project NAME"
      "-target=": "Build the target NAME"
      "-alltargets": "Build all targets"
      "-workspace=": "Build the workspace NAME"
      "-scheme=": "Build the scheme NAME"
      "-configuration=": "Use the build configuration NAME for building each target"
      "-xcconfig=": "Apply the build settings defined in the file at PATH as overrides"
      "-arch=": "Build each target for the architecture ARCH; this will override architectures defined in the project"
      "-sdk=": "Use SDK as the name or path of the base SDK when building the project"
      "-toolchain=": "Use the toolchain with identifier or name NAME"
      "-destination=": "Use the destination described by DESTINATIONSPECIFIER (a comma-separated set of key=value pairs describing the destination to use)"
      "-destination-timeout=": "Wait for TIMEOUT seconds while searching for the destination device"
      "-parallelizeTargets": "Build independent targets in parallel"
      "-jobs=": "Specify the maximum number of concurrent build operations"
      "-maximum-concurrent-test-device-destinations=": "The maximum number of device destinations to test on concurrently"
      "-maximum-concurrent-test-simulator-destinations=": "The maximum number of simulator destinations to test on concurrently"
      "-parallel-testing-enabled=": "Overrides the per-target setting in the scheme"
      "-parallel-testing-worker-count=": "The exact number of test runners that will be spawned during parallel testing"
      "-maximum-parallel-testing-workers=": "The maximum number of test runners that will be spawned during parallel testing"
      "-dry-run": "Do everything except actually running the commands"
      "-quiet": "Do not print any output except for warnings and errors"
      "-hideShellScriptEnvironment": "Don't show shell script environment variables in build log"
      "-showsdks": "Display a compact list of the installed SDKs"
      "-showdestinations": "Display a list of destinations"
      "-showTestPlans": "Display a list of test plans"
      "-showBuildSettings": "Display a list of build settings and values"
      "-showBuildSettingsForIndex": "Display build settings for the index service"
      "-list": "Lists the targets and configurations in a project, or the schemes in a workspace"
      "-find-executable=": "Display the full path to executable NAME in the provided SDK and toolchain"
      "-find-library=": "Display the full path to library NAME in the provided SDK and toolchain"
      "-version": "Display the version of Xcode; with -sdk will display info about one or all installed SDKs"
      "-enableAddressSanitizer=": "Turn the address sanitizer on or off"
      "-enableThreadSanitizer=": "Turn the thread sanitizer on or off"
      "-enableUndefinedBehaviorSanitizer=": "Turn the undefined behavior sanitizer on or off"
      "-resultBundlePath=": "Specifies the directory where a result bundle describing what occurred will be placed"
      "-resultStreamPath=": "Specifies the file where a result stream will be written to (the file must already exist)"
      "-resultBundleVersion=": "Specifies which result bundle version should be used"
      "-clonedSourcePackagesDirPath=": "Specifies the directory to which remote source packages are fetch or expected to be found"
      "-derivedDataPath=": "Specifies the directory where build products and other derived data will go"
      "-archivePath=": "Specifies the directory where any created archives will be placed, or the archive that should be exported"
      "-exportArchive": "Specifies that an archive should be exported"
      "-exportNotarizedApp": "Export an archive that has been notarized by Apple"
      "-exportOptionsPlist=": "Specifies a path to a plist file that configures archive exporting"
      "-enableCodeCoverage=": "Turn code coverage on or off when testing"
      "-exportPath=": "Specifies the destination for the product exported from an archive"
      "-skipUnavailableActions": "Specifies that scheme actions that cannot be performed should be skipped instead of causing a failure"
      "-exportLocalizations": "Exports completed and outstanding project localizations"
      "-importLocalizations": "Imports localizations for a project, assuming any necessary localized resources have been created in Xcode"
      "-localizationPath=": "Specifies a path to XLIFF localization file"
      "-exportLanguage=": {description: "Specifies multiple optional ISO 639-1 languages included in a localization export", nargs: -1}
      "-xcroot=": "Specifies a path to a .xcroot to use for building and/or testing"
      "-xctestrun=": "Specifies a path to a test run specification"
      "-testPlan=": "Specifies the name of the test plan associated with the scheme to use for testing"
      "-only-testing": "Constrains testing by specifying tests to include, and excluding other tests"
      "-only-testing:=": "Constrains testing by specifying tests to include, and excluding other tests"
      "-skip-testing": "Constrains testing by specifying tests to exclude, but including other tests"
      "-skip-testing:=": "Constrains testing by specifying tests to exclude, but including other tests"
      "-test-timeouts-enabled=": "Enable or disable test timeout behavior"
      "-default-test-execution-time-allowance=": "The default execution time an individual test is given to execute, if test timeouts are enabled"
      "-maximum-test-execution-time-allowance=": "The maximum execution time an individual test is given to execute, regardless of the test's preferred allowance"
      "-only-test-configuration": "Constrains testing by specifying test configurations to include, and excluding other test configurations"
      "-skip-test-configuration": "Constrains testing by specifying test configurations to exclude, but including other test configurations"
      "-testLanguage": "Constrains testing by specifying ISO 639-1 language in which to run the tests"
      "-testRegion": "Constrains testing by specifying ISO 3166-1 region in which to run the tests"
      "-resolvePackageDependencies": "Resolves any Swift package dependencies referenced by the project or workspace"
      "-disableAutomaticPackageResolution": "Prevents packages from automatically being resolved to versions other than those recorded in the `Package.resolved` file"
      "-json": "Output as JSON"
      "-allowProvisioningUpdates": "Allow xcodebuild to communicate with the Apple Developer website. For automatically signed targets, xcodebuild will create and update profiles, app IDs, and certificates. For manually signed targets, xcodebuild will download missing or updated provisioning profiles. Requires a developer account to have been added in Xcode's Accounts preference pane"
      "-allowProvisioningDeviceRegistration": "Allow xcodebuild to register your destination device on the developer portal if necessary. This flag only takes effect if -allowProvisioningUpdates is also passed"
      "-scmProvider=": "Which implementation to use for Git operations (system/xcode)"
      "-showBuildTimingSummary": "Display a report of the timings of all the commands invoked during the build"
      "-create-xcframework": "Create an xcframework from prebuilt libraries; -help for more information"
    exclusiveflags:
      - [only-testing, skip-testing]
      - ["only-testing:", skip-testing]
      - [skip-testing, only-testing]
      - ["skip-testing:", only-testing]
    completion:
      flag:
        workspace: ["$files"]
        xcconfig: ["$files"]
        arch: [x86_64, arm64, armv7]
        sdk: ["$directories"]
        destination: ["$directories"]
        parallel-testing-enabled: ["YES", "NO"]
        enableAddressSanitizer: ["YES", "NO"]
        enableThreadSanitizer: ["YES", "NO"]
        enableUndefinedBehaviorSanitizer: ["YES", "NO"]
        resultBundlePath: ["$directories"]
        resultStreamPath: ["$files"]
        clonedSourcePackagesDirPath: ["$directories"]
        derivedDataPath: ["$directories"]
        archivePath: ["$directories"]
        exportOptionsPlist: ["$files"]
        enableCodeCoverage: ["YES", "NO"]
        exportPath: ["$directories"]
        localizationPath: ["$files"]
        xcroot: ["$directories"]
        xctestrun: ["$directories"]
        test-timeouts-enabled: ["YES", "NO"]
        scmProvider: [system, xcode]
  - name: simctl
    commands:
      - name: addmedia
        description: "Add photos, live photos, videos, or contacts to the library of a device"
      - name: boot
        description: "Boot a device or device pair"
        flags:
          "--arch*": "Specify the architecture to use when booting the simulator (eg: 'arm64' or 'x86_64')"
          "--disabledJob*": "Disables the given launchd job. Multiple jobs can be disabled by passing multiple flags"
          "--enabledJob*": "Enables the given launchd job when it would normally be disabled. Multiple jobs can be enabled by passing multiple flags"
      - name: clone
        description: "Clone an existing device"
      - name: create
        description: "Create a new device"
      - name: delete
        description: "Delete specified devices, unavailable devices, or all devices"
      - name: diagnose
        description: "Collect diagnostic information and logs"
        flags:
          "-b": "Do NOT show the resulting archive in a Finder window upon completion"
          "-X": "Run all diagnostics with no timeout. It ignores the --timeout value if it is specified"
          "--timeout": "Specify a duration (in seconds) to wait for the log collection before timeout"
          "--output": "Specify the output directory. If not provided the temporary directory is used"
          "--no-archive": "Do not create an archive, leave the collected files uncompressed"
          "--all-logs": "Include all device logs, even for non-booted devices"
          "--data-containers": "Include booted device(s) data directory. Warning: May include private information, app data containers, and increases the size of the archive! Default is NOT to collect the data container"
          "--udid*": "Collect diagnostics only from the specified device. This option may be specified more than once to consider multiple devices. The --all-logs option causes all --udid options to be ignored"
        exclusiveflags:
          - [X, timeout]
      - name: erase
        description: "Erase a device's contents and settings"
      - name: get_app_container
        description: "Print the path of the installed app's container"
        completion:
          positional:
            - []
            - []
            - ["app\tThe .app bundle", "data\tThe application's data container", "groups\tThe App Group containers", "<group identifier>\tA specific App Group container"]
      - name: getenv
        description: "Print an environment variable from a running device"
      - name: help
        description: "Prints the usage for a given subcommand"
      - name: icloud_sync
        description: "Trigger iCloud sync on a device"
      - name: install
        description: "Install an app on a device"
      - name: install_app_data
        description: "Install an xcappdata package to a device, replacing the current contents of the container"
      - name: io
        description: "Set up a device IO operation"
        commands:
          - name: enumerate
            description: "Lists all available IO ports and descriptor states"
            flags:
              "--poll": "Poll after enumeration"
          - name: poll
            description: "Polls all available IO ports for events"
          - name: recordVideo
            description: "Records the display to a QuickTime movie at the specified file or url"
            flags:
              "--codec": "Specifies the codec type: 'h264' or 'hevc'. Default is 'hevc'"
              "--display": "iOS: supports 'internal' or 'external'. Default is 'internal'. tvOS: supports only 'external' watchOS: supports only 'internal'"
              "--mask": "For non-rectangular displays, handle the mask by policy: ignored: The mask is ignored and the unmasked framebuffer is saved. alpha: Not supported, but retained for compatibility; the mask is rendered black. black: The mask is rendered black"
              "--force": "Force the output file to be written to, even if the file already exists"
          - name: screenshot
            description: "Saves a screenshot as a PNG to the specified file or url(use '-' for stdout)"
            flags:
              "--type": "Can be 'png', 'tiff', 'bmp', 'gif', 'jpeg'. Default is png"
              "--display": "iOS: supports 'internal' or 'external'. Default is 'internal'. tvOS: supports only 'external' watchOS: supports only 'internal'. You may also specify a port by UUID"
              "--mask": "For non-rectangular displays, handle the mask by policy: ignored: The mask is ignored and the unmasked framebuffer is saved. alpha: The mask is used as premultiplied alpha. black: The mask is rendered black"
      - name: keychain
        description: "Manipulate a device's keychain"
        commands:
          - name: add-root-cert
            description: "Add a certificate to the trusted root store"
          - name: add-cert
            description: "Add a certificate to the keychain"
          - name: reset
            description: "Reset the keychain"
      - name: launch
        description: "Launch an application by identifier on a device"
        flags:
          "-w, --wait-for-debugger": ""
          "--console": "Block and print the application's stdout and stderr to the current terminal. Signals received by simctl are passed through to the application. (Cannot be combined with --stdout or --stderr)"
          "--console-pty": "Block and print the application's stdout and stderr to the current terminal via a PTY. Signals received by simctl are passed through to the application. (Cannot be combined with --stdout or --stderr)"
          "--stdout=": "Redirect the application's standard output to a file"
          "--stderr=": "Redirect the application's standard error to a file"
          "--terminate-running-process": "Terminate any running copy of the application. Note: Log output is often directed to stderr, not stdout"
        exclusiveflags:
          - [console, console-pty, stdout, stderr]
          - [console-pty, console, stdout, stderr]
          - [stdout, console, console-pty]
          - [stderr, console, console-pty]
      - name: list
        description: "List available devices, device types, runtimes, or device pairs"
        flags:
          "-j, --json": "Print as JSON"
          "-e, --no-escape-slashes": "Encode slashes without escapes in JSON output"
          "-v": "More verbose output"
        completion:
          positional:
            - [devices, deviceTypes, runtimes, pairs]
            - [available]
      - name: location
        description: "Control a device's simulated location"
        commands:
          - name: list
            description: "List available simulation scenarios"
          - name: clear
            description: "Stop any running scenario and clear any simulated location"
          - name: set
            description: "Set the location to a specific latitude and longitude"
          - name: run
            description: "Run a simulated location scenario (use the list action to get a list of scenarios)"
          - name: start
            description: "Set the location to a series of waypoints specified as 'lat,lon' pairs, interpolating between them over time. At least two waypoints are required. Use '-' to read waypoints from stdin, one waypoint per li Speed specifies how quickly to move between waypoints in meters per second. If not specified 20m/s is us The system will issue location updates along the path between each pair of waypoints. Use distance or interval to control how often those updates are issued. Distance will issue an update every <meters> travelled without regard for the time between updates. Interval will issue updates at fixed times without regard for how much the location moves between updates. If neither are specified an interval of 1.0 seconds is used. If both are specified the system picks on Example simulating a direct line between San Francisco and New York City, with updates every km: set --distance=1000 --speed=260 37.629538,-122.395733 40.628083,-73.768254"
      - name: logverbose
        description: "Enable or disable verbose logging for a device. NOTE: You may need to reboot the affected device before logging changes will be effective"
        completion:
          positional:
            - []
            - [enable, disable]
      - name: openurl
        description: "Open a URL in a device"
      - name: pair
        description: "Create a new watch and phone pair"
      - name: pair_activate
        description: "Set a given pair as active"
      - name: pbcopy
        description: "Copy standard input onto the device pasteboard"
        flags:
          "-v": ""
      - name: pbpaste
        description: "Print the contents of the device's pasteboard to standard output"
        flags:
          "-v": ""
      - name: pbsync
        description: "Sync the pasteboard content from one pasteboard to another"
        flags:
          "-p": "Causes simctl to use promise data for secondary types. simctl will continue to run to provide that promise data until something else replaces it on the pasteboard"
          "-v": ""
      - name: privacy
        description: "Grant, revoke, or reset privacy and permissions"
        completion:
          positional:
            - []
            - [grant, revoke, reset]
            - [all, calendar, contacts-limited, contacts, location, location-always, photos-add, photos, media-library, microphone, motion, reminders, siri]
      - name: push
        description: "Send a simulated push notification"
        completion:
          positional:
            - []
            - []
            - ["-"]
      - name: rename
        description: "Rename a device"
      - name: runtime
        description: "Perform operations on runtimes"
        commands:
          - name: add
            description: "Add a runtime disk image to the secure storage area. The image will be staged, verified, and mounted. When possible the image file will be cloned so no additional disk space will be used. If stdout is a terminal and a copy is required then progress will be reported"
            flags:
              "-m, --move": "Remove the original file if the image is added successfully. If the image cannot be staged or the add fails the original is not removed"
              "-a, --async": "Print the UUID of the new image then exit, do not wait on the results of the add operation"
          - name: delete
            description: "Delete a simulator runtime from the secure storage area. If runtime is a disk image any booted simulators are shutdown and the disk is unmounted first. Use the alias 'all' to delete all images"
            flags:
              "-d, --notUsedSinceDays": "Delete images not used within the past <days> days"
              "-n, --dry-run": "Print what images would be deleted without actually deleting anything"
            exclusiveflags:
              - [dry-run, identifier]
          - name: verify
            description: "Re-verify the signature of a given runtime"
          - name: list
            flags:
              "-v": "Print more verbose output"
              "-j, --json": "Print as JSON"
          - name: "match list"
            description: "List the SDK build to runtime build mapping rules for the selected Xcode. Preferred means the runtime was either bundled with Xcode, exactly matched your SDK version, or the downloadable index indicated a better match for your SDK Manual overrides using 'match set' have the highest priority"
            flags:
              "-v": "Verbose mode. Includes the full preferred build map, user override map, and known SDK names"
              "-j, --json": "Print as JSON"
          - name: "match set"
            description: "Override the SDK to runtime build mapping. This controls which build of a given runtime Xcode will prefer for building and running when using that SDK. This matters most often during Beta releases when there are multiple builds for a given OS version. If --sdkBuild is not specified it is assumed you mean the SDK build for the currently selected Xcode. Note: Remember this is about build numbers, not semantic versions. When using the iOS 16.0 SDK Xcwill always prefer an iOS 16.0 runtime. Matching policy controls what to do when there are multiiOS 16.0 runtimes availabeg if the iOS 16.0 SDK is 20A245 and the available runtimes are (20A248, 20A252, 20A254) which should Xcode use for building, SwiftUI Previews, and when launching iOS 16.0 Simulators? They are all iOS 16.0 runtimes so a policy must decide which one is selected"
            flags:
              "--default": "Clear the override for the given SDK and revert to default behavior"
              "--sdkBuild": "Explicitly specify the SDK build, eg for an Xcode other than the selected Xcode"
            exclusiveflags:
              - [default, "runtime build"]
      - name: shutdown
        description: "Shutdown a device"
        completion:
          positional:
            - []
            - [all]
      - name: spawn
        description: "Spawn a process by executing a given executable on a device"
        flags:
          "-w, --wait-for-debugger": ""
          "-s, --standalone": ""
          "-a, --arch": ""
      - name: status_bar
        description: "Set or clear status bar overrides"
        commands:
          - name: list
            description: "List existing overrides"
          - name: clear
            description: "Clear all existing status bar overrides"
          - name: override
            description: "Set status bar override values, according to these flags. You may specify any combination of these flags (at least one is required)"
            flags:
              "--time": "Set the date or time to a fixed value. If the string is a valid ISO date string it will also set the date on relevant devices"
              "--dataNetwork": "If specified must be one of 'hide', 'wifi', '3g', '4g', 'lte', 'lte-a', 'lte+', '5g', '5g+', '5g-uwb', or '5g-uc'"
              "--wifiMode": "If specified must be one of 'searching', 'failed', or 'active'"
              "--wifiBars": "If specified must be 0-3"
              "--cellularMode": "If specified must be one of 'notSupported', 'searching', 'failed', or 'active'"
              "--cellularBars": "If specified must be 0-4"
              "--operatorName": "Set the cellular operator/carrier name. Use '' for the empty string"
              "--batteryState": "If specified must be one of 'charging', 'charged', or 'discharging'"
              "--batteryLevel": "If specified must be 0-100"
      - name: terminate
        description: "Terminate an application by identifier on a device"
      - name: ui
        description: "Get or Set UI options"
        commands:
          - name: appearance
            description: "When invoked without arguments prints the current user interface appearance style: light The Light appearance style. dark The Dark appearance style. unsupported The platform or runtime version do not support appearance styles. unknown The current style is unknown or there was an error detecting it"
          - name: increase_contrast
            description: "When invoked without arguments prints whether the Increase Contrast mode is currently enabled: enabled Increase Contrast is enabled. disabled Increase Contrast is disabled. unsupported The platform or runtime version do not support the Increase Contrast setting. unknown The current setting is unknown or there was an error detecting it"
          - name: content_size
            description: "When invoked without arguments prints the current preferred content size category, from the following possible values:"
      - name: uninstall
        description: "Uninstall an app from a device"
      - name: unpair
        description: "Unpair a watch and phone pair"
      - name: upgrade
        description: "Upgrade a device to a newer runtime"
