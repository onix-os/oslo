# Converted from Fig's pac.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: pac
description: "Power Platform CLI"
commands:
  - name: admin
    description: "Work with your Power Platform Admin Account"
    commands:
      - name: list
        description: "List all environments from your tenant"
        flags:
          "--environment, -env=": "List all environments that contain given string in their name or ID"
          "--type, -t=": "List all environments with the given type"
          "--name, -n=": "List all environments that contain given string in their name"
          "--organization-id, -oi=": "List all environments that contain given string in their organization ID"
          "--application, -a=": "List all environments that have specified application installed. To specify application, use unique name or ID"
        completion:
          flag:
            type: ["Trial\tTrial", "Sandbox\tSandbox", "Production\tProduction", "Developer\tDeveloper", "Teams\tTeams", "SubscriptionBasedTrial\tSubscriptionBasedTrial"]
      - name: create
        description: "Creates a Dataverse instance in your tenant"
        flags:
          "--name, -n=": "Sets the name of the environment"
          "--region, -r=": "Sets the environment's region name. [defaults to unitedstates]"
          "--type, -t=!": "Sets the environment Type"
          "--currency, -c=": "Sets the currency used for your environment. [defaults to USD]"
          "--language, -l=": "Sets the language used for your environment. [defaults to English]"
          "--templates, -tm=": "Sets the Dynamics 365 app that needs to be deployed, passed as comma separated values. For example: -tm 'D365_Sample, D365_Sales'"
          "--domain, -d=": "The domain name is part of the environment URL. If domain name is already in use, a numeric value is appended to the domain name. For example: If 'contoso' is already in use, then the environment URL is updated to https://{contoso}0.crm.dynamics.com"
          "--input-file, -if=": "The verb arguments to be passed in a .json input file. For example: {'name' : 'contoso'}. The arguments passed through command-line will take precedence over arguments from the .json input file"
          "--async, -a": "Optional boolean argument to run pac verbs asynchronously, defaults to false"
          "--team-id, -tid=": "Team ID as Guid"
          "--max-async-wait-time, -wt=": "Max asynchronous wait time in minutes. The default value is 60 minutes"
          "--user, -u=": "Object ID or user principal name (UPN) of Microsoft Entra ID user to be assigned to the environment"
        completion:
          flag:
            region: ["unitedstates\tUnitedstates", "unitedstatesfirstrelease\tUnitedstatesfirstrelease", "europe\tEurope", "asia\tAsia", "australia\tAustralia", "india\tIndia", "japan\tJapan", "canada\tCanada", "unitedkingdom\tUnitedkingdom", "southamerica\tSouthamerica", "france\tFrance", "unitedarabemirates\tUnitedarabemirates", "germany\tGermany", "switzerland\tSwitzerland", "norway\tNorway", "korea\tKorea"]
            type: ["Trial\tTrial", "Sandbox\tSandbox", "Production\tProduction", "Developer\tDeveloper", "Teams\tTeams", "SubscriptionBasedTrial\tSubscriptionBasedTrial"]
      - name: backup
        description: "Takes a manual backup of your environment"
        flags:
          "--environment, -env=": "Environment URL or ID of the Environment that requires backup"
          "--label, -l=!": "Sets the backup label as provided"
          "--notes, -n=": "**ignored**: Additional notes for this backup"
      - name: set-backup-retention-period
        description: "Takes a manual backup of your environment"
        flags:
          "--environment, -env=": "Environment URL or ID of the Environment that requires backup"
          "--backup-retention-period, -br=!": "Sets the backup retention period in days as provided. Valid values are: 7, 14, 21, 28"
          "--async, -a": "Optional boolean argument to run pac verbs asynchronously, defaults to false"
          "--max-async-wait-time, -wt=": "Max asynchronous wait time in minutes. The default value is 60 minutes"
        completion:
          flag:
            backup-retention-period: ["7\t7", "14\t14", "21\t21", "28\t28"]
      - name: delete
        description: "Deletes the environment from your tenant"
        flags:
          "--environment, -env=": "Environment URL or ID of the Environment that needs to be deleted from your tenant"
          "--async, -a": "Optional boolean argument to run pac verbs asynchronously, defaults to false"
          "--max-async-wait-time, -wt=": "Max asynchronous wait time in minutes. The default value is 60 minutes"
      - name: reset
        description: "Reset the environment from your tenant"
        flags:
          "--environment, -env=": "URL or ID of the Environment that needs to be reset"
          "--currency, -c=": "Sets the currency used for your environment. [defaults to USD]"
          "--domain, -d=": "The domain name is part of the environment URL. If domain name is already in use, a numeric value is appended to the domain name. For example: If 'contoso' is already in use, then the environment URL is updated to https://{contoso}0.crm.dynamics.com"
          "--name, -n=": "Sets the name of the environment"
          "--language, -l=": "Sets the language used for your environment. [defaults to English]"
          "--purpose, -p=": "Sets the description used to associate the environment with a specific intent"
          "--templates, -tm=": "Sets the Dynamics 365 app that needs to be deployed, passed as comma separated values. For example: -tm 'D365_Sample, D365_Sales'"
          "--input-file, -if=": "The verb arguments to be passed in a .json input file. For example: {'name' : 'contoso'}. The arguments passed through command-line will take precedence over arguments from the .json input file"
          "--async, -a": "Optional boolean argument to run pac verbs asynchronously, defaults to false"
          "--max-async-wait-time, -wt=": "Max asynchronous wait time in minutes. The default value is 60 minutes"
      - name: list-backups
        description: "Lists all backups of your environment"
        flags:
          "--environment, -env=": "List all environments that contain a given string in their Environment ID or URL"
      - name: restore
        description: "Restores an environment to a given backup"
        flags:
          "--source-env, -se=": "Environment URL or ID of the source environment required for restore"
          "--target-env, -te=": "Environment URL or ID of the target environment required for restore. This would default to source URL/ID if not provided"
          "--selected-backup, -sb=!": "DateTime of the backup in 'mm/dd/yyyy hh:mm' format OR string 'latest'"
          "--name, -n=": "Optional name of the restored environment"
          "--skip-audit-data, -sa": "Switch indicating whether audit data should be skipped"
          "--async, -a": "Optional boolean argument to run pac verbs asynchronously, defaults to false"
          "--max-async-wait-time, -wt=": "Max asynchronous wait time in minutes. The default value is 60 minutes"
      - name: copy
        description: "Copy Source Environment to Destination Environment"
        flags:
          "--source-env, -se=": "Environment URL or ID of the source environment that is being copied"
          "--target-env, -te=": "Environment URL or ID of the target environment"
          "--name, -n=": "Name of the target environment"
          "--type, -t=": ""
          "--skip-audit-data, -sa": "Switch indicating whether audit data should be skipped"
          "--async, -a": "Optional boolean argument to run pac verbs asynchronously, defaults to false"
          "--max-async-wait-time, -wt=": "Max asynchronous wait time in minutes. The default value is 60 minutes"
        completion:
          flag:
            type: ["MinimalCopy\tMinimalCopy", "FullCopy\tFullCopy"]
      - name: status
        description: "This command lists the status of all the operations in progress"
      - name: assign-user
        description: "Assign a user to a target Dataverse environment with specified security role"
        flags:
          "--environment, -env=!": "ID or URL of the environment to assign a user to"
          "--user, -u=!": "Object ID or user principal name (UPN) of Microsoft Entra ID user to be assigned to the environment or Application ID if assigning an Application User"
          "--role, -r=!": "Name or ID of security role to be applied to user"
          "--application-user, -au": "Specifies whether the input user is an application user. If a business unit isn't specified, the application user is added to the authenticated users business unit"
          "--business-unit, -bu=": "ID of business unit to associate application user with"
          "--async, -a": "Optional boolean argument to run pac verbs asynchronously, defaults to false"
      - name: assign-group
        description: "Assign group to target Dataverse environment with specified security role"
        flags:
          "--environment, -env=!": "ID or URL of the environment to assign a user to"
          "--group, -g=!": "Microsoft Entra ID object ID of group to assign to target Dataverse environment"
          "--group-name, -gn=!": "Name of the group or team to create in Dataverse"
          "--role, -r=!": "Name or ID of security role to be applied to user"
          "--team-type, -tt=!": "Type of team"
          "--membership-type, -mt=!": "Team membership type"
          "--business-unit, -bu=": "ID of business unit to associate application user with"
        completion:
          flag:
            team-type: ["Owner\tOwner", "Access\tAccess", "AadSecurityGroup\tAadSecurityGroup", "AadOfficeGroup\tAadOfficeGroup"]
            membership-type: ["MembersAndGuests\tMembersAndGuests", "Members\tMembers", "Owners\tOwners", "Guests\tGuests"]
      - name: list-app-templates
        description: "Lists all supported Dataverse templates of model-driven apps in Dynamics 365"
        flags:
          "--region, -r=": "Sets the environment's region name. [defaults to unitedstates]"
        completion:
          flag:
            region: ["unitedstates\tUnitedstates", "unitedstatesfirstrelease\tUnitedstatesfirstrelease", "europe\tEurope", "asia\tAsia", "australia\tAustralia", "india\tIndia", "japan\tJapan", "canada\tCanada", "unitedkingdom\tUnitedkingdom", "southamerica\tSouthamerica", "france\tFrance", "unitedarabemirates\tUnitedarabemirates", "germany\tGermany", "switzerland\tSwitzerland", "norway\tNorway", "korea\tKorea"]
      - name: create-service-principal
        description: "Add Microsoft Entra ID application and associated application user to the Dataverse environment"
        flags:
          "--environment, -env=": "Environment (ID, org ID, url, unique name, or partial name)"
          "--name, -n=": "Application name to create in Entra ID"
          "--role, -r=": "Name or ID of security role to be applied to application user. The default value is: 'System Administrator'"
      - name: list-service-principal
        description: "List Microsoft Entra ID applications which have access to Dataverse"
        flags:
          "--filter, -f=": "Application name 'starts with' filter"
          "--max, -m=": "Max number of applications to show. Default: 20"
      - name: set-governance-config
        description: "Enable, disable, and edit managed environments"
        flags:
          "--environment, -env=!": "URL or ID of the environment for which managed environments need to be enabled, disabled or edited"
          "--protection-level, -pl=!": "Set protection level : 'Standard' to enable managed environments, 'Basic' to disable managed environments"
          "--disable-group-sharing, -dgs": "Disable group sharing"
          "--exclude-analysis, -ea": "Exclude usage insights for the environment from the weekly digest email"
          "--include-insights, -ii": "Include insights in the Power Platform Admin Center homepage cards"
          "--limit-sharing-mode, -lsm=": "Limit sharing mode"
          "--max-limit-user-sharing, -ml=": "If group sharing is disabled, specify the number of people that makers can share canvas apps with"
          "--solution-checker-mode, -scm=": "Solution checker validation mode"
        completion:
          flag:
            solution-checker-mode: ["none\tNone", "warn\tWarn", "block\tBlock"]
      - name: list-tenant-settings
        description: "List tenant settings"
        flags:
          "--settings-file, -s=": "The .json file to output tenant settings"
      - name: update-tenant-settings
        description: "Update tenant settings"
        flags:
          "--settings-file, -s=!": "The .json file with tenant settings"
      - name: application
        description: "Work with Microsoft Entra ID applications"
        commands:
          - name: list
            description: "List Microsoft Entra ID applications registered under your tenant"
          - name: register
            description: "Register Microsoft Entra ID application with your tenant"
            flags:
              "--application-id, -a=!": "Application Id"
          - name: unregister
            description: "Unregister Microsoft Entra ID application from your tenant"
            flags:
              "--application-id, -a=!": "Application Id"
  - name: application
    description: "Commands for listing and installing available Dataverse applications from AppSource"
    commands:
      - name: list
        description: "List available Dataverse applications from AppSource"
        flags:
          "--environment, -env=": "List available Dataverse applications for given environment (by ID or url); if not specified, list all applications in the tenant"
          "--output, -o=": "Location of the JSON file to be created with list of the Dataverse applications from AppSource"
          "--installState, -s=": "Filter by application install state"
        completion:
          flag:
            installState: ["NotInstalled\tNotInstalled", "Installed\tInstalled", "All\tAll"]
      - name: install
        description: "Installs Dataverse application to given environment"
        flags:
          "--environment, -env=": "List available Dataverse applications for given environment (by ID or url); if not specified, list all applications in the tenant"
          "--application-name, -an=": "Unique name of the application to install to the target environment"
          "--application-list, -al=": "Location of the JSON file with list of the Dataverse applications from AppSource to be installed"
  - name: auth
    description: "Manage how you authenticate to various services"
    commands:
      - name: create
        description: "Create and store authentication profiles on this computer"
        flags:
          "--name, -n=": "The name you want to give to this authentication profile (maximum 30 characters)"
          "--kind, -k=": "The kind of authentication profile you're creating"
          "--url, -u=": "The resource URL to connect to"
          "--username, -un=": "Optional: The username to authenticate with; shows Microsoft Entra ID dialog if not specified"
          "--password, -p=": "Optional: The password to authenticate with"
          "--applicationId, -id=": "Optional: The application ID to authenticate with"
          "--clientSecret, -cs=": "Optional: The client secret to authenticate with"
          "--certificateDiskPath, -cdp=": "Optional: The certificate disk path to authenticate with"
          "--certificatePassword, -cp=": "Optional: The certificate password to authenticate with"
          "--tenant, -t=": "Tenant ID if using application ID/client secret or application ID/client certificate"
          "--cloud, -ci=": "Optional: The cloud instance to authenticate with"
          "--deviceCode, -dc": "Use the Microsoft Entra ID Device Code flow for interactive sign-in"
          "--managedIdentity, -mi": "Use Azure Managed Identity"
          "--environment, -env=": "Default environment (ID, url, unique name, or partial name)"
        completion:
          flag:
            cloud: ["Public\tPublic", "Preprod\tPreprod", "Test\tTest", "UsGov\tUsGov", "UsGovHigh\tUsGovHigh", "UsGovDod\tUsGovDod", "China\tChina"]
      - name: list
        description: "List the authentication profiles stored on this computer"
      - name: select
        description: "Select which authentication profile should be active"
        flags:
          "--index, -i=": "The index of the profile to be active"
          "--name, -n=": "The name of the profile to be active"
      - name: delete
        description: "Delete a particular authentication profile"
        flags:
          "--index, -i=": "The index of the profile to be deleted"
          "--name, -n=": "The name of the profile to be active"
      - name: update
        description: "Update name or target environment of an existing authentication profile"
        flags:
          "--index, -i=!": "The index of the profile to be named/renamed"
          "--name, -n=": "The name you want to give to this authentication profile (maximum 30 characters)"
          "--environment, -env=": "Default environment (ID, url, unique name, or partial name)"
      - name: name
        description: "Name or rename an existing authentication profile"
        flags:
          "--index, -i=!": "The index of the profile to be named/renamed"
          "--name, -n=!": "The name you want to give to this authentication profile (maximum 30 characters)"
      - name: clear
        description: "Clear all authentication profiles stored on this computer"
  - name: canvas
    description: "Operating with Power Apps .msapp files"
    commands:
      - name: download
        description: "Download canvas app as .msapp file"
        flags:
          "--name, -n=!": "Canvas app exact, partial name, or App ID"
          "--file-name, -f=": "File name (usually with .msapp extension). If not provided file is saved in current directory with 'appname'.msapp"
          "--overwrite, -o": "Allow file overwrite"
          "--environment, -env=": "Environment (ID, org ID, url, unique name, or partial name)"
      - name: list
        description: "List canvas apps"
        flags:
          "--environment, -env=": "Environment (ID, org ID, url, unique name, or partial name)"
      - name: pack
        description: "(Preview) Pack sources into an msapp file"
        flags:
          "--sources=!": "Directory to sources to be packed"
          "--msapp=!": "Path to .msapp file"
      - name: unpack
        description: "(Preview) Extract an msapp file into sources"
        flags:
          "--sources=": "Directory to sources to be unpacked"
          "--msapp=!": "Path to .msapp file"
      - name: create
        description: "Generate a canvas app from a custom connector"
        flags:
          "--msapp=!": "Path to .msapp file to be generated"
          "--connector-id=": "The ID of the Connector to generate the Power App from"
          "--connector-display-name=": "The display name of the Connector to generate the Power App from"
          "--environment=": "The target Environment ID or URL. The default value is the environment of your currently active Dataverse Auth Profile"
  - name: catalog
    description: "Commands for working with Catalog in Power Platform"
    commands:
      - name: list
        description: "List all published catalog items from the current Dataverse organization"
        flags:
          "--catalog-item-name, -n=": "Catalog item name to search for"
          "--catalog-item-id, -cid=": "Catalog item ID to search for. When catalog item ID is used, catalog item name is ignored"
          "--include-active, -ia": "Include active items"
      - name: submit
        description: "Submit catalog approval request"
        flags:
          "--path, -p=!": "Path to catalog submission document"
          "--package-zip, -pz=": "Path to package zip file"
          "--solution-zip, -sz=": "Path to solution zip file"
          "--poll-status, -ps": "Poll to check status of your request"
      - name: install
        description: "Install a catalog item to the target environment"
        flags:
          "--catalog-item-id, -cid=!": "Catalog item to be installed on the target environment"
          "--target-url, -tu=!": "Url of the target environment for catalog item installation"
          "--settings, -s=": "Runtime Package Settings for the installation framework to execute. The format of the string must be 'key=value|key=value'"
          "--target-version, -tv=": "Target version to install. If left empty, the published version is selected"
          "--poll-status, -ps": "Poll to check status of your request"
      - name: status
        description: "Get status of the catalog install/submit request"
        flags:
          "--tracking-id, -id=!": "Request tracking ID"
          "--type, -t=!": "Request type"
      - name: update
        description: "Update settings for the catalog"
        flags:
          "--path, -p=!": "Path to catalog settings document"
      - name: create-submission
        description: "Create catalog submission document. Note: This command will be removed in a future release"
        flags:
          "--path, -p=": "Path to catalog submission document"
  - name: connection
    description: "Commands for working with Dataverse connection"
    commands:
      - name: create
        description: "Create new Dataverse connection"
        flags:
          "--tenant-id, -t=!": "Tenant Id"
          "--name, -n=!": "Connection name"
          "--application-id, -a=!": "Application Id"
          "--client-secret, -cs=!": "Client Secret"
          "--environment, -env=": "Environment (ID, org ID, url, unique name, or partial name)"
      - name: delete
        description: "Delete Dataverse connection"
        flags:
          "--connection-id, -id=!": "Connection Id"
          "--environment, -env=": "Environment (ID, org ID, url, unique name, or partial name)"
      - name: list
        description: "List all Connections"
        flags:
          "--environment, -env=": "Environment (ID, org ID, url, unique name, or partial name)"
      - name: update
        description: "Update Dataverse connection"
        flags:
          "--tenant-id, -t=!": "Tenant Id"
          "--connection-id, -id=!": "Connection Id"
          "--application-id, -a=!": "Application Id"
          "--client-secret, -cs=!": "Client Secret"
          "--environment, -env=": "Environment (ID, org ID, url, unique name, or partial name)"
  - name: connector
    description: "Commands for working with Power Platform Connectors"
    commands:
      - name: list
        description: "List the Connectors registered in Dataverse"
        flags:
          "--environment, -env=": "The target Environment ID or URL. The default value is the environment of your currently active Dataverse Auth Profile"
      - name: init
        description: "Initializes a new API Properties file for a Connector"
        flags:
          "--connection-template, -ct=": "Generate an initial Connection Parameters set with the specified template"
          "--generate-script-file": "Generate an initial Connector Script file"
          "--generate-settings-file": "Generate an initial Connector Settings file"
          "--outputDirectory, -o=": "Output directory"
        completion:
          flag:
            connection-template: ["NoAuth\tNoAuth", "BasicAuth\tBasicAuth", "ApiKey\tApiKey", "OAuthGeneric\tOAuthGeneric", "OAuthAAD\tOAuthAAD"]
      - name: create
        description: "Creates a new row in the Connector table in Dataverse"
        flags:
          "--api-definition-file, -df=": "The filename and path to read the Connector's OpenApiDefinition"
          "--api-properties-file, -pf=": "The filename and path to read the Connector's API Properties file"
          "--icon-file, -if=": "The filename and path to and Icon .png file"
          "--script-file, -sf=": "The filename and path to a Script .csx file"
          "--solution-unique-name, -sol=": "The unique name of the solution to add the connector to"
          "--environment, -env=": "The target Environment ID or URL. The default value is the environment of your currently active Dataverse Auth Profile"
          "--settings-file=": "The filename and path Connector Settings file"
      - name: download
        description: "Download a Connector's OpenApiDefinition and API Properties file"
        flags:
          "--connector-id, -id=!": "The ID of the Connector"
          "--outputDirectory, -o=": "Output directory"
          "--environment, -env=": "The target Environment ID or URL. The default value is the environment of your currently active Dataverse Auth Profile"
      - name: update
        description: "Updates a Connector Entity in Dataverse"
        flags:
          "--connector-id, -id=": "The ID of the Connector"
          "--api-definition-file, -df=": "The filename and path to read the Connector's OpenApiDefinition"
          "--api-properties-file, -pf=": "The filename and path to read the Connector's API Properties file"
          "--icon-file, -if=": "The filename and path to and Icon .png file"
          "--script-file, -sf=": "The filename and path to a Script .csx file"
          "--solution-unique-name, -sol=": "The unique name of the solution to add the connector to"
          "--environment, -env=": "The target Environment ID or URL. The default value is the environment of your currently active Dataverse Auth Profile"
          "--settings-file=": "The filename and path Connector Settings file"
  - name: copilot
    description: "Tools and utilities for copilot scenarios"
    commands:
      - name: list
        description: "AI Builder models in the current environment"
      - name: predict
        description: "Sends text or prompt to AI Model"
        flags:
          "--model-id, -id=": "AI Builder model Id"
          "--model-name, -n=": "Full or partial AI Model name"
          "--prompt, -p=": "Prompt to send to AI Model"
          "--text, -t=": "Text to send to AI Model"
      - name: prepare-fetch
        description: "Takes the FetchXML file from the AI Large Language Model (LLM) and prepares it for execution against the current environment"
        flags:
          "--inputFile, -i=!": "Input FetchXML file that usually comes from AI LLM"
          "--outputFile, -o=!": "Output FetchXML file that is ready to execute against the current environment"
  - name: data
    description: "Import and export data from Dataverse"
    commands:
      - name: export
        description: "Export data"
        flags:
          "--schemaFile, -sf=!": "Schema file name. It can be created using the Configuration Migration Tool"
          "--dataFile, -df=": "File name for data zip file. Default data.zip"
          "--overwrite, -o": "Allow overwrite of the output data file if it already exists"
          "--verbose, -v": "Output more diagnostic information during data import/export"
          "--environment, -env=": "Environment (ID, org ID, url, unique name, or partial name)"
      - name: import
        description: "Import data"
        flags:
          "--dataDirectory, -dd=": "Directory name with data for import"
          "--data, -d=!": "Zip file or directory name with data for import"
          "--connection-count, -c=": "Number of parallel connections to use during import. Default: 5"
          "--verbose, -v": "Output more diagnostic information during data import/export"
          "--environment, -env=": "Environment (ID, org ID, url, unique name, or partial name)"
  - name: help
    description: "Show help for the Microsoft Power Platform CLI"
  - name: modelbuilder
    description: "Code Generator for Dataverse APIs and Tables"
    commands:
      - name: build
        description: "Builds a code model for Dataverse APIs and Tables"
        flags:
          "--suppressGeneratedCodeAttribute, -sgca": "When set, this suppress all generated objects being tagged with the code generation engine and version"
          "--language, -l=": "The language to use for the generated proxy code. This value can be either 'CS' or 'VB'. The default language is 'CS'"
          "--namespace, -n=": "The namespace for the generated code. The default namespace is the global namespace"
          "--serviceContextName, -sctx=": "The name for the generated service context. If a value is passed in, it's used for the Service Context. If not, no Service Context is generated"
          "--generatesdkmessages, -a": "When set, emits Sdk message classes as part of code generation"
          "--emitentityetc, -etc": "When set, includes the entity ETC ( entity type code ) in the generated code"
          "--emitvirtualattributes, -eva": "When set, includes the Virtual Attributes of entities in the generated code"
          "--emitfieldsclasses, -efc": "Generate a constants structure that contains all of the field names by entity at the time of code generation"
          "--entitynamesfilter, -enf=": "Filters the list of entities are retrieved when reading data from Dataverse. Passed in as a semicolon separated list. Using the form <entitylogicalname>;<entitylogicalname>"
          "--messagenamesfilter, -mnf=": "Filters the list of messages that are retrieved when reading data from Dataverse. Passed in as a semicolon separated list, required messages (Create, Update, Delete, Retrieve, RetrieveMultiple, Associate and Disassociate) are always included. Use a trailing or leading asterisk (*) with the names of the messages to allow for all messages starting with or ending with a string. Using the form <messagename>;<messagename>"
          "--outdirectory, -o=!": "Write directory for entity, message, and optionset files"
          "--entitytypesfolder, -etf=": "Folder name that contains entities. The default name is 'Entities'"
          "--messagestypesfolder, -mtf=": "Folder name that contains messages. The default name is 'Messages'"
          "--optionsetstypesfolder, -otf=": "Folder name that contains option sets. The default name is 'OptionSets'"
          "--generateGlobalOptionSets, -go=": "Emit all Global OptionSets. Note: If an entity contains a reference to a global optionset, it is emitted even if this switch is not present"
