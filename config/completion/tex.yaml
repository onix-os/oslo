# Converted from argc's tex.sh by tools/argc-to-spec. Do not edit by hand.
name: tex
flags:
  "-cnf-line=": "Parse string as a texmf.cnf configuration line."
  "-enc": "Enable the encTeX extensions."
  "-file-line-error": "Print error messages in the form file:line:error which is similar to the way many compilers format them."
  "-no-file-line-error": "Disable printing error messages in the file:line:error style."
  "-file-line-error-style": "This is the old name of the -file-line-error option."
  "-fmt=": "Use format as the name of the format to be used, instead of the name by which TeX was called or a %& line."
  "-halt-on-error": "Exit with an error code when an error is encountered during processing."
  "-help": "Print help message and exit."
  "-ini": "Start in INI mode, which is used to dump formats."
  "-interaction=": "Sets the interaction mode."
  "-ipc": "Send DVI output to a socket as well as the usual output file."
  "-ipc-start": "As -ipc, and starts the server at the other end as well."
  "-jobname=": "Use name for the job name, instead of deriving it from the name of the input file."
  "-kpathsea-debug=": "Sets path searching debugging flags according to the bitmask."
  "-mktex=": "Enable mktexfmt, where fmt must be either tex or tfm."
  "-mltex": "Enable MLTeX extensions."
  "-no-mktex=": "Disable mktexfmt, where fmt must be either tex or tfm."
  "-output-comment=": "Use string for the DVI file comment instead of the date."
  "-output-directory=": "Write output files in directory instead of the current directory."
  "-parse-first-line": "If the first line of the main input file begins with %& parse it to look for a dump name or a -translate-file option."
  "-no-parse-first-line": "Disable parsing of the first line of the main input file."
  "-progname=": "Pretend to be program name."
  "-recorder": "Enable the filename recorder."
  "-shell-escape": "Enable the \\write18{command} construct."
  "-no-shell-escape": "Disable the \\write18{command} construct, even if it is enabled in the texmf.cnf file."
  "-src-specials=": "Insert source specials in certain places of the DVI file."
  "-translate-file=": "Use the tcxname translation table to set the mapping of input characters and re-mapping of output characters."
  "-default-translate-file=": "Like -translate-file except that a %& line can overrule this setting."
  "-version": "Print version information and exit."
