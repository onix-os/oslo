      "--authtoken, -authtoken=": "Ngrok.com authtoken identifying a user"
      "--hostname, -hostname=": "Host tunnel on custom hostname (requires DNS CNAME)"
      "--subdomain, -subdomain=": "Host tunnel on a custom subdomain"
      "--auth, -auth=": "Enforce basic auth on tunnel endpoint, 'user:password'"
      "--bind-tls, -bind-tls=": "Listen for http, https or both: true/false/both"
      "--host-header, -host-header=": "Set Host header; if 'rewrite' use local address hostname"
      "--introspection, -introspection=": "Enable/disable http introspection"
    completion:
      flag:
        log: [stdout, stderr, "false", "$files"]
        log-format: [term, logfmt, json]
        log-level: [crit, warn, error, info, debug]
        config: ["$files"]
        region: [us, eu, au, ap, sa, jp, in]
        bind-tls: ["true", "false", both]
        host-header: [rewrite]
        introspection: ["true", "false"]
      positional:
        - ["8080\tPort"]
  - name: authtoken
