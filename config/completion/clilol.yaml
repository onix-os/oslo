# Converted from Fig's clilol.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: clilol
description: "A cli for omg.lol"
persistentflags:
  "--help, -h": "Display help"
commands:
  - name: create
    description: "Create things"
    commands:
      - name: dns
        description: "Create a DNS record"
        flags:
          "--priority, -p=": "Priority of the DNS record"
          "--ttl, -T=": "Time to live of the DNS record"
      - name: paste
        description: "Create or update a paste"
        flags:
          "--filename, -f=": "File to read paste from (default stdin)"
          "--listed, -l": "Create paste as listed (default false)"
        completion:
          flag:
            filename: ["$files"]
      - name: picture
        description: "Upload a picture to some.pics"
        flags:
          "--description, -d": "Description of the picture (default empty/unlisted)"
      - name: purl
        description: "Create a PURL"
        flags:
          "--listed, -l": "Create as listed (default false)"
      - name: status
        description: "Create a status"
        flags:
          "--emoji, -e=": "Emoji to add to status (default sparkles)"
          "--skip-mastodon-post": "Do not cross-post to Mastodon"
      - name: weblog
        description: "Create a weblog entry"
        flags:
          "--filename, -f=": "File to read entry from (default stdin)"
        completion:
          flag:
            filename: ["$files"]
  - name: delete
    description: "Delete things"
    commands:
      - name: account
        description: "Delete information about your account"
        commands:
          - name: session
            description: "Delete a session"
      - name: dns
        description: "Delete a DNS record"
      - name: paste
        description: "Delete a paste"
      - name: picture
        description: "Delete a picture from some.pics"
      - name: purl
        description: "Delete a PURL"
      - name: status
        description: "Delete a status"
      - name: weblog
        description: "Delete a weblog entry"
  - name: get
    description: "Get things"
    commands:
      - name: account
        description: "Get information about your account"
        commands:
          - name: info
            description: "Get info about your account"
          - name: name
            description: "Get your account name"
          - name: settings
            description: "Get your account settings"
      - name: address
        description: "Get information about an address"
        commands:
          - name: availability
            description: "Get address availability"
          - name: expiration
            description: "Get address expiration"
          - name: info
            description: "Get information about an address"
            commands:
              - name: private
                description: "Get private information about an address"
              - name: public
                description: "Get public information about an address"
      - name: email
        description: "Get email forwarding address(es)"
      - name: now
        description: "Get a Now page"
        flags:
          "--address, -a=": "Address whose Now page to get"
          "--filename, -f=": "File to write Now page to (default stdout)"
        completion:
          flag:
            filename: ["$files"]
      - name: paste
        description: "Get a paste"
        flags:
          "--address, -a=": "Address whose paste to get"
          "--filename, -f=": "File to write paste to (default stdout)"
        completion:
