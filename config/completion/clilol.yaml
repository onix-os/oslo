            filename: ["$files"]
      - name: purl
        description: "Get a PURL"
        flags:
          "--address, -a=": "Address whose PURL to get"
      - name: service
        description: "Get service stats"
      - name: status
        description: "Get status"
        flags:
          "--address, -a=": "Address whose status to get"
      - name: status-bio
        description: "Get status bio"
        flags:
