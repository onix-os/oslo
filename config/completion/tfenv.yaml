# Converted from Fig's tfenv.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: tfenv
description: "Terraform version manager"
flags:
  "-v, --version": "View your current tfenv version"
  "--help": "View commands"
commands:
  - name: install
    description: "Install a specific version of Terraform"
    completion:
      positional:
        - [latest, min-required]
  - name: use
    description: "Switch to a version to use"
  - name: uninstall
    description: "Uninstall a specific version of Terraform"
  - name: list
    description: "List all installed versions"
  - name: list-remote
    description: "List all installable versions"
  - name: version-name
    description: "Print current version"
  - name: init
    description: "Update environment to use tfenv correctly"
