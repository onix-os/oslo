# Converted from Fig's hugo.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: hugo
description: "Hugo builds your site"
flags:
  "-h, --help": "help for hugo"
  "-b, --baseURL=": "Hostname (and path) to the root, e.g. http://spf13.com/"
  "-D, --buildDrafts=": "Include content marked as draft (default false)"
  "-E, --buildExpired=": "Include expired content (default false)"
  "-F, --buildFuture=": "Include content with publishdate in the future (default false)"
  "--cacheDir=": "Filesystem path to cache directory. Defaults: $TMPDIR/hugo_cache/"
  "--cleanDestinationDir=": "Remove files from destination not found in static directories (default false)"
  "-c, --contentDir=": "Filesystem path to content directory"
  "-d, --destination=": "Filesystem path to write files to"
  "--disableKinds=": "Disable different kind of pages (home, RSS etc.)"
  "--enableGitInfo=": "Add Git revision, date and author info to the pages (default false)"
  "--forceSyncStatic=": "Copy all files when static is changed (default false)"
  "--gc=": "Enable to run some cleanup tasks (remove unused cache files) after the build (default false)"
  "--i18n-warnings=": "Print missing translations (default false)"
  "--ignoreCache=": "Ignores the cache directory (default false)"
  "-l, --layoutDir=": "Filesystem path to layout directory"
  "--minify=": "Minify any supported output format (HTML, XML etc.) (default false)"
  "--noChmod=": "Don't sync permission mode of files (default false)"
  "--noTimes=": "Don't sync modification time of files (default false)"
  "--path-warnings=": "Print warnings on duplicate target paths etc (default false)"
  "--poll=": "Set this to a poll interval, e.g --poll 700ms, to use a poll based approach to watch for file system changes"
  "--print-mem=": "Print memory usage to screen at intervals (default false)"
  "--templateMetrics=": "Display metrics about template executions (default false)"
  "--templateMetricsHints=": "Calculate some improvement hints when combined with --templateMetrics (default false)"
  "-t, --theme=": "Themes to use (located in /themes/THEMENAME/)"
  "--trace=": "Write trace to file (not useful in general)"
  "--config=": "Config file (default is path/config.yaml|json|toml)"
  "--configDir=": "Config dir (default 'config')"
  "--debug=": "Debug output (default false)"
  "-e, --environment=": "Build environment"
  "--ignoreVendor=": "Ignores any _vendor directory (default false)"
  "--ignoreVendorPaths=": "Ignores any _vendor for module paths matching the given Glob pattern"
  "--log=": "Enable Logging (default false)"
  "--logFile=": "Log File path (if set, logging enabled automatically)"
  "--quiet=": "Build in quiet mode (default false)"
  "-s, --source=": "Filesystem path to read files relative from"
  "--themesDir=": "Filesystem path to themes directory"
  "-v, --verbose=": "Verbose output (default false)"
  "--verboseLog=": "Verbose logging (default false)"
  "-w, --watch=": "Watch filesystem for changes and recreate as needed (default true)"
  "--renderToMemory": "Render to memory (only useful for benchmark testing)"
completion:
  flag:
    cacheDir: ["$directories"]
    contentDir: ["$directories"]
    destination: ["$directories"]
    disableKinds: [page, home, section, taxonomy, term, RSS, sitemap, robotsTXT, 404]
    layoutDir: ["$directories"]
    trace: ["$files"]
    config: ["$files"]
    configDir: ["$directories"]
    logFile: ["$files"]
    source: ["$files"]
    themesDir: ["$files"]
commands:
