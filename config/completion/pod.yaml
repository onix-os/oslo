        description: "Validates a spec file"
        flags:
          "--quick": "Lint skips checks that would require to download and build the spec"
          "--allow-warnings": "Lint validates even if warnings are present"
          "--subspec=": "Lint validates only the given subspec"
          "--no-subspecs": "Lint skips validation of subspecs"
          "--no-clean": "Lint leaves the build directory intact for inspection"
          "--fail-fast": "Lint stops on the first failing platform or subspec"
          "--use-libraries": "Lint uses static libraries to install the spec"
          "--use-modular-headers": "Lint uses modular headers during installation"
          "--use-static-frameworks": "Lint uses static frameworks during installation"
          "--sources=": "The sources from which to pull dependent pods (defaults to https://cdn.cocoapods.org/). Multiple sources must be comma-delimited"
          "--platforms=": "Lint against specific platforms (defaults to all platforms supported by the podspec). Multiple platforms must be comma-delimited"
          "--private": "Lint skips checks that apply only to public specs"
          "--swift-version=": "The `SWIFT_VERSION` that should be used to lint the spec. This takes precedence over the Swift versions specified by the spec or a `.swift-version` file"
          "--skip-import-validation": "Lint skips validating that the pod can be imported"
          "--skip-tests": "Lint skips building and running tests during validation"
