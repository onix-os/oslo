          positional:
            - ["$directories"]
      - name: start
        description: "Start the application in production mode"
        flags:
          "-p, --port=": "A port number on which to start the application"
          "-H, --hostname=": "Hostname on which to start the application"
        completion:
          positional:
            - ["$directories"]
      - name: export
        description: "Exports the application for production deployment"
        flags:
