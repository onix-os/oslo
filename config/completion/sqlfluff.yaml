# Converted from Fig's sqlfluff.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: sqlfluff
description: "A dialect-flexible and configurable SQL linter"
persistentflags:
  "--version": "Show the version and exit"
  "--help, -h": "Show help for sqlfluff"
commands:
  - name: lint
    description: "Lint SQL files via passing a list of files or using stdin"
    flags:
      "--nocolor, -n": "No color - output will be without ANSI color codes"
      "--ignore, -i=": "Ignore particular families of errors so that they don’t cause a failed run. -–ignore behaves somewhat like noqa comments, except it applies globally"
      "--verbose, -v*": "Verbosity, how detailed should the output be. This is stackable, so -vv is more verbose than -v. For the most verbose option try -vvvv or -vvvvv"
      "--exclude-rules, -e=": "Exclude specific rules. This could either be the allowlist, or the general set if there is no specific allowlist"
      "--rules, -r=": "Narrow the search to only specific rules"
      "--templater, -t=": "The templater to use (default=jinja)"
      "--dialect, -d=": "The dialect of SQL to lint"
      "--format, -f=": "What format to return the lint result in (default=human)"
      "--processes, -p=": "The number of parallel processes to run. Positive numbers work as expected. Zero and negative numbers will work as number_of_cpus - number. e.g -1 means all cpus except one. 0 means all cpus"
      "--disable-noqa": "Set this flag to ignore inline noqa comments"
      "--bench": "Set this flag to engage the benchmarking tool output"
      "--logger=": "Choose to limit the logging to one of the loggers"
      "--encoding=": "Specify encoding to use when reading and writing files. Defaults to autodetect"
      "--ignore-local-config": "Ignore config files in default search path locations. This option allows the user to lint with the default config or can be used in conjunction with –config to only reference the custom config file"
      "--config=": "Include additional config file. By default the config is generated from the standard configuration files described in the documentation. This argument allows you to specify an additional configuration file that overrides the standard configuration files. N.B. cfg format is required"
      "--write-output=": "Optionally provide a filename to write the results to, mostly used in tandem with –format. NB: Setting an output file re-enables normal stdout logging"
      "--annotation-level=": "When format is set to github-annotation or github-annotation-native, default annotation level (default=notice). failure and error are equivalent"
      "--disregard-sqlfluffignores": "Perform the operation regardless of .sqlfluffignore configurations"
      "--disable-progress-bar": "Disables progress bars"
      "--nofail": "If set, the exit code will always be zero, regardless of violations found. This is potentially useful during rollout"
      "--help, -h": "Show help for sqlfluff"
    completion:
      flag:
        templater: [raw, jinja, python, placeholders]
        dialect: [ansi, bigquery, exasol, hive, mysql, oracle, postgres, redshift, snowflake, spark3, sqllite, teradata, tsql]
        format: [human, json, yaml, github-annotation, github-annotation-native]
        logger: [templater, lexer, parser, linter, rules]
        config: ["$files"]
        write-output: ["$files"]
        annotation-level: [notice, warning, failure, error]
      positionalany: ["$files"]
