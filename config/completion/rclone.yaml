# Converted from Fig's rclone.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: rclone
description: "The Swiss army knife of cloud storage"
flags:
  "--version": "View your current rclone version"
  "--help, -h": "Show help for rclone commands, flags and backends"
commands:
  - name: about
    description: "Get quota information from the remote"
    flags:
      "--full": "Full numbers instead of SI units"
      "--json": "Format output as JSON"
  - name: authorize
    description: "Remote authorization"
    flags:
      "--auth-no-open-browser": "Do not automatically open auth link in default browser"
  - name: backend
    description: "Run a backend specific command"
    flags:
      "--json": "Format output as JSON"
  - name: cat
    description: "Concatenates any files and sends them to stdout"
    flags:
      "--discard": "Discard the output instead of printing"
      "--count=": "Only print N characters. (default -1)"
      "--head=": "Only print the first N characters"
      "--offset=": "Start printing at offset N (or from end if -ve)"
      "--tail=": "Only print the last N characters"
  - name: check
    description: "Checks the files in the source and destination match"
    flags:
      "--download": "Check by downloading rather than with hash"
      "--combined=": "Make a combined report of changes to this file"
      "--differ=": "Report all non-matching files to this file"
      "--error=": "Report all files with errors (hashing or reading) to this file"
      "--match=": "Report all matching files to this file"
      "--missing-on-dst=": "Report all files missing from the destination to this file"
      "--missing-on-src=": "Report all files missing from the source to this file"
      "--one-way": "Check one way only, source files must exist on remote"
    completion:
      flag:
        combined: ["$files"]
        differ: ["$files"]
        error: ["$files"]
        match: ["$files"]
        missing-on-dst: ["$files"]
        missing-on-src: ["$files"]
  - name: cleanup
    description: "Clean up the remote if possible"
  - name: config
    description: "Enter an interactive configuration session"
    commands:
      - name: create
        description: "Create a new remote with name, type and options"
  - name: copy
    description: "Copy files from source to dest, skipping already copied"
  - name: copyto
    description: "Copy files from source to dest, skipping already copied"
  - name: copyurl
    description: "Copy url content to dest"
  - name: cryptcheck
    description: "Cryptcheck checks the integrity of a crypted remote"
    flags:
      "--combined=": "Make a combined report of changes to this file"
      "--differ=": "Report all non-matching files to this file"
      "--error=": "Report all files with errors (hashing or reading) to this file"
      "--match=": "Report all matching files to this file"
      "--missing-on-dst=": "Report all files missing from the destination to this file"
      "--missing-on-src=": "Report all files missing from the source to this file"
      "--one-way": "Check one way only, source files must exist on remote"
    completion:
      flag:
        combined: ["$files"]
        differ: ["$files"]
        error: ["$files"]
        match: ["$files"]
        missing-on-dst: ["$files"]
        missing-on-src: ["$files"]
  - name: cryptdecode
    description: "Cryptdecode returns unencrypted file names"
    flags:
      "--reverse": "Reverse cryptdecode, encrypts filenames"
  - name: dedupe
    description: "Interactively find duplicate filenames and delete/rename them"
    flags:
      "--by-hash": "Find identical hashes rather than names"
      "--dedupe-mode=": "Dedupe mode"
    completion:
      flag:
        dedupe-mode: ["interactive\tInteractive", "skip\tRemoves identical files then skips anything left", "rename\tRemoves identical files then renames the rest to be different", "list\tLists duplicate dirs and files only and changes nothing", "first\tremoves identical files then keeps the first one.", "newest\tremoves identical files then keeps the newest one.", "oldest\tremoves identical files then keeps the oldest one.", "largest\tremoves identical files then keeps the largest one.", "smallest\tremoves identical files then keeps the smallest one."]
  - name: delete
    description: "Remove the files in path"
    flags:
      "--rmdirs": "Rmdirs removes empty directories but leaves root intact"
  - name: deletefile
    description: "Remove a single file from remote"
  - name: genautocomplete
    description: "Output completion script for a given shell"
    commands:
      - name: bash
        description: "Output bash completion script for rclone."
      - name: fish
        description: "Output fish completion script for rclone."
      - name: zsh
        description: "Output zsh completion script for rclone."
  - name: gendocs
    description: "Output markdown docs for rclone to the directory supplied"
    completion:
      positional:
        - ["$directories"]
  - name: hashsum
    description: "Produces a hashsum file for all the objects in the path"
    flags:
      "--base64": "Output base64 encoded hashsum"
      "--download": "Download the file and hash it locally; if this flag is not specified, the hash is requested from the remote"
      "--output-file=": "Output hashsums to a file rather than the terminal"
    completion:
      flag:
        output-file: ["$files"]
      positional:
        - [MD5, SHA-1, DropboxHash, QuickXorHash, Whirlpool, CRC-32, MailruHash]
  - name: help
    description: "Show help for rclone commands, flags and backends"
    commands:
      - name: flags
        description: "List of global flags"
  - name: link
    description: "Generate public link to file/folder"
    flags:
      "--expire=": "The amount of time that the link will be valid (default 100y)"
      "--unlink": "Remove existing public link to file/folder"
  - name: listremotes
    description: "List all the remotes in the config file"
    flags:
      "--long": "Show the type as well as names"
  - name: ls
    description: "List the objects in the path with size and path"
  - name: lsd
    description: "List all directories/containers/buckets in the path"
    flags:
      "-R, --recursive": ""
  - name: lsf
    description: "List directories and objects in remote:path formatted for parsing"
    flags:
      "--dirs-only": "Only list directories"
      "--files-only": "Only list files"
      "--recursive, -R": "Recurse into the listing"
      "--absolute": "Put a leading / in front of path names"
      "--csv": "Output in CSV format"
      "-d, --dir-slash": "Append a slash to directory names. (default true)"
      "--format, -F=": "Output format - see help for details (default \"p\")"
      "--hash=": "Use this hash when h is used in the format (default \"MD5\")"
      "--separator, -s=": "Separator for the items in the format. (default \";\")"
    completion:
      flag:
        format: ["p\tpath", "s\tsize", "t\tmodification time", "h\thash", "i\tID of object", "o\tOriginal ID of underlying object", "m\tMimeType of object if known"]
        hash: [MD5, SHA-1, DropboxHash, QuickXorHash, Whirlpool, CRC-32, MailruHash]
  - name: lsjson
    description: "List directories and objects in the path in JSON format"
    flags:
      "--dirs-only": "Only list directories"
      "--files-only": "Only list files"
      "--recursive, -R": "Recurse into the listing"
      "--encrypted, -M": "Show the encrypted names"
      "--hash": "Include hashes in the output (may take longer)"
      "--hash-type=": "Show only this hash type (may be repeated)"
      "--no-mimetype": "Don't read the mime type (can speed things up)"
      "--no-modtime": "Don't read the modification time (can speed things up)"
      "--original": "Show the ID of the underlying Object"
    completion:
      flag:
        hash-type: [MD5, SHA-1, DropboxHash, QuickXorHash, Whirlpool, CRC-32, MailruHash]
  - name: lsl
    description: "List the objects in path with modification time, size and path"
  - name: md5sum
    description: "Produces an md5sum file for all the objects in the path"
    flags:
      "--base64": "Output base64 encoded hashsum"
      "--download": "Download the file and hash it locally; if this flag is not specified, the hash is requested from the remote"
      "--output-file=": "Output hashsums to a file rather than the terminal"
    completion:
      flag:
        output-file: ["$files"]
  - name: mkdir
    description: "Make the path if it doesn't already exist"
  - name: mount
    description: "Mount the remote as file system on a mountpoint"
    completion:
      positional:
        - []
        - ["$directories"]
  - name: move
    description: "Move files from source to dest"
  - name: moveto
    description: "Move file or directory from source to dest"
  - name: ncdu
    description: "Explore a remote with a text based user interface"
  - name: obscure
    description: "Obscure password for use in the rclone config file"
  - name: purge
    description: "Remove the path and all of its contents"
  - name: rc
    description: "Run a command against a running rclone"
  - name: rcat
    description: "Copies standard input to file on remote"
  - name: rcd
    description: "Run rclone listening to remote control commands only"
  - name: rmdir
    description: "Remove the empty directory at path"
  - name: rmdirs
    description: "Remove empty directories under the path"
  - name: selfupdate
    description: "Update the rclone binary"
  - name: serve
    description: "Serve a remote over a protocol"
  - name: settier
    description: "Changes storage class/tier of objects in remote"
  - name: sha1sum
    description: "Produces an sha1sum file for all the objects in the path"
  - name: size
    description: "Prints the total size and number of objects in remote:path"
  - name: sync
    description: "Make source and dest identical, modifying destination only"
  - name: test
    description: "Run a test command"
  - name: touch
    description: "Create new file or change file modification time"
  - name: tree
    description: "List the contents of the remote in a tree like fashion"
  - name: version
    description: "Show the version number"
