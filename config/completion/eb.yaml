# Converted from Fig's eb.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: eb
description: "AWS Elastic Beanstalk"
commands:
  - name: init
    description: "Initialize a new AWS Elastic Beanstalk application"
    flags:
      "-i, --interactive": "Forces EB CLI to prompt you to provide a value for every eb init command option"
      "-k, --keyname=": "The name of the AWS EC2 key pair"
      "--modules": "List of child directories to initialize"
      "-p, --platform=": "The platform version to use"
      "--tags=": "List of tags to apply to the application"
  - name: deploy
    description: "Deploys the application source bundle from the initialized project directory to the running application"
    flags:
      "-l, --label=": "Specify a label to use for the version that the EB CLI creates"
      "--env-group-suffix=": "Group name to append to the environment name"
      "-m, --message=": "The description for the application version, enclosed in double quotation marks"
      "--modules=": "List of components to update. Only for Compose Environments"
      "-p, --platform": "Preprocess and validate the environment manifest and configuration files in the source bundle"
      "--source=": "CodeCommit repository and branch"
      "--staged": "Deploy files staged in the git index instead of the HEAD commit"
      "--timeout=": "The number of minutes before the command times out"
      "--version=": "An existing application version to deploy"
  - name: abort
    description: "Abort the current running process"
  - name: clone
    description: "Clones an environment to a new environment so that both have identical environment settings"
    flags:
      "-n, --clone_name=": "Desired name for the cloned environment"
      "-c, --cname=": "Desired CNAME prefix for the cloned environment"
      "--envvars": "Environment properties in a comma-separated list with the format name=value"
      "--exact": "Prevents Elastic Beanstalk from updating the solution stack version for the new clone environment to the most recent version available"
      "--scale=": "The number of instances to run in the clone environment when it is launched"
      "--tags=": "Tags for the resources in your environment in a comma-separated list with the format name=value"
      "--timeout": "The number of minutes before the command times out"
  - name: open
    description: "Opens the public URL of your website in the default browser"
  - name: list
    description: "List environments"
    flags:
      "-a, --all": "List all environments from all applications"
      "-v, --verbose": "Provides more detailed information about all environments, including instances"
  - name: printenv
    description: "Prints all the environment properties in the command window"
  - name: ssh
    description: "Connect to a Linux Amazon EC2 instance in your environment using Secure Shell"
    flags:
      "-i, --instance": "The ID of the instance to connect to"
      "-n, --number": "The number of the instance to connect to by number"
      "-o, --keep_open": "Leave port 22 open on the security group after the SSH session ends"
      "--command": "Execute a shell command on the specified instance instead of starting an SSH session"
      "--custom": "Specify an SSH command to use instead of 'ssh -i keyfile'. Do not include the remote user and hostname"
      "--setup": "Change the key pair assigned to the environment's instances"
      "--force": "Open port 22 to incoming traffic from 0.0.0.0/0 in the environment's security group, even if the security group is already configured for SSH"
      "--timeout=": "Set number of minutes before the command times out"
  - name: use
    description: "Sets the specified environment as the default environment"
    flags:
      "-r, --region=": "Change the region in which you create environments"
      "--source=": "CodeCommit repository and branch"
