# Converted from Fig's nl.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: nl
description: "Line numbering filter"
parsing: non-interspersed
flags:
  "-b=": "Specify the logical page body lines to be numbered"
  "-d=": "Specify the delimiter characters used to indicate the start of a logical page section in the input file. At most two characters may be specified; if only one character is specified, the first character is replaced and the second character remains unchanged"
  "-f=": "Specify the same as -b type except for logical page footer lines"
  "-h=": "Specify the same as -b type except for logical page header lines"
  "-i=": "Specify the increment value used to number logical page lines"
  "-l=": "If numbering of all lines is specified for the current logical section using the corresponding -b a, -f a or -h a option, specify the number of adjacent blank lines to be considered as one. For example, -l 2 results in only the second adjacent blank line being numbered"
  "-n=": "Specify the line numbering output format"
  "-p": "Specify that line numbering should not be restarted at logical page delimiters"
  "-s=": "Specify the characters used in separating the line number and the corresponding text line. The default sep setting is a single tab character"
  "-v=": "Specify the initial value used to number logical page lines; see also the description of the -p option"
  "-w=": "Specify the number of characters to be occupied by the line number; in case the width is insufficient to hold the line number, it will be truncated to its width least significant digits"
completion:
  flag:
    b: ["a\tNumber all lines", "t\tNumber only non-empty lines", "pexpr\tOnly those lines that contain the basic regular expression specified by 'expr'"]
    d: ["\\:"]
    f: [n]
    h: [n]
    i: [1]
    l: [1]
    n: ["ln\tLeft justified", "rn\tRight justified (leading zeros suppressed)", "rz\tRight justified (leading zeros kept)"]
    s: ["\\t"]
    v: [1, 2, 3]
    w: [6, 5, 4, 3, 2, 1]
  positional:
    - ["$files"]
