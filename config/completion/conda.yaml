  - name: convert
    description: "Various tools to convert conda packages. Takes a pure Python package build for one platform and converts it to work on one or more other platforms, or all"
    flags:
      "-h, --help": "Show this help message and exit"
      "-p, --platform=": "Platform to convert the packages to"
      "--dependencies, -d?": {description: "Additional (besides python) dependencies of the converted package", nargs: -1}
      "--show-imports": "Show Python imports for compiled parts of the package"
      "-f, --force": "Force convert, even when a package has compiled C extensions"
      "-o, --output-dir=": "Directory to write the output files. The packages will be organized in platform/ subdirectories, e.g., win-32/package-1.0-py27_0.tar.bz2"
      "-v, --verbose": "Print verbose output"
      "--dry-run": "Only display what would have been done"
      "-q, --quiet": "Don't print as much output"
    completion:
      flag:
        platform: [osx-64, osx-arm64, linux-32, linux-64, linux-ppc64, linux-ppc64le, linux-s390x, linux-armv6l, linux-armv7l, linux-aarch64, win-32, win-64, all]
      positionalany: ["$files"]
