# Converted from Fig's conda.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: conda
description: "Conda package manager"
flags:
  "-h, --help": "Show this help message and exit"
  "-V, --version": "Show the conda version number and exit"
commands:
  - name: activate
    description: "Activate an environment"
    flags:
      "--stack": "Stack the environment being activated on top of the previous active environment"
      "--no-stack": "Do not stack the environment. Overrides 'auto_stack' setting"
  - name: deactivate
    description: "Deactivate an environment"
  - name: clean
    description: "Remove unused packages and caches"
    flags:
      "-a, --all": "Remove index cache, lock files, unused cache packages, and tarballs"
      "-i, --index-cache": "Remove index cache"
      "-p, --packages": "Remove unused packages from writable package caches"
      "-t, --tarballs": "Remove cached package tarballs"
      "-f, --force-pkgs-dirs": "Remove all writable package caches"
      "-c, --tempfiles=": {description: "Remove temporary files that could not be deleted earlier due to being in-use. Argument is path(s) to prefix(es) where files should be found and removed", nargs: -1}
      "-d, --dry-run": "Only display what would have been done"
      "--json": "Report all output as json. Suitable for using conda programmatically"
      "-q, --quiet": "Do not display progress bar"
      "-v, --verbose*": "Can be used multiple times. Once for INFO, twice for DEBUG, three times for TRACE"
      "-y, --yes": "Do not ask for confirmation"
    completion:
      flag:
        tempfiles: ["$files"]
  - name: compare
    description: "Compare packages between conda environments"
    flags:
      "-n, --name=": "Name of environment"
      "-p, --prefix=": "Full path to environment location (i.e. prefix)"
      "-h, --help": "Show this help message and exit"
      "--json": "Report all output as json. Suitable for using conda programmatically"
      "-v, --verbose": "Use once for info, twice for debug, three times for trace"
      "-q, --quiet": "Do not display progress bar"
    completion:
      flag:
        prefix: ["$files"]
      positional:
        - ["$files"]
  - name: config
    description: "Modify configuration values in .condarc. This is modeled after the git config command. Writes to the user .condarc file by default"
    flags:
      "--json": "Report all output as json. Suitable for using conda programmatically"
      "-v, --verbose": "Use once for info, twice for debug, three times for trace"
      "-q, --quiet": "Do not display progress bar"
      "--system": "Write to the system .condarc file at '/home/docs/checkouts/readthedocs.org/user_builds/continuumio-conda/conda/latest/.condarc'"
      "--env": "Write to the active conda environment .condarc file (<no active environment>). If no environment is active, write to the user config file (/home/docs/.condarc)"
      "--file=": "Write to the given file"
      "--show?": {description: "Display configuration values as calculated and compiled. If no arguments given, show information for all configuration values", nargs: -1}
      "--show-sources": "Display all identified configuration sources"
      "--validate": "Validate all configuration sources"
      "--describe?": {description: "Describe given configuration parameters. If no arguments given, show information for all configuration parameters", nargs: -1}
      "--write-default": "Write the default configuration to a file. Equivalent to conda config --describe > ~/.condarc"
      "--get?": {description: "Get a configuration value", nargs: -1}
      "--append=": {description: "Add one configuration value to the end of a list key", nargs: 2}
      "--prepend, --add=": {description: "Add one configuration value to the beginning of a list key", nargs: 2}
      "--set=": {description: "Set a boolean or string key", nargs: 2}
      "--remove=": {description: "Remove a configuration value from a list key. This removes all instances of the value", nargs: 2}
      "--remove-key=": "Remove a configuration key (and all its values)"
      "--stdin": "Apply configuration information given in yaml format piped through stdin"
    completion:
      flag:
        file: ["$files"]
  - name: create
    description: "Create a new conda environment from a list of specified packages"
    flags:
      "--clone=": "Path to (or name of) existing local environment"
      "--file=": "Read package versions from the given file. Repeated file specifications can be passed (e.g. --file=file1 --file=file2)"
      "--dev": "Use sys.executable -m conda in wrapper scripts instead of CONDA_EXE. This is mainly for use during tests where we test new conda source against old Python versions"
      "-n, --name=": "Name of environment"
      "-p, --prefix=": "Full path to environment location (i.e. prefix)"
      "-c, --channel=": "They are given (including local directories using the 'file://' syntax or simply a path like '/home/conda/mychan' or '../mychan'). Then, the defaults or channels from .condarc are searched (unless --override-channels is given). You can use 'defaults' to get the default packages for conda. You can also use any name and the .condarc channel_alias value will be prepended. The default channel_alias is http://conda.anaconda.org/"
      "--use-local": "Use locally built packages. Identical to '-c local'"
      "--override-channels": "Do not search default or .condarc channels. Requires --channel"
      "--repodata-fn=": "Specify name of repodata on remote server. Conda will try whatever you specify, but will ultimately fall back to repodata.json if your specs are not satisfiable with what you specify here. This is used to employ repodata that is reduced in time scope. You may pass this flag more than once. Leftmost entries are tried first, and the fallback to repodata.json is added for you automatically"
      "--strict-channel-priority": "Packages in lower priority channels are not considered if a package with the same name appears in a higher priority channel"
      "--no-channel-priority": "Package version takes precedence over channel priority. Overrides the value given by conda config --show channel_priority"
      "--no-deps": "Do not install, update, remove, or change dependencies. This WILL lead to broken environments and inconsistent behavior. Use at your own risk"
      "--only-deps": "Only install dependencies"
      "--no-pin": "Ignore pinned file"
      "--no-default-packages": "Ignore create_default_packages in the .condarc file"
      "--copy": "Install all packages using copies instead of hard- or soft-linking"
      "-C, --use-index-cache": "Use cache of channel index files, even if it has expired"
      "-k, --insecure": "Allow conda to perform insecure SSL connections and transfers. Equivalent to setting 'ssl_verify' to 'false'"
      "--offline": "Offline mode. Don't connect to the Internet"
      "-d, --dry-run": "Only display what would have been done"
      "--json": "Report all output as json. Suitable for using conda programmatically"
      "-q, --quiet": "Do not display progress bar"
      "-v, --verbose*": "Can be used multiple times. Once for INFO, twice for DEBUG, three times for TRACE"
      "-y, --yes": "Do not ask for confirmation"
      "--download-only": "Solve an environment and ensure package caches are populated, but exit prior to unlinking and linking packages into the prefix"
      "--show-channel-urls": "Show channel urls. Overrides the value given by conda config --show show_channel_urls"
    completion:
      flag:
        file: ["$files"]
        prefix: ["$files"]
  - name: help
