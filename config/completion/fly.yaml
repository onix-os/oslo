# Converted from Fig's fly.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: fly
description: "The flyctl is a command-line interface for fly.io"
persistentflags:
  "--access-token, -t=": "Fly API Access Token"
  "--builtinsfile=&": "Load builtins from named file"
  "--json, -j": "Json output"
  "--verbose": "Verbose output"
  "--help, -h": "Display help"
commands:
  - name: agent
    description: "Commands that manage the Fly agent, a background process that manages flyctl wireguard connections"
    commands:
      - name: ping
        description: "Ping the Fly agent"
      - name: restart
        description: "Restart the Fly agent"
      - name: daemon-start
        aliases: [run]
        description: "Run the Fly agent in the foreground"
      - name: start
        description: "Start the Fly agent"
      - name: stop
        description: "Stop the Fly agent"
  - name: apps
    description: "Manage apps"
    commands:
      - name: create
        description: "Create a new application"
        flags:
          "--generate-name": "Generate a name for the app"
          "--name=": "The app name to use"
          "--network=": "Specify custom network id"
          "--org, -o=": "The organization to operate on"
      - name: destroy
        description: "Permanently destroys an app"
        flags:
          "--yes, -y": "Accept all confirmations"
      - name: list
        description: "List applications"
      - name: move
        description: "Move an app to another organization"
        flags:
          "--org, -o=": "The organization to operate on"
          "--yes, -y": "Accept all confirmations"
      - name: open
        description: "Open browser to current deployed application"
        flags:
          "--app, -a=": "Application name"
          "--config, -c=": "Path to application configuration file"
        completion:
          flag:
            config: ["$files"]
      - name: releases
        description: "List app releases"
        flags:
          "--app, -a=": "Application name"
          "--config, -c=": "Path to application configuration file"
          "--image": "Display the Docker image reference of the release"
        completion:
          flag:
            config: ["$files"]
      - name: restart
        description: "Restart an application"
        flags:
          "-f, --force": "Will issue a restart against each Machine even if there are errors. ( Machines only )"
          "--skip-health-checks": "Restarts app without waiting for health checks. ( Machines only )"
  - name: auth
    description: "Manage authentication"
    commands:
      - name: docker
        description: "Authenticate docker"
      - name: login
        description: "Log in a user"
        flags:
          "--email=": "Login email"
          "--interactive, -i": "Log in with an email and password interactively"
          "--otp=": "One time password"
          "--password=": "Login password"
      - name: logout
        description: "Logs out the currently logged in user"
      - name: signup
        description: "Create a new fly account"
      - name: token
        description: "Show the current auth token"
      - name: whoami
        description: "Displays the users email address/service identity currently authenticated and in use"
  - name: autoscale
    description: "Autoscaling app resources"
    flags:
      "--app, -a=": "App name to operate on"
      "--config, -c=": "Path to an app config file or directory containing one"
    completion:
      flag:
        config: ["$files"]
    commands:
      - name: balanced
        description: "Configure a traffic balanced app with params (min=int max=int)"
        flags:
          "--app, -a=": "App name to operate on"
          "--config, -c=": "Path to an app config file or directory containing one"
        completion:
          flag:
            config: ["$files"]
      - name: disable
        description: "Disable autoscaling"
        flags:
          "--app, -a=": "App name to operate on"
          "--config, -c=": "Path to an app config file or directory containing one"
        completion:
          flag:
            config: ["$files"]
      - name: set
        description: "Set current models autoscaling parameters"
        flags:
          "--app, -a=": "App name to operate on"
          "--config, -c=": "Path to an app config file or directory containing one"
        completion:
          flag:
            config: ["$files"]
      - name: show
        description: "Show current autoscaling configuration"
        flags:
          "--app, -a=": "App name to operate on"
          "--config, -c=": "Path to an app config file or directory containing one"
        completion:
          flag:
            config: ["$files"]
      - name: standard
        description: "Configure a standard balanced app with params (min=int max=int)"
        flags:
          "--app, -a=": "App name to operate on"
          "--config, -c=": "Path to an app config file or directory containing one"
        completion:
          flag:
            config: ["$files"]
  - name: builds
    description: "Manage application builds"
    commands:
      - name: list
        description: "List builds"
        flags:
          "--app, -a=": "Application name"
          "--config, -c=": "Path to application configuration file"
        completion:
          flag:
            config: ["$files"]
  - name: certs
    description: "Manage certificates"
    flags:
      "--app, -a=": "App name to operate on"
      "--config, -c=": "Path to an app config file or directory containing one"
    completion:
      flag:
        config: ["$files"]
    commands:
      - name: create
        aliases: [add]
        description: "Add a certificate for an app"
        flags:
          "--app, -a=": "App name to operate on"
          "--config, -c=": "Path to an app config file or directory containing one"
        completion:
          flag:
            config: ["$files"]
      - name: check
        description: "Checks DNS configuration"
        flags:
          "--app, -a=": "App name to operate on"
          "--config, -c=": "Path to an app config file or directory containing one"
        completion:
          flag:
            config: ["$files"]
      - name: list
        description: "List certificates for an app"
        flags:
          "--app, -a=": "App name to operate on"
          "--config, -c=": "Path to an app config file or directory containing one"
        completion:
          flag:
            config: ["$files"]
      - name: delete
        aliases: [remove]
        description: "Removes a certificate from an app"
        flags:
          "--app, -a=": "App name to operate on"
          "--config, -c=": "Path to an app config file or directory containing one"
          "--yes, -y": "Accept all confirmations"
        completion:
          flag:
            config: ["$files"]
      - name: show
        description: "Shows certificate information"
        flags:
          "--app, -a=": "App name to operate on"
          "--config, -c=": "Path to an app config file or directory containing one"
        completion:
          flag:
            config: ["$files"]
  - name: checks
    description: "Manage health checks"
    commands:
      - name: handlers
        description: "Manage health check handlers"
        commands:
          - name: create
            description: "Create a health check handler"
            flags:
              "--organization, -o=": "The organization to add the handler to"
              "--type=": "The type of handler to create, can be slack or pagerduty"
          - name: delete
            description: "Delete a health check handler"
          - name: list
            description: "List health check handlers"
      - name: list
        description: "List app health checks"
        flags:
          "--app, -a=": "App name to operate on"
          "--check-name=": "Filter checks by name"
          "--config, -c=": "Path to an app config file or directory containing one"
        completion:
          flag:
            config: ["$files"]
  - name: completion
    description: "Generate the autocompletion script for the specified shell"
    commands:
      - name: bash
        description: "Generate the autocompletion script for bash"
        flags:
          "--no-descriptions": "Disable completion descriptions"
      - name: fish
        description: "Generate the autocompletion script for fish"
        flags:
          "--no-descriptions": "Disable completion descriptions"
      - name: powershell
        description: "Generate the autocompletion script for powershell"
        flags:
          "--no-descriptions": "Disable completion descriptions"
      - name: zsh
        description: "Generate the autocompletion script for zsh"
        flags:
          "--no-descriptions": "Disable completion descriptions"
  - name: config
    description: "Manage an app's configuration"
    flags:
      "--app, -a=": "App name to operate on"
      "--config, -c=": "Path to an app config file or directory containing one"
    completion:
      flag:
        config: ["$files"]
    commands:
      - name: display
        description: "Display an app's configuration"
        flags:
          "--app, -a=": "App name to operate on"
          "--config, -c=": "Path to an app config file or directory containing one"
        completion:
          flag:
            config: ["$files"]
      - name: env
        description: "Display an app's runtime environment variables"
        flags:
          "--app, -a=": "App name to operate on"
          "--config, -c=": "Path to an app config file or directory containing one"
        completion:
          flag:
            config: ["$files"]
      - name: save
        description: "Save an app's config file"
        flags:
          "--app, -a=": "App name to operate on"
          "--config, -c=": "Path to an app config file or directory containing one"
        completion:
          flag:
            config: ["$files"]
      - name: validate
        description: "Validate an app's config file"
        flags:
          "--app, -a=": "App name to operate on"
          "--config, -c=": "Path to an app config file or directory containing one"
        completion:
          flag:
            config: ["$files"]
  - name: create
    description: "Create a new application"
    flags:
      "--generate-name": "Generate a name for the app"
      "--name=": "The app name to use"
      "--network=": "Specify custom network id"
      "--org, -o=": "The organization to operate on"
  - name: curl
    description: "Run a performance test against a URL"
  - name: dash
    aliases: [dashboard]
    description: "Open web browser on Fly Web UI for this app"
    flags:
      "--app, -a=": "App name to operate on"
      "--config, -c=": "Path to an app config file or directory containing one"
    completion:
      flag:
        config: ["$files"]
    commands:
      - name: metrics
        description: "Open web browser on Fly Web UI for this app's metrics"
        flags:
          "--app, -a=": "App name to operate on"
          "--config, -c=": "Path to an app config file or directory containing one"
        completion:
          flag:
            config: ["$files"]
  - name: deploy
    description: "Deploy Fly applications"
    flags:
      "--app, -a=": "Application name"
      "--build-arg=": "Set of build time variables in the form of NAME=VALUE pairs. Can be specified multiple times"
      "--build-only": "Build but do not deploy"
      "--build-target=": "Set the target build stage to build if the Dockerfile has more than one stage"
      "--config, -c=": "Path to application configuration file"
      "--detach": "Return immediately instead of monitoring deployment progress"
      "--dockerfile=": "Path to a Dockerfile. Defaults to the Dockerfile in the working directory"
      "--env, -e=": "Set of environment variables in the form of NAME=VALUE pairs. Can be specified multiple times"
      "--image, -i=": "The image tag or ID to deploy"
      "--image-label=": "Image label to use when tagging and pushing to the fly registry. Defaults to \"deployment-{timestamp}\""
      "--local-only": "Only perform builds locally using the local docker daemon"
      "--nix": "Build with Nix"
      "--no-cache": "Do not use the build cache when building the image"
      "--now": "Deploy now without confirmation"
      "--push": "Push image to registry after build is complete"
      "--region, -r=": "The region to operate on"
      "--remote-only": "Perform builds on a remote builder instance instead of using the local docker daemon"
      "--strategy=": "The strategy for replacing running instances. Options are canary, rolling, bluegreen, or immediate. Default is canary, or rolling when max-per-region is set"
    completion:
      flag:
        config: ["$files"]
  - name: destroy
    description: "Permanently destroys an app"
    flags:
      "--yes, -y": "Accept all confirmations"
  - name: dig
    description: "Make DNS requests against Fly.io's internal DNS server"
    flags:
      "--app, -a=": "Application name"
      "--config, -c=": "Path to application configuration file"
      "--org, -o=": "The organization to operate on"
      "--short, -s": "Just print the answers, not DNS record details"
    completion:
      flag:
        config: ["$files"]
  - name: dns-records
    description: "Manage DNS records"
    commands:
      - name: export
        description: "Export DNS records"
        flags:
          "--overwrite": ""
      - name: import
        description: "Import DNS records"
      - name: list
        description: "List DNS records"
  - name: docs
    description: "View Fly documentation"
  - name: doctor
    description: "The DOCTOR command allows you to debug your Fly environment"
    flags:
      "--app, -a=": "Application name"
      "--config, -c=": "Path to application configuration file"
    completion:
      flag:
        config: ["$files"]
    commands:
      - name: diag
        description: "Send diagnostic information about your applications back to Fly.io"
        flags:
          "--app, -a=": "Application name"
          "--config, -c=": "Path to application configuration file"
          "--force": "Send diagnostics even if we can't find your local Fly.io app"
        completion:
          flag:
            config: ["$files"]
  - name: domains
    description: "Manage domains"
    commands:
      - name: add
        description: "Add a domain"
      - name: list
        description: "List domains"
      - name: register
        description: "Register a domain"
      - name: show
        description: "Show domain"
  - name: history
    description: "List an app's change history"
    flags:
      "--app, -a=": "Application name"
      "--config, -c=": "Path to application configuration file"
    completion:
      flag:
        config: ["$files"]
  - name: img
    aliases: [image]
    description: "Manage app image"
    commands:
      - name: show
        description: "Show image details"
        flags:
          "--app, -a=": "Application name"
          "--config, -c=": "Path to application configuration file"
        completion:
          flag:
            config: ["$files"]
      - name: update
        description: "Updates the app's image to the latest available version. (Fly Postgres only)"
        flags:
          "--app, -a=": "Application name"
          "--config, -c=": "Path to application configuration file"
          "--detach": "Return immediately instead of monitoring update progress"
          "--yes, -y": "Accept all confirmations"
        completion:
          flag:
            config: ["$files"]
  - name: info
    description: "Show detailed app information"
    flags:
      "--app, -a=": "App name to operate on"
      "--config, -c=": "Path to an app config file or directory containing one"
      "--host": "Returns just the hostname"
      "--name, -n": "Returns just the appname"
    completion:
      flag:
        config: ["$files"]
  - name: ips
    description: "Manage IP addresses for apps"
    flags:
      "--app, -a=": "App name to operate on"
      "--config, -c=": "Path to an app config file or directory containing one"
    completion:
      flag:
        config: ["$files"]
    commands:
      - name: allocate-v4
        description: "Allocate an IPv4 address"
        flags:
          "--app, -a=": "App name to operate on"
          "--config, -c=": "Path to an app config file or directory containing one"
          "--region=": "The region where the address should be allocated"
        completion:
          flag:
            config: ["$files"]
      - name: allocate-v6
        description: "Allocate an IPv6 address"
        flags:
          "--app, -a=": "App name to operate on"
          "--config, -c=": "Path to an app config file or directory containing one"
          "--region=": "The region where the address should be allocated"
        completion:
          flag:
            config: ["$files"]
      - name: list
        description: "List allocated IP addresses"
        flags:
          "--app, -a=": "App name to operate on"
          "--config, -c=": "Path to an app config file or directory containing one"
        completion:
          flag:
            config: ["$files"]
      - name: private
        description: "List instances private IP addresses"
        flags:
          "--app, -a=": "App name to operate on"
          "--config, -c=": "Path to an app config file or directory containing one"
        completion:
          flag:
            config: ["$files"]
      - name: release
        description: "Release an IP address"
        flags:
          "--app, -a=": "App name to operate on"
          "--config, -c=": "Path to an app config file or directory containing one"
        completion:
          flag:
            config: ["$files"]
  - name: launch
    description: "Launch a new app"
    flags:
      "--copy-config": "Use the configuration file if present without prompting"
      "--dockerfile=": "Path to a Dockerfile. Defaults to the Dockerfile in the working directory"
      "--generate-name": "Always generate a name for the app"
      "--image=": "The image to launch"
      "--name=": "The name of the new app"
      "--no-deploy": "Do not prompt for deployment"
      "--now": "Deploy now without confirmation"
      "--org=": "The organization that will own the app"
      "--path=": "Path to app code and where a fly.toml file will be saved"
      "--region=": "The region to launch the new app in"
      "--remote-only": "Perform builds remotely without using the local docker daemon"
  - name: logs
    description: "View app logs"
    flags:
      "--app, -a=": "Application name"
      "--config, -c=": "Path to application configuration file"
      "--instance, -i=": "Filter by instance ID"
      "--region, -r=": "The region to operate on"
    completion:
      flag:
        config: ["$files"]
  - name: machines
    aliases: [m, machine]
    description: "Commands that manage machines"
    commands:
      - name: clone
        description: "Clones a Fly Machine"
        flags:
          "--app, -a=": "Application name"
          "--config, -c=": "Path to application configuration file"
          "--detach, -d": "Detach from the machine's logs"
          "--name, -n=": "The name of the new machine"
          "--org, -o=": "The organization to operate on"
          "--region, -r=": "The region to operate on"
        completion:
          flag:
            config: ["$files"]
      - name: kill
        description: "Kill (SIGKILL) a Fly machine"
        flags:
          "--app, -a=": "Application name"
          "--config, -c=": "Path to application configuration file"
        completion:
          flag:
            config: ["$files"]
      - name: list
        description: "List Fly machines"
        flags:
          "--app, -a=": "Application name"
          "--config, -c=": "Path to application configuration file"
          "--quiet, -q": "Only list machine ids"
        completion:
          flag:
            config: ["$files"]
      - name: rm
        aliases: [remove]
        description: "Remove a Fly machine"
        flags:
          "--app, -a=": "Application name"
          "--config, -c=": "Path to application configuration file"
          "--force, -f": "Force kill machine if it's running"
        completion:
          flag:
            config: ["$files"]
      - name: run
        description: "Run a machine"
        flags:
          "--app, -a=": "Application name"
          "--build-arg=": "Set of build time variables in the form of NAME=VALUE pairs. Can be specified multiple times"
          "--build-local-only": "Only perform builds locally using the local docker daemon"
          "--build-only": ""
          "--build-remote-only": "Perform builds remotely without using the local docker daemon"
          "--build-target=": "Set the target build stage to build if the Dockerfile has more than one stage"
          "--config, -c=": "Path to application configuration file"
          "--cpu-kind=": "Kind of CPU to use (shared, dedicated)"
          "--cpus=": "Number of CPUs"
          "--detach, -d": "Detach from the machine's logs"
          "--dockerfile=": "Path to a Dockerfile. Defaults to the Dockerfile in the working directory"
          "--entrypoint=": "ENTRYPOINT replacement"
          "--env, -e=": "Set of environment variables in the form of NAME=VALUE pairs. Can be specified multiple times"
          "--id=": "Machine ID, if previously known"
          "--image-label=": "Image label to use when tagging and pushing to the fly registry. Defaults to \"deployment-{timestamp}\""
          "--memory=": "Memory (in megabytes) to attribute to the machine"
          "--name, -n=": "Machine name, will be generated if missing"
          "--no-build-cache": "Do not use the cache when building the image"
          "--org=": "The organization that will own the app"
          "--port, -p=": "Exposed port mappings (format: edgePort[:machinePort]/[protocol[:handler]])"
          "--region, -r=": "The region to operate on"
          "--size, -s=": "Preset guest cpu and memory for a machine"
          "--volume, -v=": "Volumes to mount in the form of <volume_id_or_name>:/path/inside/machine[:<options>]"
        completion:
          flag:
            config: ["$files"]
      - name: start
        description: "Start a Fly machine"
        flags:
          "--app, -a=": "Application name"
          "--config, -c=": "Path to application configuration file"
        completion:
          flag:
            config: ["$files"]
      - name: status
        description: "Show current status of a running machine"
        flags:
          "--app, -a=": "Application name"
          "--config, -c=": "Path to application configuration file"
        completion:
          flag:
            config: ["$files"]
      - name: stop
        description: "Stop a Fly machine"
        flags:
          "--app, -a=": "Application name"
          "--config, -c=": "Path to application configuration file"
          "--signal, -s=": "Signal to stop the machine with (default: SIGINT)"
          "--time=": "Seconds to wait before killing the machine"
        completion:
          flag:
            config: ["$files"]
  - name: monitor
    description: "Monitor currently running application deployments"
    flags:
      "--app, -a=": "Application name"
      "--config, -c=": "Path to application configuration file"
    completion:
      flag:
        config: ["$files"]
  - name: move
    description: "Move an app to another organization"
    flags:
      "--org, -o=": "The organization to operate on"
      "--yes, -y": "Accept all confirmations"
  - name: open
    description: "Open browser to current deployed application"
    flags:
      "--app, -a=": "Application name"
      "--config, -c=": "Path to application configuration file"
    completion:
      flag:
        config: ["$files"]
  - name: orgs
    description: "Commands for managing Fly organizations"
    commands:
      - name: builder
        description: "Manage remote builder"
        commands:
          - name: show
            description: "Show details about an organization's remote builder image"
          - name: update
            description: "Update an organization's remote builder image"
      - name: create
        description: "Create an organization"
      - name: delete
        description: "Delete an organization"
        flags:
          "--yes, -y": "Accept all confirmations"
      - name: invite
        description: "Invite user (by email) to organization"
      - name: list
        description: "Lists organizations for current user"
      - name: remove
        description: "Remove a user from an organization"
      - name: show
        description: "Show information about an organization"
  - name: ping
    description: "Test connectivity with ICMP ping messages"
    flags:
      "--app, -a=": "Application name"
      "--config, -c=": "Path to application configuration file"
      "--count, -n=": "Number of probes to send (0=indefinite)"
      "--interval, -i=": "Interval between ping probes"
      "--org, -o=": "The organization to operate on"
      "--size, -s=": "Size of probe to send (not including headers)"
    completion:
      flag:
        config: ["$files"]
  - name: platform
    description: "Fly platform information"
    commands:
      - name: regions
        description: "List regions"
      - name: status
        description: "Show current platform status"
      - name: vm-sizes
        description: "List VM Sizes"
  - name: pg
    aliases: [postgres]
    description: "Manage postgres clusters"
    commands:
      - name: attach
        description: "Attach a postgres cluster to an app"
        flags:
          "--app, -a=": "App name to operate on"
          "--config, -c=": "Path to an app config file or directory containing one"
          "--database-name=": "Database to use, defaults to a new database with the same name as the app"
          "--database-user=": "The database user to create, defaults to creating a user with the same name as the consuming app"
          "--postgres-app=": "The postgres cluster to attach to the app"
          "--variable-name=": "The env variable name that will be added to the app. Defaults to DATABASE_URL"
        completion:
          flag:
            config: ["$files"]
      - name: connect
        description: "Connect to the Postgres console"
        flags:
          "--app, -a=": "App name to operate on"
          "--config, -c=": "Path to an app config file or directory containing one"
          "--database=": "The postgres database to connect to"
          "--password=": "The postgres user password"
          "--user=": "The postgres user to connect with"
        completion:
          flag:
            config: ["$files"]
      - name: create
        description: "Create a postgres cluster"
        flags:
          "--image-ref=&": ""
          "--initial-cluster-size=": "The size of the initial postgres cluster"
          "--name=": "The name of the new app"
          "--organization=": "The organization that will own the app"
          "--password=": "The superuser password. one will be generated for you if you leave this blank"
          "--region=": "The region to launch the new app in"
          "--snapshot-id=": "Creates the volume with the contents of the snapshot"
          "--vm-size=": "The size of the VM"
          "--volume-size=": "The size in GB for volumes"
      - name: db
        description: "Manage databases in a cluster"
        commands:
          - name: list
            description: "List databases in a cluster"
            flags:
              "--app, -a=": "App name to operate on"
              "--config, -c=": "Path to an app config file or directory containing one"
            completion:
              flag:
                config: ["$files"]
      - name: detach
        description: "Detach a postgres cluster from an app"
        flags:
          "--app, -a=": "App name to operate on"
          "--config, -c=": "Path to an app config file or directory containing one"
          "--postgres-app=": "The postgres cluster to detach from the app"
        completion:
          flag:
            config: ["$files"]
      - name: list
