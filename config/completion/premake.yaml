    flags:
      "--file=": "The premake5.lua file"
      "--debugger": "Start MobDebug remote debugger. Works with ZeroBrane Studio"
      "--fatal": "Treat warnings from project scripts as errors"
      "--insecure": "Forfit SSH certification checks"
      "--interactive": "Interactive command prompt"
      "--os=": "Generate files for a different operating system"
      "--scripts=": "Search for additional scripts on the given path"
      "--systemscript=": "Override default system script (premake5-system.lua)"
      "--verbose": "Generate extra debug text output"
      "--cc=": "Choose a C/C++ compiler set"
      "--dc=": "Choose a D compiler"
      "--dotnet=": "Choose a .NET compiler set"
    completion:
      flag:
        file: ["$files"]
        os: [aix, android, bsd, haiku, hurd, ios, linux, macosx, solaris, windows]
        scripts: ["$directories"]
        systemscript: ["$files"]
        cc: [clang, gcc, mingw]
        dc: [dmd, gdc, ldc]
        dotnet: [mono, msnet, pnet]
