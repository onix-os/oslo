# Converted from Fig's k3d.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: k3d
description: "K3d is a lightweight wrapper to run k3s in Docker"
flags:
  "--version": "Print version information"
persistentflags:
  "-h, --help": "Help for k3d"
  "--verbose": "Verbose output"
  "--trace": "Trace output"
  "--timestamps": "Print timestamp in log output"
commands:
  - name: cluster
    description: "Manage k3s clusters"
    commands:
      - name: create
        description: "Create a new k3s cluster"
        flags:
          "-a, --agents=": "Number of agents to create"
          "--agents-memory=": "Memory limit imposed on the agents nodes"
          "--api-port=": "Specify the Kubernetes API server port exposed on the LoadBalancer"
          "-c, --config=": "Path of a config file to use"
          "-e, --env=": "Add environment variables to nodes"
          "--gpus=": "GPU devices to add to the cluster node containers"
          "-h, --help": "Help for create"
          "--host-alias=": "Add ip:host[,host,...] mappings"
          "--host-pid-mode": "Enable host pid mode of server(s) and agent(s)"
          "-i, --image=": "Specify k3s image that you want to use for the nodes"
          "--k3s-arg=": "Additional args passed to k3s command"
          "--k3s-node-label=": "Add label to k3s node"
          "--kubeconfig-switch-context": "Directly switch the default kubeconfig's current-context to the new cluster's context (requires --kubeconfig-update-default) (default true)"
          "--kubeconfig-update-default": "Directly update the default kubeconfig with the new cluster's context (default true)"
          "--lb-config-override=": "Use dotted YAML path syntax to override nginx loadbalancer settings"
          "--network=": "Specify the docker network to use"
          "--no-image-volume": "Don't create a volume for the container's root filesystem"
          "--no-lb": "Don't create a loadbalancer for the cluster"
          "--no-rollback": "Don't rollback changes if cluster creation failed"
          "-p, --port=": "Map ports from the node containers (via the serverlb) to the host"
          "--registry-config=": "Specify path to an extra registries.yaml file"
          "--registry-create=": "Create a k3d-managed registry and connect it to the cluster (Format: NAME[:HOST][:HOSTPORT] - Example: `k3d cluster create --registry-create mycluster-registry"
          "--registry-use=": "Connect to one or more k3d-managed registries running locally"
          "--runtime-label": "Add label to container runtime (Format: KEY[=VALUE][@NODEFILTER[;NODEFILTER...]] - Example: `k3d cluster create --agents 2 --runtime-label \"my.label@agent:0,1\" --runtime-label \"other.label=somevalue@server:0\"`"
          "-s, --servers=": "Specify how many servers you want to create"
          "--servers-memory=": "Memory limit imposed on the server nodes [From docker]"
          "--subnet=": "[Experimental: IPAM] Define a subnet for the newly created container network"
          "--timeout=": "Rollback changes if cluster couldn't be created in specified duration"
          "--token=": "Specify a cluster token. By default, we generate one"
          "-v, --volume=": "Mount volumes into the nodes"
          "--wait": "Wait for the server(s) to be ready before returning"
      - name: delete
        aliases: [del, rm]
        description: "Delete a cluster"
        flags:
          "-a, --all": "Delete all clusters"
          "-c, --config=": "Path of a config file to use"
      - name: edit
        aliases: [update]
        description: "Edit a cluster"
        flags:
          "--port-add": "Map ports from the node containers"
      - name: list
        aliases: [ls, get]
        description: "List clusters"
        flags:
          "--no-headers": "Don't print headers"
          "-o, --output=": "Output format"
          "--token": "Print k3s cluster token"
        completion:
          flag:
            output: [json, yaml]
      - name: start
        description: "Start a cluster"
        flags:
          "--all": "Start all clusters"
          "--timeout=": "Maximum waiting time for '--wait' before canceling/returning"
          "--wait": "Wait for the server(s) (and loadbalancer) to be ready before returning"
      - name: stop
        description: "Stop a cluster"
        flags:
          "-a, --all": "Stop all clusters"
  - name: completion
    description: "Generate shell completion scripts"
    completion:
      positional:
        - ["bash\tBash shell", "zsh\tZsh shell", "fish\tFish shell", "powershell\tPowershell"]
  - name: config
    description: "Manage k3d config"
    commands:
      - name: init
        aliases: [create]
        description: "Create a new config file"
        flags:
          "-f, --force": "Force overwrite of target file"
          "-o, --output": "Write a default k3d config (default \"k3d-default.yaml\")"
      - name: migrate
        aliases: [update]
        description: "Migrate a config file to the latest version"
  - name: image
    description: "Manage k3d images"
    commands:
      - name: import
        aliases: [load]
        description: "Import image(s) from docker into k3d cluster(s)"
        flags:
          "-c, --cluster=": "Cluster to import image(s) into"
          "-k, --keep-tarball": "Do not delete the tarball containing the saved images from the shared volume"
          "-t, --keep-tools": "Do not delete the tools node after import"
          "-m, --mode=": "Import mode"
        completion:
          flag:
            mode: [auto, direct, tools]
  - name: kubeconfig
    description: "Manage k3d kubeconfig"
    commands:
      - name: get
        aliases: [print, show]
        flags:
          "-a, --all": ""
      - name: merge
        aliases: [write]
        description: "Write/Merge kubeconfig(s) from cluster(s) into new or existing kubeconfig/file"
        flags:
          "-a, --all": ""
          "-d, --kubeconfig-merge-default": "Merge into the default kubeconfig ($KUBECONFIG or /Users/balli/.kube/config)"
          "-s, --kubeconfig-switch-context": "Switch to new context (default true)"
          "-o, --output=": "Define output [ - | FILE ] (default from $KUBECONFIG or /Users/balli/.kube/config"
          "--overwrite": "[Careful!] Overwrite existing file, ignoring its contents"
          "-u, --update": "Update conflicting fields in existing kubeconfig (default true)"
  - name: node
    description: "Manage k3d nodes"
    commands:
      - name: create
        description: "Create a new node"
        flags:
          "-c, --cluster=": "Cluster URL or k3d cluster name to connect to. (default \"k3s-default\")"
          "-i, --image=": "Node image to use"
          "--k3s-arg=": "Additional k3s arguments"
          "--k3s-node-label=": "Specify k3s node labels in format"
          "--memory=": "Memory limit for the node container"
          "-n, --network=": "Add node to (another) runtime network"
          "--replicas=": "Number of replicas to create"
          "--role=": "Node role"
          "--runtime-label=": "Specify runtime labels in format"
          "--timeout=": "Maximum waiting time for '--wait' before canceling/returning"
          "-t, --token=": "Override cluster token"
          "--wait": "Wait for the node(s) to be ready before returning"
        completion:
          flag:
            replicas: [1, 2, 3, 4, 5]
            role: [agent, server]
      - name: delete
        description: "Delete a node"
        flags:
          "-a, --all": "Delete all existing nodes"
          "-r, --registry": "Also delete registries"
      - name: edit
        aliases: [update]
        description: "[EXPERIMENTAL] Edit node(s)"
        flags:
          "--port-add=": "Map ports from the node container to the host"
      - name: list
        aliases: [ls, get]
        description: "List nodes"
        flags:
          "--no-headers": "Don't print headers (default print headers)"
          "-o, --output=": "Output format"
        completion:
          flag:
            output: [json, yaml]
      - name: start
        description: "Start a node"
      - name: stop
        description: "Stop a node"
  - name: registry
    aliases: [registries, reg]
    description: "Manage registry/registries"
    commands:
      - name: create
        description: "Create a new registry"
        flags:
          "--default-network": "Specify the network connected to the registry (default \"bridge\")"
          "-i, --image=": "Specify image used for the registry (default \"docker.io/library/registry:2\")"
          "--no-help": "Disable the help text (How-To use the registry)"
          "-p, --port=": "Select which port the registry should be listening on your machine (localhost) (Format: [HOST:]HOSTPORT)"
          "--proxy-password=": "Specify the password of the proxied remote registry"
          "--proxy-remote-url=": "Specify the url of the proxied remote registry"
          "--proxy-username=": "Specify the username of the proxied remote registry"
          "-v, --volume=": "Mount volumes into the registry node (Format: [SOURCE:]DEST"
      - name: delete
        aliases: [del, rm]
        description: "Delete registry/registries"
        flags:
          "-a, --all": ""
      - name: list
        aliases: [ls, get]
        description: "List registries"
        flags:
          "--no-headers": "Don't print headers (default print headers)"
          "-o, --output=": "Output format"
        completion:
          flag:
            output: [json, yaml]
  - name: version
    description: "Show k3d and default k3s version"
