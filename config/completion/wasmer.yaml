# Converted from argc's wasmer.sh by tools/argc-to-spec. Do not edit by hand.
name: wasmer
flags:
  "-V, --version": "Print version info and exit"
  "-v, --verbose*": "Generate verbose output (repeat for more verbosity)"
  "-q, --quiet": "Do not print progress messages"
  "--log-format=": "The format to use when generating logs"
  "--color=": "When to display colored output"
  "-h, --help": "Print help (see a summary with '-h')"
completion:
  flag:
    color: [auto, always, never]
commands:
  - name: login
    description: "Login into a wasmer.io-like registry"
    flags:
      "--no-browser": "Variable to login without opening a browser"
      "-v, --verbose*": "Generate verbose output (repeat for more verbosity)"
      "--wasmer-dir=": "Set Wasmer's home directory"
      "-q, --quiet": "Do not print progress messages"
      "--registry=": "The registry to fetch packages from (inferred from the environment by default)"
      "--cache-dir=": "The directory cached artefacts are saved to"
      "--log-format=": "The format to use when generating logs"
      "--color=": "When to display colored output"
      "-h, --help": "Print help (see a summary with '-h')"
    completion:
      flag:
        color: [auto, always, never]
  - name: publish
    description: "Publish a package to a registry [alias: package publish]"
    flags:
      "--token=": "The (optional) authorization token to pass to the registry"
      "--registry=": "Change the current registry"
      "-v, --verbose*": "Generate verbose output (repeat for more verbosity)"
      "--wasmer-dir=": "Set Wasmer's home directory"
      "--cache-dir=": "The directory cached artefacts are saved to"
      "--log-format=": "The format to use when generating logs"
      "--color=": "When to display colored output"
      "--dry-run": "Run the publish logic without sending anything to the registry server"
      "--quiet": "Run the publish command without any output"
      "--namespace=": "Override the namespace of the package to upload"
      "--name=": "Override the name of the package to upload"
      "--version=": "Override the package version of the uploaded package in the wasmer.toml"
      "--no-validate": "Skip validation of the uploaded package"
      "--wait=": "Wait for package to be available on the registry before exiting"
      "--timeout=": "Timeout (in seconds) for the publish query to the registry."
      "--bump": "Whether or not the patch field of the version of the package - if any - should be bumped"
      "--non-interactive": "Do not prompt for user input"
      "-h, --help": "Print help (see a summary with '-h')"
    completion:
      flag:
        color: [auto, always, never]
        wait: [none, container, native-executables, bindings, all]
  - name: cache
    description: "Manage the local Wasmer cache"
    flags:
      "--wasmer-dir=": "Set Wasmer's home directory"
      "--registry=": "The registry to fetch packages from (inferred from the environment by default)"
      "-v, --verbose*": "Generate verbose output (repeat for more verbosity)"
      "--cache-dir=": "The directory cached artefacts are saved to"
      "-q, --quiet": "Do not print progress messages"
      "--log-format=": "The format to use when generating logs"
      "--token=": "The API token to use when communicating with the registry (inferred from the environment by default)"
      "--color=": "When to display colored output"
      "-h, --help": "Print help (see a summary with '-h')"
    completion:
      flag:
        color: [auto, always, never]
    commands:
      - name: clean
        description: "Clear the cache"
        flags:
          "-v, --verbose*": "Generate verbose output (repeat for more verbosity)"
          "-q, --quiet": "Do not print progress messages"
          "--log-format=": "The format to use when generating logs"
          "--color=": "When to display colored output"
          "-h, --help": "Print help (see a summary with '-h')"
        completion:
          flag:
            color: [auto, always, never]
      - name: dir
        description: "Display the location of the cache"
