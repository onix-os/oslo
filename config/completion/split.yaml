# Converted from Fig's split.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: split
description: "The split utility reads the given file and breaks it up into files of 1000 lines each (if no options are specified), leaving the file unchanged. If file is a single dash ('-') or absent, split reads from the standard input"
flags:
  "-a=": "Use suffix_length letters to form the suffix of the file name"
  "-b=": "Create split files byte_count bytes in length. If k or K is appended to the number, the file is split into byte_count kilobyte pieces. If m or M is appended to the number, the file is split into byte_count megabyte pieces. If g or G is appended to the number, the file is split into byte_count gigabyte pieces"
  "-d": "Use a numeric suffix instead of a alphabetic suffix"
  "-l=": "Create split files line_count lines in length"
  "-p=": "The file is split whenever an input line matches pattern, which is interpreted as an extended regular expression. The matching line will be the first line of the next output file. This option is incompatible with the -b and -l options"
exclusiveflags:
  - [b, p]
  - [l, p]
  - [p, b, l]
completion:
  positional:
    - ["$files"]
    - [x]
