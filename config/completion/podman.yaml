    description: "Attach to a running container"
    flags:
      "--detach-keys=": "Override the key sequence for detaching a container"
      "--no-stdin": "Do not attach STDIN"
      "--sig-proxy": "Proxy all received signals to the process (default true)"
  - name: build
    description: "Build an image using instructions from Containerfiles"
    flags:
      "--add-host=": ""
      "--build-arg=": ""
      "--cache-from=": ""
      "--disable-content-trust": "Skip image verification (default true)"
      "-f, --file=": "Name of the Dockerfile (Default is 'PATH/Dockerfile')"
      "--iidfile=": "Write the image ID to the file"
      "--isolation=": "Container isolation technology"
      "--label=": "Set metadata for an image"
      "--network=": "Set the networking mode for the RUN instructions during build (default \"default\")"
      "--no-cache": "Do not use cache when building the image"
      "-o, --output=": "Output destination (format: type=local,dest=path)"
      "--platform=": "Set platform if server is multi-platform capable"
      "--progress=": "Set type of progress output (auto, plain, tty). Use plain to show container output"
      "--pull": "Always attempt to pull a newer version of the image"
      "-q, --quiet": "Suppress the build output and print image ID on success"
