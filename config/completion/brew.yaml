# Converted from Fig's brew.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: brew
description: "Package manager for macOS"
flags:
  "--version": "The current Homebrew version"
commands:
  - name: list
    description: "List all installed formulae"
    flags:
      "-d, --debug": "Display any debugging information"
      "-q, --quiet": "Make some output more quiet"
      "-v, --verbose": "Make some output more verbose"
      "-h, --help": "Show help message"
      "--formula, --formulae": "List only formulae, or treat all named arguments as formulae"
      "--cask, --casks": "List only casks, or treat all named arguments as casks"
      "--unbrewed": "List files in Homebrew's prefix not installed by Homebrew. (disabled; replaced by brew --prefix --unbrewed)"
      "--full-name": "Print formulae with fully-qualified names. Unless --full-name, --versions or"
      "--pinned": "List only pinned formulae, or only the specified (pinned) formulae if formula are provided. See also pin, unpin"
      "--versions": "Show the version number for installed formulae, or only the specified formulae if formula are provided"
      "--multiple": "Only show formulae with multiple versions installed"
      "-1": "Force output to be one entry per line. This is the default when output is not to a terminal"
      "-l": "List formulae and/or casks in long format. Has no effect when a formula or cask name is passed as an argument"
      "-r": "Reverse the order of the formulae and/or casks sort to list the oldest entries first. Has no effect when a formula or cask name is passed as an argument"
      "-t": "Sort formulae and/or casks by time modified, listing most recently modified first. Has no effect when a formula or cask name is passed as an argument"
  - name: ls
    description: "List all installed formulae"
    flags:
      "-d, --debug": "Display any debugging information"
      "-q, --quiet": "Make some output more quiet"
      "-v, --verbose": "Make some output more verbose"
      "-h, --help": "Show help message"
      "--formula": "List only formulae, or treat all named arguments as formulae"
      "--cask": "List only casks, or treat all named arguments as casks"
      "--unbrewed": "List files in Homebrew's prefix not installed by Homebrew. (disabled; replaced by brew --prefix --unbrewed)"
      "--full-name": "Print formulae with fully-qualified names. Unless --full-name, --versions or"
      "--pinned": "List only pinned formulae, or only the specified (pinned) formulae if formula are provided"
      "--versions": "Show the version number for installed formulae, or only the specified formulae if formula are provided"
      "--multiple": "Only show formulae with multiple versions installed"
      "-1": "Force output to be one entry per line. This is the default when output is not to a terminal"
      "-l": "List formulae and/or casks in long format. Has no effect when a formula or cask name is passed as an argument"
      "-r": "Reverse the order of the formulae and/or casks sort to list the oldest entries first. Has no effect when a formula or cask name is passed as an argument"
      "-t": "Sort formulae and/or casks by time modified, listing most recently modified first. Has no effect when a formula or cask name is passed as an argument"
  - name: leaves
    description: "List installed formulae that are not dependencies of another installed formula"
    flags:
      "-r, --installed-on-request": "Show manually installed formula"
      "-p, --installed-as-dependency": "Show installed formula as dependencies"
  - name: doctor
    description: "Check your system for potential problems"
    flags:
      "-d, --debug": "Display any debugging information"
      "-q, --quiet": "Make some output more quiet"
      "-v, --verbose": "Make some output more verbose"
      "-h, --help": "Show help message"
      "--list-checks": "List all audit methods"
      "-D, --audit-debug": "Enable debugging and profiling of audit methods"
  - name: abv
    aliases: [info]
    description: "Display brief statistics for your Homebrew installation"
    flags:
      "--cask, --casks": "List only casks, or treat all named arguments as casks"
      "--analytics": "List global Homebrew analytics data or, if specified, installation and build error data for formula"
      "--days=": "How many days of analytics data to retrieve"
      "--category=": "Which type of analytics data to retrieve"
      "--github": "Open the GitHub source page for formula in a browser"
      "--json": "Print a JSON representation"
      "--installed": "Print JSON of formulae that are currently installed"
      "--all": "Print JSON of all available formulae"
      "-v, --verbose": "Show more verbose analytics data for formulae"
      "--formula": "Treat all named arguments as formulae"
      "--cash": "Treat all named arguments as casks"
      "-d, --debug": "Display any debugging information"
      "-q, --quiet": "List only the names of outdated kegs"
      "-h, --help": "Get help with services command"
    exclusiveflags:
      - [days, analytics]
      - [category, analytics]
      - [installed, json]
      - [all, json]
    completion:
      flag:
        days: [30, 90, 365]
  - name: update
    description: "Fetch the newest version of Homebrew and all formulae"
    flags:
      "-f, --force": "Always do a slower, full update check"
      "-v, --verbose": "Print the directories checked and git operations performed"
      "-d, --debug": "Display a trace of all shell commands as they are executed"
      "-h, --help": "Show help message"
      "--merge": "Use git merge to apply updates (rather than git rebase)"
      "--preinstall": "Run on auto-updates (e.g. before brew install). Skips some slower steps"
  - name: outdated
    description: "List installed casks and formulae that have an updated version available"
    flags:
      "-d, --debug": "Display any debugging information"
      "-q, --quiet": "List only the names of outdated kegs"
      "-v, --verbose": "Include detailed version information"
      "-h, --help": "Show help message for the outdated command"
      "--cask": "List only outdated casks"
      "--fetch-HEAD": "Fetch the upstream repository to detect if the HEAD installation of the formula is outdated"
      "--formula": "List only outdated formulae"
      "--greedy": "Print outdated casks with auto_updates or version :latest"
      "--greedy-latest": "Print outdated casks including those with version :latest"
      "--greedy-auto-updates": "Print outdated casks including those with auto_updates true"
      "--json": "Print output in JSON format"
  - name: pin
    description: "Pin formula, preventing them from being upgraded"
