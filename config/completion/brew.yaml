  - name: "--prefix"
    description: "Prefix of <formula>"
    flags:
      "--unbrewed": "List files in Homebrew's prefix not installed by Homebrew"
      "--installed": "Outputs nothing and returns a failing status code if formula is not installed"
  - name: cask
    description: "Homebrew Cask provides a friendly CLI workflow for the administration of macOS applications distributed as binaries"
    commands:
      - name: install
        description: "Installs the given cask"
      - name: uninstall
        description: "Uninstalls the given cask"
        flags:
          "-d, --debug": "Display any debugging information"
          "-q, --quiet": "Make some output more quiet"
          "-v, --verbose": "Make some output more verbose"
          "-h, --help": "Show help message"
          "--zap": "Remove all files associated with a cask. May remove files which are shared between applications"
          "--ignore-dependencies": "Don't fail uninstall, even if formula is a dependency of any installed formulae"
          "--formula": "Treat all named arguments as formulae"
          "--cask": "Treat all named arguments as casks"
  - name: cleanup
    description: "Remove stale lock files and outdated downloads for all formulae and casks and remove old versions of installed formulae"
    flags:
      "-d, --debug": "Display any debugging information"
      "-q, --quiet": "Make some output more quiet"
      "-v, --verbose": "Make some output more verbose"
