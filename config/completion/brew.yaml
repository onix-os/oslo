  - name: unlink
    description: "Remove symlinks for formula from Homebrew's prefix"
    flags:
      "-n, --dry-run": "List files which would be unlinked without actually unlinking or deleting any files"
  - name: formulae
    description: "List all available formulae"
  - name: casks
