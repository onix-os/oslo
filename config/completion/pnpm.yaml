          "--access=": "Tells the registry whether the published package should be public or restricted"
          "--force": "Try to publish packages even if their current version is already found in the registry"
          "--report-summary": "Save the list of published packages to pnpm-publish-summary.json. Useful when some other tooling is used to report the list of published packages"
          "--filter=": "Filtering allows you to restrict commands to specific subsets of packages. pnpm supports a rich selector syntax for picking packages by name or by relation. More details: https://pnpm.io/filtering"
        completion:
          flag:
            access: [public, private]
            filter: ["$files"]
  - name: server
    description: "Manage a store server"
    commands:
      - name: start
        description: "Starts a server that performs all interactions with the store. Other commands will delegate any store-related tasks to this server"
        flags:
          "--background": "Runs the server in the background, similar to daemonizing on UNIX systems"
          "--network-concurrency=": "The maximum number of network requests to process simultaneously"
          "--protocol=": "The communication protocol used by the server. When this is set to auto, IPC is used on all systems except for Windows, which uses TCP"
          "--port=": "The port number to use when TCP is used for communication. If a port is specified and the protocol is set to auto, regardless of system type, the protocol is automatically set to use TCP"
          "--store-dir=": "The directory to use for the content addressable store"
          "--lock": "Set to make the package store immutable to external processes while the server is running or not"
          "--no-lock": "Set to make the package store mutable to external processes while the server is running or not"
          "--ignore-stop-requests": "Prevents you from stopping the server using pnpm server stop"
          "--ignore-upload-requests": "Prevents creating a new side effect cache during install"
        completion:
          flag:
            protocol: [auto, tcp, ipc]
            store-dir: ["$files"]
      - name: stop
        description: "Stops the store server"
      - name: status
        description: "Prints information about the running server"
  - name: store
    description: "Managing the package store"
    commands:
      - name: status
        description: "Checks for modified packages in the store. Returns exit code 0 if the content of the package is the same as it was at the time of unpacking"
      - name: add
        description: "Functionally equivalent to pnpm add, except this adds new packages to the store directly without modifying any projects or files outside of the store"
      - name: prune
        description: "Removes orphan packages from the store. Pruning the store will save disk space, however may slow down future installations involving pruned packages. Ultimately, it is a safe operation, however not recommended if you have orphaned packages from a package you intend to reinstall. Please read the FAQ for more information on unreferenced packages and best practices. Please note that this is prohibited when a store server is running"
      - name: path
        description: "Returns the path to the active store directory"
  - name: init
    description: "Creates a basic package.json file in the current directory, if it doesn't exist already"
  - name: doctor
    description: "Checks for known common issues with pnpm configuration"
