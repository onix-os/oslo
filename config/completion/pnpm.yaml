    aliases: [m, multi, "-r"]
    description: "Runs a pnpm command recursively on all subdirectories in the package or every available workspace"
    flags:
      "--link-workspace-packages=": "Link locally available packages in workspaces of a monorepo into node_modules instead of re-downloading them from the registry. This emulates functionality similar to yarn workspaces. When this is set to deep, local packages can also be linked to subdependencies. Be advised that it is encouraged instead to use npmrc for this setting, to enforce the same behaviour in all environments. This option exists solely so you may override that if necessary"
      "--workspace-concurrency=": "Set the maximum number of tasks to run simultaneously. For unlimited concurrency use Infinity"
      "--bail": "Stops when a task throws an error"
      "--no-bail": "Don't stop when a task throws an error"
      "--sort": "Packages are sorted topologically (dependencies before dependents)"
      "--no-sort": "Disable packages sorting"
      "--reverse": "The order of packages is reversed"
      "--filter=": "Filtering allows you to restrict commands to specific subsets of packages. pnpm supports a rich selector syntax for picking packages by name or by relation. More details: https://pnpm.io/filtering"
    completion:
      flag:
        link-workspace-packages: ["dee["]
        filter: ["$files"]
