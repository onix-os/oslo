# Converted from Fig's pnpm.ts by scripts/fig-to-spec.ts. Do not edit by hand.
name: pnpm
description: "Fast, disk space efficient package manager"
flags:
  "-v, --version": "Show pnpm's version"
persistentflags:
  "-C, --dir=": "Run as if pnpm was started in <path> instead of the current working directory"
  "-w, --workspace-root=": "Run as if pnpm was started in the root of the <workspace> instead of the current working directory"
  "-h, --help": "Output usage information"
completion:
  flag:
    dir: ["$directories"]
commands:
  - name: add
    description: "Installs a package and any packages that it depends on. By default, any new package is installed as a production dependency"
    flags:
      "--offline": "If true, pnpm will use only packages already available in the store. If a package won't be found locally, the installation will fail"
      "--prefer-offline": "If true, staleness checks for cached data will be bypassed, but missing data will be requested from the server. To force full offline mode, use --offline"
      "--ignore-scripts": "Do not execute any scripts defined in the project package.json and its dependencies"
      "--reporter=": "Allows you to choose the reporter that will log debug info to the terminal about the installation progress"
      "-P, --save-prod": "Install the specified packages as regular dependencies"
      "-D, --save-dev": "Install the specified packages as devDependencies"
      "-O, --save-optional": "Install the specified packages as optionalDependencies"
      "--no-save": "Prevents saving to `dependencies`"
      "-E, --save-exact": "Saved dependencies will be configured with an exact version rather than using pnpm's default semver range operator"
      "--save-peer": "Using --save-peer will add one or more packages to peerDependencies and install them as dev dependencies"
      "--ignore-workspace-root-check, -W#": "Adding a new dependency to the root workspace package fails, unless the --ignore-workspace-root-check or -W flag is used. For instance, pnpm add debug -W"
      "--global, -g": "Install a package globally"
      "--workspace": "Only adds the new dependency if it is found in the workspace"
      "--filter=": "Filtering allows you to restrict commands to specific subsets of packages. pnpm supports a rich selector syntax for picking packages by name or by relation. More details: https://pnpm.io/filtering"
    completion:
      flag:
        reporter: [silent, default, append-only, ndjson]
        filter: ["$files"]
  - name: install
    aliases: [i]
    description: "Pnpm install is used to install all dependencies for a project. In a CI environment, installation fails if a lockfile is present but needs an update. Inside a workspace, pnpm install installs all dependencies in all the projects. If you want to disable this behavior, set the recursive-install setting to false"
  - name: install-test
    aliases: [it]
    description: "Runs pnpm install followed immediately by pnpm test. It takes exactly the same arguments as pnpm install"
    flags:
      "--offline": "If true, pnpm will use only packages already available in the store. If a package won't be found locally, the installation will fail"
      "--prefer-offline": "If true, staleness checks for cached data will be bypassed, but missing data will be requested from the server. To force full offline mode, use --offline"
      "--ignore-scripts": "Do not execute any scripts defined in the project package.json and its dependencies"
      "--reporter=": "Allows you to choose the reporter that will log debug info to the terminal about the installation progress"
      "-P, --save-prod": "Pnpm will not install any package listed in devDependencies if the NODE_ENV environment variable is set to production. Use this flag to instruct pnpm to ignore NODE_ENV and take its production status from this flag instead"
      "-D, --save-dev": "Only devDependencies are installed regardless of the NODE_ENV"
      "--no-optional": "OptionalDependencies are not installed"
      "--lockfile-only": "When used, only updates pnpm-lock.yaml and package.json instead of checking node_modules and downloading dependencies"
      "--frozen-lockfile": "If true, pnpm doesn't generate a lockfile and fails to install if the lockfile is out of sync with the manifest / an update is needed or no lockfile is present"
      "--use-store-server": "Starts a store server in the background. The store server will keep running after installation is done. To stop the store server, run pnpm server stop"
      "--shamefully-hoist": "Creates a flat node_modules structure, similar to that of npm or yarn. WARNING: This is highly discouraged"
    completion:
      flag:
        reporter: [silent, default, append-only, ndjson]
  - name: update
    aliases: [upgrade, up]
    description: "Pnpm update updates packages to their latest version based on the specified range. When used without arguments, updates all dependencies. You can use patterns to update specific dependencies"
    flags:
      "--recursive, -r": "Concurrently runs update in all subdirectories with a package.json (excluding node_modules)"
      "--latest, -L": "Ignores the version range specified in package.json. Instead, the version specified by the latest tag will be used (potentially upgrading the packages across major versions)"
      "--global": "Update global packages"
      "-P, --save-prod": "Only update packages in dependencies and optionalDependencies"
      "-D, --save-dev": "Only update packages in devDependencies"
      "--no-optional": "Don't update packages in optionalDependencies"
      "--interactive, -i": "Show outdated dependencies and select which ones to update"
      "--workspace": "Tries to link all packages from the workspace. Versions are updated to match the versions of packages inside the workspace. If specific packages are updated, the command will fail if any of the updated dependencies are not found inside the workspace. For instance, the following command fails if express is not a workspace package: pnpm up -r --workspace express"
      "--filter=": "Filtering allows you to restrict commands to specific subsets of packages. pnpm supports a rich selector syntax for picking packages by name or by relation. More details: https://pnpm.io/filtering"
    completion:
      flag:
        filter: ["$files"]
  - name: remove
    aliases: [rm, uninstall, un]
    description: "Removes packages from node_modules and from the project's package.json"
    flags:
      "--recursive, -r": "When used inside a workspace, removes a dependency (or dependencies) from every workspace package. When used not inside a workspace, removes a dependency (or dependencies) from every package found in subdirectories"
      "--global": "Remove a global package"
      "-P, --save-prod": "Only remove the dependency from dependencies"
      "-D, --save-dev": "Only remove the dependency from devDependencies"
      "--save-optional, -O": "Only remove the dependency from optionalDependencies"
      "--filter=": "Filtering allows you to restrict commands to specific subsets of packages. pnpm supports a rich selector syntax for picking packages by name or by relation. More details: https://pnpm.io/filtering"
    completion:
      flag:
        filter: ["$files"]
  - name: link
    aliases: [ln]
    description: "Makes the current local package accessible system-wide, or in another location"
    flags:
      "--dir, -C": "Changes the link location to <dir>"
      "--global": "Links the specified package (<pkg>) from global node_modules to the node_nodules of package from where this command was executed or specified via --dir option"
  - name: unlink
    description: "Unlinks a system-wide package (inverse of pnpm link). If called without arguments, all linked dependencies will be unlinked. This is similar to yarn unlink, except pnpm re-installs the dependency after removing the external link"
    flags:
      "--recursive, -r": "Unlink in every package found in subdirectories or in every workspace package, when executed inside a workspace"
      "--filter=": "Filtering allows you to restrict commands to specific subsets of packages. pnpm supports a rich selector syntax for picking packages by name or by relation. More details: https://pnpm.io/filtering"
    completion:
      flag:
        filter: ["$files"]
  - name: import
    description: "Pnpm import generates a pnpm-lock.yaml from an npm package-lock.json (or npm-shrinkwrap.json) file"
  - name: rebuild
    aliases: [rb]
    description: "Rebuild a package"
    flags:
      "--recursive, -r": "This command runs the pnpm rebuild command in every package of the monorepo"
      "--filter=": "Filtering allows you to restrict commands to specific subsets of packages. pnpm supports a rich selector syntax for picking packages by name or by relation. More details: https://pnpm.io/filtering"
    completion:
      flag:
        filter: ["$files"]
  - name: prune
    description: "Removes unnecessary packages"
    flags:
      "--prod": "Remove the packages specified in devDependencies"
      "--no-optional": "Remove the packages specified in optionalDependencies"
  - name: fetch
    description: "EXPERIMENTAL FEATURE: Fetch packages from a lockfile into virtual store, package manifest is ignored: https://pnpm.io/cli/fetch"
    flags:
      "--prod": "Development packages will not be fetched"
      "--dev": "Only development packages will be fetched"
  - name: patch
    description: "This command will cause a package to be extracted in a temporary directory intended to be editable at will"
    flags:
      "--edit-dir": "The package that needs to be patched will be extracted to this directory"
  - name: patch-commit
    description: "Generate a patch out of a directory"
  - name: patch-remove
  - name: audit
    description: "Checks for known security issues with the installed packages. If security issues are found, try to update your dependencies via pnpm update. If a simple update does not fix all the issues, use overrides to force versions that are not vulnerable. For instance, if lodash@<2.1.0 is vulnerable, use overrides to force lodash@^2.1.0. Details at: https://pnpm.io/cli/audit"
    flags:
      "--audit-level=": "Only print advisories with severity greater than or equal to <severity>"
      "--fix": "Add overrides to the package.json file in order to force non-vulnerable versions of the dependencies"
      "--json": "Output audit report in JSON format"
      "--dev, -D": "Only audit dev dependencies"
      "--prod, -P": "Only audit production dependencies"
      "--no-optional": "Don't audit optionalDependencies"
      "--ignore-registry-errors": "If the registry responds with a non-200 status code, the process should exit with 0. So the process will fail only if the registry actually successfully responds with found vulnerabilities"
    completion:
      flag:
        audit-level: [low, moderate, high, critical]
  - name: list
    aliases: [ls]
    description: "This command will output all the versions of packages that are installed, as well as their dependencies, in a tree-structure. Positional arguments are name-pattern@version-range identifiers, which will limit the results to only the packages named. For example, pnpm list \"babel-*\" \"eslint-*\" semver@5"
    flags:
      "--recursive, -r": "Perform command on every package in subdirectories or on every workspace package, when executed inside a workspace"
      "--json": "Log output in JSON format"
      "--long": "Show extended information"
      "--parseable": "Outputs package directories in a parseable format instead of their tree view"
      "--global": "List packages in the global install directory instead of in the current project"
      "--depth=": "Max display depth of the dependency tree. pnpm ls --depth 0 will list direct dependencies only. pnpm ls --depth -1 will list projects only. Useful inside a workspace when used with the -r option"
      "--dev, -D": "Only list dev dependencies"
      "--prod, -P": "Only list production dependencies"
      "--no-optional": "Don't list optionalDependencies"
      "--filter=": "Filtering allows you to restrict commands to specific subsets of packages. pnpm supports a rich selector syntax for picking packages by name or by relation. More details: https://pnpm.io/filtering"
    completion:
      flag:
        filter: ["$files"]
  - name: outdated
    description: "Checks for outdated packages. The check can be limited to a subset of the installed packages by providing arguments (patterns are supported)"
    flags:
      "--recursive, -r": "Check for outdated dependencies in every package found in subdirectories, or in every workspace package when executed inside a workspace"
      "--long": "Print details"
      "--global": "List outdated global packages"
      "--no-table": "Prints the outdated dependencies in a list format instead of the default table. Good for small consoles"
      "--compatible": "Prints only versions that satisfy specifications in package.json"
      "--dev, -D": "Only list dev dependencies"
      "--prod, -P": "Only list production dependencies"
      "--no-optional": "Doesn't check optionalDependencies"
  - name: why
    description: "Shows all packages that depend on the specified package"
    flags:
      "--recursive, -r": "Show the dependency tree for the specified package on every package in subdirectories or on every workspace package when executed inside a workspace"
      "--json": "Log output in JSON format"
      "--long": "Show verbose output"
      "--parseable": "Show parseable output instead of tree view"
      "--global": "List packages in the global install directory instead of in the current project"
      "--dev, -D": "Only display the dependency tree for packages in devDependencies"
      "--prod, -P": "Only display the dependency tree for packages in dependencies"
      "--filter=": "Filtering allows you to restrict commands to specific subsets of packages. pnpm supports a rich selector syntax for picking packages by name or by relation. More details: https://pnpm.io/filtering"
    completion:
      flag:
        filter: ["$files"]
  - name: run
    aliases: [run-script]
    description: "Runs a script defined in the package's manifest file"
    flags:
      "-r, --recursive": "This runs an arbitrary command from each package's \"scripts\" object. If a package doesn't have the command, it is skipped. If none of the packages have the command, the command fails"
      "--if-present": "You can use the --if-present flag to avoid exiting with a non-zero exit code when the script is undefined. This lets you run potentially undefined scripts without breaking the execution chain"
      "--parallel": "Completely disregard concurrency and topological sorting, running a given script immediately in all matching packages with prefixed streaming output. This is the preferred flag for long-running processes over many packages, for instance, a lengthy build process"
      "--stream": "Stream output from child processes immediately, prefixed with the originating package directory. This allows output from different packages to be interleaved"
      "--filter=": "Filtering allows you to restrict commands to specific subsets of packages. pnpm supports a rich selector syntax for picking packages by name or by relation. More details: https://pnpm.io/filtering"
    completion:
      flag:
        filter: ["$files"]
  - name: exec
    description: "Execute a shell command in scope of a project. node_modules/.bin is added to the PATH, so pnpm exec allows executing commands of dependencies"
    flags:
      "-r, --recursive": "Execute the shell command in every project of the workspace. The name of the current package is available through the environment variable PNPM_PACKAGE_NAME (supported from pnpm v2.22.0 onwards)"
      "--parallel": "Completely disregard concurrency and topological sorting, running a given script immediately in all matching packages with prefixed streaming output. This is the preferred flag for long-running processes over many packages, for instance, a lengthy build process"
      "--filter=": "Filtering allows you to restrict commands to specific subsets of packages. pnpm supports a rich selector syntax for picking packages by name or by relation. More details: https://pnpm.io/filtering"
    completion:
      flag:
        filter: ["$files"]
  - name: test
    aliases: [t, tst]
    description: "Runs an arbitrary command specified in the package's test property of its scripts object. The intended usage of the property is to specify a command that runs unit or integration testing for your program"
  - name: start
    description: "Runs an arbitrary command specified in the package's start property of its scripts object. If no start property is specified on the scripts object, it will attempt to run node server.js as a default, failing if neither are present. The intended usage of the property is to specify a command that starts your program"
  - name: publish
    description: "Publishes a package to the registry. When publishing a package inside a workspace, the LICENSE file from the root of the workspace is packed with the package (unless the package has a license of its own). You may override some fields before publish, using the publishConfig field in package.json. You also can use the publishConfig.directory to customize the published subdirectory (usually using third party build tools). When running this command recursively (pnpm -r publish), pnpm will publish all the packages that have versions not yet published to the registry"
    flags:
      "--tag=": "Publishes the package with the given tag. By default, pnpm publish updates the latest tag"
      "--dry-run": "Does everything a publish would do except actually publishing to the registry"
      "--ignore-scripts": "Ignores any publish related lifecycle scripts (prepublishOnly, postpublish, and the like)"
      "--no-git-checks": "Don't check if current branch is your publish branch, clean, and up-to-date"
      "--access=": "Tells the registry whether the published package should be public or restricted"
      "--force": "Try to publish packages even if their current version is already found in the registry"
      "--report-summary": "Save the list of published packages to pnpm-publish-summary.json. Useful when some other tooling is used to report the list of published packages"
      "--filter=": "Filtering allows you to restrict commands to specific subsets of packages. pnpm supports a rich selector syntax for picking packages by name or by relation. More details: https://pnpm.io/filtering"
    completion:
      flag:
        access: [public, private]
        filter: ["$files"]
