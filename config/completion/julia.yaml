completion:
  flag:
    project: ["@.\tSearch through parent directories until a Project.toml or JuliaProject.toml file is found"]
    home: ["$directories"]
    startup-file: ["yes", "no"]
    handle-signals: ["yes", "no"]
    sysimage-native-code: ["yes", "no"]
    compiled-modules: ["yes", "no"]
    threads: [auto]
    procs: [auto]
    machine-file: ["$files"]
    banner: ["yes", "no", auto]
    color: ["yes", "no", auto]
    history-file: ["yes", "no"]
    depwarn: ["yes", "no", error]
    warn-overwrite: ["yes", "no"]
    warn-scope: ["yes", "no"]
    inline: ["yes", "no"]
    check-bounds: ["yes", "no", auto]
    polly: ["yes", "no"]
    math-mode: [ieee, fast]
    code-coverage: [none, user, all]
    track-allocation: [none, user, all]
    compile: ["yes", "no", all, min]
    output-o: ["$files"]
    output-ji: ["$files"]
    output-unopt-bc: ["$files"]
    output-jit-bc: ["$files"]
    output-bc: ["$files"]
    output-asm: ["$files"]
    output-incremental: ["yes", "no"]
