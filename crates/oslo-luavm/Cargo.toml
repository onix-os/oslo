[package]
name = "oslo-luavm"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false
description = "A spike: the reference Lua VM behind the same front door as oslo's own evaluator."

[dependencies]
# The reference interpreter, vendored and compiled from C. `vendored` is the whole question this
# crate exists to answer: it is what makes the binary self-contained and what makes a musl build
# need a C compiler.
mlua = { version = "0.12", features = ["lua54", "vendored"] }
