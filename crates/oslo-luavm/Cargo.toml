[package]
name = "oslo-luavm"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false
description = "The Lua VM oslo runs on: luna, vendored."

[dependencies]
# `vendor/luna` — a stackless Lua VM in pure Rust with a real garbage collector. No C, so a static
# musl build needs no C toolchain, which is the property `oslo-lua` was written to keep.
luna = { path = "../../vendor/luna" }
