[package]
name = "oslo-luavm"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false
description = "The Lua VM oslo runs on: luna."

[dependencies]
# A stackless Lua VM in pure Rust with a tracing garbage collector. No C, so a static musl build
# needs no C toolchain — the property the evaluator this replaced was written to keep.
#
# **Pinned to a commit, not a tag or a branch.** luna has no tagged releases yet, and a branch would
# make the build depend on when it was run: the same oslo revision would compile against whatever
# had landed that morning. The hash moves when somebody moves it, deliberately, and `cargo update`
# cannot move it at all.
luna = { git = "https://github.com/onix-os/luna", rev = "a2e2d3181dc875e5ff83a46fb42fc68c8e0a93a1" }
# The value type the shell speaks. The whole point of this crate is converting between the two.
oslo-base = { path = "../oslo-base" }
