[package]
name = "oslo-shell"
version = "0.2.21"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "oslo's shell: syntax adaptation, expansion, execution, builtins, the structured pipeline and directory environments."

[features]
default = []
# `scratch` — named sessions that keep running when the terminal they were in goes away. Off by
# default; a build without it has no keeper, no client and no runtime directory, and the key that
# opens the finder does nothing.
scratch = []
# `direnv` — directory environments: `.env.lua`, `.envrc`, and the dev shell an `.envrc` can ask
# for. Off by default; a build without it never reads a directory file and never runs one.
direnv = []
# `argc` — the `argc` builtin, and the `Runtime` oslo implements for it. Off by default; a build
# without it has no builtin of that name, so the word falls through to `$PATH`.
argc = ["dep:argc"]
# `nix` — everything that knows what a Nix dev shell is: `nix print-dev-env`, importing its
# variables, its shell-local state and its functions. Independent of `direnv`: the two meet only
# where a directory file asks for a dev shell, and that overlap needs both.
nix = []

[dependencies]
oslo-base = { path = "../oslo-base" }
# The argument parser behind the `argc` builtin. Vendored; see `vendor/argc`.
argc = { path = "../../vendor/argc", default-features = false, features = [
    "eval", "eval-bash", "compgen",
], optional = true }
# `where` and `each` evaluate a Lua expression once per row.
oslo-luavm = { path = "../oslo-luavm" }
# The widgets the `ui` builtin drives, and the settings a builtin reads.
oslo-ui = { path = "../oslo-ui" }

# Nearly everything the executor does: fork, exec, wait, signals, terminal control, `ulimit`'s
# limits and `times`'s getrusage.
nix = { version = "0.29", features = [
    "process", "signal", "term", "fs", "user", "resource", "hostname", "poll",
] }

# `[[ str =~ ere ]]`. See the root manifest for why the feature set is trimmed.
regex = { version = "1", default-features = false, features = [
    "std", "unicode-case", "unicode-gencat", "unicode-perl",
    "perf-literal", "perf-inline",
] }

# The structured pipeline's JSON, and a core capability rather than a library a user can install:
# a C module cannot load into a static binary.
# `preserve_order` keeps a document's own column order: without it `serde_json::Map` is a
# `BTreeMap`, so `from json` handed the record its fields alphabetised and `to text` printed them in
# an order matching neither the document nor its own header.
serde_json = { version = "1", features = ["preserve_order"] }

# Command resolution for `command -v` and the direnv stdlib's `has`.
which = "7.0"

# Parsing only — its AST is converted straight into oslo's in `syntax/brush_adapter/`. Vendored;
# see `vendor/README.md`.
brush-parser = { path = "../../vendor/brush-parser" }

# The allow list for directory environments, keyed by a hash of the rc file's path and contents.
sha2 = "0.10"

# Not a dev-dependency: an `.envrc`'s own output is captured to a scratch file so it can be printed
# under the file that produced it. A pipe would block once it filled, with nothing draining it.
tempfile = "3.17"

[dev-dependencies]
oslo-base = { path = "../oslo-base" }
oslo-ui = { path = "../oslo-ui" }
